  requirementCoverage:
  - id: r.iroh-ticket-delivery
    implemented: true
    evidence: 'lib/requester-xrpc/mod.ts: before compose, `const irohTicketApp = new
      Hono(); irohTicketApp.post(`${IROH_TICKET_ROUTE}/:token`, ...)` mounted on the
      requester''s own serve (`pds.serve.app.route("/", irohTicketApp as never)`)
      with a per-contract token from `crypto.getRandomValues(bytes)` (16 bytes hex)
      registered in `irohTicketHandlers.set(token, (ticket) => resolveGuestAddress(ticket,
      "iroh-ticket-report"))`; URL is the requester''s own ingress name, no invented
      host/port and no loopback fallback: `const ingressHost = (pds.ingressHost ||
      pds.relay.ingressHost || "").split(":")[0]; if (ingressHost.includes(".")) {
      ... irohReportUrl = `https://${ingressHost}${IROH_TICKET_ROUTE}/${token}` }
      else log("iroh_ticket_route_skipped", { reason: "no publicly addressed ingress"
      })`; passed to the composer as `irohReportUrl` in the buildUserData ctx (guarded
      by `if (transport === "iroh" && !skipSsh)`); POST handler reads the body ticket
      once and acks: `const handler = irohTicketHandlers.get(token); if (!handler)
      return c.json({ ok: false }, 404); const ticket = typeof body?.ticket === "string"
      ? body.ticket : ""; if (!ticket) return c.json({ ok: false }, 404); irohTicketHandlers.delete(token);
      handler(ticket); return c.json({ ok: true })` -- unknown and already-satisfied
      tokens get the identical 404; onNetwork addresses now flow through one handler,
      `const resolveGuestAddress = (address: string, source: string) => { if (!address
      || vmFqdn) return; if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?$/.test(address)) { log("vm_onnetwork_ip_skipped",
      ...); return; } vmFqdn = address; vmFqdnReady.resolve(address); log("vm_fqdn_discovered",
      { fqdn: address, kind: address.includes(".") ? "relay-fqdn" : "iroh-ticket",
      source }) }`, called from both firehose paths and `onNetworkFromSubmitEvent`
      as `resolveGuestAddress(address, "submitEvent")` replacing the old `/[a-zA-Z]/`
      FQDN-only check; the log names `vm_fqdn_discovered` and `vm_fqdn_timeout` are
      preserved; the portless URL''s name-to-address mapping and port substitution
      are left to the provisioning backend (test passes `caCertPem, guestTlsPort`
      to the local provider), which the requester does not do itself.'
