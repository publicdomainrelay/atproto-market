  agentLog: |-
    ... one release.
    - `test/fixtures/cloud-init/iroh.yaml` regenerated; other six fixtures untouched.

    **lib-requester-xrpc**
    - `ensureDumbpipe(logger?): Promise<string>` — PATH lookup, else downloads pinned release, unpacks `./dumbpipe` from the tar.gz with a Deno-runtime gzip+tar reader (no shell installer), writes 0755 in a temp dir, prepends PATH; never throws; logs `dumbpipe_{found,unsupported,downloading,download_failed,downloaded,path_updated}`.
    - `createSshSessionProvider(logger?, { proxyCommandFn?: (target) => string; dumbpipePath? })`; one builder picks `dumbpipe connect <ticket>` for a dotless target, websocat for a dotted one. Session output captured and exposed via `lastSessionOutput()`.
    - Default transport `iroh`; flow bootstraps the transport's helper and passes `dumbpipePath` in; `result.sshProxyCommand` and `result.sshOutput` recorded.
    - Ticket-report route mounted on the requester's own serve at `/iroh-ticket/<32-hex token>`; `ctx.irohReportUrl = https://<relay ingress host>/iroh-ticket/<token>` — no invented host/port, no loopback fallback. POST resolves once, 404 for unknown/satisfied.
    - One `resolveGuestAddress` handler serves the report, submitEvent and both firehose paths: IPv4 skipped, dotless = iroh ticket, dotted = relay FQDN; `vm_fqdn_discovered` / `vm_fqdn_timeout` unchanged.

    **atproto-market**
    - `test/bidder_container_integration_test.ts` rewritten as the acceptance suite: `relay.localhost` dispatcher (plain + TLS, `generateLocalhostTlsCert` with `*.relay.localhost`), interceptor on the TLS port with CA, provider with `caCertPem`/`guestTlsPort`, contract awaited with no race, asserts receiptOk, no 401, sshReady, exit 0, `dumbpipe connect <reported ticket>`, `SSH_OK_VIA_IROH`.
    - `hono-compute-contract-gateway`, `bidder_{ssh_relay,prod,cross_platform}` and `request-vm-ssh` name `transport: "tunnel"` / bootstrap accordingly; `run_full_flow.ts` keeps the websocat topology with `ensureWebsocat` and updated diagram.

    verify: exit 0, 268ms, 0 ok
