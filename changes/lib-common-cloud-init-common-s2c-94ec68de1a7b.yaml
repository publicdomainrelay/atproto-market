  agentLog: |-
    ...?: (target) => string; dumbpipePath?: string })`; one builder picks `dumbpipe connect <ticket>` for a dotless target, websocat for a dotted one
      - default transport is now `iroh`; the flow bootstraps the selected transport's helper and passes `dumbpipePath` into the provider
      - ticket-report route mounted on the requester's own serve under an unguessable per-contract token; `ctx.irohReportUrl` = `https://<relay ingress host>/iroh-ticket/<token>` (no invented host/port)
      - one `resolveGuestAddress` handler feeds the ticket report, submitEvent and both firehose onNetwork paths; IPv4 literals skipped, tickets/FQDNs accepted; `vm_fqdn_discovered` / `vm_fqdn_timeout` kept
      - `result.sshProxyCommand` recorded; guest stdout captured onto the result (`sshOutput`) and still echoed
    - `test/bidder_container_integration_test.ts` — rewritten as the acceptance suite: dispatcher on `relay.localhost` plain + TLS (`generateLocalhostTlsCert` with `*.relay.localhost`), fetch interceptor on the TLS port with `caCertPem`, provider with `caCertPem`/`guestTlsPort`, contract awaited with no race, assertions on `receiptOk`, no-401, `sshReady`, `sshExitCode 0`, `dumbpipe connect <reported ticket>`, and the `SSH_OK_VIA_IROH` marker
    - `compute-contract-full-flow/run_full_flow.ts` — selects `transport: "tunnel"` explicitly, calls `ensureWebsocat`, diagrams/progress describe the websocat topology
    - `request-vm-ssh` — bootstraps dumbpipe for the iroh default (websocat when a websocket transport is named); flag description updated
    - `lib/compute-contract-gateway-xrpc` and `test/bidder_{ssh_relay,prod,cross_platform}_integration_test.ts` — name `transport: "tunnel"` so their websocat/relay topologies survive the new default

    `lib/common/cloud-init-common` needed no change: the iroh module, `iroh.yaml` fixture and snapshot/semantic/registry cases already match the refined `r.iroh-ticket-report` (report script + oneshot + path unit, no CA material of its own).

