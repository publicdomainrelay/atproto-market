  agentLog: |-
    Done. All three spec changes applied, verify command exits 0.

    **Changes:**

    - `lib/common/cloud-init-common/mod.ts` — dropped `irohReportToken` from `CloudInitContext`; `iroh` module now gates the report on `ctx.irohReportUrl` alone, writes `/root/secrets/iroh-report.json` as `{"url":<url>}` (no token), and POSTs with only `content-type: application/json`.
    - `lib/requester-xrpc/mod.ts` — report endpoint reworked: `requesterApp(pds)` now reads `pds.serve.app` (the app the ingress serves, not the repo app); entries keyed by accept ref matched at request time, exactly one report per contract (later → 409), no bearer token; route mounted/remounted by replaying `app.routes` into a fresh Hono router so it is genuinely unmounted at contract end. `runComputeContract` passes only `ctx.irohReportUrl`.
    - `test/iroh_private_report_test.ts` — (a) rewrites to mount a repo-shaped child under a parent via `route("/", child)`, then register on the parent; asserts settle, 409 on stale ref + repeat report (settled ticket unchanged), 404 after unmount; (b) unchanged.
    - `test/cloud_init_snapshot_test.ts` + `test/fixtures/cloud-init/iroh.yaml` — regenerated snapshot; asserts report file carries only the URL and no `Bearer` appears.

    **Verify:** `deno check && deno test -A test/cloud_init_snapshot_test.ts test/iroh_dumbpipe_install_test.ts test/iroh_transport_test.ts test/iroh_private_report_test.ts` → 33 passed, exit 0.

