status:
  agentLog: 'lib-market-atproto is the shared TypeScript library through which the
    atproto-market services speak to each other. It bundles five concerns: cryptographic
    signing and verification of market records (signing.ts, attest.ts), inter-service
    authentication and DID/PDS discovery (auth.ts, badge-blue-keys.ts), AT Protocol
    record plumbing against a PDS (records.ts), the market''s own lexicon-facing server
    handlers for the submit-rfp, submit-bid, submit-accept and submit-event XRPC methods
    plus a verify endpoint (server.ts), and the client and contract layers that call
    those methods and walk an accept record back to the RFP and bid it settles against
    (client.ts, contract.ts, bid.ts, mod.ts). Everything is dependency-injected: handlers,
    factories and clients take resolvers, signers and transports as options so a caller
    supplies the concrete PDS, PLC directory and HTTP implementation.'
