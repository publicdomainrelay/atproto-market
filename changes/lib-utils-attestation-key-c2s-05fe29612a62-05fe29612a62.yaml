  agentLog: This context covers lib/utils-attestation-key, a single-module Deno utility
    whose only exported entry point is loadOrCreateAttestationKeyHex. The function
    takes the path to a secp256k1 attestation private JWK as a string or URL and resolves
    to the raw private scalar as a lowercase hex string. When a file already exists
    at that path it reads and JSON-parses it, requires kty "EC", crv "secp256k1" and
    a string d, and returns base64UrlDecode(d) as hex; when the read fails with Deno.errors.NotFound
    it draws 32 random bytes with crypto.getRandomValues, writes them as a pretty-printed
    private JWK with use "sig" and alg "ES256K", narrows the file mode to 0600 where
    chmod is supported, and returns the same scalar as hex. Any other read error,
    or a pre-existing file that is not a secp256k1 private JWK, is rejected rather
    than overwritten. Three module-private helpers, bytesToHex, base64UrlEncode and
    base64UrlDecode, do the encoding and stay unexported so callers cannot bypass
    this load-or-create and validation path.
