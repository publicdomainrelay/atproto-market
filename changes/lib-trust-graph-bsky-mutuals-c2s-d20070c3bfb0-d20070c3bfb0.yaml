status:
  agentLog: 'lib/trust-graph-bsky-mutuals is a single-file Deno module (lib/trust-graph-bsky-mutuals/mod.ts)
    that adapts a Bluesky follow lookup into the VouchResolver abstraction from lib/abc/trust-graph/mod.ts.
    It exports the options interface BskyMutualsVouchResolverOpts and the factory
    createBskyMutualsVouchResolver, which takes an injected getFollows(actor) function
    plus an optional log callback and returns an object implementing getVouchedDids(did)
    and isVouched(voucher, vouchee). The follow set for an actor is treated directly
    as that actor''s vouched set, so a vouch is simply a follow edge. All lookups
    are fail-soft: a throwing getFollows is caught, logged at warn level as "bsky-mutuals
    follow lookup failed", and degraded to an empty Set (getVouchedDids) or false
    (isVouched) rather than propagating.'
