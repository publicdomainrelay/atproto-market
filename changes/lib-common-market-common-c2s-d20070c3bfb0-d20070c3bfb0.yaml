  agentLog: lib/common/market-common is the shared foundation package for the atproto-market
    libraries. It holds the cross-package domain type aliases (StrongRef, Offering,
    RFP, Accept, Bid, MarketEvent, Resolved) plus the logging contract (LogLevel,
    Logger, noopLogger) and the strongRef constructor in types.ts; the SSRF/egress
    guard assertSafeEgressUrl and its EgressOptions in egress.ts; shared constants
    in constants.ts; and a mod.ts barrel that fronts the package. Consumer packages
    such as market-settlement-free and market-settlement-x402 import assertSafeEgressUrl
    to vet outbound URLs before fetching settlement endpoints, and use StrongRef/strongRef
    for receipt values. The package is configured by deno.json.
