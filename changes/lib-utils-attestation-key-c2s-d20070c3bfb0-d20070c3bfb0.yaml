status:
  agentLog: A single-module Deno utility at lib/utils-attestation-key/mod.ts that
    resolves the secp256k1 attestation key an operator wants to sign with, given the
    path to its private JWK file. The exported entry point loadOrCreateAttestationKeyHex
    reads the JSON at the supplied string-or-URL path, and if it exists it accepts
    the file only when kty is "EC", crv is "secp256k1" and d is a string, then returns
    the private scalar as lowercase hex after base64url-decoding d. If the file is
    absent it generates 32 random bytes via crypto.getRandomValues, writes them as
    a pretty-printed private JWK with use "sig" and alg "ES256K", narrows the file
    mode to 0600 where chmod is supported, and returns the hex of the freshly generated
    scalar. Three local helpers — bytesToHex, base64UrlEncode and base64UrlDecode
    — carry the encoding work and are not exported.
