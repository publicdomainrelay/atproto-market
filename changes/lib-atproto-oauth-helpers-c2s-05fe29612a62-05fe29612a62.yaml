  agentLog: lib/atproto-oauth-helpers is a two-file Deno module — lib/atproto-oauth-helpers/key.ts
    and lib/atproto-oauth-helpers/mod.ts — holding the OAuth plumbing that @atproto/oauth-client
    needs where no Node-style crypto adapter exists. key.ts defines WebCryptoKey,
    a subclass of @atproto/jwk's abstract Key wrapping an ECDSA P-256 CryptoKey plus
    its public and private JWKs; it signs compact JWS tokens through crypto.subtle,
    overriding the header's alg and kid with its own, and deliberately leaves verifyJwt
    unimplemented. createWebCryptoKey generates the extractable sign/verify key pair,
    preferring ES256 when the caller lists it, and derives the kid from crypto.randomUUID().
    mod.ts exports webCryptoRuntime, a RuntimeImplementation wired to createWebCryptoKey,
    crypto.getRandomValues and a digest that maps sha256/sha384/sha512 onto the Web
    Crypto names; memoryStateStore, a Map-backed StateStore for one authorization
    flow; jsonSessionStore, a file-backed SessionStore that caches a parsed JSON object,
    tolerates a missing or unparsable file and rewrites the file on every set and
    del; oauthClientMetadata, the client metadata document with localhost loopback
    defaults and the fixed public-client fields; and startLoopbackCallbackServer,
    a 127.0.0.1 server that resolves with the query parameters of the /callback redirect
    and exposes a shutdown.
