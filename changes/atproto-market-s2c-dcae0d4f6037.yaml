  agentLog: |-
    ...inned release fetch → pure-Deno gzip/tar unpack to temp dir mode 0755 → PATH prepend; never throws; emits `dumbpipe_found|unsupported|downloading|download_failed|downloaded|path_updated`); `createSshSessionProvider` now takes `{ proxyCommandFn?: (target) => string; dumbpipePath?: string }` and derives the ProxyCommand from the target (`dumbpipe connect <ticket>` for a dotless ticket, websocat for a hostname); flow default transport is now `iroh`, bootstraps the matching helper, mounts a per-contract unguessable ticket-report route on the requester's own serve and bakes its absolute URL into cloud-init as `ctx.irohReportUrl`, accepts a ticket from that POST (or a non-IPv4/non-host vm.onNetwork address), and records `sshProxyCommand` / `sessionOutput` on the result.
    - `lib/abc/requester/mod.ts` — optional `SshSessionProvider.runSessionCapture` and `ContractResult.sessionOutput`.
    - `test/bidder_container_integration_test.ts` — rewritten as the iroh acceptance suite: awaits the whole contract (no `Promise.race`, no deadline), asserts did:plc → did:key resolution through `IdResolver`, subscriber registration, `receiptOk`, `sshReady`, exit 0, a `dumbpipe connect <ticket>` ProxyCommand (never websocat, never a bare address), the mounted report route, and the `SSH_OK_VIA_IROH` marker in captured guest output.
    - `compute-contract-full-flow/run_full_flow.ts` — bootstraps `ensureDumbpipe` and passes `dumbpipePath` to the provider; header diagram + progress lines now describe the iroh topology (no websocat claim).
    - Relay tests that exercise the websocket path (`bidder_ssh_relay_test`, `bidder_prod_integration_test`, `bidder_cross_platform_integration_test`) now select `userData: { transport: "tunnel" }` explicitly; CLI flag description updated.
    - `lib/did-key-ingress-proxy/mod.ts` — unchanged; the new `r.control-plane-and-report-route` requirement already holds (relay carries market XRPC + requester-mounted routes; no SSH data plane).

