status:
  phase: Succeeded
  agentLog: 'lib-abc-trust-graph is the abstract contract layer for trust relationships
    in atproto-market. Its single module lib/abc/trust-graph/mod.ts exports exactly
    three TypeScript interfaces and nothing else: VouchResolver, which answers which
    DIDs one DID vouches for and whether a specific voucher-vouchee vouch exists;
    OperatorDiscovery, which maps an atproto DID to the DIDs of the operators running
    it; and DelegatedTrustResolver, which resolves the set of DIDs a self DID trusts
    by delegation. The package carries a deno.json manifest, holds no concrete trust
    logic or I/O, and depends only on the parent atproto-market context, so implementations
    such as delegated-trust-badge-blue-keys, operator-discovery-badge-blue-keys, trust-graph-bsky-mutuals
    and trust-graph-tangled-graph supply the actual trust sources behind these interfaces.'
