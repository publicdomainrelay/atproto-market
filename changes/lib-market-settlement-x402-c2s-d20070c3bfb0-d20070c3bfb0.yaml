status:
  agentLog: lib-market-settlement-x402 is the Deno package @publicdomainrelay/market-settlement-x402
    that implements the x402 leg of the market settlement protocol on top of the @publicdomainrelay/market-*
    libraries. The server half (server.ts) parses the trailing at-uri/cid pair from
    an incoming receipt request path, mints a signed receipts.x402 proof-of-payment
    record bound to an accepts.x402 record, and verifies a payment reference supplied
    by a bidder, rejecting it with a status-carrying X402PaymentError when the record
    type, authorship or cryptographic binding is wrong. The client half (client.ts)
    signs and writes an accepts.x402 record from a bid against a bid payload, builds
    the receipt URL from the accepts strongRef, fetches it with a timeout, and returns
    the receipts.x402 strongRef the endpoint responds with. mod.ts re-exports both
    halves as the package entrypoint, and deno.json wires the package name to ./mod.ts.
