  agentLog: 'lib/did-plc is the AT Protocol PLC directory client used across atproto-market.
    Its hand-written core (client.ts) wraps the PLC directory HTTP API behind a PlcClient
    class constructed from PlcClientOptions, exposing resolve, getLog, getAuditLog,
    getLastOp, getData, submitOp, health, export and exportPages, plus a createPlcDirectoryClient
    factory. A generated layer under generated/ (produced from openapi.official.yaml
    through openapi-ts.config.ts and fixup-openapi.ts) supplies the low-level hey-api
    style client: createClient, per-endpoint SDK functions resolveDid/createPlcOp/getPlcOpLog/getPlcAuditLog/getLastOp/getPlcData/export_,
    and the supporting config, middleware, auth, body/path/query serializers and SSE
    machinery. The remaining modules cover DID key resolution (resolver.ts: keysFromDidDocument,
    createPlcKeyResolver, plcClientAsKeyResolver), genesis operation creation (genesis.ts:
    createGenesisOp), on-disk keypair persistence (keypair-state.ts: loadKeypairState,
    saveKeypairState), and shared result/option types (types.ts: ExportOptions, HealthResponse),
    with mod.ts as the package entrypoint.'
