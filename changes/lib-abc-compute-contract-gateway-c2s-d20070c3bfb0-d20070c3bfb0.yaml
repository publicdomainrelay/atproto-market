status:
  agentLog: 'This context is the abstract compute-contract gateway boundary of atproto-market:
    a single Deno TypeScript module, lib/abc/compute-contract-gateway/mod.ts, exporting
    one interface, ComputeContractGateway, alongside a deno.json package manifest.
    The interface is the ABC abstraction layer that a market-side caller programs
    against when it wants compute provisioned through a gateway DID. It declares an
    identity field, did, a lifecycle pair (beginServe and dispose), three provisioning
    calls that each take a CallerIdentity plus an input record and resolve to a GatewayComputeResponse
    (requestComputeVM for a long-lived VM, requestComputeWorkerEphemeral for a throwaway
    worker, requestComputeWorkerPersistent for a durable worker), and a deleteCompute
    that takes a receipt URI, receipt CID and token and resolves to a bare ok flag.
    The transport implementation lives elsewhere (lib/compute-contract-gateway-xrpc),
    which builds this interface over a requester PDS; the Hono factory layer in lib/hono-factory-compute-contract-gateway-xrpc
    injects it into the HTTP surface, so the interface is what both sides depend on
    rather than either concrete module.'
