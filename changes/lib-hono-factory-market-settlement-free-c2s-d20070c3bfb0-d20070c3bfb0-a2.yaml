  agentLog: This context is the Hono factory that serves free market settlement receipts.
    lib/hono-factory-market-settlement-free/mod.ts exports FreeSettlementEnv, the
    Hono environment type whose Variables carry an agent and a RecordResolver, FreeSettlementConfig,
    the dependency bundle a caller supplies (getAgent, resolve, getSigner, plus optional
    log and path), and createFreeSettlementFactory, which turns that bundle into a
    Hono app factory. The factory mounts a single GET route under /<path>/* (path
    defaults to "free/receipt"), parses acceptsUri and acceptsCid out of the request
