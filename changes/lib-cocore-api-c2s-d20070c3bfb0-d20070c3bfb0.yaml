  agentLog: lib/cocore-api is a single-module TypeScript client for the cocore AppView's
    API-key XRPC methods. lib/cocore-api/mod.ts exports a CocoreClientOptions shape
    carrying an optional appviewUrl and fetch plus a required getServiceAuth callback,
    three response/value interfaces (ApiKey, CreateApiKeyResponse, ListApiKeysResponse),
    a CocoreClient interface exposing createApiKey/listApiKeys/deleteApiKey, and the
    createCocoreClient factory that builds it. The factory normalizes the base URL
    (defaulting to https://appview.cocore.dev, trailing slashes stripped), derives
