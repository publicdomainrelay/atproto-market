  requirementCoverage:
  - id: r.iroh-acceptance-flow
    implemented: true
    evidence: 'test/bidder_container_integration_test.ts: `const result = await runComputeContract(requester,
      { ... skipSsh: false, keepVm: true, vmReadyTimeoutSec: 300, execProgram: `echo
      ${MARKER} && uname -a`, ... })` awaited directly; the old `Promise.race([contract,
      new Promise((r) => setTimeout(r, 40_000))])` and the spying on pendingBids are
      deleted, so no race/wall-clock deadline remains. All cleanups (dispatcher/PLC
      abort, fetch restore, `providerServe.shutdown()`, `bidder.shutdown()`, `requesterServe.shutdown()`)
      are registered and only run in `finally` after the await. Asserts: `assert(result.receiptOk
      === true)`, `assert(result.sshReady === true)`, `assert(result.sshExitCode ===
      0)`, ``/dumbpipe connect /.test(proxyCommand) && proxyCommand.trim().endsWith(ticket)``,
      `assert(!proxyCommand.includes("websocat"))`, and `assert(result.sshOutput?.includes(MARKER)
      === true)` with `const MARKER = "SSH_OK_VIA_IROH"`. The ticket comes only from
      the flow''s own logged address-discovery event `vm_fqdn_discovered`/`kind ===
      "iroh-ticket"` (fed by the guest''s outbound report / onNetwork), never by exec-ing
      into the container. `result.sshOutput` is the allowed small result addition
      (lib/abc/requester/mod.ts adds `sshOutput?: string` and `lastSessionOutput?()`;
      lib/requester-xrpc captures stdout/stderr while live-streaming). The test is
      registered unconditionally (no `ignore: true`); the `if (!(await backend.ensureRunning()))
      return` guard is the repo''s existing container-availability idiom (oauth_session_transfer_test.ts,
      bidder_prod_integration_test.ts).'
  - id: r.iroh-acceptance-guest-reachable-report
    implemented: true
    evidence: 'test/bidder_container_integration_test.ts: `const gateway = await backend.defaultGateway();`
      then `createRelayFactory({ hostname: "relay.localhost", additionalHosts: [gateway]
      }).createApp()`; `generateLocalhostTlsCert({ extraDnsSans: ["relay.localhost",
      "*.relay.localhost"] })`; the one app served via `serveOnPort0(dispatcherApp.fetch,
      dispAc, "0.0.0.0")` (plain) and `serveOnPort0(dispatcherApp.fetch, dispTlsAc,
      "0.0.0.0", serverCertPem, serverKeyPem)` (TLS); `const ingressProxyHost = `relay.localhost:${dispPort}``
      passed to `createRequesterPDS`, the bidder relays (`makeRelay` uses `ingressProxyHost`)
      and the provider; interceptor installed with `dispPort: dispTlsPort, caCertPem`
      (not the plain port); provider built with `ingressProxyHost, caCertPem, guestTlsPort:
      dispTlsPort`. The provisioning backend already does the rewrite/hosts/CA work
      (hono-compute-provider lib/compute-provider-local/mod.ts:773-809 uses `ctx.guestTlsPort`
      to rewrite `https://$1:${port}`, writes `resolve = *:${port}:${gw}` and the
      CA cert), and the requester composes the portless URL from its own ingress (`irohReportUrl
      = `https://${ingressHost}${IROH_TICKET_ROUTE}/${token}``). No host-side read
      of the guest''s ticket/address and no invented port handed to the requester.'
  - id: r.iroh-acceptance-plc-key-resolution
    implemented: true
    evidence: 'test/bidder_container_integration_test.ts createFakePlc GET handler
      derives the doc''s `verificationMethod` as `{ id: `${did}#${name}`, type: "Multikey",
      publicKeyMultibase: String(didKey).replace(/^did:key:/, "") }` from the genesis
      op''s verificationMethods, so resolving a did:plc yields that DID''s did:key
      end to end through the resolver the relay/market call (fetch is intercepted
      to the fake PLC). The suite asserts only run-level facts: `assert(result.receiptOk
      === true, "receipt verification should pass")` and `assert(unauthorized.length
      === 0, ...)` over the filtered `logEvents` (no 401 during subscriber registration).
      It adds no did:key fast path and no assertion on any resolver''s internals;
      the only change to the PLC code path is a comment.'
  - id: r.iroh-cloud-init-fixture
    implemented: true
    evidence: 'test/fixtures/cloud-init/iroh.yaml is present and is the byte-exact
      composer output: `deno test -A test/cloud_init_snapshot_test.ts` passes 19/19,
      including `iroh module snapshot matches fixture` (`assertEquals(buildUserData({
      ctx: IROH_CTX, modules: ["iroh"] }), await fixture("iroh.yaml"))`) and `composer
      snapshots match fixtures` (the six existing fixtures unchanged; only iroh.yaml
      is modified in the diff, kept in sync with the cloud-init-common report-loop
      change). The `iroh module semantics` case asserts the pinned dumbpipe release
      (`DUMBPIPE_VERSION="0.39.0"`, GitHub release URL), the loopback listener (`--host
      127.0.0.1:22`), the ticket report to the configured URL (`iroh-report.service`,
      `IROH_CTX.irohReportUrl`, ticket JSON body), and the sshd it configures (`openssh-server`).'
  - id: r.iroh-full-flow-harness
    implemented: true
    evidence: 'compute-contract-full-flow/run_full_flow.ts imports `ensureWebsocat`
      (still exported by lib/requester-xrpc) and calls `await ensureWebsocat(logger)`,
      selects the transport explicitly with `userData: { transport: "tunnel" }` while
      keeping `skipSsh: false` and `createSshSessionProvider`, and its header diagram
      line is changed to `cloud-init: sshd + relay tunnel` (no longer claims websocat),
      plus a progress line `log("transport: tunnel (websocat ProxyCommand through
      the local dispatcher)")` matching the topology actually used. No removed helper
      is imported or called (the change kept `ensureWebsocat` and `createSshSessionProvider`).'
