  agentLog: This context covers the generated atproto lexicon for `com.publicdomainrelay.temp.auth.allowlist.rbacDid`,
    a record type that lets a record owner's own DID authorize account-scoped AT Protocol
    operations (for example `applyWrites` on their own repo via service-auth tokens)
    — the use case being bidders and other automated actors. The record carries two
    lex-map fields, `protects` and `allowed`, plus a `createdAt` datetime; `protects`
    maps an arbitrary label (such as 'allowSelf') to a `{ service, scope }` entry
    that must match for the protection to apply, and `allowed` maps the same labels
    to arrays of DIDs authorized under each label. The package is split into a definitions
    module that declares the NSID, the `Main` type and the `l.record<'tid', Main>`
    validator, and a thin barrel module that re-exports everything and re-exports
    `main` as the default.
