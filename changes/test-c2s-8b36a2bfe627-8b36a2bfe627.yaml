  agentLog: 'The test context holds the repository''s executable verification layer:
    a shared networking shim in test/fetch-interceptor.ts plus the per-subsystem suites
    that depend on it. The shim installs a replacement for globalThis.fetch that rewrites
    https://plc.directory/ requests onto a caller-supplied local fake PLC, rewrites
    https URLs whose host is localhost, ends with .localhost, or contains .localhost:
    onto the local dispatcher port (appending dispPort when the host carries no explicit
    port, preserving path and query), forwards everything else untouched, and returns
    a teardown closure that restores the original fetch and closes the Deno HttpClient
    it created. When the caller passes a caCertPem, the localhost branch keeps the
    https scheme and routes the request through an HttpClient that trusts that CA,
    so TLS-terminating local services are reachable without disabling verification;
    without a PEM the rewrite downgrades to plain http. Eight integration suites (bidder
    container, bidder cross-platform, gateway caller RBAC, gateway README smoke, gateway
    request VM, gateway SSH, gateway worker, OAuth session transfer) install this
    interceptor, and the remaining suites cover badge blue keys binding, bid collection,
    bidder policy restricted to only-me, production bidder, bidder SSH relay, cloud-init
    k3s and snapshot rendering, firehose watching, offering refresh, registry discovery,
    secrets capability, and the two named gateway defects.'
