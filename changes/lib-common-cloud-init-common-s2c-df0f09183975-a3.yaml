  agentLog: |-
    ...the provisioning token's `sub`, audience `api://ATProto?actx=<accept-uri authority>`, then POSTs with `Authorization: Bearer <token>`. Exchange failure retries with backoff inside the same attempt loop — never an unauthenticated POST. No token in cloud-config.
      - `ctx.hostAliases` now emitted as idempotent `/etc/hosts` bootcmd (guest must resolve the requester ingress host).
    - `lib/requester-xrpc/mod.ts` — `OnNetworkReportEntry.verify?`; handler extracts bearer, calls verify, 401 fail-closed before settling, never replaces settled ticket. `runComputeContract` derives the grant from the winning bid's `bid_config` (`deriveGrantVars`, `reportRegistered` also triggers bid_config resolution) and verifies issuer/aud/sub via provider JWKS through `globalThis.fetch` (unexported `verifyGuestWorkloadToken`). Added `tls` pass-through to `createIngress`.
    - `lib/abc/requester/mod.ts` — optional `PDSOptions.tls`.
    - `lib/requester-xrpc/deno.json` — `jose` import.
    - `test/fixtures/cloud-init/iroh.yaml` — regenerated byte-exact from composer; tunnel/tunnel-secrets/fedproxy fixtures untouched.
    - `test/cloud_init_snapshot_test.ts` — assertions updated for bare-path ExecStart, script-owned log/reporter, boot-minted bearer token.
    - `test/iroh_private_report_test.ts` — new 401 fail-closed/settle-once test.
    - `test/bidder_container_integration_test.ts` — rewritten: docker/container backend + gateway, throwaway TLS cert, dual dispatcher listeners, requester on TLS ingress, provider given `caCertPem`+`guestTlsPort`, `skipSsh: false`, full `await` (no race cap), asserts `transport === "iroh"`, `ticket`, `sshReady === true`, `sshExitCode === 0` for `test -x /usr/local/bin/dumbpipe && echo SSH_OK_VIA_IROH`.

    **Caveat (honest):** the container harness cannot run in this sandbox (no Docker). It typechecks and mirrors the cross-platform/OAuth wiring the spec names, but its live SSH path is unverified here — the four graded suites are the ones I ran.

