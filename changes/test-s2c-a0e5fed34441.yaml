          and must assert listUserDataModules() includes "iroh"; the existing tunnel,
          tunnel-secrets, fedproxy-ssh and fedproxy-web-wootty snapshot assertions
          and the secrets-module semantic assertions must remain in the same file
          and stay green. This test is the verification gate: it must pass under `deno
          test -A test/cloud_init_snapshot_test.ts`, and the whole workspace must
          still pass `deno check`.'
      id: r.cloud-init-iroh-snapshot
      op: changed
      to:
        codeRefs:
        - file:test/cloud_init_snapshot_test.ts
        id: r.cloud-init-iroh-snapshot
        level: MUST
        text: 'test/cloud_init_snapshot_test.ts must render the new iroh transport
          and assert it byte-for-byte against test/fixtures/cloud-init/iroh.yaml,
          and must assert listUserDataModules() includes "iroh"; the existing tunnel,
          tunnel-secrets, fedproxy-ssh and fedproxy-web-wootty snapshot assertions
          and the secrets-module semantic assertions must remain in the same file
          and stay green. The file''s module-completeness rule -- a module that writes
          an sshd drop-in or enables ssh must install openssh-server -- must cover
          the iroh module as well as tunnel and fedproxy-ssh, so a module that configures
          an sshd it never installs fails the suite. This test is the verification
          gate: it must pass under `deno test -A test/cloud_init_snapshot_test.ts`,
          and the whole workspace must still pass `deno check`.'
    - id: r.iroh-ticket-extraction-tested
      op: added
      to:
        codeRefs:
        - file:test/cloud_init_snapshot_test.ts
        id: r.iroh-ticket-extraction-tested
        level: MUST
        text: 'test/cloud_init_snapshot_test.ts must assert the iroh module''s ticket
          extraction against the line the pinned dumbpipe release actually prints:
          the rendered cloud-config must extract the ticket from a `dumbpipe connect-tcp
          <ticket>` line (the subcommand `listen-tcp` prints) and must not depend
          on a bare `dumbpipe connect ` prefix, so a guest that logs the real listener
          output still writes /root/secrets/iroh-node-id.'
