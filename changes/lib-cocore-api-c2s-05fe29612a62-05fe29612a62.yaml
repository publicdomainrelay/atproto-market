  agentLog: lib-cocore-api is a single-module TypeScript client for the cocore AppView's
    API-key XRPC methods, living in lib/cocore-api/mod.ts with a deno.json manifest
    alongside it. It exports the data interfaces ApiKey, CreateApiKeyResponse and
    ListApiKeysResponse, the config interface CocoreClientOptions, the CocoreClient
    interface, and the createCocoreClient factory. createCocoreClient normalizes the
    base URL (defaulting to https://appview.cocore.dev and stripping trailing slashes),
    derives a service-auth audience of did:web:<host> from the parsed URL, and closes
    over an internal call helper that mints a fresh Bearer token per request through
    opts.getServiceAuth and POSTs JSON to <base>/xrpc/<nsid>, throwing an Error carrying
    the NSID, status and response text on any non-2xx response. The returned client
    exposes createApiKey, listApiKeys and deleteApiKey, each a thin wrapper over call
    with its matching cocore NSID constant.
