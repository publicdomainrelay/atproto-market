    | dead `hostnameOnly` binding (MAY) | `:56` — spec documents it "as written", kept |
    | r.control-plane-and-report-route | satisfied by caller wiring: `serve.app.route("/", app)` + `serve.addRelay(relay)` (`lib/requester-xrpc/mod.ts:581-582`, `lib/atproto-helpers/agent.ts:353,371`), so relay forwards every mounted route incl. `IROH_TICKET_ROUTE` (`lib/requester-xrpc/mod.ts:1354`); iroh default transport `DEFAULT_TRANSPORT_MODULE = "iroh"` (`:997`), tunnel kept for explicit `tunnel`/`fedproxy-ssh` selection (`:1066`), no host-side read of a guest address from the relay anywhere (`grep .subdomain` hits only the `mod.ts` log line) |

    Verify gate run, exits zero:

    - `deno check` — pass
