status:
  agentLog: 'lib-abc-trust-graph is the abstract interface layer for trust relationships
    in atproto-market. Its single module lib/abc/trust-graph/mod.ts exports three
    TypeScript interfaces and nothing else: VouchResolver, which answers who a DID
    vouches for and whether one DID vouches for another; OperatorDiscovery, which
    maps an atproto DID to the DIDs of the operators that run it; and DelegatedTrustResolver,
    which returns the set of DIDs a self DID delegates trust to. The package carries
    a deno.json manifest, so it is consumed as a Deno/JSR module by the implementation
    packages that satisfy these interfaces.'
