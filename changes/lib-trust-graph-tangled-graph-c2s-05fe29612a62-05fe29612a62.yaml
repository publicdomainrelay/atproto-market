  agentLog: 'lib/trust-graph-tangled-graph is a single-module Deno package (lib/trust-graph-tangled-graph/mod.ts,
    configured by deno.json alongside it) that adapts Tangled-style vouch records
    into the VouchResolver shape the trust graph consumes. It exports the ListedRecord
    interface (a uri plus an untyped value object), the TangledGraphVouchResolverOpts
    options bag (a required listRecords(repo, collection) callback returning Promise<ListedRecord[]>,
    and an optional log(level, msg, meta) callback), and createTangledGraphVouchResolver,
    which closes over those options and returns a VouchResolver with async getVouchedDids
    and async isVouched. getVouchedDids lists the vouch collection for a did through
    the injected callback, skips records whose value.kind is "denounce", takes each
    remaining record''s rkey (the last slash-separated segment of its uri, empty string
    when the split yields nothing) and keeps it only when it starts with "did:", collecting
    survivors into a Set. A listRecords rejection is swallowed: it is logged at warn
    level through the optional logger (or a no-op when none was supplied) with the
    message "tangled-graph vouch lookup failed" and metadata carrying the did and
    the stringified error, and the set collected so far is returned instead of throwing.
    isVouched delegates to getVouchedDids for the voucher and tests set membership
    of the vouchee, inheriting the same fail-closed behaviour. The package exposes
    no other source file.'
