  agentLog: 'lib/delegated-trust-badge-blue-keys is a one-file Deno module (lib/delegated-trust-badge-blue-keys/mod.ts)
    that adapts the badgeBlueKeys record collection to the DelegatedTrustResolver
    interface the ABC trust graph consumes. It exports ListedRecord (uri plus value),
    the DelegatedTrustBadgeBlueKeysOpts bag carrying a VouchResolver, a listOwnRecords(collection,
    opts) function and an optional log callback, and the factory createBadgeBlueKeysDelegatedTrustResolver,
    which returns an object whose sole member getDelegatedTrustedDids(selfDid) resolves
    to a Set of DID strings. That method seeds the set from vouchResolver.getVouchedDids(selfDid),
    lists the subject''s own badgeBlueKeys records with a limit of 200, keeps only
    records whose service is requester_associate or bidder_associate, reads a candidate
    operator from either the canonical {challenge: operator, keyId: self} shape or
    the legacy inverted {challenge: self, keyId: operator} shape, unions in the vouches
    of every candidate operator, and catches listing failures so it returns a partial
    or empty set instead of throwing.'
