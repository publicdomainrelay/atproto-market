  agentLog: 'lib-hono-factory-market-settlement-free is a single-module Deno package
    that wraps free market settlement receipt minting in a Hono app factory. Its mod.ts
    exports three things: FreeSettlementEnv, the Hono environment type whose Variables
    carry the request-scoped agent and resolve; FreeSettlementConfig, the dependency-injection
    surface holding getAgent, resolve, getSigner, and optional log and path; and createFreeSettlementFactory,
    which destructures that config with defaults of noopLog and "free/receipt", calls
    createFactory parameterised by FreeSettlementEnv, and registers a GET handler
    on `/${path}/*`. Inside the handler it parses acceptsUri and acceptsCid from the
    request path via parseGrantPath(c.req.path, `${path}/`), logs an info entry for
    the incoming request, mints a receipt through mintGrantForAccepts using the agent
    from getAgent(), the configured resolver, the parsed accepts pair and the signer
    from getSigner(), logs the minted uri and cid, and answers with c.json({ uri,
    cid }). The package carries its own deno.json so it can be imported as a standalone
    workspace member.'
