    ...— PATH lookup, else pinned `v0.39.0` release for linux/darwin × x86_64/aarch64, gunzipped via `DecompressionStream` + in-runtime tar reader into a 0755 temp dir, PATH prepended, log events `dumbpipe_found|unsupported|downloading|download_failed|downloaded|path_updated`; never throws.
    - `createSshSessionProvider(logger?, opts?: { proxyCommandFn?: (target) => string; dumbpipePath? })` — dotless target → `dumbpipe connect <ticket>` (dumbpipePath or PATH), dotted → websocat relay command. Non-interactive `runSession` captures stdout for the flow.
    - `runComputeContract`: default transport `iroh`; bootstraps `ensureDumbpipe`/`ensureWebsocat` per transport; mounts a per-contract unguessable ticket-report route on the requester's serve and passes `ctx.irohReportUrl`; `acceptGuestAddress` accepts a dotless non-IPv4 onNetwork address as a ticket (keeps `vm_fqdn_discovered`/`vm_fqdn_timeout`); records `result.sshProxyCommand` and `result.sessionOutput`.

    **`lib/abc/requester/mod.ts`** — optional `ContractFlowResult.sessionOutput`.

    **`test/bidder_container_integration_test.ts`** — rewritten as the iroh acceptance suite: no skip, no `Promise.race`/deadline, awaits the whole contract, tears infra down only after it settles, asserts did:plc→did:key via `IdResolver` + `createDidKeyResolver` fast path, subscriber registration, `receiptOk`, `sshReady`, exit 0, `dumbpipe connect <ticket>` (never websocat/address), and `SSH_OK_VIA_IROH` in captured output. No host-side exec into the guest.

    **`compute-contract-full-flow/run_full_flow.ts`** — selects `transport: "tunnel"` explicitly so the documented websocat topology matches.

    **`lib/did-key-ingress-proxy/mod.ts`** — documented as control-plane-only (no SSH data plane).

    **`request-vm-ssh/cli-args-env.ts`, `lib/abc/requester/mod.ts`** — stale "default tunnel" descriptions corrected to iroh.

    `bash -lc "deno check && deno test -A test/cloud_init_snapshot_test.ts"` → exit 0, 19 passed.

