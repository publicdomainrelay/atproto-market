  agentLog: |-
    ...ownload_failed|downloaded|path_updated`, never throws). Default ProxyCommand now transport-derived: dotted target → websocat relay, dotless ticket → `dumbpipe connect <ticket>` (`dumbpipePath` or PATH). `createSshSessionProvider` gains `dumbpipePath`; non-interactive sessions capture program output. `runComputeContract`: transport defaults to `iroh`, bootstraps `ensureDumbpipe`/`ensureWebsocat` per transport before provisioning, mounts a per-contract unguessable ticket-report POST route on the requester's serve and passes `ctx.irohReportUrl`, accepts a dotless onNetwork address as an iroh ticket, and records `result.sshProxyCommand` + `result.sessionOutput` (keeps `vm_fqdn_discovered`/`vm_fqdn_timeout` event names).
    - `lib/abc/requester/mod.ts` — optional `ContractFlowResult.sessionOutput`.
    - `test/bidder_container_integration_test.ts` — rewritten as the iroh acceptance suite: no skip, no `Promise.race`/deadline, whole contract awaited, infra torn down only after it settles; asserts bid collected, registration succeeded with no 401 (via `ingressUrl`), `receiptOk`, `sshReady`, exit 0, `dumbpipe connect <dotless ticket>` (never websocat, never an address), and `SSH_OK_VIA_IROH` in captured output. Asserts run-level facts only — no resolver-internals/"did:key fast path" assertions on the fake PLC.
    - `compute-contract-full-flow/run_full_flow.ts` — names `userData: { transport: "tunnel" }` so its websocat diagram stays true.
    - `lib/did-key-ingress-proxy/mod.ts` — documents control-plane-only scope (SSH data plane is iroh).
    - Tests asserting the websocket path pin `transport: "tunnel"`: bidder cross-platform/prod/ssh-relay, oauth session transfer (`--user-data-transport tunnel`), readme smoke filter widened for `dumbpipe`.
    - `request-vm-ssh` — transport defaults to iroh, bootstraps dumbpipe, passes `dumbpipePath` to its injected provider; flag/docs say iroh.

    Fixtures untouched — the six golden YAML files stay byte-identical.

