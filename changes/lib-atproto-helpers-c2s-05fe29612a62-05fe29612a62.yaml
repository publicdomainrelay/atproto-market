status:
  phase: Succeeded
  agentLog: 'lib/atproto-helpers is the shared AT Protocol client layer of atproto-market,
    split across four TypeScript files (agent.ts, misc.ts, mod.ts, oauth-qr-session.ts,
    with deno.json tracking the package config). agent.ts declares the minimal agent
    contract AtprotoAgentLike and the ATProto facade built by createATProto, then
    supplies three concrete agent factories: createLocalPDSAgent for a PDS the process
    itself runs, createRemoteAgent for CredentialSession handle/password login against
    a remote PDS, and createOAuthAgent plus createOAuthAgentFromSession for the OAuth
    QR flow, together with OAuthSessionExpiredError, OAuthSessionData, pollForOAuthSession
    and the getSession/checkSession/refreshTokens session helpers. oauth-qr-session.ts
    persists and restores those OAuth sessions on disk, keyed per AT Protocol handle,
    through saveOAuthQRSession and tryRestoreOAuthQRSession. misc.ts holds the small
    DID and AT-URI utilities ownServiceDidWeb, atUriAuthority, parseAtUri, loginAgent,
    pdsForDid, getRecord and resolveAs, while mod.ts is the single re-export entrypoint
    for the package. The record and service helpers on the facade wrap the underlying
    agent so consumers get one uniform surface regardless of which factory built the
    agent.'
