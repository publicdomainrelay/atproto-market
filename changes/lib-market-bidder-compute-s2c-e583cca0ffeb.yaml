metadata:
  name: lib-market-bidder-compute-s2c-e583cca0ffeb
  namespace: default
spec:
  delta:
    intent:
      from: 'This context exists so that the compute VM market can be served by a
        market bidder without the generic bidder package knowing anything about VM
        provisioning. It is the adapter layer: it turns a ComputeProvider into the
        MarketBidderProviderRef the bidder host expects, supplying serviceId and appliesTo
        for routing and delegating setup/teardown to the provider, while the callbacks
        implement the VM-specific RFP, accept, and event semantics. It sits downstream
        of the atproto-market bidder abstractions and is what concrete compute providers
        plug into.'
      to: 'This context exists so that the compute VM market can be served by a market
        bidder without the generic bidder package knowing anything about VM provisioning.
        It is the adapter layer: it turns a ComputeProvider into the MarketBidderProviderRef
        the bidder host expects, supplying serviceId and appliesTo for routing and
        delegating setup/teardown to the provider, while the callbacks implement the
        VM-specific RFP, accept, and event semantics. It sits downstream of the atproto-market
        bidder abstractions and is what concrete compute providers plug into. It also
        turns the guest''s iroh endpoint id, read back from the provider, into the
        contract event the requester uses as its SSH transport target.'
    requirements:
    - id: r.iroh-ticket-emission
      op: added
      to:
        codeRefs:
        - file:lib/market-bidder-compute/mod.ts
        - function:5ec21894bcf015b3164a07db128adf72
        id: r.iroh-ticket-emission
        level: MUST
        text: 'Once a providerId resolves, the handler must obtain the guest''s iroh
          ticket by calling deps.computeProvider.getNodeId(providerId) when that optional
          method exists, retrying with a bounded backoff up to the provisioning timeout
          because the guest writes /root/secrets/iroh-node-id only after boot; the
          returned ticket must be published on the contract''s event path so the requester
          can dial it: the vm.onNetwork record''s address field must carry the ticket
          (the registerIdentity computeIdentity.nodeId field may carry the same value
          in addition). This publication must be deduplicated per receipt key and
          must not require an ingress submitEvent URL. When the provider has no getNodeId
          or it never returns a ticket, the handler must fall back to its previous
          behavior (the provisioned address) rather than failing the contract.'
