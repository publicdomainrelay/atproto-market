  agentLog: lib/did-key-ingress-proxy is a single-module Deno package whose mod.ts
    exports the CreateIngressOpts interface and the createIngress factory. createIngress
    destructures logger, ingressProxyHost, signer and keypair from its options, resolves
    the subscriber label from opts.label with the literal "bidder" as fallback, and
    holds the active subscriber in a closure variable initialized to null. It returns
    an IngressRef whose ingressRef string starts empty, whose ingressUrl getter yields
    "" until that string is truthy and otherwise "https://" plus ingressRef with its
    leading "did:web:" stripped, whose ingressHost getter applies that same strip
    when the prefix is present and otherwise returns ingressRef unchanged, whose onServe(fetch)
    wraps the caller's fetch through createSubscriberFactory to get handleRequest,
    logs "xrpc-relay connecting", registers via createSubscriber with the label, keypair,
    a nested getServiceAuthToken closure, ingressProxyHost, opts.tls, handleRequest,
    opts.localWsTarget as wsTarget and opts.directSubscriptionHandler, then stores
    the handle and logs "xrpc-relay registered" with its subdomain and ingressRef,
    and whose close() forwards to the stored subscriber or does nothing when onServe
    never ran. The nested getServiceAuthToken(lxm) derives the audience by passing
    ingressProxyHost through hostnameToDid and mints the service-auth JWT with signServiceAuth
    over the injected signer. onServe also computes hostnameOnly(ingressProxyHost)
    into a local host binding that is never read.
