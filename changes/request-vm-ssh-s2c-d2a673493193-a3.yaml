spec:
  delta:
    intent:
      from: 'This context exists so the requester CLI''s external contract is pinned
        down: which flags and environment variables configure it and what each defaults
        to, how the three identity/OAuth modes differ, how association is proven or
        skipped, what is passed into `runComputeContract`, and how shutdown, hold
        mode and the `--help` smoke test behave. It is the operator-facing shell around
        the requester library, so that library can change without silently breaking
        the command people actually run.'
      to: 'This context exists so the requester CLI''s external contract is pinned
        down: which flags and environment variables configure it and what each defaults
        to, how the three identity/OAuth modes differ, how association is proven or
        skipped, what is passed into `runComputeContract`, and how shutdown, hold
        mode and the `--help` smoke test behave. It is the operator-facing shell around
        the requester library, so that library can change without silently breaking
        the command people actually run. The default guest transport is the iroh module,
        so the CLI must ensure the dumbpipe helper is present and drive SSH through
        the published ticket.'
    requirements:
    - fields:
      - text
      from:
        codeRefs:
        - file:request-vm-ssh/mod.ts
        id: r.capabilities
        level: MUST
        text: When --secrets names a JSON bundle, the file is parsed and a secrets
          guest capability is registered (the ephemeral server is reachable only through
          the ingress proxy and releases values after the VM exchanges its workload
          identity token); --user-data names a base cloud-init file that is read and
          patched with the default tunnel provisioning before the RFP, and --user-data-transport
          selects the transport module.
      id: r.capabilities
      op: changed
      to:
        codeRefs:
        - file:request-vm-ssh/mod.ts
        id: r.capabilities
        level: MUST
        text: When --secrets names a JSON bundle, the file is parsed and a secrets
          guest capability is registered (the ephemeral server is reachable only through
