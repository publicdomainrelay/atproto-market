status:
  phase: Succeeded
  agentLog: 'lib-market-atproto is the AT Protocol transport implementation for the
    market stack: a Deno TypeScript package that turns the abstract market contract
    (RFP, bid, accept, event, receipt) into signed atproto repository records, verifies
    those records, and exposes both a server-side handler factory set and a client
    for calling a remote market service over XRPC. It is split into focused modules:
    attest.ts wraps the attestation port (secp256k1 keypairs, inline attestation signing
    and verification, did:key/PLC key resolution), signing.ts signs whole records
    and remote-proof subject records, records.ts does raw repo CRUD plus record resolution
    and public listing including PDS resolution, badge-blue-keys.ts publishes and
    checks the badge-blue key binding record under a DID, auth.ts validates inter-service
    market service-auth JWTs, contract.ts walks the RFP-to-accept graph into a contract,
    server.ts provides Hono handlers for the submit/verify XRPC methods, and bid.ts
    plus client.ts provide the outbound side. mod.ts is the single barrel export for
    the package.'
