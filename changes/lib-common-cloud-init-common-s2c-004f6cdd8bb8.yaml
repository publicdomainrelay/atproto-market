    ...oh.env` + `ExecStartPre=/usr/local/bin/iroh-prepare.sh` (new script: creates secret under umask 077, truncates log); listener script still repeats both jobs for the container-mode shim, ExecStart stays one bare path
      - report script: base64url payload padded to multiple of four (`case $((${#_payload} % 4))`: 2→`==`, 3→`=`, 1→`===`) instead of fixed `==`, so the provider-minted subject decodes and the token is actually minted
    - `lib/requester-xrpc/mod.ts` — `POST /v1/on-network` authenticates the reporter:
      - `OnNetworkReportEntry.authorize(token)`; handler extracts `Authorization: Bearer`, 401 when missing/unverifiable, ref-match 409 first, settled 409, ticket never replaced
      - `verifyWorkloadIdentityToken` — JWKS via call-time `globalThis.fetch`, issuer/audience/sub check, one reload on `JWKSNoMatchingKey` (mirrors `createSecretsAuthorizer`)
      - `runComputeContract` resolves the winner's `bid_config` when the report path is live and derives issuer/aud/sub with `deriveGrantVars` (aud = accept-URI authority, sub = provider tag-derived subject)
    - `lib/requester-xrpc/deno.json`, `deno.lock` — add `jose`
    - `test/cloud_init_snapshot_test.ts` + `test/fixtures/cloud-init/iroh.yaml` — regenerated for the new unit shape; assert EnvironmentFile/ExecStartPre, `curl -qfsSL`, and the variable padding
    - `test/iroh_private_report_test.ts` — harness supplies `authorize`; adds 401 fail-closed test and a real JWKS verification test
    - `test/bidder_container_integration_test.ts` — rewritten to prove live SSH over iroh: dual plain/TLS dispatcher listeners on `relay.localhost` (SANs `relay.localhost`, `*.relay.localhost`), interceptor at TLS port + CA PEM, provider gets guest TLS port + CA + `createOidcProvisioningEnricher`, contract awaited whole with no `Promise.race`, asserts `sshReady === true` and `sshExitCode === 0` for `test -x /usr/local/bin/dumbpipe && echo SSH_OK_VIA_IROH`

    `deno check` passes; the four verify tests pass 36/36.

