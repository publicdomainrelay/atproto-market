  agentLog: |-
    Done. Working tree matches new spec.

    **Changed**

    - `lib/common/cloud-init-common/mod.ts` — iroh module rewritten:
      - unit now one bare-path `ExecStart=/usr/local/bin/iroh-listen.sh`; dropped `ExecStartPre`, quoted `/bin/sh -c '…'` ExecStart, `EnvironmentFile`, `ExecStartPost`, `StandardOutput/Error=append:` (container-mode systemctl shim can't do any of those).
      - new `iroh-listen.sh` owns it all: creates `iroh.env` (umask 077, 0600), sources it in-process (`set -a`), truncates the log, `exec >>log 2>&1`, backgrounds `iroh-report-ticket.sh`, then `exec dumbpipe listen-tcp --host 127.0.0.1:22`.
      - new `iroh-report-ticket.sh` re-extracts ticket → `/root/secrets/iroh-node-id`, then POSTs to `ctx.irohReportUrl` with `Authorization: Bearer $_report_token`. Token minted at boot: reads `.bid_config.value // .bid_config` from accept.json → `token_path`/`url_path`/`url_route`, aud `api://ATProto?actx=<accept.uri authority>`, sub from workload-identity token. Exchange+POST retry in one backoff loop; never an unauthenticated POST. No literal token in cloud-config.
      - dropped `iroh-report.json` (URL now in script; still public).
    - `test/fixtures/cloud-init/iroh.yaml` — regenerated byte-exact from composer.
    - `test/cloud_init_snapshot_test.ts` — iroh assertions updated + new test for bare-path ExecStart / boot-minted bearer.

    **Verified**

    - `deno check` exit 0.
    - Exact verify cmd: exit 0, **34 passed | 0 failed**.
    - Fixture YAML parses; both embedded scripts pass `sh -n`; sshd drop-in has no `ListenAddress`; report-parsing pipeline smoke-tested (strongRef unwrap, requester/aud/sub/body all correct).
    - `tunnel.yaml`, `tunnel-secrets.yaml`, `fedproxy-ssh.yaml`, `fedproxy-web-wootty.yaml` untouched and still asserted equal.

    Scope note: requester-side endpoint left as-is — requirement text only constrains the fixture/composer output, and that module's own spec pins its handler behavior.

    verify: exit 0, 2.765s, 0 ok
