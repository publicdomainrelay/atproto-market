  agentLog: |-
    Done. Both spec changes realized.

    **lib/requester-xrpc/mod.ts**
    - `mountOnNetworkReportHandler` no longer touches Hono's route registry/router (`rebuildReportRouter`, `requesterApp` deleted). It only does `app.post("/v1/on-network", handler)`; the per-app entry map is the same WeakMap keyed by that app.
    - `registerOnNetworkReport`/`unregisterOnNetworkReport` now only add/drop an entry — no mounting, no unmounting. A ref that matches no live entry answers 409 even after the route stays mounted.
    - `createRequesterPDS` calls `mountOnNetworkReportHandler(app)` before `serve.app.route("/", app)`, so the route is copied into the serve app at that call.
    - `runComputeContract` takes the report app from `(pds as RequesterPDSImpl).app` (the repo app) instead of reaching into `pds.serve.app`; still registers/drops only its own entry, and registers nothing under `skipSsh`.
    - Fixed the stale "bearer token" comment — the endpoint carries no credential.

    **test/iroh_private_report_test.ts**
    - Harness mounts the report route on the repo-shaped child app, then `serveApp.route("/", repoApp)` — same order as `createRequesterPDS`.
    - First test drives the parent through a repo request *before* registering, then asserts the POST reaches the handler and settles the wait.
    - Stale ref / second report → 409, settled ticket unchanged.
    - Ended contract (unregistered entry) → 409, nothing settled (was 404 under the removed unmount behavior).

    `test/fetch-interceptor.ts` already satisfied the four new interceptor requirements (plc rewrite, localhost port rewrite, passthrough, teardown) — no change needed.

    Verify: `deno check && deno test -A test/cloud_init_snapshot_test.ts test/iroh_dumbpipe_install_test.ts test/iroh_transport_test.ts test/iroh_private_report_test.ts` → 33 passed, 0 failed.

