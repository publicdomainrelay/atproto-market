  agentLog: 'This context is the storage layer of the Hono PLC directory factory:
    a single TypeScript module, lib/hono-factory-did-plc-directory/storage/plc-store.ts,
    that defines the PlcStore port and its only adapter, MemoryPlcStore. PlcStore
    declares six asynchronous operations over per-DID operation logs — getCurrentOps,
    getAuditLog, getOpByCid, insertOp, nullifyOps, and exportLogs — all exchanging
    LogEntry records. MemoryPlcStore implements the port over an in-process Map keyed
    by DID whose values are ordered arrays of LogEntry; it appends on insert, returns
    the filtered non-nullified subset for current ops, returns the whole array for
    audit, finds by CID across nullified and live entries alike, mutates entries in
    place to set their nullified flag, and scans every DID to produce a globally sorted,
    optionally paged export.'
