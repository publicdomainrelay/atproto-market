  agentLog: lib/secrets-oidc is a Deno module (lib/secrets-oidc/mod.ts, published
    as @publicdomainrelay/secrets-oidc with exports ./mod.ts) that authorizes a guest's
    bearers against an in-memory secrets grant. createSecretsAuthorizer builds a SecretsAuthorizer
    whose install(grant) stores a SecretsGrant (an RBAC record shape, the issuer URI,
    and the expected audience), whose revoke() clears it, whose granted getter reports
    whether a grant is active, and whose authorize(token, path, method) decodes the
    JWT, checks the audience against the grant, verifies the signature against the
    issuer's JWKS with the configured clock tolerance, requires a sub claim, then
    runs checkRBACPolicy over (rbac, sub, path, method) and returns AuthorizedRequest
    { sub }. Key resolution goes through getJwks, which fetches the issuer's .well-known/openid-configuration,
    reads jwks_uri, builds a local jose JWK set, and caches it per issuer; all network
    calls use the injected fetch so tests and local dispatchers are not bypassed by
    jose's own remote JWKS fetcher.
