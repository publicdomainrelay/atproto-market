  agentLog: |-
    ...vider` takes `{ proxyCommandFn?: (target) => string; dumbpipePath? }`; `defaultProxyCommand` picks `dumbpipe connect <ticket>` for dotless targets and websocat for dotted ones; default transport is `iroh` with helper bootstrap; per-contract unguessable ticket-report route mounted on the requester's serve and fed to cloud-init as `ctx.irohReportUrl`; non-IPv4 onNetwork addresses accepted as tickets; `sessionOutput` capture; `sshProxyCommand` recorded.
    - `lib/abc/requester/mod.ts` — optional `ContractFlowResult.sessionOutput`.
    - `test/bidder_container_integration_test.ts` — rewritten as the iroh acceptance suite: no skip path, no `Promise.race`/deadline, awaits the whole contract, tears infra down only after it settles, asserts did:plc→did:key through `IdResolver` + the market's did:key fast path, subscriber registration, `receiptOk`, `sshReady`, exit 0, `dumbpipe connect <reported ticket>` ProxyCommand (never websocat/address), and `SSH_OK_VIA_IROH` in captured output. No ssh invocation and no container exec — every SSH byte goes through the transport ProxyCommand.
    - `test/fixtures/cloud-init/iroh.yaml` + `test/cloud_init_snapshot_test.ts` — new byte-exact golden fixture and its snapshot + semantic tests; six existing fixtures untouched.
    - `compute-contract-full-flow/run_full_flow.ts` — selects the tunnel transport explicitly (websocat topology the header documents). `request-vm-ssh/*` and the relay/oauth suites bootstrap per selected transport. `lib/did-key-ingress-proxy/mod.ts` documents it as control-plane only.

    **Gate fix**: the previous attempt had ssh reaching the guest directly at `test/bidder_container_integration_test.ts:251`; the suite now contains no ssh invocation at all — the guest is reached only through `dumbpipe connect <ticket>` built by the flow, and the marker is captured from the session the flow itself runs.

    `bash -lc "deno check && deno test -A test/cloud_init_snapshot_test.ts"` → exit 0, 19 passed.

    verify: exit 0, 253ms, 0 ok
