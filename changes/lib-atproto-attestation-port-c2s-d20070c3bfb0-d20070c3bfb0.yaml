status:
  agentLog: 'lib-atproto-attestation-port is a self-contained Deno/TypeScript module
    that creates, appends and verifies AT Protocol attestations over repository records.
    attestation.ts holds the high-level operations (didForKey, createInlineAttestation,
    createRemoteAttestation, createSignature, appendInlineAttestation, appendRemoteAttestation,
    verifyRecord) plus the private helpers (unwrapToObject, computeAttestationCid,
    buildSigMetadata, base58btcEncode, compressPublicKey, multicodecPrefix) they lean
    on. cid.ts turns JSON values into deterministic DAG-CBOR CIDs (createDagCborCid,
    createAttestationCid, validateDagCborCid). compat.ts provides the legacy-compatible
    surface: key encoding helpers (parseDidKey/formatDidKey, parsePrivateMultibase/formatPrivateMultibase),
    signature normalisation, signBytes/verifyBytes, the Attestation class and the
    verify() entry point. input.ts wraps record or metadata that may arrive either
    already parsed or as a JSON string. errors.ts defines one AttestationError base
    plus a typed subclass per failure mode, and types.ts holds the shared JSON/DAG-CBOR
    type aliases and attestation shapes. mod.ts re-exports the public surface and
    deno.json declares the module configuration.'
