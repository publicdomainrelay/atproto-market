  agentLog: |-
    ...-contract unguessable `/iroh-report/<token>` route before cloud-config and feeds its absolute URL in as `ctx.irohReportUrl`, accepts a ticket from that POST or a dotless/non-IPv4 `vm.onNetwork` address, records `result.sshProxyCommand`.
    - `test/bidder_container_integration_test.ts` — rewritten as the iroh acceptance suite: awaits the whole contract (no `Promise.race`, no deadline), asserts did:plc→did:key via `getKey`/`IdResolver` plus the did:key fast path, subscriber registration (`requester.ingressRef`), `receiptOk`, `sshReady`, exit 0, `dumbpipe connect <ticket>` ProxyCommand (never websocat, no address), ticket reported through the mounted route, and `SSH_OK_VIA_IROH` in captured guest output. No host-side side channel; teardown only after the promise settles.
    - `compute-contract-full-flow/run_full_flow.ts` + `SUMMARY.md` — bootstrap `ensureDumbpipe`, pass `dumbpipePath`, header/progress lines and topology now describe iroh (no websocat claim).
    - `request-vm-ssh/{mod.ts,cli-args-env.ts}` — bootstrap helper by selected transport (default iroh), pass `dumbpipePath`, flag description updated.
    - `test/{bidder_ssh_relay,bidder_prod_integration,bidder_cross_platform_integration}_test.ts` — relay/websocat suites explicitly select `userData: { transport: "tunnel" }`.
    - `lib/did-key-ingress-proxy/mod.ts` — unchanged; already satisfies `r.control-plane-and-report-route`.

    Not executed here (need Docker + a real dumbpipe download): the container acceptance suite and the relay suites — they typecheck under `deno check` but I could not run them.

    The change failed the policy gate. Fix these before trying again:
    - rfp-relay-only-guest-ssh: ssh from test reaches the guest directly: test/bidder_container_integration_test.ts:251; a guest is reached only through a relay, so give the ssh a ProxyCommand that goes through any transport -- the org relay, fedproxy, websocat, iroh, dumbpipe, cloudflared or an unnamed tunnel (test/bidder_container_integration_test.ts:251)
  message: 'PolicyDenied: rfp-relay-only-guest-ssh: ssh from test reaches the guest
    directly: test/bidder_container_integration_test.ts:251; a guest is reached only
    through a relay, so give the ssh a ProxyCommand that goes through any transport
    -- the org relay, fedproxy, websocat, iroh, dumbpipe, cloudflared or an unnamed
    tunnel'
  attempt: 4
  retryReason: 'The acceptance suite fails at the live guest: the dumbpipe install
    loops forever. Live container log of the kept guest (--keep-vm): curl -sfL https://github.com/n0-computer/dumbpipe/releases/download/v0.39.0/dumbpipe-v0.39.0-linux-x86_64.tar.gz
    | tar -xz -C /usr/local/bin dumbpipe answers ''tar: dumbpipe: Not found in archive''
    and is retried 50+ times, so no listener starts, no ticket is reported and the
    requester ends on vm_fqdn_timeout timeoutSec=300. The v0.39.0 archive stores the
    binary as ./dumbpipe: extract with tar -xzf <archive> -C <dir> ./dumbpipe (or
    untar the whole archive into a temp dir). Make the install fail loudly after a
    few attempts instead of retrying forever, and do not run the 5-minute acceptance
    suite yourself while iterating: it is the gate and specd runs it.'
