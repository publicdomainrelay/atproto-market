status:
  agentLog: 'This context is the test suite of the atproto-market repository, a flat
    collection of nineteen Deno test files under test/ plus one shared helper module.
    The helper, test/fetch-interceptor.ts, exports installFetchInterceptor, which
    monkey-patches globalThis.fetch so tests can run against local infrastructure:
    requests to https://plc.directory/ are rewritten to a caller-supplied local PLC
    directory URL, and https URLs whose host is localhost or ends in .localhost are
    rewritten to reach a local dispatcher port, either downgraded to plain HTTP or
    kept on HTTPS with a Deno HttpClient that trusts a caller-supplied self-signed
    CA PEM. The function returns a teardown closure that restores the original fetch
    and closes that HttpClient. The test files themselves are integration and unit
    suites covering the bidder (containers, cross-platform bidders, policy restricted
    to self, production, SSH relay), the gateway (caller RBAC, README smoke, request
    VM, SSH, worker), and discrete subsystems: badge blue key binding, bid collection,
    cloud-init snapshot generation, firehose watching, OAuth session transfer, offering
    refresh, registry discovery, and secrets capability. Eight of those integration
    suites install the fetch interceptor as their ambient networking shim, which is
    the single coupling point that ties this context together.'
