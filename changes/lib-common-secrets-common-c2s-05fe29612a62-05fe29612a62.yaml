  agentLog: 'lib/common/secrets-common/mod.ts is the single-file shared contract for
    the secrets feature of atproto-market, backed by a deno.json manifest and exporting
    five naming constants (SECRETS_NSID, SECRETS_ROUTE, SECRETS_SCOPE, FEDPROXY_RBAC_NSID,
    DEFAULT_ACCEPT_PATH_VM), seven type declarations and two pure functions. parseSecretsFile(text)
    parses the --secrets payload, a JSON array of {path, value} objects, and returns
    SecretEntry path/value string pairs in input order: it throws InvalidSecretsFileError
    when the text is not JSON, when the parsed value is not an array, when an element
    is not an object, when path is missing, non-string, empty, not starting with a
    slash or containing a .. segment, when a path repeats, or when a non-string value
    cannot be serialized; string values pass through untouched while every other JSON
    value is converted by the module-local stringifyValue helper. buildSecretsRbacRecord(ctx)
    turns a role, subject, issuerUri, expectedAud and serviceUrl, plus optional route
    and createdAt, into a com.fedproxy.rbac RBAC record that grants exactly one capability,
    read, on the secrets route for one subject from one issuer under one audience;
    the record is never published, the ephemeral server holds it in memory and evaluates
    it with the shared checkRBACPolicy. The shapes RbacRecordShape, RbacPolicyShape,
    RbacSchemaShape, RbacRoleShape and RbacProtectsShape are declared here so lib-guest-capability-secrets,
    lib-hono-factory-secrets-oidc, lib-secrets-oidc and request-vm-ssh share one spelling
    of the wire format. The module holds no state and performs no I/O.'
