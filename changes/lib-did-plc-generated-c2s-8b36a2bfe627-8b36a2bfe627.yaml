  agentLog: 'lib/did-plc/generated is the OpenAPI-generated TypeScript client for
    a PLC directory — the did:plc operation-log server — and it occupies four .gen.ts
    files. types.gen.ts holds every transport shape (a Data/Errors/Error/Responses/Response
    quartet per operation) alongside the PLC domain vocabulary: Operation as the union
    of signed operations with PlcOp, TombstoneOp and LegacyCreateOp as its variants,
    LogEntry for an operation-log entry, and DidDocument with PlcService for a resolved
    identity. sdk.gen.ts exports seven thin arrow functions — resolveDid, createPlcOp,
    getPlcOpLog, getPlcAuditLog, getLastOp, getPlcData and export_ — each taking one
    Options object and delegating to an injected client or the module-level default,
    each addressed by DID through a path template. client.gen.ts declares CreateClientConfig
    as the typed factory for producing a configured client, and index.ts re-exports
    the whole surface as the package entry point that hand-written code such as lib/did-plc/client.ts
    consumes.'
