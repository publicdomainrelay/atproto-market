  requirementCoverage:
  - id: r.contract-flow-defaults
    implemented: true
    evidence: 'lib/abc/requester/mod.ts: `userData.transport` doc changed to "Transport
      module id. Defaults to the iroh module id (the dumbpipe listener transport).
      See cloud-init-common listUserDataModules." and `sshProxyCommandFn` doc rewritten:
      "Without it the ProxyCommand follows the transport the flow selected: `dumbpipe
      connect <ticket>` for the default iroh transport, and `websocat --binary wss://<fqdn>`
      only for the explicitly selected tunnel or fedproxy-ssh transport." — signature
      also retargeted to `(target: string) => string`. The `fedingressHost` "Defaults
      to fedproxy.com" doc is present in the option bag (mod.ts:66-72) but is unchanged
      context, not touched by this diff.'
  - id: r.contract-flow-result-transport
    implemented: true
    evidence: 'lib/abc/requester/mod.ts: added optional field to ContractFlowResult
      — `/** The ProxyCommand the SSH provider was given or derived for the guest
      target, e.g. \`dumbpipe connect <ticket>\` for iroh. Absent on a run that never
      attempted SSH. */` followed by `sshProxyCommand?: string;` (placed before sshReady/sshExitCode).
      Optional marker satisfies "absent on a run that never attempted SSH".'
  - id: r.requester-pds-transport-address
    implemented: false
    evidence: Diff touches RequesterPDS only by replacing the doc comment above `setOnNetworkResolved?`
      ("The address is opaque ... resolves at most once per key; a second address
      for the same contract is ignored"). No member is added or changed that exposes
      the inbound route's absolute URL for the guest's cloud-config, and nothing registers
      interest keyed by the contract receipt before provisioning. The resolve-once
      / no-rewrite / no-classification semantics exist only as prose in a comment,
      and `ingressUrl`/`setOnNetworkResolved` themselves are unchanged context — no
      behaviour in the diff.
  - id: r.ssh-session-provider
    implemented: true
    evidence: 'lib/abc/requester/mod.ts: interface doc added above SshSessionProvider
      — "The address handed to pollReady and runSession is the guest''s transport
      address, not necessarily a DNS name: an iroh ticket for the iroh transport and
      a relay hostname for the websocket transports. The provider turns that address
      into a ProxyCommand." — and the members are `generateKeypair(vmName)` returning
      `{publicKey, privateKeyPath}`, `pollReady(privateKeyPath, target, timeoutMs):
      Promise<boolean>`, `runSession(privateKeyPath, target, program): Promise<number>`
      with `fqdn` renamed to `target`.'
