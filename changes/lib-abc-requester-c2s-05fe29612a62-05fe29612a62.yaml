  agentLog: 'lib/abc/requester/mod.ts is the ABC-layer interface module for the compute-contract
    requester: it declares the CollectedBid record shape (did, uri, cid and a raw
    record object), the BidCollector class that dedupes bids by uri, tracks in-flight
    early-path policy checks and settles a single early winner, the bidPayloadNsid
    / bidCost / selectWinner helpers that identify, price and rank bids, and the option
    bags and result types for the requester PDS, the SSH session provider, the contract
    flow and the console buffer. It imports types only from logger, serve and policy-common
    (plus cloud-init-common and guest-capability-abc in type positions), performs
    no I/O, and is accompanied by a deno.json that names the package and pins those
    imports. Every exported type is consumed unchanged by the requester implementation,
    the CLI and the test fakes, so the file is a contract about what the requester
    offers rather than a piece of the flow itself.'
