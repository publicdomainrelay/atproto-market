  agentLog: 'lib/secrets-oidc is a Deno module (lib/secrets-oidc/mod.ts, published
    as @publicdomainrelay/secrets-oidc from lib/secrets-oidc/deno.json) that authorizes
    bearer tokens against a single in-memory secrets grant. createSecretsAuthorizer
    builds a SecretsAuthorizer: install(grant) stores a SecretsGrant (an RbacRecordShape
    plus issuerUri and expectedAud), revoke() clears it, and the readonly granted
    getter reports whether a grant is active. authorize(token, path, method) rejects
    an empty token or a missing grant, decodes the JWT unverified, compares the aud
    claim against the grant''s expectedAud, verifies the signature against the issuer''s
    JWKS with the configured clock tolerance, requires a string sub, then runs checkRBACPolicy
    over (rbac, sub, path, method) and returns AuthorizedRequest { sub }. Keys come
    from getJwks, which fetches the issuer''s .well-known/openid-configuration, reads
    jwks_uri, builds a local jose JWK set cached per issuer, and routes every request
    through the injected fetch so caller-patched transports are not bypassed by jose''s
    own remote JWKS fetcher.'
