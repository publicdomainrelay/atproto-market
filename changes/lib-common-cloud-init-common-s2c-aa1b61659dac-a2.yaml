  requirementCoverage:
  - id: r.iroh-ticket-report
    implemented: true
    evidence: 'requester-xrpc/mod.ts adds the report route and URL: `IROH_TICKET_ROUTE
      = "/iroh-ticket"`, `irohTicketApp.post(`${IROH_TICKET_ROUTE}/:token`)` mounted
      with `pds.serve.app.route("/", irohTicketApp)`, a random per-contract token
      whose handler is `resolveGuestAddress(ticket, "iroh-ticket-report")`, and `irohReportUrl
      = `https://${ingressHost}${IROH_TICKET_ROUTE}/${token}`` where `ingressHost
      = (pds.ingressHost || pds.relay.ingressHost || "").split(":")[0]` -- the run''s
      own ingress name, no invented host or port, portless so the backend substitutes
      a reachable port and it never dials 443. It is composed only for `transport
      === "iroh" && !skipSsh` and passed into the cloud-init ctx (`irohReportUrl`
      in the buildUserData ctx), so absent it nothing is written. The cloud-init hunk
      shows the report script POSTing `--data "{\"ticket\":\"${TICKET}\"}" "${reportUrl}"`
      (ticket only, no key material/provider path/accept bundle) in a bounded loop
      `for attempt in $(seq 1 10)` with `--connect-timeout 5 --max-time 10`, `sleep
      2`, `exit 0` on success and `exit 1` after the loop -- fail-fast, non-zero,
      under two minutes instead of 60x5s. The repo''s iroh module gates every report
      file on `if (reportUrl)`: /usr/local/bin/report-iroh-ticket.sh, iroh-report.service
      (`Type=oneshot`) and iroh-report.path (`PathExists=/run/guest-iroh-ticket`),
      and contains no CA material of its own; the provisioning backend supplies the
      CA and maps the ingress name/substitutes a guest port (compute-provider-local
      `caCertPem`/`guestTlsPort`, wired by the container acceptance test), and no
      host-side code reads the ticket out of the guest -- the guest announces it outbound
      via this route.'
