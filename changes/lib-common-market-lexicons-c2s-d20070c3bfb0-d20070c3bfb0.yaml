status:
  agentLog: 'lib/common/market-lexicons is the shared lexicon package for the atproto-market
    monorepo, published as @publicdomainrelay/market-lexicons with its entrypoint
    at lib/common/market-lexicons/mod.ts. mod.ts re-exports three sibling modules:
    com.ts and network.ts (both generator-produced barrel files that re-export @atproto/lex-generated
    bindings under the com/ and network/ subdirectories) and nsids.ts, a hand-written
    catalogue of NSID string constants. nsids.ts is the single source of truth for
    the record, query and procedure identifiers used across the market, covering agent
    and compute records (com.publicdomainrelay.temp.agent.*, com.publicdomainrelay.temp.compute.*),
    market records and procedures (bids/accepts/receipts in free and x402 flavours,
    rfp, bid, accept, receipt, event, offering, submit*, policy describe/checkScope,
    bidder registration and discovery, relays, registerIdentity), requester association,
    package registry, and the network.attested.* signature/proof/verify vocabulary
    that replaced the former market.attestation record. deno.json declares the package
    name, the Unlicense licence, exports ./mod.ts, and pins the only dependency, @atproto/lex
    at npm:@atproto/lex@^0.1.3.'
