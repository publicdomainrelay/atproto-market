    ...unsupported,downloading,download_failed,downloaded,path_updated}`; never throws.
      - `createSshSessionProvider(logger?, { proxyCommandFn?: (target) => string; dumbpipePath?: string })` — default ProxyCommand is `dumbpipe connect <ticket>` for a dotless target (iroh ticket) and `websocat --binary wss://…` for a dotted hostname; non-interactive `runSession` captures stdout+stderr onto the provider.
      - `runComputeContract` — transport defaults to `iroh`; mounts a per-contract unguessable ticket-report route on the requester serve and feeds `ctx.irohReportUrl` into cloud-init; accepts an onNetwork/ticket address that is neither IPv4 literal nor dotted hostname (ticket) while skipping the bidder-side IP; ensures `ensureDumbpipe`/`ensureWebsocat` per transport before polling; records `result.sshProxyCommand`, `sshReady`, `sshExitCode`, `sshOutput`.
    - `lib/abc/requester/mod.ts` — `ContractFlowResult.sshOutput?: string`.
    - `test/bidder_container_integration_test.ts` — acceptance suite rewritten: awaits the whole contract promise (no `Promise.race`, no deadline), teardown only after it settles, asserts no 401 + `receiptOk`, `sshReady`, exit 0, `sshProxyCommand` == `dumbpipe connect <ticket>` (no websocat, ticket shape), and `SSH_OK_VIA_IROH` in `sshOutput`. Fake PLC keeps deriving did:plc docs from genesis ops; no mock-internals assertions.
    - `compute-contract-full-flow/run_full_flow.ts` — drops explicit provider so the iroh default bootstraps dumbpipe; header diagram/SSH section/log lines now describe the iroh ticket topology.
    - `test/bidder_ssh_relay_test.ts`, `test/bidder_prod_integration_test.ts`, `test/bidder_cross_platform_integration_test.ts` — select `userData: { transport: "tunnel" }` explicitly to keep their websocat relay topology under the new default.

    `lib/did-key-ingress-proxy/mod.ts` needed no code change — its control-plane surface (`localWsTarget`, tunnel, mounted routes) already matches the updated requirement.

