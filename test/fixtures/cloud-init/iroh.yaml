#cloud-config
apt:
  preserve_sources_list: true
packages:
  - curl
write_files:
  - path: /root/.ssh/authorized_keys
    owner: root:root
    permissions: "0600"
    content: |
      ssh-ed25519 AAAA test@example
  - path: /etc/ssh/sshd_config.d/10-iroh.conf
    owner: root:root
    permissions: "0644"
    content: |
      # Key-only root login; dumbpipe bridges iroh traffic to sshd on loopback.
      PermitRootLogin prohibit-password
      PasswordAuthentication no
  - path: /etc/systemd/system/dumbpipe-listen.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=iroh dumbpipe listener (ssh-over-iroh)
      After=network-online.target sshd.service ssh.service
      Wants=network-online.target

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/local/bin/dumbpipe listen-tcp --host 127.0.0.1:22
      Restart=always
      RestartSec=5
      TimeoutStopSec=10
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
runcmd:
  - - sh
    - -c
    - |-
      command -v dumbpipe >/dev/null || {
        _arch=$(uname -m)
        case "$_arch" in x86_64|amd64) _arch=x86_64 ;; aarch64|arm64) _arch=aarch64 ;; esac
        curl -fsSL "https://github.com/n0-computer/dumbpipe/releases/download/v0.39.0/dumbpipe-v0.39.0-linux-${_arch}.tar.gz" | tar -xvz -C /usr/local/bin dumbpipe
        chmod 755 /usr/local/bin/dumbpipe
      }
  - - sh
    - -c
    - install -d -m 0700 -o root -g root /root/secrets
  - - sh
    - -c
    - |-
      timeout 30 /usr/local/bin/dumbpipe listen-tcp --host 127.0.0.1:22 > /root/secrets/iroh-node-id || true
      chmod 0600 /root/secrets/iroh-node-id
      [ -s /root/secrets/iroh-node-id ] || { echo "dumbpipe ticket never appeared" >&2; exit 1; }
  - systemctl daemon-reload
  - systemctl enable --now ssh || systemctl enable --now sshd
  - systemctl enable --now dumbpipe-listen.service
disable_root: false
ssh_pwauth: false
