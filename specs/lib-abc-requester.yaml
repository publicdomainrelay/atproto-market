kind: SystemContext
metadata:
  name: lib-abc-requester
  namespace: default
spec:
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists to pin down the contract boundary of the requester:
    the types and pure helpers every requester transport, CLI and test agrees on,
    so that bid collection, winner selection and the option surface can change implementation
    without changing the modules that consume them. It is deliberately dependency-light
    and side-effect-free, which lets the flow implementation in lib/requester-xrpc/mod.ts
    and the tests under test/ be exercised against fakes; the only behavior it owns
    is deterministic bid bookkeeping. The SSH transport surface is now transport-neutral:
    the flow''s target is an iroh ticket by default and a relay FQDN only for the
    legacy transport.'
  interfaces:
