apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-abc-requester
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists so the atproto-market requester''s ABC layer — the
    bid collection and winner-selection rules, the requester PDS surface, the contract
    flow''s option and result bags, and the SSH session provider contract — can be
    specified once and depended on by the implementation, the CLI and the hermetic
    test fakes without any of them re-deriving the shapes. It is a pure declaration
    file: no I/O, no runtime globals, only the types and pure helpers that the transport
    layers below it must satisfy. The guest transport is iroh by default, so the address
    the flow waits for and hands to the SSH provider is an opaque transport address
    — an iroh ticket for iroh, a relay hostname for the websocket transports — and
    the ABC layer never assumes it is a resolvable FQDN.'
  requirements:
  - id: r.bid-collector-dedupe
    level: MUST
    text: BidCollector.add ignores a bid whose uri has already been seen and otherwise
      records that uri, appends the bid and starts the early-exit path only when firstFree
      is set, the collector is unsettled and isFree(bid) holds; addAll is a repeated
      add over an array and all() returns the arrival-ordered list of distinct bids,
      so two bidders submitting the same record URI contribute one entry.
    codeRefs:
    - class:d57e883e006876b805c05d8d04f3c70d
    - method:075eb6ec1290d376ade2f43084aafaa7
    - method:57342a42b93f081e405aff614b83bea6
    - method:8caf134464a48ce61f8572f957c5d489
    - method:be9c9383827329e0d7af9662d2f6f1de
  - id: r.bid-collector-drain
    level: MUST
    text: drain waits for every in-flight early-path policy check to settle by looping
      over Promise.allSettled of the tracked in-flight set until it is empty, so a
      caller that stops waiting out the bid window still observes all policy checks
      complete before it proceeds, and no rejection from a check escapes drain.
    codeRefs:
    - class:d57e883e006876b805c05d8d04f3c70d
    - method:a494d7a4e7ee0619038e9ac0caa89a66
  - id: r.bid-collector-early-winner
    level: MUST
    text: On the early-exit path add awaits opts.allow(bid) and, only if that policy
      gate resolves true and no earlier free bid has settled the collector, sets the
      settled flag, invokes opts.onEarlyWinner and resolves the public earlyWinner
      promise with that bid; a rejected gate is swallowed by a catch and leaves the
      window open, so a free bid from a rejected bidder never short-circuits it.
    codeRefs:
    - class:d57e883e006876b805c05d8d04f3c70d
    - method:075eb6ec1290d376ade2f43084aafaa7
    - method:8caf134464a48ce61f8572f957c5d489
  - id: r.bid-collector-early-winner-once
    level: MUST
    text: earlyWinner is created through Promise.withResolvers in the constructor
      and settles at most once per collector, because the settled flag is re-checked
      after the allow promise resolves, so a second free bid arriving while the first
      policy check is still in flight can never produce a second resolution or a second
      onEarlyWinner callback.
    codeRefs:
    - class:d57e883e006876b805c05d8d04f3c70d
    - method:1d57f0d392207f772e28cf364c8221e6
  - id: r.bid-collector-options
    level: MUST
    text: BidCollector is constructed from a BidCollectorOptions whose freeBidNsid,
      firstFree and async allow gate are required and whose onEarlyWinner callback
      is optional, so every caller must name the NSID that marks a bid free and supply
      the policy gate; isFree is exactly the comparison of bidPayloadNsid(bid) against
      that freeBidNsid.
    codeRefs:
    - interface:bbce0224c2c383325ab5878b13e89926
    - method:075eb6ec1290d376ade2f43084aafaa7
    - method:1d57f0d392207f772e28cf364c8221e6
  - id: r.bid-cost
    level: MUST
    text: bidCost reads record.payload.cost and coerces it with Number, yielding Infinity
      when the payload or the cost is absent, so an unpriced bid never wins on price
      and never returns NaN into the comparison.
    codeRefs:
    - function:24f8ac1d96de6ca5018e544cac052e84
  - id: r.bid-payload-nsid
    level: MUST
    text: 'bidPayloadNsid reads the NSID from record.payload: it returns the payload''s
      $type when a $type is present and is not com.atproto.repo.strongRef, otherwise
      it falls back to the fourth slash-separated segment of payload.uri (the rkey
      position of an at:// URI), and it returns the empty string when there is no
      payload or no such segment.'
    codeRefs:
    - function:69339ecd22627b6da61ee16603023f6c
    - interface:f25a32e8c06ef59f558fa95805408414
  - id: r.collected-bid-shape
    level: MUST
    text: A collected bid is identified by exactly four fields, did, uri, cid and
      an untyped record object; the bid's payload and cost are read out of that record
      by bidPayloadNsid and bidCost rather than carried as top-level fields, so callers
      pass the raw atproto record through untouched.
    codeRefs:
    - function:24f8ac1d96de6ca5018e544cac052e84
    - function:69339ecd22627b6da61ee16603023f6c
    - interface:f25a32e8c06ef59f558fa95805408414
  - id: r.console-buffer
    level: MUST
    text: 'ConsoleBuffer lets the flow stop and restart console output around interactive
      or SSH phases: pause is synchronous and resume returns a promise the caller
      awaits before the flow continues.'
    codeRefs:
    - interface:2bf4e4013748280889dd472657b64d28
  - id: r.contract-flow-defaults
    level: SHOULD
    text: 'The option bag documents its own defaults so implementations agree: fedingressHost
      defaults to fedproxy.com, the userData transport module defaults to the iroh
      module id (the dumbpipe listener transport), and sshProxyCommandFn, when supplied,
      overrides the per-target ProxyCommand that otherwise follows the transport the
      flow selected — `dumbpipe connect <ticket>` for iroh and websocat --binary wss://<fqdn>
      only for the explicitly selected tunnel or fedproxy-ssh transport — letting
      tests and alternate ingress topologies rewrite the guest endpoint while keeping
      the RFP flow intact.'
    codeRefs:
    - interface:7fb903e1181ae51a3d69c0a40484e610
  - id: r.contract-flow-hold-mode
    level: MUST
    text: 'hold turns the flow into provisioning-only mode: after SSH-ready it does
      not run execProgram, holds the VM until holdAbort fires and then deletes it,
      and holdAbort is ignored unless hold is set.'
    codeRefs:
    - interface:7fb903e1181ae51a3d69c0a40484e610
  - id: r.contract-flow-options-surface
    level: MUST
    text: 'ContractFlowOptions is the whole option surface of the contract flow and
      every field is optional: VM naming and PLC URL, guest /etc/hosts aliases, relay
      URLs plus extra and denied bidder DIDs, the ssh toggles (skipSsh, execProgram,
      keepVm, sshAuthorizedKeys, vmReadyTimeoutSec, onSshStart and onSshEnd), the
      ingressProxyHost and fedingressHost planes, cloud-init composition (userData
      with base, transport, modules and overrides, the deprecated baseUserData, and
      userDataFactory which wins over userData), the capabilities array, the rbac
      toggle, appliesToNsid, and the policy knobs (policy, policyEngine, onlyRemotePolicyExec,
      allowUntrustedPolicyExec); the flow never names an individual capability, so
      adding one does not change this module.'
    codeRefs:
    - interface:7fb903e1181ae51a3d69c0a40484e610
  - id: r.contract-flow-result
    level: MUST
    text: ContractFlowResult reports the terminal event name plus whichever URIs and
      CIDs the run produced (vm, rfp, accept, bid and receipt), the winner DID, the
      submit event reference and receiptOk flag, the bid count, sshReady and sshExitCode,
      and an error string; every field other than event is optional, so partial results
      can be returned for a failed run.
    codeRefs:
    - interface:d628e8817422a09b842f19f2d455731e
  - id: r.contract-flow-result-transport
    level: MUST
    text: 'ContractFlowResult also carries the transport the run actually used: an
      optional sshProxyCommand string holding the ProxyCommand the SSH provider was
      given or derived for the guest target (e.g. `dumbpipe connect <ticket>` for
      iroh), so a caller can assert how the guest was reached without re-deriving
      it from the options. The field is optional and absent on a run that never attempted
      SSH.'
    codeRefs:
    - interface:7fb903e1181ae51a3d69c0a40484e610
    - interface:d628e8817422a09b842f19f2d455731e
  - id: r.deno-json
    level: SHOULD
    text: The package ships a deno.json beside mod.ts naming it @publicdomainrelay/requester-abc,
      exporting ./mod.ts, and mapping @publicdomainrelay/logger, @publicdomainrelay/serve,
      @publicdomainrelay/policy-common and @publicdomainrelay/cloud-init-common to
      their jsr ^0 specifiers, so the type-only dependencies resolve when the package
      is consumed on its own.
    codeRefs:
    - file:lib/abc/requester/deno.json
    - file:lib/abc/requester/mod.ts
  - id: r.pds-options
    level: MUST
    text: PDSOptions requires a structured logger and a serve handle and accepts optional
      privateKeyHex, plcDirectoryUrl, ingressProxyHost, label, storagePath and skipIngress,
      so a requester PDS can be built against an existing serve handle with or without
      its own ingress and with optional durable storage.
    codeRefs:
    - interface:7701e7d56c70ba5cf00215557461ee48
  - id: r.pure-interface-only
    level: MUST
    text: 'The module declares only pure types and pure helpers: no Deno.* global,
      no fetch and no crypto call appears in it, it has no side effects at import
      time, and its dependencies on logger, serve, policy-common, cloud-init-common
      and guest-capability-abc are type-level imports only, so the file can be loaded
      in any JavaScript runtime.'
    codeRefs:
    - file:lib/abc/requester/mod.ts
  - id: r.requester-pds-association
    level: MUST
    text: 'RequesterPDS carries the CLI association handshake: associateCalled resolves
      with the caller DID when the webapp invokes the associateConfirm XRPC, while
      approveAssociation resolves that pending XRPC response and rejectAssociation
      rejects it with the supplied error.'
    codeRefs:
    - interface:380dfb7fe1bd2c55f157a6b95bd59bd0
  - id: r.requester-pds-bidder-calls
    level: MUST
    text: RequesterPDS resolves a bidder's endpoint from an endpoint URL to a target
      URL plus audience DID, or null when it cannot be resolved, and calls it through
      callBidder with a target base, NSID, lxm, audience DID and body, returning the
      raw status, ok flag and decoded body so the flow never speaks HTTP itself; incoming
      bids are buffered in a pendingBids map keyed by the contract uri.
    codeRefs:
    - interface:380dfb7fe1bd2c55f157a6b95bd59bd0
    - interface:f25a32e8c06ef59f558fa95805408414
  - id: r.requester-pds-ingress-lifecycle
    level: MUST
    text: RequesterPDS exposes did, serve and relay immediately, but ingressRef, relaySubdomain,
      ingressUrl and ingressHost are valid only after beginServe() has been awaited;
      before the relay connects the URL and host accessors return the empty string
      rather than throwing.
    codeRefs:
    - interface:380dfb7fe1bd2c55f157a6b95bd59bd0
  - id: r.requester-pds-optional-handles
    level: MUST
    text: 'RequesterPDS exposes dispose() to release storage resources such as a Deno.Kv
      handle, and carries optional irohNodeId, resolveIrohNodeId, setOnNetworkResolved
      and clearOnNetworkResolved members: the iroh node id promise is resolved once
      and is a no-op after the first call, and onNetwork interest is keyed by the
      contract''s receipt because one requester serves many contracts concurrently.'
    codeRefs:
    - interface:380dfb7fe1bd2c55f157a6b95bd59bd0
  - id: r.requester-pds-records
    level: MUST
    text: RequesterPDS writes to its own repo through createRepoRecord and createSignedRepoRecord,
      both returning the created record's uri and cid; the signed variant additionally
      takes an attestation keypair and an optional issuer so a record can be attributed
      to a key other than the repo owner, and the interface exposes that attestationKp
      plus the requester's signer and privateKeyHex as properties.
    codeRefs:
    - interface:380dfb7fe1bd2c55f157a6b95bd59bd0
  - id: r.requester-pds-transport-address
    level: MUST
    text: 'RequesterPDS is the only channel through which the flow learns where the
      provisioned guest can be reached, and it learns one transport address per contract:
      the flow registers its interest keyed by the contract''s receipt before the
      guest is provisioned, the PDS resolves that interest exactly once, and a second
      address for the same contract is ignored. The address is opaque — an iroh ticket
      for the default transport and a relay hostname for the websocket transports
      — so the PDS must not classify, rewrite or reject it by shape. The same PDS
      owns the inbound route the guest POSTs its own address to and exposes the absolute
      URL of that route so the flow can bake it into the guest''s cloud-config; a
      requester with no publicly addressed ingress exposes no such URL and leaves
      the flow waiting on the event path instead.'
    codeRefs:
    - interface:380dfb7fe1bd2c55f157a6b95bd59bd0
  - id: r.select-winner-cheapest
    level: MUST
    text: selectWinner returns the bid with the strictly lowest bidCost by reducing
      over the array, keeping the earliest of equal-cost bids because the incumbent
      is replaced only on a strict less-than, and it returns undefined for an empty
      bid list.
    codeRefs:
    - function:24f8ac1d96de6ca5018e544cac052e84
    - function:7daa86a6f9e8695a5c71ac805fdf133f
  - id: r.ssh-session-provider
    level: MUST
    text: 'SshSessionProvider is the whole SSH surface the flow may assume: generateKeypair
      returns a public key and a private key path for a VM name, pollReady reports
      whether the guest at a transport address becomes reachable within a timeout,
      and runSession runs a program on that address and returns its exit code. The
      address argument is the guest''s transport address, not necessarily a DNS name:
      an iroh ticket for the iroh transport and a relay hostname for the websocket
      transports. The provider, not the flow, turns that address into a ProxyCommand,
      so a provider and the flow agree on key material, readiness and exit status
      without the flow knowing the transport or how the address is dialled.'
    codeRefs:
    - interface:8ae67fbea354fbac2ec37b3b073691bf
