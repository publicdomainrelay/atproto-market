apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-tangled-spindle
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'Provide the generated TypeScript bindings for the `com.publicdomainrelay.temp.tangled.spindle.trigger`
    XRPC procedure so that callers and the spindle server share one schema: the defs
    file declares the NSID, the empty parameter set, the JSON input and output payload
    schemas, the `WorkflowResult` object shape, and the procedure''s declared error
    names, while `trigger.ts` narrows the import surface to the single NSID module.
    It is a leaf lexicon package inside the `market-lexicons` tree, consumed wherever
    the market needs to trigger a Tangled pipeline over PDS service proxying rather
    than talking to the spindle directly.'
  requirements:
  - id: r.barrel-export
    level: MUST
    text: '`trigger.ts` re-exports everything from `trigger.defs.ts` and re-exports
      `main` as the module default, so `main` is the single importable entry point
      for the procedure while `$nsid`, `$params`, `$input`, `$output`, `workflowResult`,
      the inferred types, and `$lxm` stay reachable from the same module path.'
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.ts
  - id: r.generated-do-not-edit
    level: MUST
    text: Both files are generated by `@atproto/lex` and carry a do-not-edit banner,
      so changes to the procedure shape must be made in the source lexicon and regenerated
      rather than hand-edited here.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.ts
  - id: r.input-shape
    level: MUST
    text: The JSON input payload requires `knot`, `pipelineRkey`, `actor`, `repoDid`,
      `repoName`, and `ref` as strings, with `actor` and `repoDid` constrained to
      the `did` string format, and accepts an optional `inputs` lex-map; `$Input`
      and `$InputBody` are the inferred payload and payload-body types over that schema,
      parameterized by a binary-data type defaulting to `l.BinaryData`.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
    - type_alias:2384d850334f4824332256cd26c0e1e0
    - type_alias:7b015485c5d41aa955d7da0515ea7cbc
  - id: r.nsid-identity
    level: MUST
    text: The module declares the procedure NSID `com.publicdomainrelay.temp.tangled.spindle.trigger`
      as `$nsid`, re-exports it, and exports it again as `$lxm` so callers can address
      the method by its lexical name without hard-coding the string.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.ts
  - id: r.output-shape
    level: MUST
    text: The JSON output payload requires a boolean `submitted` plus `knot`, `pipelineRkey`,
      and `ref` strings, and a `workflows` array of `WorkflowResult` references, with
      `$Output` and `$OutputBody` inferred from that schema and parameterized by a
      binary-data type defaulting to `l.BinaryData`.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
    - type_alias:35f9b05be484c9db3e66293938e0c7fc
    - type_alias:5b2e55e12944df104929ddb029ab7366
  - id: r.params-empty
    level: MUST
    text: The procedure declares an empty parameter set via `l.params()`, so `$Params`
      resolves to an empty object type and the trigger carries no query or path arguments;
      all run data travels in the input body.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
    - type_alias:635b87d49390c20cc0c03a3b2717fce8
  - id: r.procedure-errors
    level: MUST
    text: The procedure is registered with the declared error names `InvalidRequest`,
      `Unauthorized`, and `Forbidden`, so a spindle rejecting a trigger can distinguish
      a malformed request from an unauthenticated caller and from an authenticated
      caller not permitted to trigger that pipeline.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
  - id: r.service-proxy-auth
    level: SHOULD
    text: The procedure is documented as intended to be invoked through PDS service
      proxying via the `atproto-proxy` header pointed at the spindle's did:web service
      entry, so the user's PDS mints and signs the inter-service auth token, the spindle
      verifies the token issuer against their DID document, and the verified issuer
      must match the trigger's `actor`; the input mirrors the `sh.tangled.pipeline`
      fields a knot dispatches on a push or PR event.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
  - id: r.workflow-result
    level: MUST
    text: A `WorkflowResult` typed object under the NSID fragment `#workflowResult`
      carries a required `workflow` string naming the submitted workflow stem and
      optional `logsUrl` and `statusUrl` fields constrained to URI strings; the output's
      `workflows` array references this type so each submitted pipeline run is reported
      by stem and, when available, by log and status stream URLs.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
  interfaces:
  - name: $Input
    kind: type_alias
    signature: export type $Input<B = l.BinaryData> = l.InferPayload<typeof $input,
      B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
  - name: $InputBody
    kind: type_alias
    signature: export type $InputBody<B = l.BinaryData> = l.InferPayloadBody<typeof
      $input, B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
  - name: $Output
    kind: type_alias
    signature: export type $Output<B = l.BinaryData> = l.InferPayload<typeof $output,
      B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
  - name: $OutputBody
    kind: type_alias
    signature: export type $OutputBody<B = l.BinaryData> = l.InferPayloadBody<typeof
      $output, B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
  - name: $Params
    kind: type_alias
    signature: export type $Params = l.InferOutput<typeof $params>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
codeRefIndex:
