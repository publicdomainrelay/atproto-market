  - name: $Input
    kind: type_alias
    signature: export type $Input<B = l.BinaryData> = l.InferPayload<typeof $input,
      B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/market/registerBidder.defs.ts
  - name: $InputBody
    kind: type_alias
    signature: export type $InputBody<B = l.BinaryData> = l.InferPayloadBody<typeof
      $input, B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/market/registerBidder.defs.ts
  - name: $Output
    kind: type_alias
    signature: export type $Output<B = l.BinaryData> = l.InferPayload<typeof $output,
      B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/market/listBidders.defs.ts
  - name: $OutputBody
    kind: type_alias
    signature: export type $OutputBody<B = l.BinaryData> = l.InferPayloadBody<typeof
      $output, B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/market/listBidders.defs.ts
  - name: $Params
    kind: type_alias
    signature: export type $Params = l.InferOutput<typeof $params>
