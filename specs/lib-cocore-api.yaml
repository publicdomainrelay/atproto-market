apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-cocore-api
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: This context exists so callers elsewhere in atproto-market can manage cocore
    API keys without hand-rolling XRPC plumbing or service-auth signing. It isolates
    the cocore-specific details — the default AppView host, the did:web audience derivation,
    the three api-key NSIDs, and the error convention — behind a small typed surface,
    and keeps token minting injectable so the caller supplies getServiceAuth rather
    than the module owning credentials.
  requirements:
  - id: r.create-api-key
    level: MUST
    text: CocoreClient.createApiKey takes a name, posts it to the create-api-key NSID,
      and resolves to a CreateApiKeyResponse carrying the new token string and the
      ApiKey that was created.
    codeRefs:
    - function:1fea095a0bee325bdb1aae5e86e8f6a3
    - interface:1bcea98b6e61d0fa858c001c956b655d
    - interface:6c1e6b8fec8cdfaf8c00a2c93ec26f2e
  - id: r.default-appview-url
    level: MUST
    text: createCocoreClient resolves the base URL from opts.appviewUrl and falls
      back to https://appview.cocore.dev when it is absent, stripping any trailing
      slashes from the result before use.
    codeRefs:
    - function:1fea095a0bee325bdb1aae5e86e8f6a3
    - interface:8ec256e4f14d893e88afbca014d72b53
  - id: r.delete-api-key
    level: MUST
    text: CocoreClient.deleteApiKey takes a key id, posts it to the delete-api-key
      NSID, and resolves to void once the call succeeds.
    codeRefs:
    - function:1fea095a0bee325bdb1aae5e86e8f6a3
    - interface:6c1e6b8fec8cdfaf8c00a2c93ec26f2e
  - id: r.error-on-non-ok
    level: MUST
    text: A non-ok response throws an Error whose message includes the NSID, the HTTP
      status, and the response body text, rather than returning the failed response.
    codeRefs:
    - function:d182b9f8d24e2ca8806313b0bcd98280
  - id: r.injectable-fetch
    level: SHOULD
    text: The helper performs its fetch through opts.fetch when provided and falls
      back to globalThis.fetch otherwise, so callers can substitute the transport.
    codeRefs:
    - function:d182b9f8d24e2ca8806313b0bcd98280
    - interface:8ec256e4f14d893e88afbca014d72b53
  - id: r.list-api-keys
    level: MUST
    text: CocoreClient.listApiKeys calls the list-api-keys NSID with no body and resolves
      to a ListApiKeysResponse whose keys array holds ApiKey entries with id, name,
      createdAt and an optional lastUsedAt.
    codeRefs:
    - interface:09decfc0b5223bf533f41d5230769bc8
    - interface:6c1e6b8fec8cdfaf8c00a2c93ec26f2e
    - interface:a6b944b6f1859d7bd5b304b7a2b77b3c
  - id: r.service-auth-audience
    level: MUST
    text: Every request derives its service-auth audience as did:web:<host> from the
      parsed base URL and obtains a token by awaiting opts.getServiceAuth(aud, nsid)
      with that audience and the NSID being called.
    codeRefs:
    - function:d182b9f8d24e2ca8806313b0bcd98280
    - interface:8ec256e4f14d893e88afbca014d72b53
  - id: r.single-module-package
    level: MAY
    text: The package ships as a single-entry Deno module, with every type and the
      factory exported from lib/cocore-api/mod.ts and its manifest alongside at lib/cocore-api/deno.json.
    codeRefs:
    - file:lib/cocore-api/deno.json
    - file:lib/cocore-api/mod.ts
  - id: r.transport-post-json
    level: MUST
    text: The internal call helper issues an HTTP POST to <base>/xrpc/<nsid> with
      content-type application/json and an authorization header of Bearer <token>,
      attaching a JSON-stringified body only when a body argument was supplied, and
      parses the response as JSON.
    codeRefs:
    - function:d182b9f8d24e2ca8806313b0bcd98280
  interfaces:
  - name: ApiKey
    kind: interface
    signature: 'interface ApiKey { id: string; name: string; createdAt: string; lastUsedAt?:
      string }'
    file: lib/cocore-api/mod.ts
  - name: CocoreClient
    kind: interface
    signature: 'interface CocoreClient { createApiKey(name: string): Promise<CreateApiKeyResponse>;
      listApiKeys(): Promise<ListApiKeysResponse>; deleteApiKey(id: string): Promise<void>
      }'
    file: lib/cocore-api/mod.ts
  - name: CocoreClientOptions
    kind: interface
    signature: 'interface CocoreClientOptions { appviewUrl?: string; fetch?: typeof
      fetch; getServiceAuth: (aud: string, nsid: string) => Promise<string> }'
    file: lib/cocore-api/mod.ts
  - name: CreateApiKeyResponse
    kind: interface
    signature: 'interface CreateApiKeyResponse { token: string; key: ApiKey }'
    file: lib/cocore-api/mod.ts
  - name: ListApiKeysResponse
    kind: interface
    signature: 'interface ListApiKeysResponse { keys: ApiKey[] }'
    file: lib/cocore-api/mod.ts
  - name: createCocoreClient
    kind: function
    signature: 'function createCocoreClient(opts: CocoreClientOptions): CocoreClient'
    file: lib/cocore-api/mod.ts
