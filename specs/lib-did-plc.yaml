apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-did-plc
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists so that services in atproto-market can talk to a PLC
    directory without each one re-implementing the HTTP surface: it centralises the
    DID-document and operation-log reads, operation submission, export/pagination
    and health checks behind one typed PlcClient, gives a typed error taxonomy (PlcNotFoundError,
    PlcTombstonedError, PlcInvalidOperationError, all carrying the HTTP status) so
    callers can distinguish missing, tombstoned and invalid-operation failures, derives
    DID verification keys from resolved documents for signing, and pins the wire format
    to the upstream OpenAPI document through a generated client plus a fixup step
    so the generated code stays usable.'
  requirements:
  - id: r.did-key-resolution
    level: MUST
    text: 'DID verification keys must be derivable two ways: keysFromDidDocument must
      extract the key strings from a resolved DidDocument, and both createPlcKeyResolver,
      which takes PlcKeyResolverOptions defaulting to empty, and plcClientAsKeyResolver,
      which wraps a PlcClient with an optional cache, must return a KeysForDid lookup
      so callers can resolve keys by DID.'
    codeRefs:
    - file:lib/did-plc/resolver.ts
    - function:3a3751439dd48106c07530ecb7436c23
    - function:3b90763d12a0a4c3f820e3c6672dc372
    - function:a44d36ee0dc159bf2beed768aaff1e61
    - interface:d1adb282179ee1bc93186f577980da48
    - type_alias:cda4456d40f40308bc05b5e1f3d08229
  - id: r.error-taxonomy
    level: MUST
    text: Failures must be reported through a PlcError base class that carries the
      HTTP status and sets its name, with PlcNotFoundError for a 404-style missing
      DID, PlcTombstonedError for a 410-style tombstoned DID and PlcInvalidOperationError
      for a rejected operation, so callers can branch on the failure kind.
    codeRefs:
    - class:33b7d068752c38948075552d9cef40eb
    - class:8a857a0ac52fbb0a4da6a57b447664ec
    - class:9b6ece3d7112f0cf0be907735c5f3d5a
    - class:a02218cd093a941f85749da7960298a5
    - file:lib/did-plc/client.ts
    - method:3eb76e760f6161e2133b61ae52ba09e2
    - method:4a87ed875b87c760b18994d50d1b79d5
    - method:56dc0a2c422513844c595e8ec9a9b661
    - method:72c360d1837be5bb5dcfa1140fa19cc7
  - id: r.export-pagination
    level: MUST
    text: PlcClient.export must stream the directory's LogEntry history accepting
      ExportOptions and defaulting to no options, while exportPages must expose the
      same history as an AsyncGenerator of LogEntry pages with a default page size
      of 1000 so large exports can be consumed incrementally.
    codeRefs:
    - file:lib/did-plc/client.ts
    - interface:da65aed4a72e5d371a6f16031aa0ef83
    - method:72f0f2fbb2ecf38e70ef7708ae62c81b
    - method:a8b2aede97428a79b7847a31740b5845
  - id: r.generated-sdk-endpoints
    level: MUST
    text: Generation must emit one thin request function per PLC directory endpoint
      - resolve a DID, create an op, read the op log, read the audit log, read the
      last op, read the stored data and export - each taking an Options object and
      returning a RequestResult parameterised by that endpoint's responses and errors,
      with a shared client transport underneath that resolves config, auth tokens,
      URLs, bodies and interceptors, and parameter serializers that follow OpenAPI
      style rules for arrays, objects, primitives and multipart bodies.
    codeRefs:
    - file:lib/did-plc/openapi-ts.config.ts
    - file:lib/did-plc/openapi.official.yaml
  - id: r.genesis-operation
    level: MUST
    text: createGenesisOp must build a signed PLC genesis operation from GenesisOptions
      and resolve with a GenesisResult, giving callers a way to create a brand new
      DID without hand-assembling the operation.
    codeRefs:
    - file:lib/did-plc/genesis.ts
    - function:8da01723383daa387c12dc941628b9a7
    - interface:4c23cbfe2fc6db60fea7fe843a47a8f6
    - interface:5998a6ebd292373230c747dba056be85
  - id: r.get-data
    level: MUST
    text: PlcClient.getData must return the directory's stored data for a DID as an
      untyped unknown value, for callers that need the raw payload rather than a DidDocument.
    codeRefs:
    - file:lib/did-plc/client.ts
    - method:7a27bfcb60ada39f3859bf8cd78c6fed
  - id: r.health-check
    level: MUST
    text: PlcClient.health must query the directory health endpoint and resolve with
      a HealthResponse, and must raise PlcError when the directory reports an error
      status.
    codeRefs:
    - class:a02218cd093a941f85749da7960298a5
    - file:lib/did-plc/client.ts
    - interface:d20f19dc21ed3a83a1714e5dd722b53e
    - method:934b52fe49087234488561a3e9fa265c
  - id: r.keypair-state-persistence
    level: MUST
    text: 'Keypair state must round-trip through a file path: loadKeypairState must
      resolve to the parsed KeypairState or to null when no state exists at that path,
      and saveKeypairState must write the state back so genesis keys survive process
      restarts.'
    codeRefs:
    - file:lib/did-plc/keypair-state.ts
    - function:689a9b51d2e09d093defe4dfd3db3deb
    - function:c4d5a623ba103c6f42dd447f82559553
    - interface:df8391de25b80908a518669067a0216c
  - id: r.openapi-fixup
    level: SHOULD
    text: The generated code must be produced from the pinned openapi.official.yaml
      through openapi-ts.config.ts, with fixup-openapi.ts correcting the specification
      before generation so a regeneration reproduces a client that compiles and types
      correctly.
    codeRefs:
    - file:lib/did-plc/fixup-openapi.ts
    - file:lib/did-plc/openapi-ts.config.ts
    - file:lib/did-plc/openapi.official.yaml
  - id: r.operation-log-reads
    level: MUST
    text: 'The client must expose the three distinct PLC log reads for a DID: getLog
      returning the current Operation list, getAuditLog returning the full LogEntry
      audit trail including nullified entries, and getLastOp returning only the most
      recent Operation.'
    codeRefs:
    - file:lib/did-plc/client.ts
    - method:21f0cc8824e1b4f6b3504c835e87cf1d
    - method:acc069a9598f75909843cc79e05f199d
    - method:f049cdcb1705123200f64a903d8d30bf
  - id: r.package-entrypoint
    level: MUST
    text: mod.ts must re-export the package's public surface - the PlcClient and its
      error classes, the factories and the shared option and response types - so consumers
      import the library from a single module.
    codeRefs:
    - class:ca276d9a71683fdf566bcdf5fb46e47c
    - file:lib/did-plc/mod.ts
    - file:lib/did-plc/types.ts
    - interface:d20f19dc21ed3a83a1714e5dd722b53e
    - interface:da65aed4a72e5d371a6f16031aa0ef83
  - id: r.plc-client-construction
    level: MUST
    text: A PlcClient must be constructible from PlcClientOptions, defaulting to an
      empty options object when none is supplied, and createPlcDirectoryClient must
      require a plcDirectoryUrl and return a PlcClient bound to that directory URL.
    codeRefs:
    - class:ca276d9a71683fdf566bcdf5fb46e47c
    - file:lib/did-plc/client.ts
    - function:e49cc4a90e023dc47d5a2d109f1d2f08
    - interface:d759a391fe304d866db88c324e3e12bc
    - method:ccfc740ff0345ec11783cafe8b0545c9
  - id: r.resolve-did
    level: MUST
    text: PlcClient.resolve must fetch the PLC document for a DID string and return
      it as a Promise<DidDocument>, so callers get verification methods and services
      for identity.
    codeRefs:
    - class:ca276d9a71683fdf566bcdf5fb46e47c
    - file:lib/did-plc/client.ts
    - method:a608364390c07ffbcb4053df02e4f50c
  - id: r.shared-types
    level: MUST
    text: 'The shared option, response and service shapes must live in types.ts: ExportOptions
      carrying the export filters PlcClient.export accepts, HealthResponse carrying
      the directory health payload PlcClient.health resolves to, and PlcService describing
      a service entry, so the client and its consumers agree on one definition of
      each.'
    codeRefs:
    - file:lib/did-plc/types.ts
    - interface:4f51012b3df9c0dc5b7b93dc7b0249ba
    - interface:d20f19dc21ed3a83a1714e5dd722b53e
    - interface:da65aed4a72e5d371a6f16031aa0ef83
  - id: r.submit-operation
    level: MUST
    text: PlcClient.submitOp must POST a signed Operation for a given DID to the directory
      and resolve to void on success, rejecting with a PlcError-family error otherwise.
    codeRefs:
    - class:a02218cd093a941f85749da7960298a5
    - file:lib/did-plc/client.ts
    - method:6265c2659cccf561f5f79d7c67669548
