apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-hono-factory-did-plc-directory
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  - sc.lib-did-plc
  intent: 'This context exists so a host can serve a did:plc style directory over
    HTTP without owning identity storage or cryptography: the library takes an injected
    PlcStore and verifySig, mounts the standard PLC route table on a Hono app, and
    exposes the app plus the store back to the caller. It separates the operation
    pipeline (structure, signature, prev-chain and rotation-key checks, CID derivation)
    from the transport, and keeps the DID-document projection as a pure replay of
    a DID''s current operation log.'
  requirements:
  - id: r.cid-computation
    level: MUST
    text: computeOperationCid hashes the signed operation bytes with SHA-256 and wraps
      the digest as a base32 multibase string under the dag-cbor CIDv1 header, so
      identical signed bytes always yield the same operation CID and a CID can be
      recomputed from the bytes alone.
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/validation.ts
    - function:cee54877382c117e060715b89d4affa0
  - id: r.did-document-resolution
    level: MUST
    text: 'resolveDidDocument replays a DID''s current operations in order and returns
      the resulting DID document, or null when the log is empty or its last entry
      is a plc_tombstone; a create entry supplies the atproto signing key as a verification
      method, the handle in alsoKnownAs and the atproto_pds service, while plc_operation
      entries merge their verificationMethods, alsoKnownAs and services over the accumulated
      state, with keys emitted as Multikey verification methods under ''#id'' after
      stripping any did:key: prefix, and duplicate alsoKnownAs values collapsed.'
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/did-resolution.ts
    - function:45efe51af646c2a859080a62330a6a54
  - id: r.export-pagination
    level: MUST
    text: 'The export handler reads the after and count query parameters, rejecting
      an after that does not parse as a date with 400 ''Invalid Query Parameter: after''
      and a count that is non-numeric or negative with 400 ''Invalid Query Parameter:
      count'', clamping an accepted count to at most 1000, and answers with the entries
      returned by store.exportLogs(after, count).'
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/handlers.ts
    - method:b8ee53ece42a3057f7a82bf6033b7ab5
  - id: r.factory-construction
    level: MUST
    text: createPlcDirectoryFactory takes an optional PlcDirectoryOptions whose store,
      version and verifySig fields are all optional and which defaults to an empty
      object, constructs a Hono app, mounts the directory routes on it through mountHandlers,
      and returns a PlcDirectoryFactory exposing that app together with the PlcStore
      actually in use, so a caller can serve the directory and still hold a handle
      on the same store instance it is serving from.
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/factory.ts
    - function:3179a5fa554e021c00aadca31e4500e6
    - interface:5a96ae66f70475a99ec34b51ef860a0b
    - interface:ebd7cb20d08759e13cef8d018c871479
  - id: r.handler-mounting
    level: MUST
    text: mountHandlers receives the Hono app and a HandlerDeps carrying the required
      store and version plus an optional verifySig, and registers exactly the routes
      GET /health, GET /export, GET /:did, POST /:did, GET /:did/log and GET /:did/log/audit,
      each dispatching to its dedicated handler with that same deps object, so this
      route table is the entire HTTP surface of the directory.
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/handlers.ts
    - function:b33678bc247c0cfd81b6157c59e5bde5
    - interface:cc3d4161f433917a2f2ac397219b72d6
  - id: r.health-reports-version
    level: MUST
    text: The health handler answers GET /health with a JSON body carrying the version
      string supplied through HandlerDeps, so an operator can confirm which build
      of the directory is running without inspecting the process.
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/handlers.ts
    - interface:cc3d4161f433917a2f2ac397219b72d6
  - id: r.memory-store
    level: MUST
    text: 'MemoryPlcStore implements PlcStore over an in-process Map keyed by DID:
      getCurrentOps filters out entries flagged nullified, getAuditLog returns the
      stored list unchanged, getOpByCid finds an entry by CID or returns null, insertOp
      appends and creates the DID''s list on first write, nullifyOps marks every entry
      whose CID is in the requested set, and exportLogs gathers entries from every
      DID, skips those whose createdAt is at or before an after cutoff, sorts by createdAt
      string order and slices to count when count is given.'
    codeRefs:
    - class:6dc897b2ad83f3474c8cc21fa651b5f0
    - file:lib/hono-factory-did-plc-directory/storage/plc-store.ts
    - method:5effb1ba90cc09ca38b9facc67e0e5e5
    - method:8b706b26d2ae998889c6d053a48c7fe3
    - method:b7635d15869a1ecb4b58b9cef42809a8
    - method:b796dec3c2dab2f5c026e954e2799299
    - method:b8ee53ece42a3057f7a82bf6033b7ab5
    - method:f3ed83fb406ac57043fa578dc7d44e12
  - id: r.module-surface
    level: SHOULD
    text: mod.ts re-exports the library's public surface — the factory and its option
      and result types, the handler mount and its deps, the store contract and in-memory
      implementation, the validation helpers and the DID-document resolver — so a
      consumer imports from the package entrypoint rather than reaching into individual
      files.
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/mod.ts
  - id: r.prev-chain-validation
    level: MUST
    text: validatePrevChain checks an operation's prev pointer against the DID's existing
      log entries and returns null when the chain link is consistent or a string describing
      the failure otherwise, so gaps, forks and stale prevs are rejected before an
      operation is accepted into the log.
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/validation.ts
    - function:ce60a9ce515fde8a842b8e510617e5e3
  - id: r.rotation-key-auth
    level: MUST
    text: validateRotationKeyAuth takes the previous operation and a signer DID and
      returns a boolean telling whether that signer is authorised by the previous
      operation's rotation keys, so only holders of a rotation key can extend a DID's
      log.
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/validation.ts
    - function:3cdeb3d911d0b80c2f67f10b8b825205
  - id: r.signature-verification
    level: MUST
    text: verifyOperationSignature takes a PlcOp or TombstoneOp, the signer DID and
      an injected verifySig callback of the form (did, data, sig) => Promise<boolean>,
      and resolves to whether that callback accepts the operation's signature, keeping
      the cryptographic primitive outside the library so hosts can supply their own
      key handling.
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/validation.ts
    - function:d29a8b70510a2a66739855a818989601
  - id: r.store-contract
    level: MUST
    text: 'PlcStore is the persistence contract the directory runs against: per DID
      it yields the current, non-nullified operations through getCurrentOps and the
      full log including nullified entries through getAuditLog, looks up a single
      entry by CID through getOpByCid, appends an entry through insertOp, marks a
      set of CIDs nullified through nullifyOps, and exports entries across all DIDs
      in ascending createdAt order through exportLogs while applying an optional after
      cutoff and truncating to an optional count.'
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/storage/plc-store.ts
    - interface:86a4aca923e87a6278f374fd01ce9547
  - id: r.structure-validation
    level: MUST
    text: validateOperationStructure takes an unknown value and returns a string describing
      the structural problem it found, or null when the operation is well formed,
      so a caller can reject a malformed operation before performing any cryptographic
      work on it.
    codeRefs:
    - file:lib/hono-factory-did-plc-directory/validation.ts
    - function:5503ef41dd95dd3ff95e23b6b7bd072e
