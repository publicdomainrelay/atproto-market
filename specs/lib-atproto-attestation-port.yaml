apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-atproto-attestation-port
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: This context exists to isolate the attestation port — the boundary through
    which the market code creates, appends and verifies cryptographic attestations
    on AT Protocol records — from the marketplace logic that consumes it. It fixes
    the wire shape of an attestation (a signatures array entry with $type, issuer
    did:key, cid and base64url signature, or a proof strongRef for remote attestations),
    the deterministic CID binding over record, metadata and repository, and the closed
    set of typed errors callers may catch. Keeping it separate lets the market, bidder
    and helper contexts depend on a stable attestation API without re-implementing
    key encoding, DAG-CBOR CID computation or signature normalisation, and lets verification
    remain pluggable through KeyResolver and RecordResolver without the library knowing
    how repositories or DIDs are actually fetched.
  requirements:
  - id: r.any-input-json-or-string
    level: MUST
    text: 'AnyInput wraps a record or metadata value either as a parsed JSON object
      or as a JSON string: AnyInput.serialize wraps a value, AnyInput.string wraps
      raw JSON text, AnyInput.unwrap decodes a string value back to a JsonObject and
      returns the serialized value otherwise, AnyInput.isString and AnyInput.isSerialize
      report which wrapping is in use, and a value that is neither a JSON object nor
      valid JSON raises AnyInputError.'
    codeRefs:
    - class:1a37e5e99c2f4686933593eaa60984ba
    - file:lib/atproto-attestation-port/input.ts
    - method:30ab2cdc2d7313e77f1c432546b9ac5b
    - method:91503af86adefbc94fa747b007fe8479
    - method:cac29564982c30bd3d715b12f82c39cf
    - method:e1982fb1967a1379ef0321784b96cbe4
    - method:fcd307bc25f1c5640baaf03fe65bc70b
  - id: r.append-inline-verifies-before-appending
    level: MUST
    text: appendInlineAttestation verifies the supplied attestation against the record
      using the caller's KeyResolver before appending a signature entry for it, so
      an attestation whose signature cannot be verified is never written onto the
      record.
    codeRefs:
    - file:lib/atproto-attestation-port/attestation.ts
    - function:877a563a87f49d44fab8e99b97d02560
  - id: r.append-remote-recomputes-cid
    level: MUST
    text: appendRemoteAttestation requires the metadata to carry a cid field pointing
      at the proof — raising InvalidProofError when it is missing — recomputes the
      CID from the record and the metadata with the cid field removed, raises CidMismatchError
      when the recomputation disagrees with the supplied proof CID, and only then
      appends a strongRef to the given attestation URI.
    codeRefs:
    - class:6cdd06d793526feb3cfa6807b7adabaf
    - class:8c5a146784cd14ea91a95e85b9aa1495
    - function:7b5845af2c94749bc3dc4f342f504cf6
  - id: r.cid-binds-record-metadata-repository
    level: MUST
    text: 'Attestation CIDs are deterministic and bound to the repository: createAttestationCid
      serializes the record, the metadata and the repository identifier to DAG-CBOR
      and returns the resulting CID string, createDagCborCid hashes an arbitrary JsonValue
      the same way, and validateDagCborCid recomputes the CID of a record and raises
      CidMismatchError when it does not match the expected value.'
    codeRefs:
    - class:8c5a146784cd14ea91a95e85b9aa1495
    - file:lib/atproto-attestation-port/cid.ts
    - function:03e63b4d0a85548561fea6f9162f6de3
    - function:4359bf6648cbb29b659affcb66d34e5b
    - function:65d90d22f60b7e69321cabd8fddea572
  - id: r.cid-string-recognition
    level: MUST
    text: isAttestationCidString reports whether a string is shaped like an attestation
      CID, so callers can distinguish a CID reference from an arbitrary signature
      field value before attempting resolution.
    codeRefs:
    - function:060cd79cf0174d1b688b0cd665ad811f
    - interface:c8af39ac7d15bb1ffa3d65e332c61a1f
  - id: r.compat-attestation-class
    level: MUST
    text: The Attestation class is constructed from AttestationOptions, offers sign()
      returning either an InlineAttestation or a RecordMap depending on the SignOptions
      it is given, offers signAndAppend() which signs a record and returns the record
      with the signature appended, and offers findOwnIndex() which locates the index
      within a signatures array of the entry belonging to this attestation.
    codeRefs:
    - class:78c68037004092ea70086bb747ce8093
    - interface:d51229f6b13e3dff6b991c37add6ea5f
    - interface:fa9b61dff1a54f899bc11b1c8b57197e
    - method:1a3487a9c57591bc4b1c084dfab01af3
    - method:524c92eeb4918f18f46c07bed25b9f8c
    - method:a52d4e68aefb09274402d893f1ab8491
    - method:f4ea7110ae842973077307601ed58831
  - id: r.did-key-derivation
    level: MUST
    text: 'The issuer identity of an inline attestation is a did:key derived from
      the signing key: didForKey prefixes the multicodec code for the key type to
      the compressed public key, base58btc-encodes the concatenation and returns it
      as did:key:z<encoded>.'
    codeRefs:
    - file:lib/atproto-attestation-port/attestation.ts
    - function:b0cd1a5e6e1cfce2bb54c88d0804a9fc
  - id: r.error-taxonomy
    level: MUST
    text: 'All errors raised by the port derive from AttestationError, which carries
      a variant string and an optional source, and each distinct failure mode has
      its own subclass: input shape, record and metadata shape, missing metadata field,
      DAG-CBOR encoding, JSON parsing, signature invalidity and decoding, key resolution,
      record resolution, invalid proof, invalid attestation, dangling proof, CID mismatch
      and unsupported key type; an unexpected error thrown inside a public entrypoint
      is wrapped in AttestationError rather than escaping raw.'
    codeRefs:
    - class:0cbfdd727ed1d1ee628497b007abc14c
    - class:28318086515aeda2b5c46589074c4e08
    - class:64210da3888fe20806521fd0773dd307
    - class:6fa70196e50d7a23495de3b871e47550
    - class:9f387f80617d507785b3fabd867cd0d7
    - class:a20cf26f25619bd856befe573b43073e
    - class:b0fd453e73ea91c4d134eb84b58c9638
    - class:c8f55e166625532f3f7830310d6b6e69
    - class:dfade15defe0f3ccc30c2e0ee1630bc4
    - file:lib/atproto-attestation-port/errors.ts
  - id: r.inline-attestation-signs-cid
    level: MUST
    text: createInlineAttestation returns a deep clone of the input record with a
      signature entry pushed onto its signatures array, where the entry carries the
      metadata $type, the issuer derived from the private key, the attestation CID
      and the base64url-encoded raw signature over the CID bytes; existing signature
      entries are preserved.
    codeRefs:
    - file:lib/atproto-attestation-port/attestation.ts
    - function:373c7553e6b2efc4ff0ec7fe00b4c353
    - function:e41589b91c43965e4145a8db999ccd50
  - id: r.key-and-signature-encoding
    level: MUST
    text: 'Key material round-trips through text encodings: parseDidKey and formatDidKey
      convert between a did:key string and KeyData, parsePrivateMultibase and formatPrivateMultibase
      convert between a private multibase string and KeyData, an unparseable or unsupported
      key type raises UnsupportedKeyTypeError, and a signature that cannot be decoded
      raises SignatureDecodingFailedError.'
    codeRefs:
    - class:7421474df18b13f945085c0287be3349
    - class:7bfc2359c105a76a440e60e99b480434
    - function:3608a744291922c8015b11ff35055a19
    - function:40424f5cff36d401b4f23beeb37acdeb
    - function:762dfb4e999f89f85e65a2c0b4c0839f
    - function:a3678e92d28cad3924670c536c044e80
  - id: r.metadata-requires-type
    level: MUST
    text: 'Attestation metadata must carry a non-empty $type string: createInlineAttestation
      and createRemoteAttestation raise MetadataMissingFieldError when it is absent
      or empty, and appendRemoteAttestation does the same for the remote metadata
      it appends, using the metadata $type as the $type of the emitted signature or
      proof entry.'
    codeRefs:
    - class:6fa70196e50d7a23495de3b871e47550
    - function:7b5845af2c94749bc3dc4f342f504cf6
    - function:e41589b91c43965e4145a8db999ccd50
    - function:fd28e595b10aa4b5350b5d3a05771cad
  - id: r.record-and-metadata-must-be-objects
    level: MUST
    text: Every public attestation entrypoint unwraps its inputs and rejects a record
      that is not a JSON object with RecordMustBeObjectError and metadata that is
      not a JSON object with MetadataMustBeObjectError, so no downstream CID or signature
      work runs on a non-object value.
    codeRefs:
    - class:0cbfdd727ed1d1ee628497b007abc14c
    - class:64210da3888fe20806521fd0773dd307
    - function:373c7553e6b2efc4ff0ec7fe00b4c353
    - function:7b5845af2c94749bc3dc4f342f504cf6
    - function:877a563a87f49d44fab8e99b97d02560
    - function:e41589b91c43965e4145a8db999ccd50
    - function:fd28e595b10aa4b5350b5d3a05771cad
  - id: r.remote-attestation-splits-record-and-proof
    level: MUST
    text: 'createRemoteAttestation returns a pair: the attested record, cloned with
      a signature entry whose proof is a strongRef carrying the at:// URI of the attestation
      repository and the CID, and the proof record, which holds the metadata $type,
      the CID and the remaining metadata fields without overwriting either.'
    codeRefs:
    - file:lib/atproto-attestation-port/attestation.ts
    - function:fd28e595b10aa4b5350b5d3a05771cad
  - id: r.sign-and-verify-raw-bytes
    level: MUST
    text: signBytes signs an arbitrary payload with a private KeyData and returns
      the raw signature bytes, verifyBytes checks a raw signature against a payload
      and a public KeyData and returns a boolean, and normalizeSignature canonicalises
      a signature into the encoding expected for the requested signature type before
      any comparison.
    codeRefs:
    - file:lib/atproto-attestation-port/signature.ts
    - function:005bf0c2d952033654ed028e8308675e
    - function:2ac9c256ee837efd842fad4895311014
    - function:56f3586f0b1530f49d9036375ff82ebe
  - id: r.types-shape
    level: MUST
    text: The port's data shapes are declared once in types.ts — JsonValue and JsonObject
      for arbitrary JSON, CidString for CID references, AttestationMetadata for the
      metadata carried into a proof, AttestationSignature for a signatures-array entry,
      LexiconType for the lexicon identifier, and RecordMap and KeyType in compat.ts
      — and the public entrypoints are re-exported from mod.ts so consumers import
      one module.
    codeRefs:
    - file:lib/atproto-attestation-port/mod.ts
    - file:lib/atproto-attestation-port/types.ts
    - interface:35db749ae49ede3dbb8fdfc3de0ad143
    - interface:4827b37ed0f5dca721317364d7c7041a
    - interface:c8af39ac7d15bb1ffa3d65e332c61a1f
    - interface:dd2def9b45a6c0699a904f21d6cf2f30
    - type_alias:11b501c7d99ec0e269c179fdbb14016f
    - type_alias:4391a7fee2929d2acc97a4e264636db5
    - type_alias:7a5fd567555c1713d27cd011938717e2
    - type_alias:bb3df8c349da3621f88bc8980511cd98
  - id: r.verify-helper-results
    level: MUST
    text: verify() accepts VerifyOptions — a record plus the resolvers and signature
      type to use — and returns one VerifyEntryResult per signature entry rather than
      throwing on a bad entry, so callers can inspect which attestations verified;
      defaultKeyResolver provides the did:key-based KeyResolver used when the caller
      supplies none.
    codeRefs:
    - function:7202ad9631166c21ad22faaf1b5c8074
    - function:a74e1c1c55bfcab0e180e66f01a40d81
    - interface:01516a0f8e74129f27c7dce2c73740b1
    - interface:be596c493285769fb57191618da2f945
    - type_alias:619e1e75bd8343d6113e117e85109e46
    - type_alias:e57103cf0712dcb824500aabc028de4c
  - id: r.verify-record-resolves-and-checks
    level: MUST
    text: verifyRecord takes record input, a repository identifier, a KeyResolver
      and a RecordResolver, resolves the keys and referenced records needed to check
      each signature entry and rejects entries whose proof cannot be resolved with
      DanglingProofError, entries with a bad signature with InvalidSignatureError
      and entries that do not describe a well-formed attestation with InvalidAttestationError;
      it returns nothing and signals failure by throwing.
    codeRefs:
    - class:1f1db44ad3e4784846f51be597dcb97d
    - class:6534520933c6c857cd2077cc28b5a5f0
    - class:6f51439a0a9292422b2f2f4271954324
    - function:1b60292c7cb868bcdb52dd7a84d34a7c
