  repository: atproto-market
  requirements:
  - codeRefs:
    - class:1a37e5e99c2f4686933593eaa60984ba
    - method:91503af86adefbc94fa747b007fe8479
    id: r.any-input-unwrapping
    level: MUST
    text: AnyInput must accept either an already-parsed value or a JSON string, expose
      isString/isSerialize to report which form it holds, and unwrap to the JsonObject;
      construction from a malformed JSON string must raise AnyInputError.
  - codeRefs:
    - function:65d90d22f60b7e69321cabd8fddea572
    id: r.attestation-cid
    level: MUST
    text: createAttestationCid must bind a record, a metadata object and a repository
      string into one deterministic CID over their DAG-CBOR encoding, so the same
      triple always yields the same CID and any change to record, metadata or repository
      changes it.
  - codeRefs:
    - class:78c68037004092ea70086bb747ce8093
    - method:1a3487a9c57591bc4b1c084dfab01af3
    - method:524c92eeb4918f18f46c07bed25b9f8c
    - method:a52d4e68aefb09274402d893f1ab8491
    id: r.attestation-class-surface
    level: SHOULD
    text: The Attestation class must be constructible from AttestationOptions, its
      sign must return either an InlineAttestation or a modified RecordMap depending
      on the requested signature type, signAndAppend must write the produced signature
      back into the record it is given, and findOwnIndex must locate the class's own
      signature within a signatures array.
  - codeRefs:
    - function:060cd79cf0174d1b688b0cd665ad811f
    id: r.cid-string-recognition
    level: MUST
    text: isAttestationCidString must report whether a string is a well-formed attestation
      CID, so callers can tell a proof reference from an arbitrary string before resolving
      it.
  - codeRefs:
    - function:4359bf6648cbb29b659affcb66d34e5b
    id: r.cid-validation
    level: MUST
    text: validateDagCborCid must recompute the CID of the given JsonObject and throw
      CidMismatchError naming both the expected and the actual CID when the recomputation
      does not match expectedCid, returning normally otherwise.
  - codeRefs:
    - file:lib/atproto-attestation-port/cid.ts
    - function:03e63b4d0a85548561fea6f9162f6de3
    id: r.dag-cbor-cid
    level: MUST
    text: createDagCborCid must serialise a JsonValue to deterministic DAG-CBOR, hash
      it with SHA-256 and return the CIDv1 base32 string, and must throw DagCborError
      when the value cannot be encoded.
  - codeRefs:
    - file:lib/atproto-attestation-port/attestation.ts
    - function:b0cd1a5e6e1cfce2bb54c88d0804a9fc
    id: r.did-key-derivation
    level: MUST
    text: didForKey must derive a did:key identifier from a KeyData by compressing
      its public key, prefixing the multicodec bytes for its key type and base58btc-encoding
      the concatenation, returning the string in the form did:key:z<encoded>.
  - codeRefs:
    - function:877a563a87f49d44fab8e99b97d02560
    id: r.inline-append-verification
    level: MUST
    text: appendInlineAttestation must unwrap the record and attestation inputs and
      verify the existing inline attestation against the repository using the supplied
      key resolver before appending, so an invalid or unverifiable signature prevents
      the append.
  - codeRefs:
    - function:e41589b91c43965e4145a8db999ccd50
    id: r.inline-attestation-creation
    level: MUST
    text: createInlineAttestation must unwrap the record and metadata inputs, reject
      metadata without a non-empty string $type with MetadataMissingFieldError, compute
      the attestation CID bound to the repository, sign the CID bytes with the supplied
      private key, push a base64url-encoded $sig entry carrying the issuer did:key
      onto a deep clone of the record's signatures array, and return that clone; any
      non-AttestationError raised inside must be rewrapped as AttestationError.
  - codeRefs:
    - function:3608a744291922c8015b11ff35055a19
    - function:40424f5cff36d401b4f23beeb37acdeb
    - function:762dfb4e999f89f85e65a2c0b4c0839f
    - function:a3678e92d28cad3924670c536c044e80
    id: r.key-encoding-round-trip
    level: MUST
    text: parseDidKey and formatDidKey must round-trip a KeyData through the did:key
      string form, and parsePrivateMultibase and formatPrivateMultibase must round-trip
      the same KeyData through the private multibase string form, so parse(format(key))
      yields the original key type and key material.
  - codeRefs:
    - file:lib/atproto-attestation-port/deno.json
    - file:lib/atproto-attestation-port/mod.ts
    id: r.public-module-surface
    level: MUST
    text: mod.ts must re-export the module's public surface so a consumer imports
      the attestation, CID, compat and input operations from the one module entrypoint
      rather than reaching into individual files.
  - codeRefs:
    - function:373c7553e6b2efc4ff0ec7fe00b4c353
    id: r.raw-signature-creation
    level: MUST
    text: createSignature must unwrap the record and attestation inputs, compute the
      attestation CID bytes for the record, attestation and repository, and return
      the raw Uint8Array signature over those bytes, wrapping unexpected failures
      in AttestationError.
  - codeRefs:
    - function:1b60292c7cb868bcdb52dd7a84d34a7c
    id: r.record-verification
    level: MUST
    text: verifyRecord must validate a record for a repository by resolving each signature
      entry's key through the key resolver, checking the signature against the recomputed
      attestation CID, and resolving remote proofs through the record resolver, raising
      the matching typed error when a key, record or proof cannot be resolved.
  - codeRefs:
    - function:7b5845af2c94749bc3dc4f342f504cf6
    id: r.remote-append-cid-check
    level: MUST
    text: appendRemoteAttestation must require a non-empty string cid and a non-empty
      string $type in the metadata (throwing InvalidProofError and MetadataMissingFieldError
      respectively), recompute the CID over the record with the cid field removed,
      throw CidMismatchError when the recomputed CID differs from the supplied proof
      CID, and otherwise append a strongRef pointing at attestationUri.
