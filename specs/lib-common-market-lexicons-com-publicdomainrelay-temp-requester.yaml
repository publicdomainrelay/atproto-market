apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-requester
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists so the rest of atproto-market can call com.publicdomainrelay.temp.requester.associateConfirm
    with generated, type-checked request and response shapes instead of hand-written
    fetch code. It is the lex-client projection of a lexicon that gates the RFP flow
    behind an explicit requester-side CLI confirmation: the caller is identified by
    an inter-service auth JWT resolved through the user''s PDS with the atproto-proxy
    header, and the procedure answers with the requester DID and an ok flag once confirmation
    is attempted. The barrel file exists so consumers import the procedure as a package-local
    default export.'
  requirements:
  - id: r.barrel-default-export
    level: MUST
    text: The barrel module must re-export everything from `associateConfirm.defs.ts`
      and re-export `main` as the module's default export, so `import associateConfirm
      from '.../associateConfirm.ts'` yields the procedure.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.ts
  - id: r.documented-flow
    level: SHOULD
    text: 'The procedure must keep documenting the invocation contract on `main`:
      the webapp calls it through the user''s PDS with the atproto-proxy header set
      to the requester''s DID plus the `#requester_associate` service, and the requester
      verifies the inter-service auth JWT, resolves the caller''s handle, and presents
      a CLI confirmation prompt before proceeding with the RFP flow.'
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
  - id: r.generated-files
    level: MUST
    text: Both files must carry the header `THIS FILE WAS GENERATED BY "@atproto/lex".
      DO NOT EDIT.` and be treated as generated artifacts, since hand edits are overwritten
      on the next lexicon codegen run.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.ts
  - id: r.input-empty
    level: MUST
    text: '`$input` must be an empty JSON payload (`l.jsonPayload({})`), so `$Input`
      and `$InputBody` describe a request that carries no body fields, with the body
      type still parameterizable over a binary data type defaulting to `l.BinaryData`.'
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
    - type_alias:4dbf76aa5eeb2f760aaaf03852a93725
    - type_alias:6f696a9a6d16f191e192c7a8a2082268
  - id: r.nsid
    level: MUST
    text: The module must declare the procedure NSID as the literal string 'com.publicdomainrelay.temp.requester.associateConfirm',
      export it as `$nsid`, and export the same value as `$lxm`, so callers can address
      the method by name.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
  - id: r.output-shape
    level: MUST
    text: '`$output` must be a JSON payload declaring a required boolean `ok` and
      a required string `requesterDid`; `$Output` and `$OutputBody` must be the inferred
      payload and payload-body types over that schema, so every successful response
      carries both fields.'
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
    - type_alias:9084d44b6d89c358d343bab398e2af81
    - type_alias:cc503c95f2423ace5dd97fd68005cd2d
  - id: r.params-empty
    level: MUST
    text: '`$params` must be built with `l.params()` and expose no query parameters;
      `$Params` is the inferred output of that empty parameter schema.'
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
    - type_alias:32f59c1292407af850d8f6ada5d5959c
  - id: r.procedure-error
    level: MUST
    text: '`main` must be constructed with `l.procedure($nsid, $params, $input, $output,
      [''InvalidRequest''])`, binding the schemas above into the procedure and declaring
      `InvalidRequest` as the sole named error, and must be exported under the name
      `main`.'
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
  interfaces:
  - name: $Input
    kind: type_alias
    signature: export type $Input<B = l.BinaryData> = l.InferPayload<typeof $input,
      B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
  - name: $InputBody
    kind: type_alias
    signature: export type $InputBody<B = l.BinaryData> = l.InferPayloadBody<typeof
      $input, B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
  - name: $Output
    kind: type_alias
    signature: export type $Output<B = l.BinaryData> = l.InferPayload<typeof $output,
      B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
  - name: $OutputBody
    kind: type_alias
    signature: export type $OutputBody<B = l.BinaryData> = l.InferPayloadBody<typeof
      $output, B>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
  - name: $Params
    kind: type_alias
    signature: export type $Params = l.InferOutput<typeof $params>
    file: lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
codeRefIndex:
- file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
  associateConfirm.defs.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
