kind: SystemContext
metadata:
  name: lib-did-plc-generated
  namespace: default
spec:
  dependsOn:
  - sc.atproto-market
  intent: This context is the generated HTTP client layer for the PLC directory API,
    produced from the service's OpenAPI description rather than written by hand. It
    exists so the rest of atproto-market - principally lib/did-plc/client.ts and its
    mod.ts barrel - can resolve DID documents and read or append PLC operations through
    typed request/response shapes without re-deriving the wire format, and so the
    wire contract can be regenerated when the PLC directory service changes. It depends
    on sc.atproto-market and is upstream of itself, meaning it is the leaf of the
    dependency graph and nothing inside it should depend on higher layers.
  interfaces:
