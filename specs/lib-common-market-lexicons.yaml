apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-common-market-lexicons
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'The package exists so that every TypeScript consumer in atproto-market
    — clients, gateways, compute workers, policy hosts — shares one generated, manifest-pinned
    projection of the market, fedproxy, relay and attestation lexicons instead of
    hand-writing request and response shapes or inlining NSID literals. It centralizes
    the vocabulary that crosses service boundaries: the NSID constants and their legacy
    *_LXM aliases, the per-role default service ids used for proxying and association
    lookups, and the attestation inline type, so a record-shape change is made once
    in the lexicon sources and regenerated into every binding rather than edited in
    a caller.'
  requirements:
  - id: r.attested-vocabulary
    level: MUST
    text: nsids.ts declares the shared attestation vocabulary as network.attested.signature,
      network.attested.proof and network.attested.verify, and sets ATTESTATION_INLINE_TYPE
      to NETWORK_ATTESTED_SIGNATURE_NSID so an inline attestation entry is stamped
      with the bare signature nsid and verifiers keyed on the network.attested union
      accept it.
    codeRefs:
    - file:lib/common/market-lexicons/network/attested.ts
    - file:lib/common/market-lexicons/network/attested/signature.ts
    - file:lib/common/market-lexicons/nsids.ts
  - id: r.generated-barrels-export-namespaces
    level: MUST
    text: com.ts re-exports the generated per-authority modules as namespaces fedproxy,
      publicdomainrelay and atproto from ./com/*.ts, and network.ts re-exports the
      generated module as namespace attested from ./network/attested.ts, so generated
      value and definition objects are reachable as named namespaces rather than flattened
      symbols.
    codeRefs:
    - file:lib/common/market-lexicons/com.ts
    - file:lib/common/market-lexicons/network.ts
  - id: r.generated-lexicons-stay-generated
    level: MUST
    text: Every file under the generated com/ and network/ trees carries the header
      'THIS FILE WAS GENERATED BY "@atproto/lex". DO NOT EDIT.' and is never hand-edited;
      a change to a generated type or descriptor is made in the repository-root lexicons/
      JSON source and regenerated, so the emitted bindings stay in sync with the lexicons
      they mirror and the generated header stays truthful.
    codeRefs:
    - file:lib/common/market-lexicons/com.ts
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
    - file:lib/common/market-lexicons/network.ts
  - id: r.lxm-aliases-match-nsid
    level: MUST
    text: Each *_LXM alias constant in nsids.ts is assigned its corresponding NSID
      constant (SUBMIT_RFP_LXM = SUBMIT_RFP_NSID, SUBMIT_BID_LXM = SUBMIT_BID_NSID,
      SUBMIT_ACCEPT_LXM = SUBMIT_ACCEPT_NSID, SUBMIT_EVENT_LXM = SUBMIT_EVENT_NSID,
      REGISTER_BIDDER_LXM = REGISTER_BIDDER_NSID, LIST_BIDDERS_LXM = LIST_BIDDERS_NSID,
      ASSOCIATE_CONFIRM_LXM = ASSOCIATE_CONFIRM_NSID, MARKET_EVALUATE_POLICY_LXM =
      MARKET_EVALUATE_POLICY_NSID, MARKET_POLICY_DESCRIBE_LXM = MARKET_POLICY_DESCRIBE_NSID,
      MARKET_POLICY_CHECK_SCOPE_LXM = MARKET_POLICY_CHECK_SCOPE_NSID, and the MARKET_POLICY_HOST_RESOLVE_OPERATOR_LXM,
      MARKET_POLICY_HOST_GET_VOUCHED_DIDS_LXM, MARKET_POLICY_HOST_GET_TRUST_SET_LXM
      and MARKET_POLICY_HOST_GET_RECORD_LXM aliases equal their NSID counterparts),
      so legacy LXM-named call sites and current NSID-named call sites resolve to
      the same identifier.
    codeRefs:
    - file:lib/common/market-lexicons/nsids.ts
  - id: r.nsid-constants-authority
    level: MUST
    text: nsids.ts declares every shared NSID as an exported string constant under
      the com.publicdomainrelay.temp.* authority — agent.class, agent.skill, compute.vm,
      compute.config.wif.simple, compute.events.vm.*, market.bids.free, market.accepts.free,
      market.receipts.free, market.bids.x402, market.accepts.x402, market.receipts.x402,
      market.rfp, market.bid, market.accept, market.receipt, market.event, market.offering,
      market.submitRfp, market.submitBid, market.submitAccept, market.submitEvent,
      market.bidderRegistration, market.registerBidder, market.listBidders, market.bidderDiscovery,
      market.relays, market.policies.*, market.evaluatePolicy, market.bidderAssociation,
      market.registerIdentity, market.policy.describe, market.policy.checkScope, market.policy.host.*,
      auth.allowlist.rbacDid, badgeBlueKeys, requester.associateConfirm, plus the
      packageRegistry and guest.onNetwork/registerIdentity methods — so no caller
      needs to inline a literal NSID.
    codeRefs:
    - file:lib/common/market-lexicons/nsids.ts
  - id: r.package-manifest
    level: MUST
    text: deno.json names the package @publicdomainrelay/market-lexicons, licenses
      it Unlicense, points exports at ./mod.ts, and declares @atproto/lex as the sole
      import mapped to npm:@atproto/lex@^0.1.3, so the generated bindings resolve
      their runtime dependency from the package manifest rather than an import map.
    codeRefs:
    - file:lib/common/market-lexicons/deno.json
  - id: r.per-lexicon-defs-and-sibling-modules
    level: MUST
    text: 'Every lexicon in the generated trees is emitted as a pair of modules: a
      *.defs.ts file holding the descriptor objects and their inferred types, and
      a sibling .ts file that re-exports those definitions as a value object, so a
      caller can import either the bare types or the bound definition object for the
      same lexicon (e.g. strongRef.defs.ts and strongRef.ts, sshPublicKey.defs.ts
      and sshPublicKey.ts under com/fedproxy).'
    codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.defs.ts
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.ts
    - file:lib/common/market-lexicons/com/fedproxy/sshPublicKey.defs.ts
    - file:lib/common/market-lexicons/com/fedproxy/sshPublicKey.ts
  - id: r.service-id-defaults
    level: MUST
    text: nsids.ts exports the default service-id constants DEFAULT_MARKET_SERVICE_ID
      (pdr_temp_market), DEFAULT_COMPUTE_EVENT_SERVICE_ID (pdr_temp_compute_event),
      DEFAULT_REQUESTER_ASSOCIATE_SERVICE_ID (requester_associate) and DEFAULT_BIDDER_ASSOCIATE_SERVICE_ID
      (bidder_associate) so service proxying targets and association lookups share
      one default per role.
    codeRefs:
    - file:lib/common/market-lexicons/nsids.ts
  - id: r.single-import-surface
    level: MUST
    text: The package entrypoint mod.ts re-exports com.ts, network.ts and nsids.ts,
      so a consumer importing the package gets the generated com bindings, the generated
      network bindings and every NSID constant from one specifier.
    codeRefs:
    - file:lib/common/market-lexicons/mod.ts
  - id: r.subscription-message-type
    level: MUST
    text: A generated subscription lexicon exports $Message alongside its $Params,
      inferred from the $message descriptor with l.InferOutput, so a consumer of a
      streaming method such as the fedproxy subscribe xrpc type-checks each frame
      against the descriptor rather than a hand-written shape.
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/subscribe.defs.ts
    - type_alias:121d4d034292a36860fe8a628cbedaa9
  - id: r.xrpc-defs-type-projections
    level: MUST
    text: 'Each generated XRPC *.defs.ts module projects its descriptor objects into
      exported types so no caller hand-writes a request or response shape: $Params
      is l.InferOutput<typeof $params>, $Input<B = l.BinaryData> is l.InferPayload<typeof
      $input, B>, $InputBody<B = l.BinaryData> is l.InferPayloadBody<typeof $input,
      B>, and the $output descriptor likewise yields $Output and $OutputBody, as in
      the fedproxy getRegistrationNonce module whose $Params, $Input, $InputBody,
      $Output and $OutputBody are exported for that query.'
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
    - type_alias:0692219625b3f28978097f2b3163e271
    - type_alias:13a4eac8a7e8131e9bbbc8e98105b8f6
    - type_alias:ad1db68c5d41455a259d27b7ad72252d
    - type_alias:f7d12788676fbb2d13b0c099c544510f
    - type_alias:ff2e223fce27544e3cc74fa5d48acd0b
  interfaces:
  - name: $Input
    kind: type
    signature: export type $Input<B = l.BinaryData> = l.InferPayload<typeof $input,
      B>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
  - name: $InputBody
    kind: type
    signature: export type $InputBody<B = l.BinaryData> = l.InferPayloadBody<typeof
      $input, B>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
  - name: $Message
    kind: type
    signature: export type $Message = l.InferOutput<typeof $message>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/subscribe.defs.ts
  - name: $Output
    kind: type
    signature: export type $Output = l.InferOutput<typeof $output>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
  - name: $OutputBody
    kind: type
    signature: export type $OutputBody = l.InferOutputBody<typeof $output>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
  - name: $Params
    kind: type
    signature: export type $Params = l.InferOutput<typeof $params>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
