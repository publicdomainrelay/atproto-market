apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-common-cloud-init-common
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists so every consumer (requester, compute-contract gateway,
    guest-capability) composes guest cloud-init from one place instead of hand-writing
    YAML per transport: transports are registered as named modules, and callers select
    and layer them. The context is consumed by the requester-XRPC, compute-contract-gateway-XRPC,
    abc/requester and abc/guest-capability packages, so its merge semantics, precedence
    and module ids are a cross-package contract. The `iroh` module is the guest-side
    SSH transport that replaces the did-key-ingress-proxy tunnel-subscriber: it installs
    dumbpipe, listens on the guest''s sshd, and reports its iroh ticket back to the
    requester over a per-contract endpoint the requester names in this cloud-config,
    never through a public record.'
  requirements:
  - id: r.accept-bundle
    level: MUST
    text: acceptBundleModule must return a module that writes the provider accept
      bundle as JSON at the given guest path with owner root:root and mode 0600, and
      prepends a runcmd that creates the parent directory with mode 0700 owned by
      root.
    codeRefs:
    - function:0e368f0b0439ab6ea272f375c267a4f5
  - id: r.builtin-modules
    level: MUST
    text: Importing the module must register the built-ins tunnel, fedproxy-ssh, fedproxy-web,
      wootty and secrets under those exact ids, and the tunnel module must write an
      authorized_keys from ctx.sshAuthorizedKey, a key-only sshd drop-in, and a tunnel-subscriber
      systemd unit that dials ctx.ingressProxyHost with aud ctx.audHost, bridging
      to 127.0.0.1 at ctx.targetPort defaulting to 22 and only emitting a JSR_URL
      environment line when ctx.jsrUrl is set.
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
    - type_alias:1c122be13d716b6fba19e6a5ec2e8f11
  - id: r.cloud-config-header
    level: MUST
    text: buildUserData must return a string starting with the literal `#cloud-config`
      header followed by the YAML serialization of the merged object; the composer
      owns the header, so modules must not emit it themselves.
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
    - function:60926b54e4c29025add7657a3bd604f5
  - id: r.context-fields
    level: MUST
    text: 'CloudInitContext must carry the guest-provisioning inputs, with vmName
      required and didPlc, didPlcKey, relayHost, xrpcRelaySubdomain, sshAuthorizedKey,
      ingressProxyHost, audHost, jsrUrl, targetPort, hostAliases, sshHandle, listenPort,
      woottyDistUrl, secretsUrl, secretsRoute, secretsAud, secretsAcceptPath and irohReportUrl
      optional, so a module reading a field it does not need can be composed from
      a partial context. irohReportUrl is the absolute URL of the requester''s per-contract
      transport-report endpoint, supplied by the requester that composes this cloud-config.
      No secret may be carried here: the composed user_data is published inside the
      compute.vm record, so every field is public.'
    codeRefs:
    - interface:0bccaee64ad56c10f80842c828570d30
  - id: r.deprecated-wrappers
    level: MUST
    text: buildDefaultUserData(ctx) must remain as a deprecated wrapper equivalent
      to buildUserData with the fedproxy-ssh module, and buildTunnelUserData(ctx)
      as the deprecated wrapper equivalent to buildUserData with the tunnel module,
      both accepting only the fields of their narrower context type.
    codeRefs:
    - function:40149c728f060be41b2c8ee8a826902c
    - function:46c9fd0cecf9645ba56294190be1600c
    - interface:4dd396d02d0395bd6db6013daf5b7e39
  - id: r.flatten-label
    level: MUST
    text: flattenLabel must replace every `.` and `:` in a label with `-`, staying
      byte-for-byte in sync with the atprp-ssh-relay Go implementation of the same
      name.
    codeRefs:
    - function:01307f3439d4b76f5bfc174dde2583a9
  - id: r.host-aliases
    level: SHOULD
    text: The tunnel module should keep only hostAliases entries matching `<host>
      <name>` and add each as an idempotent /etc/hosts bootcmd that appends the line
      only when it is not already present.
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
    - function:40149c728f060be41b2c8ee8a826902c
  - id: r.inject-jsr-url
    level: MUST
    text: injectJsrUrl must inject an `Environment="JSR_URL=<url>"` line immediately
      before the ExecStart of the tunnel-subscriber deno run command inside an already-rendered
      cloud-init YAML string, leaving the string unchanged when no such command is
      present.
    codeRefs:
    - function:4466755423490bdd6cd4a58e579cc002
  - id: r.iroh-dumbpipe-listener
    level: MUST
    text: 'The iroh module must install the dumbpipe binary from its pinned release
      archive (dumbpipe-v<version>-linux-x86_64.tar.gz, or the aarch64 archive on
      arm64 guests) into /usr/local/bin and make it executable. The release archive
      stores its single member as `./dumbpipe`, so the extraction must name that member
      (`tar -xvz -C /usr/local/bin ./dumbpipe`) or strip the leading path component;
      passing the bare member name `dumbpipe` fails with `tar: dumbpipe: Not found
      in archive` (exit 2) and installs nothing, which leaves the unit restarting
      forever. The module must also write a systemd unit (dumbpipe-listen.service)
      that runs `dumbpipe listen-tcp --host 127.0.0.1:22` as root, ordered After=network-online.target
      and sshd, with Restart=always, StandardOutput/StandardError appending to /root/secrets/iroh-dumbpipe.log,
      EnvironmentFile=-/root/secrets/iroh.env, an ExecStartPre that prepares the secret
      and truncates the log (r.iroh-secret-persisted, r.iroh-log-truncated) and an
      ExecStartPost that extracts and reports the ticket (r.iroh-ticket-file, r.iroh-ticket-report);
      runcmd enables and starts it after sshd. The guest sshd must stay reachable
      at 127.0.0.1:22 with no ListenAddress directive so the compute-provider harness
      can still TCP-probe port 22 directly.'
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
  - id: r.iroh-log-truncated
    level: MUST
    text: The listener log /root/secrets/iroh-dumbpipe.log must be truncated at every
      start of dumbpipe-listen.service, never appended to, so the ticket extraction
      can only read a line produced by the current run. An appended log keeps the
      line from the previous run, and a `grep -m1` style extraction then reads that
      stale ticket as if it were current.
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
  - id: r.iroh-module-installs-sshd
    level: MUST
    text: The iroh module configures and starts an sshd (its own /etc/ssh/sshd_config.d/10-iroh.conf
      and a runcmd `systemctl enable --now ssh || systemctl enable --now sshd`), so
      it must install the openssh-server package it configures, exactly as the tunnel
      and fedproxy-ssh modules do. A module that enables or configures sshd without
      installing it leaves the guest with no sshd at all and the transport dead.
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
  - id: r.iroh-secret-persisted
    level: MUST
    text: '''The listener must have a stable iroh identity across restarts: a 32-byte
      hex IROH_SECRET is generated once, under umask 077, into /root/secrets/iroh.env
      (owner root:root, mode 0600, single line `IROH_SECRET=<hex>`), and only when
      that file is missing or empty; the unit reads it through EnvironmentFile. dumbpipe
      generates a fresh identity, and prints `using secret key <hex>`, when IROH_SECRET
      is unset, so regenerating it -- or never setting it -- changes the endpoint
      id on every start and invalidates every ticket already delivered.'''
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
  - id: r.iroh-ticket-file
    level: MUST
    text: '''The iroh module must extract the ticket from the listener''''s own output
      and write it, alone and unmodified, to /root/secrets/iroh-node-id owned root:root
      mode 0600. dumbpipe prints its control output on stderr; for `listen-tcp` the
      pinned v0.39.0 release prints `Forwarding incoming requests to ''''127.0.0.1:22''''.`,
      `To connect, use e.g.:` and then `dumbpipe connect-tcp <ticket>` (a verbose
      run adds an `or:` line with a short ticket), so the extraction must match the
      `dumbpipe connect-tcp <ticket>` line -- the subcommand dumbpipe actually printed,
      not a bare `dumbpipe connect` prefix -- and take the token after it. A ticket
      is a long base32 iroh endpoint id with no dot, colon or slash, so the extraction
      must not depend on the surrounding prose. Extraction runs at every start of
      dumbpipe-listen.service, not once at first boot: a restarted listener issues
      a new ticket (the endpoint id is stable under r.iroh-secret-persisted, but the
      direct addresses inside the ticket change), so the previously delivered ticket
      would be stale. When no ticket appears within 60 s the unit must log the failure
      and exit non-zero, while the listener itself keeps running. The file is a local
      convenience only -- the value that reaches the requester is the reported ticket
      (r.iroh-ticket-report), and no provider hook is assumed to read this path.'''
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
  - id: r.iroh-ticket-report
    level: MUST
    text: 'The guest must deliver its ticket to the requester itself, over the report
      endpoint that requester names in this cloud-config, and never through a public
      record. When ctx.irohReportUrl is set, the module writes /root/secrets/iroh-report.json
      (owner root:root, mode 0600) holding `{ "url": <ctx.irohReportUrl> }` -- no
      token or other credential, because this cloud-config is published inside the
      compute.vm record and anything in it is public -- and after every successful
      ticket extraction (first boot and every listener restart) POSTs to that url,
      with `content-type: application/json`, the body `{ acceptUri, acceptCid, address:
      <ticket>, createdAt }`, where acceptUri and acceptCid come from the bidder-injected
      accept bundle (`.accept.uri` and `.accept.cid` of accept.json at ctx.secretsAcceptPath,
      default /root/secrets/publicdomainrelay.com/market/accept.json). The POST retries
      with a bounded backoff while the listener runs and logs each attempt; a failed
      report must not stop or restart the listener and must be retried on the next
      listener start. The module must not write the ticket to any other file, to any
      record, to the journal beyond a redacted success event, or to any world-readable
      path, and must not publish the ticket''s direct addresses anywhere.'
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
  - id: r.iroh-transport-module
    level: MUST
    text: 'Importing the module must also register an `iroh` user-data module under
      that exact id, so listUserDataModules() reports `iroh` and buildUserData({ctx,
      modules: ["iroh"]}) renders it; `iroh` is the guest-side SSH transport that
      replaces the did-key-ingress-proxy tunnel-subscriber. It must write /root/.ssh/authorized_keys
      from ctx.sshAuthorizedKey with owner root:root mode 0600 and an sshd drop-in
      enabling key-only root login (PermitRootLogin prohibit-password, PasswordAuthentication
      no), matching the tunnel module''s hardening.'
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
  - id: r.merge-precedence
    level: MUST
    text: buildUserData must apply values in the precedence order base < modules (in
      the array order given) < overrides, with a caller-supplied base parsed after
      stripping a leading `#cloud-config` line and silently treated as empty when
      it is absent or unparseable.
    codeRefs:
    - function:46c9fd0cecf9645ba56294190be1600c
    - function:60926b54e4c29025add7657a3bd604f5
  - id: r.module-registry
    level: MUST
    text: 'User-data modules must be held in a process-wide registry keyed by string
      id, with registerUserDataModule inserting or replacing an entry and getUserDataModules
      resolving a mixed array of ids and function values while throwing `unknown user-data
      module: <id>` for an id that is not registered; listUserDataModules returns
      the registered ids.'
    codeRefs:
    - function:1796ee277ea051578f5da6a5844f5ccc
    - function:3f68e24ba719a41c1948c008335e110e
    - function:53f5bb0040b7d369029fd8bca511a0db
  - id: r.patch-merge-semantics
    level: MUST
    text: Applying a UserDataPatch must deep-merge apt keys, union packages and bootcmd
      with duplicates removed, replace-in-place users and write_files entries that
      repeat an existing name or path (later entry wins, first position kept), and
      rebuild runcmd as runcmdPrepend then the existing runcmd then runcmd, so prepended
      commands stay ahead of provisioning commands.
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
    - interface:1428c9f2922b1657bb39eef71dd7aa5d
    - interface:b91c269f41d7e3d696ce538f83ee9305
