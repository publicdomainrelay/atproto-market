apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-common-cloud-init-common
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists so every guest-provisioning flow in the monorepo composes
    cloud-init through one shared, ordered composer instead of hand-writing YAML per
    transport. It centralises the context shape, the patch/merge precedence rules
    that make layered modules compose predictably, and the string-id registry that
    lets a caller name a module instead of importing its function — so the tunnel,
    fedproxy-ssh, fedproxy-web, wootty, secrets, k3s and iroh flows agree on one precedence
    rule, one `#cloud-config` header owner and one notion of what a module may write
    into the guest. The iroh module is the transport a guest runs by default: it installs
    a pinned dumbpipe listener in front of the guest''s own sshd on loopback, and
    it is the guest, not the host, that announces where it can be reached, by POSTing
    the listener''s ticket outbound to the URL the caller baked into the context.'
  requirements:
  - id: r.accept-bundle-write-and-parent-dir
    level: MUST
    text: acceptBundleModule returns a UserDataModule that writes the provider accept
      bundle as pretty-printed JSON at the given guest path with owner root:root and
      mode 0600, and prepends a runcmd that creates the path's parent directory 0700
      owned by root, so a bidder-injected accept.json lands readable only by root.
    codeRefs:
    - function:4b5291e8f10c0cf8f4ac044370b5d20e
    - interface:ce3efe5cd2d89f183f1c90bd06992a98
  - id: r.builtin-module-ids-registered
    level: MUST
    text: Importing the module registers the built-in provisioning modules under the
      exact ids tunnel, fedproxy-ssh, fedproxy-web, wootty, secrets and k3s, so string-id
      composition resolves without the caller importing each module function.
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
    - function:a68626e26bed80b6d685682d2680efdb
  - id: r.compose-precedence-and-header
    level: MUST
    text: buildUserData parses the optional base cloud-config, applies each requested
      module's patch in the order given, then applies the optional overrides patch,
      and returns the YAML serialised with line wrapping disabled behind a `#cloud-config`
      header that the composer alone owns — modules must not emit that header themselves.
    codeRefs:
    - function:b171eb2dbd8264151491ce36f02925d2
    - interface:0bccaee64ad56c10f80842c828570d30
    - interface:a70dcded359cb8e179e375b8adc0876c
  - id: r.context-shape
    level: MUST
    text: CloudInitContext carries vmName as its only required field alongside the
      optional transport fields — didPlc/didPlcKey/relayHost/xrpcRelaySubdomain/sshAuthorizedKey,
      ingressProxyHost/audHost/jsrUrl/targetPort/hostAliases for the tunnel transport,
      sshHandle/listenPort/woottyDistUrl for the web terminal, and secretsUrl/secretsRoute/secretsAud/secretsAcceptPath
      for secrets — so every module reads one shared, all-optional-except-vmName context
      object.
    codeRefs:
    - interface:0bccaee64ad56c10f80842c828570d30
  - id: r.deno-package-config
    level: MAY
    text: The package carries its own lib/common/cloud-init-common/deno.json naming
      @publicdomainrelay/cloud-init-common and exporting ./mod.ts with the yaml npm
      dependency, so the module is importable as a standalone Deno package alongside
      the monorepo workspace.
    codeRefs:
    - file:lib/common/cloud-init-common/deno.json
  - id: r.deprecated-single-module-wrappers
    level: SHOULD
    text: buildDefaultUserData and buildTunnelUserData stay as deprecated back-compat
      wrappers that delegate to buildUserData with the single module fedproxy-ssh
      and tunnel respectively, so existing callers keep compiling for one release.
    codeRefs:
    - function:551af720488c464d56cac19e409b8ca3
    - function:b171eb2dbd8264151491ce36f02925d2
    - function:c89637f348f562927cb49e741a2df2ad
    - interface:a1ea99f0f39ad710f4f5c37a44b76b5a
  - id: r.flatten-label-parity
    level: MUST
    text: flattenLabel replaces every `.` and `:` with `-` and must stay byte-for-byte
      in step with the Go flattenLabel on the relay side, since the two derive the
      same DNS-safe label from a DID or handle string.
    codeRefs:
    - function:c42fe19fa18470a330f72a65da020d2d
  - id: r.inject-jsr-url-into-subscriber-unit
    level: MUST
    text: injectJsrUrl splices an `Environment="JSR_URL=<url>"` line immediately before
      the ExecStart line of the tunnel-subscriber systemd unit inside already-rendered
      cloud-init YAML, redirecting the guest's Deno registry to a local hono-jsr instance.
    codeRefs:
    - function:ef90183afd35949cd0143b7d3681b88e
  - id: r.iroh-context-fields
    level: MUST
    text: 'CloudInitContext gains two optional fields the iroh transport module reads:
      irohReportUrl, the absolute URL the guest POSTs its own iroh ticket to, and
      dumbpipeVersion, the pinned dumbpipe release the module installs, defaulting
      to 0.39.0. Both stay optional: a caller that omits irohReportUrl still gets
      a guest that mints and stores its ticket without announcing it, and a caller
      that omits dumbpipeVersion gets the pinned release rather than a floating latest.'
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
    - interface:0bccaee64ad56c10f80842c828570d30
  - id: r.iroh-dumbpipe-install
    level: MUST
    text: 'The iroh module installs the pinned dumbpipe release from its GitHub archive
      rather than from a distribution package: it downloads https://github.com/n0-computer/dumbpipe/releases/download/v<dumbpipeVersion>/dumbpipe-v<dumbpipeVersion>-linux-<arch>.tar.gz,
      choosing arch x86_64 or aarch64 from the guest''s machine type, unpacks the
      single `dumbpipe` entry the archive carries (the archive contains ./dumbpipe
      and nothing else) into /usr/local/bin with mode 0755 behind an idempotent stamp
      file, and runs the whole install from a setup script the module writes, so a
      second boot installs nothing twice.'
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
  - id: r.iroh-fixture-and-snapshot
    level: MUST
    text: 'Because this context gains a composed output, add the golden fixture test/fixtures/cloud-init/iroh.yaml
      as the byte-exact output of buildUserData for the module list ["iroh"] with
      irohReportUrl and the module''s other context fields set, and extend test/cloud_init_snapshot_test.ts
      with a snapshot case for ["iroh"] against that fixture, a registry assertion
      that listUserDataModules() includes iroh, and semantic assertions that the composed
      YAML pins the dumbpipe release, carries the ticket report to irohReportUrl with
      a ticket body, installs the sshd it configures, and contains no ListenAddress
      line. Regenerate no other fixture: the six existing fixtures stay byte-identical,
      and `deno test -A test/cloud_init_snapshot_test.ts` must pass.'
  - id: r.iroh-listener-and-ticket-file
    level: MUST
    text: 'The iroh module runs `/usr/local/bin/dumbpipe listen-tcp --host 127.0.0.1:<targetPort>`
      as a systemd service that restarts on failure, so every incoming iroh bidi stream
      is forwarded to the guest''s own sshd on loopback and the guest listens for
      iroh rather than for the relay. The ticket is what dumbpipe prints on stderr
      at startup: the last stderr line reads `dumbpipe connect-tcp <ticket>`, so the
      ticket is that line''s last whitespace-separated field, and the module must
      not pass --verbose, which appends a second short-ticket line. The module''s
      wrapper script writes that ticket, as soon as it appears, to /run/guest-iroh-ticket
      with mode 0600 and to the guest rendezvous file /run/guest-fqdn that the provisioning
      on-network reporter already reads, and it generates a 64-character lowercase
      hex IROH_SECRET once into a root-only file that it exports before starting the
      listener, so the endpoint id and therefore the ticket survive a service restart.'
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
  - id: r.iroh-module-registered
    level: MUST
    text: 'Importing the module additionally registers the iroh transport module under
      the exact id `iroh`, so `buildUserData({ modules: ["iroh"] })` resolves it by
      string id like every other built-in and listUserDataModules() reports it. The
      tunnel, fedproxy-ssh, fedproxy-web, wootty, secrets and k3s ids stay registered
      and the YAML they emit is byte-identical, so test/fixtures/cloud-init/tunnel.yaml,
      fedproxy-ssh.yaml, fedproxy-web-wootty.yaml, tunnel-secrets.yaml, k3s.yaml and
      tunnel-k3s.yaml all keep matching their fixtures unchanged.'
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
    - function:a68626e26bed80b6d685682d2680efdb
  - id: r.iroh-sshd-and-key
    level: MUST
    text: The iroh module requires sshAuthorizedKey and targetPort (default 22) from
      the context, writes sshAuthorizedKey to root's authorized key file with owner
      root:root and mode 0600, and writes an sshd drop-in under /etc/ssh/sshd_config.d/
      setting PermitRootLogin prohibit-password and PasswordAuthentication no, with
      no ListenAddress line and no other sshd unit changes, so root is reached with
      the requester's own key and the provisioning harness can still TCP-probe the
      guest's port 22 while the module is active. It sets apt preserve_sources_list,
      installs the openssh-server package it configures, sets disable_root false and
      ssh_pwauth false, and appends only hostAliases entries matching `^[\w.:-]+\s+[\w.-]+$`
      to /etc/hosts idempotently through bootcmd, exactly as the tunnel module does.
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
    - interface:0bccaee64ad56c10f80842c828570d30
  - id: r.iroh-ticket-report
    level: MUST
    text: 'When ctx.irohReportUrl is set the iroh module also writes a report script,
      a oneshot systemd unit for it and a path unit on /run/guest-iroh-ticket that
      re-arms it, and the script POSTs the guest''s own ticket outbound to that URL
      as the JSON body {"ticket":"<ticket>"} until curl succeeds; when irohReportUrl
      is absent neither the script nor the units are written. The guest announces
      its own reachability: nothing host-side may read the ticket out of the guest,
      and the report carries no key material, no provider path and no accept bundle.'
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
  - id: r.list-registered-ids
    level: MUST
    text: listUserDataModules returns the currently registered module ids as a string
      array, giving callers a way to enumerate the available provisioning modules
      without hard-coding them.
    codeRefs:
    - function:a852acc6663f06c9724c3272a33b42a4
  - id: r.malformed-base-tolerated
    level: SHOULD
    text: A missing base or a base that fails YAML parsing yields an empty object
      rather than an exception, so a bad caller-supplied base never breaks composition
      of the modules layered on top of it.
    codeRefs:
    - function:b171eb2dbd8264151491ce36f02925d2
  - id: r.module-registry-by-id
    level: MUST
    text: registerUserDataModule stores a UserDataModule under a string id in a module-level
      Map, replacing any module previously registered under that id, so callers can
      select provisioning behaviour by name rather than by imported function reference.
    codeRefs:
    - file:lib/common/cloud-init-common/mod.ts
    - function:a68626e26bed80b6d685682d2680efdb
    - type_alias:41d76c33929582b594b1d002d3176708
  - id: r.patch-merge-semantics
    level: MUST
    text: 'Applying a UserDataPatch merges rather than replaces: apt maps are shallow-merged,
      packages/bootcmd arrays are appended and de-duplicated, write_files entries
      dedupe by path and users by name with the later entry winning in the earlier
      entry''s position, runcmdPrepend is spliced ahead of the existing runcmd followed
      by the patch''s own runcmd, and disable_root/ssh_pwauth are last-wins scalars.'
    codeRefs:
    - function:b171eb2dbd8264151491ce36f02925d2
    - interface:a70dcded359cb8e179e375b8adc0876c
    - interface:ce3efe5cd2d89f183f1c90bd06992a98
  - id: r.resolve-modules-or-throw
    level: MUST
    text: 'getUserDataModules passes through entries that are already UserDataModule
      functions and looks string entries up in the registry, throwing an `unknown
      user-data module: <id>` Error when an id is not registered, so a typo fails
      the build instead of silently emitting a partial cloud-config.'
    codeRefs:
    - function:b757a298771ae8dcbe1086c37860fb1e
    - type_alias:41d76c33929582b594b1d002d3176708
  - id: r.tunnel-context-shape
    level: MUST
    text: TunnelCloudInitContext keeps the historical tunnel-subscriber shape with
      ingressProxyHost, audHost and sshAuthorizedKey required and jsrUrl, targetPort
      and hostAliases optional, so callers written against the old buildTunnelUserData
      signature still type-check.
    codeRefs:
    - function:551af720488c464d56cac19e409b8ca3
    - interface:a1ea99f0f39ad710f4f5c37a44b76b5a
  - id: r.tunnel-module-defaults
    level: MUST
    text: The built-in tunnel module requires ingressProxyHost, audHost and sshAuthorizedKey
      from the context, defaults targetPort to 22, and admits only hostAliases entries
      matching `^[\w.:-]+\s+[\w.-]+$` as idempotent `/etc/hosts` bootcmd appends.
    codeRefs:
    - function:551af720488c464d56cac19e409b8ca3
    - function:b171eb2dbd8264151491ce36f02925d2
    - interface:0bccaee64ad56c10f80842c828570d30
