apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-compute-config
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: It exists as the generated entrypoint that groups the wif lexicons of the
    temp compute config namespace under a single namespace export, keeping the hand-written
    and generated consumers decoupled from the on-disk layout of the generated definitions.
    Because it is generator output, the intent is that it is consumed as-is and regenerated,
    never hand-edited.
  requirements:
  - id: r.generated-not-edited
    level: MUST
    text: The file is generated by "@atproto/lex" and carries a do-not-edit banner;
      changes to the exported surface must come from regenerating the lexicons, not
      from editing this file.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif.ts
  - id: r.namespace-reexport
    level: MUST
    text: The module re-exports the sibling wif/simple.ts definitions as the named
      namespace `simple`, so importers get the wif simple lexicon definitions through
      this one path without depending on the generated file naming underneath.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif.ts
  - id: r.no-own-declarations
    level: MUST
    text: The module declares no runtime values, types, or interfaces of its own;
      it is a pure re-export barrel, so any behavior attributed to it is the behavior
      of the re-exported definitions.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif.ts
  - id: r.stable-import-path
    level: SHOULD
    text: Consumers should import the wif config lexicons through this module rather
      than reaching into the wif/ subdirectory directly, so regeneration can reorganize
      the generated files without breaking callers.
    codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif.ts
codeRefIndex:
- file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif.ts
  wif.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif.ts
