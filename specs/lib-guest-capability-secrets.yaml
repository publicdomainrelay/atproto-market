apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-guest-capability-secrets
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  - sc.lib-abc-guest-capability
  - sc.lib-common-secrets-common
  - sc.lib-did-key-ingress-proxy
  - sc.lib-hono-factory-secrets-oidc
  - sc.lib-secrets-oidc
  intent: 'This context exists so a host can hand a guest a working, authorizer-protected
    secrets endpoint without knowing anything about ingress relays, OIDC verification
    or Hono routing. It is the composition seam of the secrets feature: it binds the
    abstract GuestCapability lifecycle (prepare, onContract, onRevoke, dispose) to
    the concrete secrets pieces that live in sibling packages, so that lib/secrets-oidc
    supplies the authorizer, lib/common/secrets-common supplies the entry and RBAC
    record shapes, lib/did-key-ingress-proxy supplies the public relay, lib/hono-factory-secrets-oidc
    supplies the app, and lib/abc/guest-capability supplies the contract it is held
    to.'
  requirements:
  - id: r.capability-identity
    level: MUST
    text: The returned GuestCapability must identify itself with id SECRETS_CAPABILITY_ID
      and userDataModule "secrets", so the host can key its capability registry and
      per-guest user data on stable names rather than on object identity.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.exports-create-secrets-capability
    level: MUST
    text: 'The package must export createSecretsCapability(opts: CreateSecretsCapabilityOpts):
      GuestCapability from lib/guest-capability-secrets/mod.ts, so a host can construct
      the secrets capability from a plain options object without touching the authorizer,
      ingress or serve layers directly.'
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.oncontract-installs-grant
    level: MUST
    text: onContract must build an RBAC record with buildSecretsRbacRecord from the
      grant vars role, subject, issuerUri and expectedAud plus the relay's ingressUrl
      and the resolved route, install it on the authorizer together with issuerUri
      and expectedAud, and log secrets_grant_installed with role, subject and issuerUri;
      the service URL must degrade to the empty string when no relay exists yet.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.option-defaults
    level: MUST
    text: When opts.route is absent the factory must fall back to SECRETS_ROUTE and
      when opts.acceptPathVm is absent it must fall back to DEFAULT_ACCEPT_PATH_VM,
      so callers may omit both without losing a usable secrets route or VM accept
      path.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.options-shape
    level: MUST
    text: CreateSecretsCapabilityOpts must carry the secrets to serve as SecretEntry[],
      a required StructuredLoggerInterface logger used by every lifecycle step, and
      optional route and acceptPathVm strings, so the factory has everything it needs
      at construction time and a caller cannot omit the logger.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - interface:0c769a67d709c48b40d3f1032540989a
  - id: r.prepare-mounts-secrets-app
    level: MUST
    text: prepare must route "/" on the serve app to createSecretsApp, passing the
      shared authorizer, a getSecrets callback returning opts.secrets, the resolved
      route, and a log adapter that forwards events to logger.info, so secrets are
      only ever read through the authorizer-protected app.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.prepare-returns-context
    level: MUST
    text: prepare must return a context containing secretsUrl from the relay's ingressUrl,
      secretsRoute set to the resolved route, secretsAcceptPath set to the resolved
      accept path, and secretsAud formatted as api://ATProto?actx=<requesterDid> from
      the prepare context, and must log secrets_server_ready with the url, route and
      secret count, so the guest learns its endpoint and audience from the capability
      itself.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.prepare-starts-ingress-and-server
    level: MUST
    text: prepare must mint an exportable Secp256k1 keypair, build an ingress relay
      through createIngress from the prepare context's ingressProxyHost, signer and
      tls with label "secrets", wrap that relay in createServe, and await beginServe,
      so the secrets endpoint is listening before the guest is handed its address.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.revoke-and-dispose
    level: MUST
    text: onRevoke must revoke the authorizer's grant and log secrets_grant_revoked,
      and dispose must additionally shut the serve handle down and clear the serve
      and relay references before resolving, so no secrets endpoint or grant outlives
      the capability.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.single-module-package
    level: SHOULD
    text: The package should expose its whole surface from lib/guest-capability-secrets/mod.ts
      with only lib/guest-capability-secrets/deno.json beside it as package metadata,
      so consumers import one module path and the package needs no internal build
      step.
    codeRefs:
    - file:lib/guest-capability-secrets/deno.json
    - file:lib/guest-capability-secrets/mod.ts
  interfaces:
  - name: CreateSecretsCapabilityOpts
    kind: interface
    signature: 'interface CreateSecretsCapabilityOpts { secrets: SecretEntry[]; logger:
      StructuredLoggerInterface; route?: string; acceptPathVm?: string }'
    file: lib/guest-capability-secrets/mod.ts
  - name: createSecretsCapability
    kind: function
    signature: '(opts: CreateSecretsCapabilityOpts): GuestCapability'
    file: lib/guest-capability-secrets/mod.ts
codeRefIndex:
- file:lib/guest-capability-secrets/deno.json deno.json@lib/guest-capability-secrets/deno.json
- file:lib/guest-capability-secrets/mod.ts mod.ts@lib/guest-capability-secrets/mod.ts
- function:0d24cd5f66964dd094175db073cc3baf createSecretsCapability@lib/guest-capability-secrets/mod.ts:37
- interface:0c769a67d709c48b40d3f1032540989a CreateSecretsCapabilityOpts@lib/guest-capability-secrets/mod.ts:23
