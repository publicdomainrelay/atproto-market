apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-guest-capability-secrets
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists to specify the guest-side secrets capability: the unit
    that exposes a set of SecretEntry values to a sandboxed guest over a per-contract
    OIDC-authorized HTTPS ingress, and that ties that exposure to the lifecycle of
    the capability grant. It exists so the host can hand a guest an addressable secrets
    endpoint (URL, route, audience, accept path) during prepare, grant scoped access
    on contract, and guarantee teardown on revoke or dispose, without the caller having
    to know about the keypair, relay, serve or authorizer wiring.'
  requirements:
  - id: r.capability-identity
    level: MUST
    text: The returned GuestCapability must identify itself with id SECRETS_CAPABILITY_ID
      and userDataModule "secrets", so the host can key its user data and capability
      registry on stable names.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.exports-secrets-capability-factory
    level: MUST
    text: 'The package must export createSecretsCapability(opts: CreateSecretsCapabilityOpts):
      GuestCapability from lib/guest-capability-secrets/mod.ts, so a host can construct
      the secrets capability from a plain options object.'
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.oncontract-installs-grant
    level: MUST
    text: onContract must build an RBAC record from the grant vars (role, subject,
      issuerUri, expectedAud) plus the relay's ingressUrl and the resolved route,
      install it on the authorizer together with issuerUri and expectedAud, and log
      secrets_grant_installed; the service URL must degrade to the empty string when
      no relay exists yet.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.option-defaults
    level: MUST
    text: When opts.route is absent the capability must fall back to SECRETS_ROUTE,
      and when opts.acceptPathVm is absent it must fall back to DEFAULT_ACCEPT_PATH_VM,
      so callers may omit both without losing a usable route or accept path.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.options-shape
    level: MUST
    text: CreateSecretsCapabilityOpts must carry the secrets to serve as SecretEntry[],
      a StructuredLoggerInterface logger, and optional route and acceptPathVm strings;
      the logger is required because every lifecycle step logs through it.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - interface:0c769a67d709c48b40d3f1032540989a
  - id: r.prepare-mounts-secrets-app
    level: MUST
    text: prepare must route "/" on the serve app to createSecretsApp, passing the
      shared authorizer, a getSecrets callback that returns opts.secrets, the resolved
      route, and a log adapter that forwards to logger.info, so secrets are only ever
      read through the authorizer-protected app.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.prepare-returns-context
    level: MUST
    text: prepare must return a context containing secretsUrl from the relay's ingressUrl,
      secretsRoute set to the resolved route, secretsAcceptPath set to the resolved
      accept path, and secretsAud formatted as `api://ATProto?actx=<requesterDid>`
      from the prepare context, and must log secrets_server_ready with the URL, route
      and secret count.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.prepare-starts-ingress-and-server
    level: MUST
    text: prepare must create an exportable Secp256k1 keypair, build an ingress through
      createIngress using the prepare context's ingressProxyHost, signer and tls with
      label "secrets", wrap that relay in createServe, and await beginServe, so the
      secrets endpoint is listening before the guest receives its address.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.revoke-and-dispose
    level: MUST
    text: onRevoke must revoke the authorizer's grant and log secrets_grant_revoked,
      and dispose must additionally shut down the serve handle and clear the serve
      and relay references before resolving, so no secrets endpoint outlives the capability.
    codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
  - id: r.single-module-package
    level: SHOULD
    text: The package should expose its whole surface from lib/guest-capability-secrets/mod.ts
      with only lib/guest-capability-secrets/deno.json beside it as package metadata,
      so consumers import one module path.
    codeRefs:
    - file:lib/guest-capability-secrets/deno.json
    - file:lib/guest-capability-secrets/mod.ts
  interfaces:
  - name: CreateSecretsCapabilityOpts
    kind: interface
    signature: 'interface CreateSecretsCapabilityOpts { secrets: SecretEntry[]; logger:
      StructuredLoggerInterface; route?: string; acceptPathVm?: string }'
    file: lib/guest-capability-secrets/mod.ts
  - name: createSecretsCapability
    kind: function
    signature: |-
      (
        opts: CreateSecretsCapabilityOpts,
      ): GuestCapability
    file: lib/guest-capability-secrets/mod.ts
codeRefIndex:
- file:lib/guest-capability-secrets/deno.json deno.json@lib/guest-capability-secrets/deno.json
- file:lib/guest-capability-secrets/mod.ts mod.ts@lib/guest-capability-secrets/mod.ts
