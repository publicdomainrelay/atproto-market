apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:hono-bidder/cli-args-env.ts cli-args-env.ts@hono-bidder/cli-args-env.ts
- file:hono-bidder/mod.ts mod.ts@hono-bidder/mod.ts
kind: SystemContext
metadata:
  name: hono-bidder
  namespace: default
spec:
  dependsOn:
  - sc.atproto-market
  intent: It exists so an operator can run a bidder as a single process — pick an
    identity/auth mode, enable compute backends, serve XRPC over TCP/Unix with an
    optional fedproxy ingress, and stay discoverable on AT Protocol relays — without
    writing any glue code. The declarative config file keeps every flag, env var and
    default in one auditable place, and mod.ts is the only place that interprets them.
  repository: atproto-market
  requirements:
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.association-qr
    level: MUST
    text: Unless --skip-qr is set, the bidder scans its own badgeBlueKeys records
      for an existing bidder_associate association and skips the prompt when one exists;
      otherwise it prints a qr.fedfork.com QR URL, waits on associateCalled, resolves
      the caller's handle from alsoKnownAs, prompts y/N on stdin, and either approves
      the association or rejects it and exits 0.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.attestation-keypair
    level: MUST
    text: An attestation keypair is derived from the same private key hex via loadOrGenerateKeypair
      before any PLC genesis op runs, so the attestation did:key can be published
      in the bidder's DID document and used as the badgeBlue signer.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.auth-mode-selection
    level: MUST
    text: 'Exactly one AT Protocol auth mode is chosen in this order: (1) --atproto-oauth,
      which requires --atproto-handle and exits 1 with an error log when the handle
      is missing, using createOAuthAgent plus restore/startFlow/completeFlow with
      a loopback callback server; (2) --atproto-oauth-qr, which registers a genesis
      did:plc on the PLC directory, restores a saved QR session if present, and otherwise
      renders a qr.fedfork.com QR and polls for the transferred session; (3) --atproto-handle
      plus --atproto-password, which creates a local PDS agent; (4) the default, which
      creates a local PDS agent and runs the association QR flow. Modes 1 and 2 set
      isOAuth true and leave pdsHostname undefined; modes 3 and 4 set isLocal true
      and take pdsHostname from the relay ingress host.'
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.badge-blue-attestation-binding
    level: MUST
    text: After the ATProto client is built, the bidder writes a badgeBlueKeys record
      for itself with keyId equal to the attestation did:key and service "bidder_attestation",
      using createRecord (never putRecord, which the OAuth scope rejects); failure
      to write is a logged warning, not a fatal error.
  - codeRefs:
    - file:hono-bidder/cli-args-env.ts
    - file:hono-bidder/mod.ts
    id: r.bidder-serve-binding
    level: MUST
    text: The market bidder gets its own serve instance bound to options.serveAddr
      (default 0.0.0.0), options.servePort (default 0 for a random port) and, when
      set, a Unix socket at options.serveUnix; its ingress is created unless --no-ingress-proxy
      is set.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.compute-providers
    level: MUST
    text: 'Compute providers are registered only when their flag is set: a DigitalOcean
      provider when --compute-provider-digitalocean-token is present, a local provider
      when --compute-provider-local is set (honoring mode, VM image, container image,
      cache dir, CA cert PEM and guest TLS port), and a Deno worker provider when
      --compute-provider-deno-worker is set. Each provider gets its own ingress (with
      a freshly generated relay keypair) and serve instance, and each serve is begun
      before startup continues.'
  - codeRefs:
    - file:hono-bidder/cli-args-env.ts
    - file:hono-bidder/mod.ts
    id: r.config-resolution
    level: MUST
    text: mod.ts resolves options by constructing the cli-args-env Command with the
      environment/config path key CONFIG_PATH_HONO_BIDDER, the cli-args-env module's
      default export, and an optional runtime config loaded from ./config.json; a
      missing or unparsable config.json is tolerated and leaves the built-in defaults
      in force.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.container-image-prebuild
    level: SHOULD
    text: When the local provider exposes ensureImage, the bidder awaits it after
      the association step and logs before and after, so the first guest provision
      does not pay the image build cost.
  - codeRefs:
    - file:hono-bidder/cli-args-env.ts
    id: r.declarative-config
    level: MUST
    text: The CLI config is a single default-exported object named "bidder" whose
      options map each flag to a type, description, optional env var and optional
      default, and that object is the only source of the flag/env/default surface
      consumed by mod.ts.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.deferred-relay-registration
    level: MUST
    text: 'PDS registration with relays is deferred until after the offering record
      exists: local relay URLs are re-announced once the local serve port is known,
      and the remaining crawl relays are announced with the visibility hostname after
      startup, because a crawl that connects before the offering commit would miss
      it in the live-stream gap.'
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.event-streams-relays
    level: MUST
    text: Event streams are configured from the union of --relay-url and, when --firehose-mode
      is "subscriberepos" with --firehose-url set, the comma-separated firehose URLs;
      when firehose URLs are used the default relay list is removed, and only http(s)
      root URLs are retained as requestCrawl targets because wss firehose URLs are
      consumed by the event-streams client instead.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.graceful-shutdown
    level: MUST
    text: SIGINT and SIGTERM handlers shut the market bidder down, dispose the OAuth
      agent when in an OAuth mode, shut down every provider serve, and then exit.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.ingress-per-relay-keypair
    level: MUST
    text: Each ingress created for a relay uses a freshly generated keypair, while
      service-auth JWTs are signed by the bidder's identity signer, whose DID is the
      OAuth PLC DID in QR mode and otherwise the ATProto DID.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.local-dev-fetch-patch
    level: SHOULD
    text: When the ingress proxy host looks local (localhost or 127.*) or the PLC
      directory URL resolves to a local host, global fetch is patched so https://*.localhost
      is rewritten to the ingress port over http and https://plc.directory/ is rewritten
      to the configured local PLC URL; otherwise fetch is untouched.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.oauth-client-metadata-route
    level: MUST
    text: The bidder serve exposes GET /oauth-client-metadata.json returning oauthClientMetadata
      built from the OAuth client id, redirect URI, the bidder OAuth scope list and
      the client name "Compute Provider (hono-bidder)".
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.oauth-session-expiry
    level: MUST
    text: An OAuth session-expired error handler logs the session path, deletes the
      stale session file if present, and exits the process with code 1 after a short
      flush delay so a supervisor restarts it and re-authenticates.
  - codeRefs:
    - file:hono-bidder/cli-args-env.ts
    - file:hono-bidder/mod.ts
    id: r.offering-refresh
    level: MUST
    text: --offering-refresh-sec defaults to 300 and is converted to milliseconds
      for createMarketBidder; a value of 0 (or less) is passed as undefined so the
      refresh loop is disabled.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.operator-association
    level: MUST
    text: When --associate-with is set, the bidder mints a bidder_associate badgeBlueKeys
      record in the canonical shape challenge=operator DID, keyId=this bidder's DID
      before the market bidder starts, so the trust cache resolves the bidder's operator
      ahead of the only-me scope check; failure is logged and does not abort startup.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.policy-config
    level: MUST
    text: 'Policy arguments are parsed with parsePolicyArgs, and when --policy is
      set the name is resolved against the policy registry with side "bidder"; an
      unknown or wrong-side policy name, or any parse failure, prints "invalid --policy:
      <error>" and exits with code 2. The resolved policy and args are handed to createMarketBidder
      together with the only-remote and allow-untrusted execution flags.'
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.private-key-precedence
    level: MUST
    text: The bidder signing key comes from options.privateKeyHex first; only when
      that is absent is the hex read and trimmed from the file at options.privateKeyHexPath.
      If neither yields a key, a fresh exportable Secp256k1Keypair is created, and
      the resulting hex is written back to privateKeyHexPath (creating parent directories)
      so later runs reuse it. Every failure to read or write that file is logged as
      a warning rather than fatal.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.ready-line
    level: MUST
    text: After beginServe, the bidder writes a single machine-readable JSON line
      to stdout containing event "bidder_ready" plus the bidder DID, the ingress ref
      and the serve port, so a test harness spawning the process as a subprocess can
      detect readiness.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.relay-visibility-check
    level: SHOULD
    text: When relay URLs and a visibility hostname are available, verifyRelayVisibility
      is run against the offering collection for the bidder DID; a positive result
      logs the indexing relays and a negative result logs a warning with the hint
      that requester-side listReposByCollection discovery will not find this bidder.
      Failure never aborts boot.
  - codeRefs:
    - file:hono-bidder/cli-args-env.ts
    - file:hono-bidder/mod.ts
    id: r.worker-permission-mode
    level: MUST
    text: The Deno worker provider defaults worker permission mode to "deny-all";
      only the value "allow-net" installs a permission policy handler, loaded dynamically.
  upstream: self
