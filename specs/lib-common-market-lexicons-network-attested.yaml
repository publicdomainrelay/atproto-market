kind: SystemContext
metadata:
  name: lib-common-market-lexicons-network-attested
  namespace: default
spec:
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists to describe the attestation lexicon package: the generated
    type surface ($Params, $Output, $OutputBody) that callers of network.attested.verify
    compile against, and the record/object schemas other packages in the repo build
    and parse when minting or checking attestations. It is read-only generated code,
    so the spec records the contract the rest of the codebase depends on rather than
    any behavior implemented here.'
  interfaces:
  - file: lib/common/market-lexicons/network/attested/verify.defs.ts
    kind: type_alias
    name: $Output
    signature: export type $Output<B = l.BinaryData> = l.InferPayload<typeof $output,
      B>
  - file: lib/common/market-lexicons/network/attested/verify.defs.ts
    kind: type_alias
    name: $OutputBody
    signature: export type $OutputBody<B = l.BinaryData> = l.InferPayloadBody<typeof
      $output, B>
  - file: lib/common/market-lexicons/network/attested/verify.defs.ts
    kind: type_alias
    name: $Params
    signature: export type $Params = l.InferOutput<typeof $params>
  repository: atproto-market
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/network/attested/proof.defs.ts
    - file:lib/common/market-lexicons/network/attested/signature.defs.ts
    - file:lib/common/market-lexicons/network/attested/verify.defs.ts
    id: r.generated-not-edited
    level: MUST
    text: All six files carry the "THIS FILE WAS GENERATED BY \"@atproto/lex\". DO
      NOT EDIT." banner and are emitted from the lexicon JSON, so schema changes must
      go through the lexicon source and regeneration rather than hand edits to these
      modules.
  - codeRefs:
    - file:lib/common/market-lexicons/network/attested/proof.ts
    - file:lib/common/market-lexicons/network/attested/signature.ts
    - file:lib/common/market-lexicons/network/attested/verify.ts
    id: r.module-reexport
    level: MUST
    text: Each concept's bare module (proof.ts, signature.ts, verify.ts) re-exports
      everything from its .defs.ts sibling and default-exports that file's `main`
      schema, so consumers import either the schema constants or the compiled lexicon
      entry from one path.
  - codeRefs:
    - file:lib/common/market-lexicons/network/attested/proof.defs.ts
    id: r.proof-record
    level: MUST
    text: network.attested.proof is a record keyed by tid whose body requires a `subject`
      strongRef to the attested record, a `cid` string in cid format (the canonical
      attestation CID computed from the subject record with signatures stripped and
      this record's metadata inserted as $sig, DAG-CBOR + SHA-256 + CIDv1), and a
      `createdAt` datetime, with optional `issuer` did, `role`, `status`, and `signatures`
      over the proof record itself; the module exports the Main type plus $type, $isTypeOf,
      $build, $assert, $check, $cast, $ifMatches, $matches, $parse, $safeParse, $validate
      and $safeValidate bound to that record schema.
  - codeRefs:
    - file:lib/common/market-lexicons/network/attested/signature.defs.ts
    id: r.signature-inline
    level: MUST
    text: network.attested.signature is a typed object whose required fields are `key`
      (did:key public-key reference), `cid` (the canonical attestation CID in cid
      format), and `signature` bytes (low-S normalized ECDSA over the CID bytes, P-256
      and K-256), with optional `issuer` did, `issuedAt` datetime and `role`, and
      it exports $type, $isTypeOf, $build, $assert, $check, $cast, $ifMatches, $matches,
      $parse, $safeParse, $validate and $safeValidate bound to that schema.
  - codeRefs:
    - file:lib/common/market-lexicons/network/attested/signature.defs.ts
    id: r.signatures-union
    level: MUST
    text: The exported `signatures` array accepts a union of inline network.attested.signature
      typed objects and com.atproto.repo.strongRef references to remote network.attested.proof
      records (plus unknown typed objects), and that array is always stripped from
      a record before attestation-CID computation so attaching attestations never
      changes the signing payload.
  - codeRefs:
    - file:lib/common/market-lexicons/network/attested/verify.defs.ts
    - type_alias:7489e38d4a935439d87ec3ac5bb7049d
    - type_alias:88f850da0d5e8b8c370e4ed509f86f74
    - type_alias:a83e3643c5b8a37f2e91a7431503554c
    id: r.verify-query-shape
    level: MUST
    text: network.attested.verify is declared as an XRPC query whose $params take
      a single required `uri` string in at-uri format identifying the record to verify,
      and whose $output is a JSON payload carrying that `uri`, an optional `cid`,
      a required boolean `valid`, a required `signatures` array of network.attested.signature
      entries, and an optional `workflow` string; the $Params, $Output and $OutputBody
      aliases are inferred from those schema constants so callers get the exact param
      and payload shapes.
  - codeRefs:
    - file:lib/common/market-lexicons/network/attested/verify.defs.ts
    id: r.verify-semantics
    level: MUST
    text: The verify query's documented contract is to resolve the record at `uri`,
      recompute its canonical attestation CID, verify inline network.attested.signature
      entries by ECDSA against their `key`, and resolve remote strongRefs to network.attested.proof
      records whose `cid` must match the subject's canonical CID, so any network.attested.*
      speaker can verify without re-deriving the CID machinery.
  upstream: self
