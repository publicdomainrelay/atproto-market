apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-trust-graph-tangled-graph
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  - sc.lib-abc-trust-graph
  - sc.lib-common-market-common
  intent: 'This context exists so that vouches expressed as Tangled-style records
    can be fed to the ABC trust graph without that graph knowing anything about atproto
    record listing. It fixes the seam between the two: a caller injects a listRecords
    callback (plus an optional logger), and createTangledGraphVouchResolver returns
    a VouchResolver whose getVouchedDids and isVouched derive trust from listed records.
    The design keeps all network and PDS access outside the module so the resolver
    is a pure, stubbable function of the injected reader, and it deliberately fails
    closed -- a lookup rejection is logged and treated as an empty vouch set rather
    than an exception -- so an unavailable repo never manufactures trust.'
  requirements:
  - id: r.export-listed-record
    level: MUST
    text: Export a ListedRecord shape carrying the record's uri and its decoded value
      object, so a caller's listRecords implementation can hand back raw listed records
      without adapting them to this module's needs.
    codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - interface:f3b2726e5ba78287474a3382ccf87cc2
  - id: r.fail-closed-on-lookup-error
    level: MUST
    text: 'A rejection from listRecords must not propagate out of getVouchedDids:
      it is logged at warn level with the message "tangled-graph vouch lookup failed"
      and metadata carrying the did and the stringified error, and the vouched set
      collected so far is returned instead of throwing.'
    codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
  - id: r.is-vouched-membership
    level: MUST
    text: isVouched(voucher, vouchee) must resolve the voucher's vouched set via getVouchedDids
      and return whether that set contains the vouchee, inheriting the same fail-closed
      (empty set, not an error) behaviour when the underlying lookup fails.
    codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
  - id: r.list-vouch-collection
    level: MUST
    text: getVouchedDids must list records for the given did through the injected
      listRecords callback, passing the module's vouch collection NSID as the collection
      argument.
    codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
  - id: r.opts-list-records-callback
    level: MUST
    text: Take the repository read as a required injected listRecords(repo, collection)
      callback returning a promise of ListedRecord[], so the resolver performs no
      network or PDS access of its own and is fully testable with a stub.
    codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - interface:96c0ea570aaadab563b357e40f8b2254
  - id: r.opts-optional-logger
    level: SHOULD
    text: Accept an optional log(level, msg, meta) callback; when it is absent the
      resolver substitutes a no-op logger, so that logging a failure never itself
      throws and a logger is never required to construct a resolver.
    codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - interface:96c0ea570aaadab563b357e40f8b2254
  - id: r.returns-vouch-resolver
    level: MUST
    text: createTangledGraphVouchResolver must return a VouchResolver value exposing
      async getVouchedDids(did) -> Promise<Set<string>> and async isVouched(voucher,
      vouchee) -> Promise<boolean>, so it can be passed wherever lib/abc/trust-graph
      expects a resolver.
    codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
  - id: r.rkey-must-be-did
    level: MUST
    text: The vouched identity must be taken from the record's rkey -- the last slash-separated
      segment of uri, empty string when the split yields nothing -- and added to the
      result set only when that rkey starts with "did:"; every other rkey is discarded.
    codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
  - id: r.single-mod-entrypoint
    level: SHOULD
    text: The package should expose its whole surface through the single mod.ts entrypoint,
      with the module configuration kept in deno.json alongside it rather than split
      across additional source files.
    codeRefs:
    - file:lib/trust-graph-tangled-graph/deno.json
    - file:lib/trust-graph-tangled-graph/mod.ts
  - id: r.skip-denounce
    level: MUST
    text: Records whose value.kind is "denounce" must be skipped entirely before the
      rkey is examined, so a denouncement is never counted as a vouch for its subject.
    codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
  interfaces:
  - name: ListedRecord
    kind: interface
    signature: 'interface ListedRecord { uri: string; value: Record<string, unknown>
      }'
    file: lib/trust-graph-tangled-graph/mod.ts
  - name: TangledGraphVouchResolverOpts
    kind: interface
    signature: 'interface TangledGraphVouchResolverOpts { listRecords(repo: string,
      collection: string): Promise<ListedRecord[]>; log?(level: string, msg: string,
      meta?: Record<string, unknown>): void }'
    file: lib/trust-graph-tangled-graph/mod.ts
  - name: createTangledGraphVouchResolver
    kind: function
    signature: 'createTangledGraphVouchResolver(opts: TangledGraphVouchResolverOpts):
      VouchResolver'
    file: lib/trust-graph-tangled-graph/mod.ts
codeRefIndex:
- file:lib/trust-graph-tangled-graph/deno.json deno.json@lib/trust-graph-tangled-graph/deno.json
- file:lib/trust-graph-tangled-graph/mod.ts mod.ts@lib/trust-graph-tangled-graph/mod.ts
- function:c548791fdd9c126249e41e29c7d44c44 createTangledGraphVouchResolver@lib/trust-graph-tangled-graph/mod.ts:14
- interface:96c0ea570aaadab563b357e40f8b2254 TangledGraphVouchResolverOpts@lib/trust-graph-tangled-graph/mod.ts:9
- interface:f3b2726e5ba78287474a3382ccf87cc2 ListedRecord@lib/trust-graph-tangled-graph/mod.ts:4
