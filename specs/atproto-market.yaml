apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: atproto-market
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.lib-abc-compute-contract-gateway
  - sc.lib-abc-guest-capability
  - sc.lib-abc-requester
  - sc.lib-atproto-helpers
  - sc.lib-common-cloud-init-common
  - sc.lib-common-compute-contract-gateway-common
  - sc.lib-common-fedproxy-rbac-common
  - sc.lib-common-market-common
  - sc.lib-common-market-lexicons
  - sc.lib-common-secrets-common
  - sc.lib-compute-contract-gateway-xrpc
  - sc.lib-did-key-ingress-proxy
  - sc.lib-did-plc
  - sc.lib-hono-factory-compute-contract-gateway-xrpc
  - sc.lib-hono-factory-did-plc-directory
  - sc.lib-hono-factory-secrets-oidc
  - sc.lib-market-atproto
  - sc.lib-market-bidder
  - sc.lib-market-bidder-compute
  - sc.lib-market-bidder-worker
  - sc.lib-requester-xrpc
  - sc.lib-secrets-oidc
  intent: The tests that drive the market, the gateway, the bidder and the PLC must
    not touch the real plc.directory or depend on a pre-provisioned dispatcher, so
    this context provides one installable fetch redirection plus the fixtures and
    factories those tests share. It exists to keep every integration test pointed
    at in-process fakes with a single, reversible patch, to keep generated cloud-init
    comparable to checked-in golden YAML, and to let the full-flow harness reproduce
    the same topology end to end on self-chosen ephemeral ports.
  requirements:
  - id: r.async-watcher-tests
    level: MAY
    text: The firehose watcher and bid collector tests drive their subscriptions and
      collector loops against the intercepted fetch stack and stop long-running watchers
      inside the test process rather than requiring external services.
    codeRefs:
    - file:test/bid_collector_test.ts
    - file:test/firehose_watcher_test.ts
  - id: r.bidder-policy-tests
    level: SHOULD
    text: The bidder-only-me, bidder-prod, bidder-ssh-relay and bidder-policy-only-me
      test modules exercise bidder selection policies and relay paths against the
      same intercepted stack, so policy changes are caught by tests that do not reach
      the production network.
    codeRefs:
    - file:test/bidder_policy_only_me_integration_test.ts
    - file:test/bidder_prod_integration_test.ts
    - file:test/bidder_ssh_relay_test.ts
  - id: r.ca-trusted-https
    level: MUST
    text: When caCertPem is set the interceptor creates a Deno HttpClient with that
      PEM in caCerts, keeps the rewritten localhost URL on the https scheme and passes
      the client on the RequestInit of the realFetch call; when caCertPem is absent
      no client is created and the localhost URL is downgraded to http, so TLS-only
      paths stay testable without weakening paths that do not need it.
    codeRefs:
    - file:test/fetch-interceptor.ts
    - function:c6f81957f952317eb0e87d2454b5add3
  - id: r.cloud-init-golden-fixtures
    level: MUST
    text: The cloud-init YAML fixtures fedproxy-ssh.yaml, fedproxy-web-wootty.yaml,
      tunnel.yaml, tunnel-secrets.yaml, k3s.yaml and tunnel-k3s.yaml are the golden
      outputs that test/cloud_init_snapshot_test.ts and test/cloud_init_k3s_test.ts
      compare generated cloud-init against, covering the SSH relay, the web/wootty
      relay, the tunnel with and without injected secrets, and the k3s and tunneled-k3s
      user data, so those generated outputs must stay comparable to these fixtures.
    codeRefs:
    - file:test/cloud_init_k3s_test.ts
    - file:test/cloud_init_snapshot_test.ts
    - file:test/fixtures/cloud-init/fedproxy-ssh.yaml
    - file:test/fixtures/cloud-init/fedproxy-web-wootty.yaml
    - file:test/fixtures/cloud-init/k3s.yaml
    - file:test/fixtures/cloud-init/tunnel-k3s.yaml
    - file:test/fixtures/cloud-init/tunnel-secrets.yaml
    - file:test/fixtures/cloud-init/tunnel.yaml
  - id: r.defect-regression-tests
    level: SHOULD
    text: test/defect1_gateway_did_test.ts and test/defect4_qr_session_test.ts pin
      the previously fixed gateway DID handling and QR session behaviours, so those
      regressions cannot return unnoticed.
    codeRefs:
    - file:test/defect1_gateway_did_test.ts
    - file:test/defect4_qr_session_test.ts
  - id: r.fetch-interceptor-export
    level: MUST
    text: test/fetch-interceptor.ts exports installFetchInterceptor(opts) taking realFetch,
      plcDirectoryUrl, dispPort and an optional caCertPem; it replaces globalThis.fetch
      with a wrapper that delegates to the supplied realFetch and returns a teardown
      function of type () => void, so a test can install the redirection for the duration
      of one case.
    codeRefs:
    - file:test/fetch-interceptor.ts
    - function:c6f81957f952317eb0e87d2454b5add3
  - id: r.full-flow-harness
    level: MUST
    text: compute-contract-full-flow/run_full_flow.ts defines its own non-exported
      installFetchInterceptor accepting only realFetch, plcDirectoryUrl and dispPort,
      with no CA support and an unconditional downgrade of the localhost leg to http;
      its main() serves a dispatcher app from createRelayFactory and a fake PLC on
      ephemeral ports bound to 127.0.0.1, resolves each bound port through an onListen
      callback, pushes one abort-controller cleanup per server, and logs timestamped
      progress lines collected into the run summary.
    codeRefs:
    - file:compute-contract-full-flow/run_full_flow.ts
  - id: r.integration-tests-install-interceptor
    level: MUST
    text: The integration test modules in this context - bidder container, bidder
      cross-platform, gateway caller-rbac, gateway readme smoke, gateway request-vm,
      gateway ssh, gateway worker and oauth session transfer - install the fetch interceptor
      before driving their flows, so every outbound plc.directory and *.localhost
      call in the test process is redirected to the local fake PLC and dispatcher.
    codeRefs:
    - file:test/bidder_container_integration_test.ts
    - file:test/bidder_cross_platform_integration_test.ts
    - file:test/gateway_caller_rbac_integration_test.ts
    - file:test/gateway_readme_smoke_test.ts
    - file:test/gateway_request_vm_integration_test.ts
    - file:test/gateway_ssh_integration_test.ts
    - file:test/gateway_worker_integration_test.ts
    - file:test/oauth_session_transfer_test.ts
  - id: r.interceptor-teardown
    level: SHOULD
    text: The function returned by installFetchInterceptor restores globalThis.fetch
      to the original realFetch and closes the CA-trusting HttpClient when one was
      created, so test cases leak neither a patched global fetch nor an open client.
    codeRefs:
    - file:test/fetch-interceptor.ts
    - function:c6f81957f952317eb0e87d2454b5add3
  - id: r.localhost-port-rewrite
    level: MUST
    text: For https URLs whose host is exactly localhost, ends with .localhost, or
      contains .localhost:, the wrapper appends :dispPort when the host carries no
      port, preserves the matched path, and re-fetches through realFetch, so service
      DID documents pointing at *.localhost reach the ephemeral dispatcher; every
      URL matching neither rule is handed to realFetch unchanged with its original
      init.
    codeRefs:
    - file:test/fetch-interceptor.ts
    - function:c6f81957f952317eb0e87d2454b5add3
  - id: r.plc-directory-factory
    level: SHOULD
    text: hono-plc/mod.ts is the Hono PLC directory factory this repository serves,
      driven by the declarative files hono-plc/config.json and hono-plc/cli-args-env.json
      rather than by its entrypoint reading environment variables directly, so the
      local PLC the full-flow harness and the tests exercise is the same factory the
      CLI runs.
    codeRefs:
    - file:hono-plc/mod.ts
  - id: r.plc-url-redirect
    level: MUST
    text: The installed wrapper detects URLs starting with https://plc.directory/,
      replaces that prefix with the supplied plcDirectoryUrl while keeping the remaining
      path, builds a Request from the rewritten URL carrying the original init when
      the input was not already a Request, and issues it through realFetch, so DID
      resolution against the real PLC host lands on the local fake PLC.
    codeRefs:
    - file:test/fetch-interceptor.ts
    - function:c6f81957f952317eb0e87d2454b5add3
  - id: r.record-shape-lexicons
    level: MUST
    text: The record shapes asserted by the tests here - fedproxy rbac and ssh public
      keys, badge blue keys, the market bid, bidder, receipt, offering and event records,
      and secrets capability records - must match the lexicon definitions the repository
      publishes under lexicons/, so changing an asserted record field requires the
      matching lexicon change.
    codeRefs:
    - file:test/badge_blue_keys_binding_test.ts
    - file:test/bid_collector_test.ts
    - file:test/offering_refresh_test.ts
    - file:test/registry_discovery_test.ts
    - file:test/secrets_capability_test.ts
  interfaces:
  - name: installFetchInterceptor
    kind: function
    signature: '(opts: { realFetch: typeof globalThis.fetch; plcDirectoryUrl: string;
      dispPort: number; caCertPem?: string }): () => void'
    file: test/fetch-interceptor.ts
