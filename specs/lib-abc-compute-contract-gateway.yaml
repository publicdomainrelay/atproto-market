apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-abc-compute-contract-gateway
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  - sc.lib-common-compute-contract-gateway-common
  intent: 'This context exists to fix the contract that every compute gateway implementation
    and every caller agrees on, without committing to a transport. It is the abstract
    boundary layer (abc) of the Deno + Hono ABC layering: implementations such as
    createComputeContractGateway in lib/compute-contract-gateway-xrpc and the Hono
    factory in lib/hono-factory-compute-contract-gateway-xrpc depend on ComputeContractGateway,
    and market callers raise compute requests through it, so VM and worker provisioning,
    receipt-addressed deletion and gateway start/stop are all expressed once as an
    interface rather than duplicated per implementation. It depends on the shared
    common package for the record types crossing the boundary, so those types are
    defined once and cannot drift between the gateway and its callers.'
  requirements:
  - id: r.delete-compute
    level: MUST
    text: 'ComputeContractGateway must expose deleteCompute taking a CallerIdentity,
      a receiptUri string, a receiptCid string and a token string, resolving to Promise<{
      ok: boolean }>, so a caller can tear down an existing compute allocation identified
      by its receipt record and learn from the boolean ok field whether the deletion
      succeeded.'
    codeRefs:
    - interface:686284d942a70c576d3538a0ee80e825
  - id: r.export-gateway-interface
    level: MUST
    text: The compute-contract-gateway module must export exactly one interface, ComputeContractGateway,
      from lib/abc/compute-contract-gateway/mod.ts, so that the XRPC transport (createComputeContractGateway),
      the Hono factory layer (ComputeContractGatewayFactoryOptions) and market callers
      all depend on this interface instead of importing a concrete gateway implementation.
    codeRefs:
    - file:lib/abc/compute-contract-gateway/mod.ts
    - interface:686284d942a70c576d3538a0ee80e825
  - id: r.gateway-identity
    level: MUST
    text: ComputeContractGateway must expose a did string field naming the gateway,
      so a caller can address the gateway's own repository identity without reaching
      into the underlying PDS object that the transport implementation holds.
    codeRefs:
    - interface:686284d942a70c576d3538a0ee80e825
  - id: r.package-manifest
    level: MUST
    text: The package must carry its own Deno manifest at lib/abc/compute-contract-gateway/deno.json
      declaring the module's dependencies and export, so the interface can be consumed
      as a package rather than by relative path across layers.
    codeRefs:
    - file:lib/abc/compute-contract-gateway/deno.json
  - id: r.provision-vm
    level: MUST
    text: ComputeContractGateway must expose requestComputeVM taking a CallerIdentity
      and a ComputeRequestVMInput and resolving to a GatewayComputeResponse, so long-lived
      VM provisioning is requested against the same caller-and-response shape as the
      worker calls and differs only by the input record it accepts.
    codeRefs:
    - interface:686284d942a70c576d3538a0ee80e825
  - id: r.provision-worker-ephemeral
    level: MUST
    text: ComputeContractGateway must expose requestComputeWorkerEphemeral taking
      a CallerIdentity and a ComputeRequestWorkerInput and resolving to a GatewayComputeResponse,
      so a throwaway worker is requested through a call distinct from the persistent-worker
      call even though both accept the same input type.
    codeRefs:
    - interface:686284d942a70c576d3538a0ee80e825
  - id: r.provision-worker-persistent
    level: MUST
    text: ComputeContractGateway must expose requestComputeWorkerPersistent taking
      a CallerIdentity and a ComputeRequestWorkerInput and resolving to a GatewayComputeResponse,
      so a durable worker is requested through a call distinct from the ephemeral-worker
      call while sharing that call's input and response types.
    codeRefs:
    - interface:686284d942a70c576d3538a0ee80e825
  - id: r.serve-lifecycle
    level: MUST
    text: 'ComputeContractGateway must expose beginServe(): Promise<void> to bring
      the gateway into a serving state and dispose(): Promise<void> to release it,
      both async and awaitable, so a caller controls gateway startup and shutdown
      explicitly rather than relying on implicit or lazy startup.'
    codeRefs:
    - interface:686284d942a70c576d3538a0ee80e825
  - id: r.shared-boundary-types
    level: SHOULD
    text: The interface should reference CallerIdentity, ComputeRequestVMInput, ComputeRequestWorkerInput
      and GatewayComputeResponse as the types crossing the gateway boundary without
      redeclaring them in this module, so request identity, VM input, worker input
      and response shape stay defined once in the shared common package and implementations
      and callers cannot drift apart.
    codeRefs:
    - file:lib/abc/compute-contract-gateway/mod.ts
    - interface:686284d942a70c576d3538a0ee80e825
  interfaces:
  - name: ComputeContractGateway
    kind: interface
    signature: 'export interface ComputeContractGateway { did: string; beginServe():
      Promise<void>; dispose(): Promise<void>; requestComputeVM(caller: CallerIdentity,
      input: ComputeRequestVMInput): Promise<GatewayComputeResponse>; requestComputeWorkerEphemeral(caller:
      CallerIdentity, input: ComputeRequestWorkerInput): Promise<GatewayComputeResponse>;
      requestComputeWorkerPersistent(caller: CallerIdentity, input: ComputeRequestWorkerInput):
      Promise<GatewayComputeResponse>; deleteCompute(caller: CallerIdentity, receiptUri:
      string, receiptCid: string, token: string): Promise<{ ok: boolean }> }'
    file: lib/abc/compute-contract-gateway/mod.ts
codeRefIndex:
- file:lib/abc/compute-contract-gateway/deno.json deno.json@lib/abc/compute-contract-gateway/deno.json
- file:lib/abc/compute-contract-gateway/mod.ts mod.ts@lib/abc/compute-contract-gateway/mod.ts
- interface:686284d942a70c576d3538a0ee80e825 ComputeContractGateway@lib/abc/compute-contract-gateway/mod.ts:8
