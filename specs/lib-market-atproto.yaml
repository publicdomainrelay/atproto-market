apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-market-atproto
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  - sc.lib-abc-market
  - sc.lib-atproto-attestation-port
  - sc.lib-common-market-common
  - sc.lib-common-market-lexicons
  intent: 'This context exists so the market''s atproto-facing behavior is specified
    once, in one place, rather than inferred from ten modules. It captures the invariants
    callers outside this package depend on: how signatures are normalized between
    @atiproto''s Uint8Array form and atproto record JSON''s { $bytes } form, which
    key material and DID documents count as authoritative, how a record is signed
    and stored, how the accept graph is verified back to its RFP, and the exact shape
    of the server handler factories and the MarketClient methods that the bidder,
    requester, and settlement packages bind to. It is the boundary document for anything
    that speaks to a market over AT Protocol, and it is what a maintainer should read
    before changing wire-visible behavior.'
  requirements:
  - id: r.attestation-for-keypair
    level: MUST
    text: An Attestation is constructed from a keypair's private key with an optional
      issuer, binding signing to that keypair and, when given, to that issuer.
    codeRefs:
    - function:4523e9fa3db0d8713e70eb71ea17cdb5
  - id: r.attestation-verification-method
    level: MUST
    text: The attestation verification method is emitted as a Multikey method whose
      id concatenates the controller, the keypair's did:key and a fragment that defaults
      to "attestation", carrying the public key in multibase form.
    codeRefs:
    - function:d086dbd2a94bb08f4868d4e1a36886d9
  - id: r.badge-blue-key-binding-check
    level: MUST
    text: A key is confirmed bound to a DID by reading the badge-blue keys record
      for that DID and key id through the id resolver, reporting a boolean and returning
      false rather than throwing when the record is absent.
    codeRefs:
    - function:10d883640e8a5a7f9d0b724d937133d1
    - function:e5c728d6a9759280b70b480547592bd5
  - id: r.badge-blue-keys-record
    level: MUST
    text: Publishing a badge-blue key binding writes a record into the subject repo
      under the badge-blue keys collection at the derived rkey, delegating the write
      through the supplied writeRecord callback and returning the resulting uri and
      cid.
    codeRefs:
    - function:bfb74ae8c3c5764aa8fec8a08b8a6dcd
  - id: r.badge-blue-keys-rkey
    level: MUST
    text: The record key for a badge-blue key binding is derived asynchronously from
      the subject DID and key id, so the same binding always lands at the same rkey
      and can be looked up without a listing.
    codeRefs:
    - function:565917e19429b690f77d038a1771cb93
  - id: r.badge-blue-signer
    level: MUST
    text: The badge-blue signer is a keypair derived from a required hex private key,
      so the badge-blue identity is deterministic across processes rather than freshly
      generated per start.
    codeRefs:
    - function:adf545411098c5c92e62813b4283dc45
  - id: r.base58btc-encoding
    level: MUST
    text: Bytes are encoded to base58btc for multibase key material, so emitted key
      identifiers round-trip through the standard multibase decoding used by DID verification.
    codeRefs:
    - function:c01f943b04487ed6765417f89402e2c2
  - id: r.bearer-extraction
    level: MUST
    text: A bearer credential is extracted from an Authorization header value that
      may be absent or null, yielding an empty string rather than throwing when no
      Bearer token is present.
    codeRefs:
    - function:87b92ea5f5717bb556617a2c1fa92cf8
  - id: r.bid-create-and-submit
    level: MUST
    text: Creating and submitting a bid takes the RFP uri, cid and record plus the
      settlement dependencies and the request URL, and resolves to the created bid's
      uri and cid so the bidder can record its own submission.
    codeRefs:
    - function:72525a51e6418b0a9341975a977fd7f7
  - id: r.bid-factory
    level: MUST
    text: A bid factory is constructed from its dependencies, closing over them so
      that building a bid does not require re-supplying signing keys, records and
      settlement wiring at each call site.
    codeRefs:
    - function:a8e295376e37dbcc8d8027ffbc143b2e
    - interface:0c2d4165b40cf28c14348ceb91db6d93
    - interface:6e79b7b8c9ce2b70f4e3986aff5f0d77
  - id: r.contract-graph-resolution
    level: MUST
    text: An accept is resolved into a ContractGraph by walking the referenced records
      through the supplied record resolver, optionally verifying signatures and resolving
      keys per DID; an unresolvable or malformed graph raises ContractGraphError rather
      than returning a partial graph.
    codeRefs:
    - class:088ab0f90fba416f3035887f3f6abcf1
    - function:d7be7fb39bc4e2f86fd9985e13241b85
    - interface:9f98899afaebca0e8500df067ae28b03
    - method:407b0c921496346755f27d2c95775484
  - id: r.did-key-resolution
    level: MUST
    text: Keys for a DID are resolved through a resolver built from an optional PLC
      URL and timeout, exposing the KeysForDid contract so that verification can be
      performed against keys fetched at verification time rather than baked-in ones.
    codeRefs:
    - function:777e711d211dc51cbd2e0d75a82e0d5b
    - type_alias:328bae5301fa305891c325db61c46469
  - id: r.inline-attestation-entries
    level: MUST
    text: The inline attestation entries carried by a record are extracted from its
      signatures field, so verification operates on the entries actually stored in
      the record.
    codeRefs:
    - function:a1c9d31ffef200b9bfd10ae485037f4c
  - id: r.inline-attestation-verification
    level: MUST
    text: An inline attestation is verified asynchronously from the given options
      and reports a boolean, resolving the signer's keys as part of the check rather
      than trusting the embedded key.
    codeRefs:
    - function:985b4184227ce0a11d4eea568402dfce
    - interface:ff01c799dc7cac3a6c8a4ee77fb85202
  - id: r.keypair-loading
    level: MUST
    text: A keypair is loaded from a hex private key when one is supplied, otherwise
      a fresh exportable secp256k1 keypair is generated; the returned keypair exposes
      the derived did:key as a callable did() and a private key object that carries
      an explicit toBytes() returning the same bytes, because @noble/curves fails
      on the raw KeyData wrapper without it.
    codeRefs:
    - file:lib/market-atproto/attest.ts
    - function:eec1501b10e44ae978048272c4e9cced
  - id: r.market-client-signing
    level: MUST
    text: The market client creates a signed record from a collection and record value,
      resolving and caching a signer lazily so no key material is required until the
      first signed write.
    codeRefs:
    - class:b264115331e7de1c849ce526bb95a46d
    - interface:06b7f3d949eb2428955dc829ff88bd32
    - method:460e2c9722d4f592de1c2ba79e06993e
    - method:c68ce766697e07e3588237b46e812d30
  - id: r.market-client-submit-accept
    level: MUST
    text: The market client submits an accept reference against a target service and
      resolves to a SubmitAcceptResult, letting the winning bidder close the contract
      over XRPC.
    codeRefs:
    - interface:7825f59d94db4727d77f7cfefff9bab1
    - method:5e00b55cb39a80b1b67ad87180a3b6ba
  - id: r.market-client-submit-bid
    level: MUST
    text: The market client submits a bid value against a target service and resolves
      to a Submission carrying the bid's uri and cid.
    codeRefs:
    - interface:8e9dba8570d46d454d9b6044ae801936
    - method:29c46de8762f2cda28ea9f42945ec2aa
  - id: r.market-client-submit-event
    level: MUST
    text: The market client submits an event value against a target service and resolves
      to a Submission, so lifecycle events travel the same path as bids.
    codeRefs:
    - method:5a7c89ac703d88b59f76fd56a381a91f
  - id: r.market-client-submit-rfp
    level: MUST
    text: The market client submits an RFP reference against a target service and
      resolves to a SubmitRfpResult, and a client is constructed either directly from
      an XrpcService plus options or through the createMarketClient factory.
    codeRefs:
    - function:a4a549b19eff8b40c325d4759430ac84
    - interface:21b9ba62b8752cd4fa4dec80859724a8
    - method:75948ea3fb693dc4b0e4e92c7a6cc06a
    - type_alias:d1516ebc54626f302d7a51f379e48688
  - id: r.market-server-deps
    level: MUST
    text: A market server is wired from a MarketServerDeps bundle, so the storage,
      resolver, signer and verification dependencies of the server are declared in
      one place.
    codeRefs:
    - interface:a2aebdfd88748624278922bae605823b
  - id: r.market-service-auth
    level: MUST
    text: An inbound market service-auth token is verified asynchronously against
      the verification options and resolves to a ServiceAuthResult describing the
      authenticated caller, rejecting tokens for the wrong audience or issuer.
    codeRefs:
    - function:97a396ee1219f7d9074d254be6aedd52
    - type_alias:07fd46a41bb1c9e9be4323c963b3e633
    - type_alias:69e9d4e152de0d940d35bb2ea3fa5e21
    - type_alias:c5125342bf372413de697892aa5b2a46
  - id: r.offering-refresh-loop
    level: MUST
    text: A periodic offering refresh is started at a given interval, invoking the
      supplied refresh callback, logging through an optional logger, and returning
      an OfferingRefreshHandle so the loop can be stopped by its owner.
    codeRefs:
    - function:3717d81ed40faf5d4dad599c4a466c88
    - interface:a1fd6134e58d1be9a02ec1816d47d3d6
  - id: r.package-barrel-export
    level: MUST
    text: The package re-exports its public surface from a single mod.ts barrel, so
      consumers import the market atproto transport from one entrypoint rather than
      reaching into individual modules.
    codeRefs:
    - file:lib/market-atproto/mod.ts
  - id: r.pds-resolution
    level: MUST
    text: The PDS endpoint for a DID is resolved through the id resolver, so callers
      can reach a repo without hard-coding a host.
    codeRefs:
    - function:6ba98cc82d098583236519c1e8e764f1
  - id: r.receipt-record
    level: MUST
    text: A receipt record is created from the receipt's refs and subject and signed
      with the supplied RecordSigner before being stored, resolving to a StrongRef
      so a receipt is never written unsigned.
    codeRefs:
    - function:4d0d3b3b20bd7fc36774859f10ac13dc
    - interface:3c712b587b45e111a5a8a12db9b7a950
    - interface:4479a9b41ebd3caed12b255aa2081366
  - id: r.record-creation
    level: MUST
    text: A record is written to a collection in the repo through the agent and resolves
      to a StrongRef of uri and cid; deleting a record removes it by uri through the
      same agent interface.
    codeRefs:
    - function:16fad6b2b6420af853fbdd73759716b6
    - function:9a8248f51f025f8b6e32b4e8e299f71a
  - id: r.record-listing-all
    level: MUST
    text: All records of a collection are listed from a PDS URL and repo with an optional
      limit and timeout, following pagination to completion rather than returning
      only the first page.
    codeRefs:
    - function:3f8629004305c464a50d8b1bacae6b4b
    - type_alias:d50b5da61960bf0467d63a21148b6499
  - id: r.record-listing-public
    level: MUST
    text: Records are listed publicly for a repo and collection by first resolving
      the repo's PDS and then reading the collection, with optional limit and timeout,
      so unauthenticated readers get the same listing as authenticated ones.
    codeRefs:
    - function:e21dfce0e403ec8cbf782a0e996930be
  - id: r.record-resolver
    level: MUST
    text: A RecordResolver is built from an id resolver so that record lookups resolve
      PDS and fetch by uri through one injected seam, keeping contract resolution
      testable.
    codeRefs:
    - function:d4ce49ecbfee113afc4127141aa82940
  - id: r.record-signature-verification
    level: MUST
    text: Record signatures are verified asynchronously from the given options and
      report a boolean, using the caller-supplied keys so a record's authorship is
      confirmed against resolved keys rather than self-asserted ones.
    codeRefs:
    - function:8667f4a02873405e91188462d922e2fe
    - interface:76a72b652b31091b4242c7e9e449f123
  - id: r.remote-proof-record
    level: MUST
    text: A remote proof record is created from metadata carrying a $type plus a subject,
      signed with the supplied signer, and stored, resolving to a StrongRef so a proof
      can be published against another record.
    codeRefs:
    - function:2dec0113615801ddc5fff8420d814147
    - interface:6fe3d0938f2e2498697e840d96caf911
  - id: r.remote-proof-verification
    level: MUST
    text: A remote proof is verified synchronously from its options and reports a
      boolean, without any network fetch, so it can be used inside a record-validation
      path.
    codeRefs:
    - function:102ed3d4f37a62e09488394627bb14ba
    - interface:e48c155afb36e23092258ba5e83a372d
  - id: r.rfp-dispatch
    level: MUST
    text: 'RFP dispatch is separated from the HTTP handler: a dispatcher is built
      from the handler config and takes a DispatchRfpInput, returning a Response,
      so the decision logic can be exercised without a request object.'
    codeRefs:
    - function:6977507cc804dcb71b651b9629300054
    - interface:a6d9838f8e5a8a01a178792680c729c8
  - id: r.service-did-for-host
    level: MUST
    text: The service DID for a request is derived deterministically from the request
      hostname, so a market service can be addressed by host without a separate configuration
      value.
    codeRefs:
    - function:98363f480e900827243e69ef1e48679b
  - id: r.signature-normalization
    level: MUST
    text: A signature is accepted in any of three wire forms - raw Uint8Array bytes,
      an atproto JSON object carrying a base64 string under $bytes, or a bare base64
      string - and is returned as a Uint8Array; any other input yields undefined rather
      than throwing.
    codeRefs:
    - file:lib/market-atproto/attest.ts
    - function:dd9dba3c37b4e3b9f52bdef5f65e1d72
  - id: r.signed-record-creation
    level: MUST
    text: A record is signed with the supplied RecordSigner before storage, producing
      a SignedRecord that carries both the emitted signed form and the underlying
      Signed value so callers can store and re-verify the same bytes.
    codeRefs:
    - function:62506aa5278c714b78058eb4ffa8fdd4
    - interface:90db8b9ee170a9798bba0b80f26f7874
    - interface:b22f1c63755c22cbfbce3e7a1b8098b7
    - type_alias:d1103ff61d586b58f801f7823020dd04
  - id: r.storable-attestation-entry
    level: MUST
    text: An inline attestation entry is converted for storage by re-encoding its
      signature as base64 under a $bytes key, because @atiproto produces a Uint8Array
      while atproto record JSON requires the $bytes form; if the signature cannot
      be normalized the original value is left untouched rather than dropped.
    codeRefs:
    - function:068238ff7263642ac7b90ebbfc5ddca3
    - function:dd9dba3c37b4e3b9f52bdef5f65e1d72
  - id: r.submit-handlers
    level: MUST
    text: The server exposes Hono Handler factories for the submit RFP, submit bid,
      submit accept and submit event XRPC methods, each built from its own config
      carrying the deps it needs, so a market service routes each method without sharing
      mutable state between them.
    codeRefs:
    - function:0f913e33cc210dafda22aef7e2cdc7b1
    - function:13fec5a02eca908bbeb919368a29e6dc
    - function:b42bd4e8e8a7b5c513c75339ddb940c2
    - function:ea2b23f33739df4fc8dc7ed4efaefea8
    - interface:3a2dd68df5868be740b032a4a37e0c7d
    - interface:3a99f2c2c67c123dd075fad5f70e5001
    - interface:9818e51eff36d0dded39af95803f0796
    - interface:e541c8eefb5b202a2d456d94a6b15630
  - id: r.verify-handler
    level: MUST
    text: A verify Handler is created from its dependencies and answers verification
      requests, using pdsForDid to find the repo and fetchRecord to read the record
      by uri and optional cid, returning the record value alongside the cid it resolved.
    codeRefs:
    - function:3f161e971ad1f5274100575fc3b91d09
    - function:6e2cdf7b076fec814b99568afd576756
    - function:fb68d4609e3ad9dcb35fa9dc0cfb9a51
    - interface:3c3e311a12ad5dfe3195b5aaac36af7d
