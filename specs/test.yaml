apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: test
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists to hold the repository''s verification surface: executable
    tests that pin down the behaviour of the bidder, gateway, and supporting subsystems
    against locally stood-up infrastructure instead of public network services. Its
    central mechanism is the shared fetch interceptor in test/fetch-interceptor.ts,
    which exists so that code under test that hardcodes public endpoints (plc.directory
    for identity resolution, https://*.localhost for per-service relays) can be driven
    against ephemeral local servers on arbitrary ports, and so that tests exercising
    TLS can trust a throwaway self-signed CA without touching the real certificate
    store. Keeping these tests in one context makes the assumptions they share — the
    host rewrite rules, the CA trust escape hatch, and the teardown contract — describable
    in one place, so a change to the interceptor''s rewriting behaviour is visibly
    a change to every integration suite at once.'
  requirements:
  - id: r.ca-cert-https-mode
    level: SHOULD
    text: When a caCertPem is supplied, localhost rewrites must keep the https scheme
      and be issued through a Deno HttpClient configured with that PEM as a trusted
      CA certificate, so TLS-terminating local services are reachable without disabling
      verification; when no PEM is supplied the rewrite must downgrade to plain http
      and issue the request on the default client.
    codeRefs:
    - file:test/fetch-interceptor.ts
    - function:c6f81957f952317eb0e87d2454b5add3
  - id: r.cloud-init-iroh-snapshot
    level: MUST
    text: 'test/cloud_init_snapshot_test.ts must render the new iroh transport and
      assert it byte-for-byte against test/fixtures/cloud-init/iroh.yaml, and must
      assert listUserDataModules() includes "iroh"; the existing tunnel, tunnel-secrets,
      fedproxy-ssh and fedproxy-web-wootty snapshot assertions and the secrets-module
      semantic assertions must remain in the same file and stay green. The file''s
      module-completeness rule -- a module that writes an sshd drop-in or enables
      ssh must install openssh-server -- must cover the iroh module as well as tunnel
      and fedproxy-ssh, so a module that configures an sshd it never installs fails
      the suite. This test is the verification gate: it must pass under `deno test
      -A test/cloud_init_snapshot_test.ts`, and the whole workspace must still pass
      `deno check`.'
    codeRefs:
    - file:test/cloud_init_snapshot_test.ts
  - id: r.container-harness-proves-live-ssh-over-iroh
    level: MUST
    text: 'test/bidder_container_integration_test.ts must prove the live SSH path,
      not only bid collection: it must run runComputeContract with skipSsh false and
      await the whole contract, with no Promise.race cap that lets the test fall through
      to its cleanup while the flow is still running. Every service -- dispatcher,
      requester serve, bidder and provider -- must stay alive until the contract returns.
      Tearing them down while the bidder is still provisioning aborts the in-flight
      record resolves and surfaces as `TypeError: fetch failed` in the bidder; that
      is a teardown race in this test and not a provisioning failure, and it is proven
      to be one: with the same harness and the teardown held for 30 s the container-mode
      provider provisions a guest, reaches sshd in under 3 s and the guest reaches
      POST /v1/on-network. The harness must assert result.sshReady === true and result.sshExitCode
      === 0 for an execProgram whose exit code only succeeds inside the real guest
      (it must both echo a marker and test for the file the guest cloud-init installs,
      e.g. `test -x /usr/local/bin/dumbpipe && echo SSH_OK_VIA_IROH`), so a green
      run proves the whole chain: RFP -> bid -> accept -> cloud-init installs dumbpipe
      in the guest -> the guest reports its ticket to the requester''s per-contract
      endpoint -> ssh with ProxyCommand `dumbpipe connect <ticket>` runs the command
      in the guest. The harness must give the requester an ingress host the container
      can actually dial and give the provider the guest TLS port and CA certificate,
      the same gateway-reachable wiring the cross-platform and OAuth suites already
      use, because the report endpoint URL is baked into the cloud-config the guest
      runs. Concretely, mirror test/oauth_session_transfer_test.ts: serve the dispatcher
      app on 0.0.0.0 on two ephemeral listeners of the same app -- plain HTTP, which
      the in-process subscribers reach with http/ws, and TLS with a generated localhost
      certificate whose SANs include relay.localhost and *.relay.localhost. Pass ingressProxyHost
      `relay.localhost:<plainPort>` to the requester, bidder and provider, so the
      requester''s ingress URL is `https://<sub>.relay.localhost` (hostnameOnly drops
      the port) and the provider''s getIssuerUrl is that same name with the TLS port
      appended -- which is what lands in the winning bid_config''s issuer_uri and
      therefore in the reporter token''s iss. Install the shared fetch interceptor
      with the TLS port and the CA PEM, not with the plain port: the requester verifies
      the reporter token by fetching the issuer''s discovery document and JWKS at
      that issuer_uri, whose host already carries the TLS port, and a plain-port interceptor
      would downgrade it to http against the TLS listener. Pass the provider the TLS
      port and the certificate as its guest TLS port and CA, so it rewrites the guest''s
      https://*.localhost URLs to that port, resolves the names to the container gateway
      and installs the CA, and pass it the OIDC provisioning enricher so the guest
      is issued the workload token the report exchange needs. A single-label wildcard
      such as *.localhost is rejected by TLS stacks, which is why the two-label relay.localhost
      base is used.'
    codeRefs:
    - file:test/bidder_container_integration_test.ts
  - id: r.container-harness-relay-resolves-did-keys
    level: MUST
    text: 'test/bidder_container_integration_test.ts is the repository''s canonical
      live harness and must be green. Its local dispatcher must be built with a resolveDidKey
      that resolves a subscriber DID from the local fake PLC -- GET https://plc.directory/<did>
      through the installed fetch interceptor, take the atproto verification method''s
      publicKeyMultibase, and return it as `did:key:<multibase>` -- so the relay can
      verify the service-auth JWTs of the PDS/subscriber DIDs it serves. Without it
      the relay answers 401 AuthenticationRequired with `cannot resolve signing key
      for did:plc:...` in the first 0.3 s, before any transport or provisioning code
      runs, and every realization gated on this harness is gated on a pre-existing
      failure. The same resolver must be used by the other suites that stand up the
      local dispatcher against a fake PLC: the gateway README smoke test, the gateway
      SSH integration test, the gateway request-VM integration test, the cross-platform
      bidder test and the OAuth session transfer test.'
    codeRefs:
    - file:test/cloud_init_snapshot_test.ts
  - id: r.dumbpipe-real-archive-extraction
    level: MUST
    text: 'A test (test/iroh_dumbpipe_install_test.ts) must prove the dumbpipe install
      works against the real release archive, not a stub: it takes the pinned v0.39.0
      linux archive from the DUMBPIPE_ARCHIVE environment variable when that names
      a readable file, and otherwise downloads it from the pinned n0-computer/dumbpipe
      GitHub release URL; it then runs the exact tar extraction the code runs -- the
      guest cloud-config''s install command, read out of the rendered iroh module
      output, and the argument list ensureDumbpipe uses -- into a temporary directory,
      and asserts that <dir>/dumbpipe exists, is executable, and that running it with
      --help exits 0 and prints dumbpipe usage. The test must fail if the extraction
      names the bare member `dumbpipe`, which is the defect this requirement exists
      to catch.'
    codeRefs:
    - file:test/cloud_init_snapshot_test.ts
    - file:test/fixtures/cloud-init/iroh.yaml
  - id: r.integration-suites-install-interceptor
    level: MUST
    text: The bidder container, bidder cross-platform, gateway caller RBAC, gateway
      README smoke, gateway request VM, gateway SSH, gateway worker, and OAuth session
      transfer suites must all install the shared fetch interceptor, so these end-to-end
      tests exercise services through the local rewrite rules rather than the public
      network.
    codeRefs:
    - file:test/bidder_container_integration_test.ts
    - file:test/bidder_cross_platform_integration_test.ts
    - file:test/fetch-interceptor.ts
    - file:test/gateway_caller_rbac_integration_test.ts
    - file:test/gateway_readme_smoke_test.ts
    - file:test/gateway_request_vm_integration_test.ts
    - file:test/gateway_ssh_integration_test.ts
    - file:test/gateway_worker_integration_test.ts
    - file:test/oauth_session_transfer_test.ts
  - id: r.iroh-private-ticket-report-tested
    level: MUST
    text: 'A test file test/iroh_private_report_test.ts must cover the private ticket
      path, not only the snapshot: (a) a test must mount a repo-shaped child app under
      a parent with route("/", child) exactly as createRequesterPDS does, must drive
      the parent through at least one request BEFORE any contract is registered (the
      real sequence: the serve app has already served by the time runComputeContract
      registers), and must then assert that a POST /v1/on-network reaches the handler
      and settles the contract''s SSH wait with the posted ticket, so a report endpoint
      that is unreachable through the ingress, or one that needs Hono''s route registry
      to be mutated after the app has served, fails the suite instead of silently
      timing out; a ref that matches no live contract and a second report for an already-settled
      contract must each answer 409 and leave the settled ticket unchanged; and (b)
      a test drives the bidder''s vm.onNetwork emission for a contract whose provider
      is stubbed to return a ticket-shaped value from an optional getNodeId method
      and asserts that the published vm.onNetwork record''s address never contains
      that ticket, so the capability cannot leak into a public record.'
    codeRefs:
    - file:test/cloud_init_snapshot_test.ts
  - id: r.iroh-ticket-extraction-tested
    level: MUST
    text: 'test/cloud_init_snapshot_test.ts must assert the iroh module''s ticket
      extraction against the line the pinned dumbpipe release actually prints: the
      rendered cloud-config must extract the ticket from a `dumbpipe connect-tcp <ticket>`
      line (the subcommand `listen-tcp` prints) and must not depend on a bare `dumbpipe
      connect ` prefix, so a guest that logs the real listener output still writes
      /root/secrets/iroh-node-id. It must also assert the identity and freshness rules:
      the unit reads an EnvironmentFile and the secret file is created once with umask
      077 in the same command that starts the listener, the log is truncated on each
      start rather than appended to, and the ticket is re-extracted and reported on
      each start rather than only at first boot.'
    codeRefs:
    - file:test/cloud_init_snapshot_test.ts
  - id: r.localhost-port-rewrite
    level: MUST
    text: installFetchInterceptor must detect https URLs whose host is exactly localhost,
      ends with .localhost, or contains .localhost:, and rewrite them to reach the
      local dispatcher; when the host carries no explicit port the configured dispPort
      is appended, and the original path and query are preserved.
    codeRefs:
    - file:test/fetch-interceptor.ts
    - function:c6f81957f952317eb0e87d2454b5add3
  - id: r.passthrough-unmatched
    level: MUST
    text: Requests that match neither the plc.directory prefix nor a localhost host
      must be forwarded unchanged to the original realFetch, so an installed interceptor
      does not silently alter traffic to any other origin.
    codeRefs:
    - file:test/fetch-interceptor.ts
    - function:c6f81957f952317eb0e87d2454b5add3
  - id: r.plc-directory-rewrite
    level: MUST
    text: installFetchInterceptor must rewrite any request whose URL begins with https://plc.directory/
      onto the caller-supplied plcDirectoryUrl, preserving the remainder of the original
      path after the https://plc.directory prefix, so tests resolve DIDs against a
      local fake PLC rather than the public directory.
    codeRefs:
    - file:test/fetch-interceptor.ts
    - function:c6f81957f952317eb0e87d2454b5add3
  - id: r.teardown-restores-fetch
    level: MUST
    text: installFetchInterceptor must return a disposable closure that reassigns
      globalThis.fetch back to the original realFetch and closes the Deno HttpClient
      it created, so a test that installs the interceptor leaves no patched global
      or leaked connection pool behind for later tests in the same process.
    codeRefs:
    - file:test/fetch-interceptor.ts
    - function:c6f81957f952317eb0e87d2454b5add3
  - id: r.transport-selection-tests
    level: MUST
    text: 'A test file test/iroh_transport_test.ts must pin the transport selection:
      sshTunnelArgs/defaultProxyCommand produce `dumbpipe connect <ticket>` for the
      iroh transport and the websocat --binary wss:// URL for the tunnel and fedproxy-ssh
      transports, an explicit proxy command override replaces either, and the helper
      selection follows the transport id (ensureDumbpipe only for iroh, ensureWebsocat
      for tunnel and fedproxy-ssh), so a target string''s shape can never decide which
      binary or command is used.'
    codeRefs:
    - file:test/bidder_container_integration_test.ts
  - id: r.unit-suite-coverage
    level: SHOULD
    text: 'The suite must retain focused tests for each non-intercepted subsystem:
      badge blue key binding, bid collection, the bidder policy restricted to only-me,
      the production bidder, bidder SSH relay, cloud-init snapshot rendering, firehose
      watching, offering refresh, registry discovery, and secrets capability.'
    codeRefs:
    - file:test/badge_blue_keys_binding_test.ts
    - file:test/bid_collector_test.ts
    - file:test/bidder_policy_only_me_integration_test.ts
    - file:test/bidder_prod_integration_test.ts
    - file:test/bidder_ssh_relay_test.ts
    - file:test/cloud_init_snapshot_test.ts
    - file:test/firehose_watcher_test.ts
    - file:test/offering_refresh_test.ts
    - file:test/registry_discovery_test.ts
    - file:test/secrets_capability_test.ts
  interfaces:
  - name: installFetchInterceptor
    kind: function
    signature: 'installFetchInterceptor(opts: { realFetch: typeof globalThis.fetch;
      plcDirectoryUrl: string; dispPort: number; caCertPem?: string }): () => void'
    file: test/fetch-interceptor.ts
