apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-common-market-lexicons-com-fedproxy-temp-xrpc
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists so the relay''s wire contract — nonce issuance, the
    signed registration record, and the WebSocket subscription frames — is captured
    as inspectable, code-generated Lexicon schemas that both the relay and its subscribers
    share. The types are the machine-readable form of the handshake: a caller proves
    custody of a did:key by having the relay issue a nonce, signing it, and presenting
    the resulting registration when opening the subscribe socket, which the relay
    then binds to that key for the connection''s lifetime. Reading this context tells
    you the exact payload shapes, error names, and frame fields that any implementation
    on either side of the relay must match.'
  requirements:
  - id: r.barrel-reexport
    level: MUST
    text: Each non-defs sibling module (`getRegistrationNonce.ts`, `registration.ts`,
      `subscribe.ts`) re-exports everything from its defs file and re-exports `main`
      as the module default, giving consumers a single import surface per method.
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.ts
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/registration.ts
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/subscribe.ts
  - id: r.generated-do-not-edit
    level: MUST
    text: Every defs module carries the `@atproto/lex` generated-file banner and must
      not be edited by hand; schema changes go through the generator.
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/registration.defs.ts
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/subscribe.defs.ts
  - id: r.get-registration-nonce-errors
    level: MUST
    text: The getRegistrationNonce procedure declares exactly one error name, `InvalidRequest`,
      so callers can distinguish a malformed key/signature payload from transport
      failure.
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
  - id: r.get-registration-nonce-shape
    level: MUST
    text: '`com.fedproxy.temp.xrpc.getRegistrationNonce` is a procedure with an empty
      param set; its input JSON payload requires a `key` string (the did:key reference)
      and a `signatures` value ref''d to the `network.attested.signature` `Signatures`
      type, and its output JSON payload requires a `nonce` byte string plus the relay''s
      own `signatures` over that nonce.'
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
    - type_alias:0692219625b3f28978097f2b3163e271
    - type_alias:13a4eac8a7e8131e9bbbc8e98105b8f6
    - type_alias:ad1db68c5d41455a259d27b7ad72252d
    - type_alias:f7d12788676fbb2d13b0c099c544510f
    - type_alias:ff2e223fce27544e3cc74fa5d48acd0b
  - id: r.nsid-identity
    level: MUST
    text: Each defs module declares its `$nsid` constant with the full reverse-DNS
      NSID and re-exports it as a named export, so consumers can key off the namespace
      string rather than the file path.
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/registration.defs.ts
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/subscribe.defs.ts
  - id: r.registration-record-fields
    level: MUST
    text: '`com.fedproxy.temp.xrpc.registration` is a `tid`-keyed record whose `key`
      is the did:key that signed the nonce, whose `nonce` is the 64-byte value issued
      by getRegistrationNonce, and whose `signatures` are `network.attested.signature`
      attestations over that nonce, proving liveness and key custody.'
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/registration.defs.ts
  - id: r.registration-record-validators
    level: MUST
    text: The registration record binds and exports the generated validator helpers
      (`$isTypeOf`, `$build`, `$assert`, `$check`, `$cast`, `$ifMatches`, `$matches`,
      `$parse`, `$safeParse`, `$validate`, `$safeValidate`) plus `$type`, so callers
      validate and construct records through the schema instead of ad-hoc shape checks.
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/registration.defs.ts
  - id: r.subscribe-errors
    level: MUST
    text: The subscribe subscription declares the error names `InvalidRequest` and
      `Unauthorized`, so a rejected registration surfaces as Unauthorized rather than
      as a generic failure.
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/subscribe.defs.ts
  - id: r.subscribe-message-union
    level: MUST
    text: 'The subscribe message stream is a typed union of exactly `#registered`,
      `#request`, and `#response` frames: `registered` carries the relay-assigned
      `serviceId` and the `did:web:HOST#serviceId` `ingressRef`; `request` carries
      `requestId`, `method`, `nsid` (nsid format), a string `params` map, an optional
      `body` map, and the `callerDid` (did format); `response` carries the matching
      `requestId`, a numeric `status`, an optional `body` map, and an optional `contentType`.'
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/subscribe.defs.ts
    - type_alias:121d4d034292a36860fe8a628cbedaa9
  - id: r.subscribe-params
    level: MUST
    text: '`com.fedproxy.temp.xrpc.subscribe` is a subscription taking a single required
      string param `registration`, which carries the registration record the relay
      verifies against the issued nonce and did:key before binding the socket.'
    codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc/subscribe.defs.ts
  interfaces:
  - name: $Input
    kind: type_alias
    signature: export type $Input<B = l.BinaryData> = l.InferPayload<typeof $input,
      B>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
  - name: $InputBody
    kind: type_alias
    signature: export type $InputBody<B = l.BinaryData> = l.InferPayloadBody<typeof
      $input, B>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
  - name: $Message
    kind: type_alias
    signature: export type $Message = l.InferOutput<typeof $message>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/subscribe.defs.ts
  - name: $Output
    kind: type_alias
    signature: export type $Output<B = l.BinaryData> = l.InferPayload<typeof $output,
      B>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
  - name: $OutputBody
    kind: type_alias
    signature: export type $OutputBody<B = l.BinaryData> = l.InferPayloadBody<typeof
      $output, B>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
  - name: $Params
    kind: type_alias
    signature: export type $Params = l.InferOutput<typeof $params>
    file: lib/common/market-lexicons/com/fedproxy/temp/xrpc/getRegistrationNonce.defs.ts
