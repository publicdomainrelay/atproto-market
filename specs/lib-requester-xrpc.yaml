apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-requester-xrpc
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists so the atproto-market requester can find who is offering
    a compute service, prove the bidder is discoverable through relays, stand up a
    requester identity/repo, and then drive an SSH-tunnelled session against the winning
    bidder. It holds both the discovery/verification half (relay queries, relay visibility,
    endpoint resolution, bidder calls) and the transport half (keypair generation,
    ssh args, session provider, dumbpipe/websocat bootstrap, readiness polling, program
    execution), because the contract flow needs them in one place to run end to end.
    The default guest transport is iroh: the guest''s dumbpipe listener is reached
    through a dumbpipe connection built from the iroh ticket the guest reports to
    this requester''s own per-contract endpoint, and the legacy websocat-over-relay
    ProxyCommand remains only for the fedproxy-ssh and tunnel transports. The OAuth
    handle and agent-application helpers exist so the same flow works when the requester
    authenticates through an OAuth session rather than a locally held key.'
  requirements:
  - id: r.bidder-endpoint-resolution
    level: MUST
    text: resolveBidderEndpoint takes a bidder's endpoint URL and returns the target
      base URL plus the audience DID to address in service auth, or null when the
      endpoint cannot be resolved; callBidder then posts to that target base for the
      given nsid with the lxm and audience DID in the body, returning the HTTP status,
      an ok flag, and the parsed response body.
    codeRefs:
    - function:9d0c13755d5ff8f03602375056c9c6c3
    - function:ca5512b1850651446ba10067b408bf2e
  - id: r.contract-flow
    level: MUST
    text: runComputeContract drives the whole requester-side flow against a RequesterPDS,
      accepting optional overrides for the SSH session provider, the relay URL list
      (with the singular relayUrl kept as a deprecated alternative), the signer, a
      callback returning offering-watcher DIDs, a structured logger, a payload factory
      returning the job's uri and cid, and an ATProto event-streams client used for
      cross-party firehose discovery, and it returns a ContractFlowResult.
    codeRefs:
    - function:04d27f9568ed8102cba9faf3289286bf
    - interface:7976e76ab81c77e90e7aa4201ff10c1d
  - id: r.dumbpipe-bootstrap
    level: MUST
    text: 'ensureDumbpipe(logger?) must make a `dumbpipe` binary available the way
      ensureWebsocat makes websocat available: return immediately when `which dumbpipe`
      succeeds, otherwise resolve the host platform triple (linux/darwin, x86_64/aarch64)
      and download the matching release archive from the n0-computer/dumbpipe GitHub
      releases, extract the dumbpipe binary, chmod it 0755, and prepend its directory
      to PATH, logging downloading/downloaded/found/unsupported events and never throwing
      on a failed download. The release archive stores its single member as `./dumbpipe`,
      so the extraction must name that member (`tar -xzf <archive> -C <dir> ./dumbpipe`)
      or strip the leading path component; naming the bare member `dumbpipe` fails
      with `tar: dumbpipe: Not found in archive` (exit 2), leaves no binary on PATH
      and makes every SSH attempt fail. This exact extraction must be covered by a
      test against the real v0.39.0 archive (r.dumbpipe-real-archive-extraction in
      the test context).'
    codeRefs:
    - file:lib/requester-xrpc/mod.ts
    - function:e5cbaf8edf9559cc75cdd46ffb76bf95
  - id: r.dumbpipe-ssh-proxycommand
    level: MUST
    text: 'Under the iroh transport the SSH ProxyCommand must be derived from the
      dumbpipe ticket: the default is a stdio dumbpipe connection to the ticket (`dumbpipe
      connect <ticket>`), and an implementation that instead starts `dumbpipe connect-tcp
      --addr 127.0.0.1:<localPort> <ticket>` and bridges the ProxyCommand''s stdin/stdout
      to that loopback port is equally valid. Both pollReady and runSession must use
      that ProxyCommand, and ssh must still authenticate as root with the requester''s
      own generated key and the same StrictHostKeyChecking=no / UserKnownHostsFile=/dev/null
      / LogLevel=ERROR hardening as before. An explicit proxy command override must
      still fully replace the default.'
    codeRefs:
    - function:784207610f82de1a689784e9deaf47e6
    - function:92a8839f14ca40e1a2ba046f349d57b2
    - function:9bf1f659af305ad4bb6e03b09e1aa7fe
  - id: r.iroh-default-transport
    level: MUST
    text: 'The default guest transport for the contract flow must be the iroh cloud-init
      module: runComputeContract must compose cloud-init with transport "iroh" when
      the caller supplies no userData.transport, the flow must call ensureDumbpipe
      before an SSH session, and the default SSH ProxyCommand for that transport must
      open a dumbpipe connection to the ticket the contract published rather than
      dial a relay FQDN. skipSsh, keepVm, hold, the sshAuthorizedKeys/appended-key
      behavior, and the fedproxy-ssh transport (selected explicitly and still using
      the websocat ProxyCommand via the proxy command override) must keep working
      unchanged.'
    codeRefs:
    - file:lib/requester-xrpc/mod.ts
    - function:04d27f9568ed8102cba9faf3289286bf
  - id: r.iroh-report-endpoint
    level: MUST
    text: 'Under the default iroh transport, when SSH will run, the contract must
      receive the guest''s ticket over a per-contract channel of its own instead of
      the public event path. runComputeContract must mount POST /v1/on-network on
      the requester''s serve app -- the app the ingress actually serves -- before
      the cloud-config is composed, and pass the endpoint URL (the requester''s own
      ingress URL plus /v1/on-network) to the iroh module as ctx.irohReportUrl. Mounting
      on the repo app instead is a defect: createRequesterPDS has already run serve.app.route("/",
      repoApp), and Hono copies a child app''s routes into the parent at that call,
      so a route added to the repo app afterwards is never reachable, the guest''s
      POST gets 404 and the SSH wait times out. The endpoint accepts { acceptUri,
      acceptCid, address } only when acceptUri#acceptCid equals the contract''s current
      accept ref and the contract''s SSH wait is still open; it accepts exactly one
      report per contract (the first settles the wait with the address, the dumbpipe
      ticket, records it as the contract result''s ticket and answers 200 { ok: true
      }; a later report answers 409 and never replaces a settled target), and a mismatched
      accept ref answers 409 without resolving. The endpoint must be unmounted when
      the contract ends, and skipSsh must not mount it. No credential may be placed
      in the cloud-config: the composed user_data is published inside the compute.vm
      record, so a bearer token there is public and would only appear to protect the
      endpoint. The accept ref is public too, and a reader of the contract records
      who races the guest''s first report can point the contract at an iroh endpoint
      of its own; an impostor endpoint cannot complete ssh publickey auth (it does
      not hold the guest''s host key and the requester''s key is authorized only on
      the real guest), but it can observe the requester''s own ssh session. Closing
      that needs a guest-held credential the cloud-init cannot carry (the workload-identity
      / secrets-capability channel); it is a stated gap, not a claim of authentication,
      and it must be named in the pull request and in the requirement text, not hidden.'
    codeRefs:
    - file:lib/requester-xrpc/mod.ts
  - id: r.iroh-ticket-onnetwork
    level: MUST
    text: 'Under the default iroh transport the SSH transport target must be taken
      only from the guest''s private report (r.iroh-report-endpoint) and never from
      a public record: the vm.onNetwork record''s address and the registerIdentity
      nodeId are world-readable, so any reader could dial the guest, and under iroh
      neither may settle the SSH wait (the bidder must not publish the ticket there
      either, r.iroh-ticket-emission of the lib-market-bidder-compute context). Receipt-keyed
      resolver registration (setOnNetworkResolved/clearOnNetworkResolved) and the
      stale-contract guards must stay and must also key the report wait, because one
      requester serves several contracts concurrently. The vestigial pds.irohNodeId/resolveIrohNodeId
      feed, which createRequesterPDS never implemented and which the report replaces,
      must be removed rather than left as a second, dead path. The legacy FQDN path
      must keep working unchanged when the fedproxy-ssh or tunnel transport is selected,
      or when an explicit proxy command override is in use: those still resolve the
      transport target from the onNetwork/submitEvent event path.'
    codeRefs:
    - file:lib/requester-xrpc/mod.ts
    - function:04d27f9568ed8102cba9faf3289286bf
  - id: r.keypair-generation
    level: MUST
    text: generateKeypair produces an SSH keypair for the named VM and returns the
      public key alongside the path to the written private key, which the tunnel helpers
      then consume.
    codeRefs:
    - function:c0acf6b42c1d903a69ea183c1c2bcbd5
  - id: r.multi-relay-union
    level: MUST
    text: discoverBiddersFromRelays queries every URL in relayUrls in parallel and
      unions the per-relay results into a deduplicated DID list, so one relay's failure
      is non-blocking; an empty relayUrls list short-circuits to an empty array without
      issuing requests.
    codeRefs:
    - function:f0041abee4623b6562227c380bcc0688
  - id: r.oauth-requester
    level: SHOULD
    text: createOAuthRequester returns an OAuthRequesterHandle built from CreateOAuthRequesterOpts,
      applyOAuthAgentToRequesterPDS installs an OAuth agent onto a RequesterPDS so
      the PDS uses the agent's session user DID and can mint service-auth tokens for
      an audience, and getSession exposes the current session for that handle.
    codeRefs:
    - function:1d588c78426adb66e36d6f6c9bc27725
    - function:347b5c9a9248125a1552ad56b3dab154
    - function:a84b4248b2a1b4d058f0f82fb1177946
    - interface:1a4c39f163763de8ecaaec1559a031ee
    - interface:8b15050751370a6014f008aea65b779c
  - id: r.package-manifest
    level: MAY
    text: The module is published as a Deno package described by lib/requester-xrpc/deno.json,
      which declares the entrypoint and dependency imports for everything mod.ts re-exports.
    codeRefs:
    - file:lib/requester-xrpc/deno.json
    - file:lib/requester-xrpc/mod.ts
  - id: r.proxycommand-follows-transport-id
    level: MUST
    text: 'The dumbpipe-versus-websocat choice must follow the selected transport
      id itself, not a negative test against one legacy id: only the `iroh` transport
      dials the published ticket with `dumbpipe connect <ticket>` and needs the dumbpipe
      helper; the `tunnel` and `fedproxy-ssh` transports both keep the websocat ProxyCommand
      to the relay tunnel URL and need the websocat helper. A caller that selects
      `--user-data-transport tunnel` must get the legacy tunnel-subscriber guest and
      the websocat SSH path, not a dumbpipe connection to a relay FQDN, which can
      never succeed. The default ProxyCommand must therefore be derived from the transport
      id that ran and not from the shape of the target string (a ticket and a relay
      FQDN are told apart by the transport that produced them, never by a dot/colon
      heuristic).'
    codeRefs:
    - file:lib/requester-xrpc/mod.ts
  - id: r.relay-autodiscovery
    level: SHOULD
    text: autoDiscoverRelayUrls resolves the requester DID (falling back to the ATPROTO_DID
      environment variable when opts.atprotoDid is absent), finds that DID's PDS endpoint,
      lists all records in the relay NSID collection from that PDS, and returns the
      deduplicated http/https URLs found in each record's relays array; an unresolvable
      DID, a missing PDS endpoint, or any thrown error yields an empty array with
      a warning log.
    codeRefs:
    - function:23df2468906ae13b777112492d90b05b
  - id: r.relay-bidder-discovery
    level: MUST
    text: discoverBiddersFromRelay queries a single relay's com.atproto.sync.listReposByCollection
      endpoint for a collection with limit=1000, deduplicates the returned DIDs, and
      returns an empty array on non-OK HTTP responses or thrown errors, logging a
      warning rather than propagating the failure; an optional timeoutMs bounds the
      request via AbortSignal.timeout.
    codeRefs:
    - file:lib/requester-xrpc/mod.ts
    - function:0905a8668f646e545d2eee135b98e164
  - id: r.relay-visibility
    level: MUST
    text: verifyRelayVisibility first probes each relay for listReposByCollection
      support, counting a 200 as capable and classifying 404 as unsupported and any
      other status or thrown error as a failure, then reports which capable relays
      returned the collection index at all; a separate phase confirms the specific
      bidderDid appears in the collection, polling at pollIntervalMs up to pollTimeoutMs
      with defaults of 2000 ms and 15000 ms.
    codeRefs:
    - function:3ee0b1bf380922d6d7077efbdaa4bfd7
    - interface:b0fc591071d1c61b6e0c5a85ff0d4f55
  - id: r.repo-record-writes
    level: MUST
    text: createRepoRecord writes a record into the requester's repo under a collection
      and returns its uri and cid; createSignedRepoRecord does the same but signs
      the record with the supplied keypair, using the issuer when one is given.
    codeRefs:
    - function:21f56da2b9cdd75bc9ac81b308e61df1
    - function:93238be8f35c6ceb0813ef4aad574d5a
  - id: r.requester-pds-shape
    level: MUST
    text: createRequesterPDS builds a RequesterPDSImpl from the given PDSOptions,
      extending RequesterPDS with the concrete Hono app, the signer, the secp256k1
      keypair, and the repo API the rest of the flow uses to write records and mint
      service auth.
    codeRefs:
    - function:92de6dd67bbcc1e2f20d810f371b2b6b
    - interface:66b06e1611350a7f4fb4602342352a5f
  - id: r.session-execution
    level: MUST
    text: runSession executes the supplied program over the ssh tunnel identified
      by the private key path and the transport target and resolves with the program's
      exit code; before a session the flow must have ensured the transport's helper
      binary is available -- ensureDumbpipe under the default iroh transport, with
      ensureWebsocat retained only for the legacy websocat/fedproxy ProxyCommand.
    codeRefs:
    - function:9bf1f659af305ad4bb6e03b09e1aa7fe
    - function:a3fc9a3b85143dbaa434e269dd75cf0e
    - function:e5cbaf8edf9559cc75cdd46ffb76bf95
  - id: r.session-readiness
    level: MUST
    text: pollReady waits for a bidder at the given transport target to become reachable
      over its tunnel using the specified private key, giving up after timeoutMs and
      returning whether readiness was achieved rather than throwing.
    codeRefs:
    - function:92a8839f14ca40e1a2ba046f349d57b2
  - id: r.ssh-session-provider
    level: MUST
    text: createSshSessionProvider returns an SshSessionProvider for the session flow,
      accepting an optional logger and an optional proxyCommandFn so the caller can
      override how the proxy command is derived from a transport target.
    codeRefs:
    - function:d7ee9b90b3b5b576e4b8f500fe4f8cde
  - id: r.ssh-tunnel-helpers
    level: MUST
    text: tunnelWsUrl maps a bidder fqdn to the websocket URL the requester dials
      for the legacy relay transport, and sshTunnelArgs builds the argument list for
      an ssh session from a private key path, a transport target, and an optional
      proxy command override that replaces the default proxy command; under the default
      iroh transport the default ProxyCommand is built from the dumbpipe ticket instead
      of tunnelWsUrl.
    codeRefs:
    - function:784207610f82de1a689784e9deaf47e6
    - function:fe91374b53af51d927a4ed9843f4fb8e
