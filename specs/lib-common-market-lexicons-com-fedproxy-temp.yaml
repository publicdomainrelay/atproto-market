apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:lib/common/market-lexicons/com/fedproxy/temp/xrpc.ts xrpc.ts@lib/common/market-lexicons/com/fedproxy/temp/xrpc.ts
kind: SystemContext
metadata:
  name: lib-common-market-lexicons-com-fedproxy-temp
  namespace: default
spec:
  dependsOn:
  - sc.atproto-market
  intent: This context exists so the temporary fedproxy XRPC surface has one aggregation
    point. Rather than importing each generated method module by path, callers import
    the `temp/xrpc.ts` barrel and pick the namespace they need. It sits under the
    shared `lib/common/market-lexicons` tree alongside the other `com.fedproxy` lexicon
    outputs, and depends only on the sibling generated files it re-exports.
  repository: atproto-market
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc.ts
    id: r.generated-do-not-edit
    level: MUST
    text: The file is machine-generated by `@atproto/lex` and declares itself not
      to be edited. Its contents are a build artifact of the lexicon definitions,
      so hand edits are overwritten on regeneration and any change to the exported
      surface must originate from the lexicon source.
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc.ts
    id: r.reexport-xrpc-namespaces
    level: MUST
    text: 'The module re-exports exactly three generated XRPC namespaces as the public
      surface for the temporary fedproxy service: `registration` from `./xrpc/registration.ts`,
      `getRegistrationNonce` from `./xrpc/getRegistrationNonce.ts`, and `subscribe`
      from `./xrpc/subscribe.ts`. Each is exported as a namespace binding, so callers
      reach the method definitions through the namespace rather than as top-level
      module members.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp/xrpc.ts
    id: r.stable-import-path
    level: SHOULD
    text: The path `lib/common/market-lexicons/com/fedproxy/temp/xrpc.ts` remains
      the single import target for the temporary fedproxy XRPC methods, so downstream
      modules do not couple to the individual `./xrpc/<method>.ts` file layout inside
      the directory.
  upstream: self
