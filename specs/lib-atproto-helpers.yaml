    name: ATProto
    signature: 'interface ATProto { did: string; getAgentDid(): string; signer: {
      did(): string; sign(bytes: Uint8Array): Promise<Uint8Array> }; attestationKp:
      AttestationKeypair; idResolver: IdResolver; plcClient: PlcClient; applyWrites(did:
      string, writes: WriteOp[]): Promise<CommitEvent>; getRecord(did: string, collection:
      string, rkey: string): Promise<{ uri: string; cid: string; value: Record<string,
      unknown> } | null>; listRecords(did: string, collection: string, opts?: { limit?:
      number }): Promise<{ records: Array<{ uri: string; cid: string; value: Record<string,
      unknown> }> }>; createRecord(collection: string, record: Record<string, unknown>):
      Promise<StrongRef>; updateRecord(collection: string, rkey: string, record: Record<string,
      unknown>): Promise<StrongRef>; createRepoRecord(collection: string, record:
      Record<string, unknown>): Promise<{ uri: string; cid: string }>; createSignedRepoRecord(collection:
      string, record: Record<string, unknown>, issuer?: string): Promise<{ uri: string;
      cid: string; record: Record<string, unknown> }>; deleteRecord(collection: string,
      rkey: string): Promise<void>; callService(endpointUrl: string, nsid: string,
      lxm: string, body: Record<string, unknown>): Promise<{ status: number; ok: boolean;
      body: unknown }>; requestCrawl(relayUrl: string, hostname: string): Promise<void>;
      listReposByCollection(relayUrl: string, collection: string): Promise<string[]>;
      resolve: ReturnType<typeof createRecordResolver> }'
