apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-market-settlement-free
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  - sc.lib-abc-market
  - sc.lib-common-market-common
  - sc.lib-common-market-lexicons
  - sc.lib-market-atproto
  intent: 'This context exists to fix the contract of the free settlement path: the
    wire shape the client and server share, the record each side owns, and the error
    type that carries an HTTP status back to a transport handler. The client writes
    an accepts.free record naming the bid and its payload, encodes that record''s
    uri and cid into the grant url, and reads back a receipts.free strongRef; the
    server parses that same path back into the accepts pair, mints the receipts.free
    record, and later verifies a payment reference against a bidder DID, treating
    an absent payment as a free settlement rather than a failure. It is deliberately
    separable from paid settlement so the no-payment flow can be reasoned about, tested
    and deployed without the payment machinery, and so a Hono factory layer can mount
    it by calling only parseGrantPath, mintGrantForAccepts and verifyFreeGrant.'
  requirements:
  - id: r.client-injection-defaults
    level: MUST
    text: SettleFreeOptions must let a caller override the fetch implementation, the
      timeout and the logger, and when any of them is absent settleFreeGrant must
      fall back to the global fetch, a thirty-second timeout and a no-op logger, so
      the helper is exercisable without changing call sites.
    codeRefs:
    - function:ca138dba99fe7843a691d23448a3af85
    - interface:cdef64f67aa14f86753db2d82253c04c
  - id: r.egress-guard-before-write
    level: MUST
    text: settleFreeGrant must run the configured base url through the safe-egress
      assertion, passing along the optional egress options, before any record is written
      and before any request is issued, so a blocked scheme, cloud-metadata host or
      private host aborts the settlement instead of being dialed.
    codeRefs:
    - function:ca138dba99fe7843a691d23448a3af85
  - id: r.free-grant-error-status
    level: MUST
    text: FreeGrantError must extend Error, set its name to "FreeGrantError", and
      carry the HTTP status as a public readonly field, so a transport handler can
      read the status off a thrown rejection and map it to a response code instead
      of inferring one.
    codeRefs:
    - class:3827f797a6bd2d1108d56d2774b6518d
    - method:d2ca5a3b04fbbe08479f73baafeef096
  - id: r.grant-request-and-errors
    level: MUST
    text: settleFreeGrant must issue the grant request as a GET under an abort signal
      bounded by the timeout, must throw an error naming the response status and its
      body text when the response is not ok, and must throw when the decoded body
      lacks either a uri or a cid rather than returning a partial reference; on success
      it returns the endpoint's uri and cid as a strongRef.
    codeRefs:
    - function:ca138dba99fe7843a691d23448a3af85
  - id: r.grant-url-shape
    level: MUST
    text: settleFreeGrant must build the grant url by stripping trailing slashes from
      the base url and appending the accepts.free uri and the accepts.free cid as
      two further path segments, so one path carries both halves of the strongRef
      and the server-side parser can recover them from it.
    codeRefs:
    - function:ca138dba99fe7843a691d23448a3af85
  - id: r.mint-grant
    level: MUST
    text: mintGrantForAccepts must take the operator's agent, a record resolver, the
      accepts uri and cid, and a record signer, and return the strongRef of the receipts.free
      record it mints for that accepts, raising a FreeGrantError carrying the status
      when the referenced accepts, bid or payload cannot be resolved.
    codeRefs:
    - class:3827f797a6bd2d1108d56d2774b6518d
    - function:f40dd626ac80197332f89582a7964061
  - id: r.package-export-surface
    level: SHOULD
    text: lib/market-settlement-free/mod.ts is the package's single export surface,
      re-exporting the client and server halves so a consumer imports the settlement
      helpers from one path rather than reaching into the individual files.
    codeRefs:
    - file:lib/market-settlement-free/client.ts
    - file:lib/market-settlement-free/mod.ts
    - file:lib/market-settlement-free/server.ts
  - id: r.parse-grant-path
    level: MUST
    text: parseGrantPath must turn a request path into the accepts uri and cid pair
      the client encoded, honouring an optional prefix that is stripped before the
      two trailing segments are read, and must reject a path that does not carry exactly
      that pair by raising a FreeGrantError carrying the status.
    codeRefs:
    - class:3827f797a6bd2d1108d56d2774b6518d
    - function:c1a42b12e47d538ba4f2c4033a018daf
  - id: r.settle-creates-accepts-first
    level: MUST
    text: settleFreeGrant must write an accepts.free record into the caller's own
      repo, stamping it with the bid strongRef, the bid payload strongRef and a createdAt
      of the current time, and must take the uri and cid of that newly written record
      as the addresses it later hands the grant endpoint, so the operator can resolve
      the settlement terms from the record rather than from the request.
    codeRefs:
    - function:ca138dba99fe7843a691d23448a3af85
    - interface:cdef64f67aa14f86753db2d82253c04c
  - id: r.verify-free-grant
    level: MUST
    text: verifyFreeGrant must accept an optional payment strongRef, a resolver and
      a bidder DID, resolve the payment back to a receipts.free record and confirm
      that record belongs to the given bidder, and must treat an absent payment as
      a free settlement rather than an error, returning the resolved receipts.free
      record to the caller.
    codeRefs:
    - class:3827f797a6bd2d1108d56d2774b6518d
    - function:528e95e009f7f506a933ba541e0c4ed9
  interfaces:
  - name: FreeGrantError
    kind: class
    signature: class FreeGrantError extends Error
    file: lib/market-settlement-free/server.ts
  - name: FreeGrantError.constructor
    kind: method
    signature: 'constructor(public readonly status: number, message: string)'
    file: lib/market-settlement-free/server.ts
  - name: SettleFreeOptions
    kind: interface
    signature: 'interface SettleFreeOptions { agent: Agent; bid: StrongRef; bidPayload:
      StrongRef; url: string; egress?: EgressOptions; fetch?: typeof fetch; timeoutMs?:
      number; log?: Logger }'
    file: lib/market-settlement-free/client.ts
  - name: mintGrantForAccepts
    kind: function
    signature: 'mintGrantForAccepts(opts: { agent: Agent; resolve: RecordResolver;
      acceptsUri: string; acceptsCid: string; signer: RecordSigner }): Promise<StrongRef>'
    file: lib/market-settlement-free/server.ts
  - name: parseGrantPath
    kind: function
    signature: 'parseGrantPath(path: string, prefix = ""): { acceptsUri: string; acceptsCid:
      string }'
    file: lib/market-settlement-free/server.ts
  - name: settleFreeGrant
    kind: function
    signature: 'settleFreeGrant(opts: SettleFreeOptions): Promise<StrongRef>'
    file: lib/market-settlement-free/client.ts
  - name: verifyFreeGrant
    kind: function
    signature: 'verifyFreeGrant(opts: { payment: StrongRef | undefined; resolve: RecordResolver;
      bidderDid: string }): Promise<Resolved<ReceiptsFree>>'
    file: lib/market-settlement-free/server.ts
