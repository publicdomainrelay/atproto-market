apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-secrets-oidc
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  - sc.lib-common-secrets-common
  intent: 'This context exists to fix the authorization contract of the secrets OIDC
    package: how a single installed secrets grant turns an inbound bearer token into
    an AuthorizedRequest, which checks run in which order (grant present, token non-empty,
    audience precheck, signature verification, sub present, RBAC decision), how issuer
    signing keys are discovered and cached, and how key rotation is recovered without
    a restart. It is depended on by atproto-market and lib-common-secrets-common,
    and consumed by lib-hono-factory-secrets-oidc and lib-guest-capability-secrets,
    so its types and failure modes are the shared vocabulary for every secrets call
    that arrives with a JWT.'
  requirements:
  - id: r.audience-precheck
    level: MUST
    text: The token is decoded unverified first (jose.decodeJwt; a decode failure
      raises UnauthorizedException 'malformed token'), and the aud claim, treating
      an array aud as its first element, must equal the grant's expectedAud or the
      request is rejected with an audience mismatch before any key lookup or signature
      check.
    codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - interface:bf1e05cf2e07ed74d51e51e2e63afc40
  - id: r.grant-lifecycle
    level: MUST
    text: 'The authorizer holds at most one active SecretsGrant: install(grant) replaces
      whatever grant was stored, revoke() clears it back to null, and the readonly
      granted getter reports whether a grant is currently installed, so callers can
      serve 404s or fail closed without inspecting internals.'
    codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - interface:05b597fb30f58132a5be06a41f6fba0d
    - interface:bf1e05cf2e07ed74d51e51e2e63afc40
  - id: r.injected-fetch-and-tolerance
    level: MUST
    text: createSecretsAuthorizer takes CreateSecretsAuthorizerOpts where fetch defaults
      to globalThis.fetch and clockToleranceSec defaults to 5; every discovery and
      JWKS request goes through that injected fetch, so caller-patched transports
      such as local dispatchers and tests are not bypassed by jose's own remote JWKS
      fetching.
    codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - function:d7d076f635e975de9b23dac9be2ef9e7
    - interface:dc48a990f6ac35504ef07082ebff16e1
  - id: r.jwks-discovery-and-cache
    level: MUST
    text: getJwks resolves keys by fetching <issuerUri>/.well-known/openid-configuration
      from the trailing-slash-trimmed issuer, requiring a jwks_uri in the response
      ('published no jwks_uri' when absent), fetching that URI, and turning the document
      into a local key set via jose.createLocalJWKSet; the result is cached per issuer
      URI and returned from cache unless reload is true, and a non-OK discovery or
      JWKS response raises UnauthorizedException naming the URL and status.
    codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - function:d7d076f635e975de9b23dac9be2ef9e7
  - id: r.package-surface
    level: MUST
    text: The package @publicdomainrelay/secrets-oidc exports ./mod.ts and depends
      on jose (npm ^5) plus the jsr packages secrets-common, rbac-atproto and oidc-issuer-abc,
      so consumers get the authorizer types and factory from the single module entrypoint.
    codeRefs:
    - file:lib/secrets-oidc/deno.json
    - file:lib/secrets-oidc/mod.ts
  - id: r.rbac-decision
    level: MUST
    text: After verification the grant's rbac record, the verified token sub, the
      request path and the request method are passed to checkRBACPolicy, which decides
      whether the caller may perform the method on the path; a successful authorize
      returns AuthorizedRequest carrying that sub.
    codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - interface:05b597fb30f58132a5be06a41f6fba0d
    - interface:d3e1a8191afeaac9625fd120d563275c
  - id: r.reject-without-grant-or-token
    level: MUST
    text: authorize throws UnauthorizedException when no grant is installed ('no active
      secrets grant'), and throws UnauthorizedException when the token argument is
      empty ('missing bearer token'), both before any decoding, key lookup or signature
      check happens.
    codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - interface:05b597fb30f58132a5be06a41f6fba0d
  - id: r.rotation-retry
    level: MUST
    text: When verification fails specifically with jose.errors.JWKSNoMatchingKey,
      the authorizer reloads the issuer's JWKS exactly once (getJwks with reload true)
      and retries verification, so an issuer that rotated signing keys recovers without
      a restart; a failure of the retry is reported as UnauthorizedException.
    codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - function:d7d076f635e975de9b23dac9be2ef9e7
  - id: r.signature-verification
    level: MUST
    text: The token signature is verified with jose.jwtVerify against the grant's
      issuerUri as issuer and expectedAud as audience, using the configured clockTolerance;
      any failure other than a missing matching key is rethrown as UnauthorizedException
      'token verification failed'.
    codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - function:d7d076f635e975de9b23dac9be2ef9e7
    - interface:bf1e05cf2e07ed74d51e51e2e63afc40
  - id: r.sub-required
    level: MUST
    text: A verified payload whose sub claim is absent or is not a string is rejected
      with UnauthorizedException 'token has no sub', so every authorized request is
      attributable to a subject.
    codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - interface:d3e1a8191afeaac9625fd120d563275c
  interfaces:
  - name: AuthorizedRequest
    kind: interface
    signature: 'interface AuthorizedRequest { sub: string }'
    file: lib/secrets-oidc/mod.ts
  - name: CreateSecretsAuthorizerOpts
    kind: interface
    signature: 'interface CreateSecretsAuthorizerOpts { clockToleranceSec?: number;
      fetch?: typeof fetch }'
    file: lib/secrets-oidc/mod.ts
  - name: SecretsAuthorizer
    kind: interface
    signature: 'interface SecretsAuthorizer { install(grant: SecretsGrant): void;
      revoke(): void; readonly granted: boolean; authorize(token: string, path: string,
      method: string): Promise<AuthorizedRequest> }'
    file: lib/secrets-oidc/mod.ts
  - name: SecretsGrant
    kind: interface
    signature: 'interface SecretsGrant { rbac: RbacRecordShape; issuerUri: string;
      expectedAud: string }'
    file: lib/secrets-oidc/mod.ts
  - name: createSecretsAuthorizer
    kind: function
    signature: 'createSecretsAuthorizer(opts: CreateSecretsAuthorizerOpts = {}): SecretsAuthorizer'
    file: lib/secrets-oidc/mod.ts
  - name: getJwks
    kind: function
    signature: 'getJwks(issuerUri: string, reload = false): Promise<jose.JWTVerifyGetKey>'
    file: lib/secrets-oidc/mod.ts
codeRefIndex:
- file:lib/secrets-oidc/deno.json deno.json@lib/secrets-oidc/deno.json
- file:lib/secrets-oidc/mod.ts mod.ts@lib/secrets-oidc/mod.ts
