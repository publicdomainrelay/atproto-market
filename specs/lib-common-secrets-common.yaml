apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-common-secrets-common
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists to fix one authoritative spelling of the secrets wire
    format and of the secrets RBAC grant, so that the producer of a secrets file and
    the four consumers (lib-guest-capability-secrets, lib-hono-factory-secrets-oidc,
    lib-secrets-oidc, request-vm-ssh) cannot drift on the XRPC route, the OIDC scope,
    the RBAC record type or the record''s nested policy/role/protects shapes. It is
    a leaf-ward common-layer package: it depends only on the repository context, defines
    no behaviour beyond validation and record construction, and is depended on by
    every secrets-speaking package above it. Both entry points are deliberately pure
    so the parsing rules and the exact grant can be tested without a server, a file
    system or a network.'
  requirements:
  - id: r.exports-secrets-surface-constants
    level: MUST
    text: 'The module must export the constants that name the secrets surface: SECRETS_NSID
      as the XRPC namespace, SECRETS_ROUTE as the /xrpc/ route derived from that namespace,
      SECRETS_SCOPE as the OIDC scope, FEDPROXY_RBAC_NSID as the RBAC record type
      and DEFAULT_ACCEPT_PATH_VM as the guest VM accept path, so every consumer references
      one spelling instead of restating them.'
    codeRefs:
    - file:lib/common/secrets-common/mod.ts
  - id: r.exports-shapes
    level: MUST
    text: 'The module must export the shapes consumers build against: SecretEntry
      as a path/value pair of strings; SecretsRbacContext carrying the required role,
      subject, issuerUri, expectedAud and serviceUrl plus optional route and createdAt;
      and RbacRecordShape with its optional $type, protects and createdAt, its required
      policies and roles maps, and its RbacPolicyShape, RbacSchemaShape, RbacRoleShape
      and RbacProtectsShape sub-shapes.'
    codeRefs:
    - interface:1b0cf0f1cd64a3fb0c747b50f12fe6d0
    - interface:3a4058c69bc810fa3f1d318c05426b08
    - interface:7253e0f353e49b3a4e231426d24dc4ec
    - interface:9f03721d29e2b3898e0b29ad30cb348a
    - interface:b63e86d96de3a2cd62373c61fb39feb4
    - interface:ba32adcf332104a7ef22a672b35989fa
    - interface:fe7c741a681050cfb5430927cbdf4551
  - id: r.invalid-secrets-file-error
    level: MUST
    text: InvalidSecretsFileError must extend Error so callers and tests can tell
      a malformed secrets payload apart from any other failure, and every rejection
      raised while parsing a secrets file or serializing a non-string value must be
      an instance of this class.
    codeRefs:
    - class:d2916f8a4fa70fb60b7c6a8af50dc206
    - function:6f7a9521a0c32f2f991f030c6b149cdb
  - id: r.module-pure-no-io
    level: SHOULD
    text: The module should stay free of dependencies and of I/O, with both exported
      functions computing from their arguments and returning plain values, leaving
      the publishing of the RBAC record and the writing of secrets to the callers
      that own a server or a file system.
    codeRefs:
    - function:6f7a9521a0c32f2f991f030c6b149cdb
    - function:bbd14d354b9d1c3aae2765a9447d1c79
  - id: r.parse-secrets-file-rejects-duplicate-paths
    level: MUST
    text: parseSecretsFile must record accepted paths in a set and throw InvalidSecretsFileError
      on a path already seen, after the value has been serialized, so a duplicate
      cannot silently overwrite or shadow an earlier secret.
    codeRefs:
    - function:6f7a9521a0c32f2f991f030c6b149cdb
  - id: r.parse-secrets-file-stringifies-values
    level: MUST
    text: A string value must pass through unchanged, while any other JSON value is
      serialized by the module-local stringifyValue helper, which raises InvalidSecretsFileError
      naming the element index when JSON.stringify yields undefined or throws, so
      an object, array, number, boolean or null becomes its JSON text and an un-serializable
      value is rejected rather than dropped.
    codeRefs:
    - function:6f7a9521a0c32f2f991f030c6b149cdb
    - interface:1b0cf0f1cd64a3fb0c747b50f12fe6d0
  - id: r.parse-secrets-file-validates-entries
    level: MUST
    text: For each element of the parsed array, parseSecretsFile must throw InvalidSecretsFileError
      naming the element index when the element is falsy or not an object, when path
      is absent or not a non-empty string, when path does not start with a slash,
      or when any slash-separated segment of path equals two dots; otherwise it returns
      SecretEntry values carrying path and value as strings, in input order.
    codeRefs:
    - function:6f7a9521a0c32f2f991f030c6b149cdb
    - interface:1b0cf0f1cd64a3fb0c747b50f12fe6d0
  - id: r.parse-secrets-file-validates-json
    level: MUST
    text: parseSecretsFile must JSON.parse the payload and throw InvalidSecretsFileError,
      quoting the underlying parse failure, when the text is not valid JSON, and must
      throw InvalidSecretsFileError when the parsed value is not an array, so a malformed
      file never yields partial or empty entries.
    codeRefs:
    - class:d2916f8a4fa70fb60b7c6a8af50dc206
    - function:6f7a9521a0c32f2f991f030c6b149cdb
  - id: r.rbac-record-defaults
    level: MUST
    text: buildSecretsRbacRecord must fall back to SECRETS_ROUTE when SecretsRbacContext.route
      is omitted and to the current time as an ISO string when createdAt is omitted,
      so a caller may supply only role, subject, issuerUri, expectedAud and serviceUrl.
    codeRefs:
    - function:bbd14d354b9d1c3aae2765a9447d1c79
    - interface:7253e0f353e49b3a4e231426d24dc4ec
  - id: r.rbac-record-grants-one-capability
    level: MUST
    text: 'buildSecretsRbacRecord must grant exactly one capability, read: the policy
      is named role plus the suffix -secrets-read and carries meta policy secrets-read,
      its single schema is keyed by the resolved route and enum-constrains capability
      to the one string read, the roles map is keyed by the role with role_name equal
      to that key and a definition binding iss to issuerUri, aud to expectedAud, sub
      to subject and policies to that one policy name, and the protects map maps the
      role to RbacProtectsShape of serviceUrl plus SECRETS_SCOPE.'
    codeRefs:
    - function:bbd14d354b9d1c3aae2765a9447d1c79
    - interface:3a4058c69bc810fa3f1d318c05426b08
    - interface:7253e0f353e49b3a4e231426d24dc4ec
    - interface:9f03721d29e2b3898e0b29ad30cb348a
  - id: r.rbac-record-shape
    level: MUST
    text: buildSecretsRbacRecord must return a plain RbacRecordShape whose $type is
      FEDPROXY_RBAC_NSID, whose policies map holds RbacPolicyShape values of meta
      plus schemas keyed by route, whose roles map holds RbacRoleShape values of role_name
      plus a definition carrying iss, aud, sub and policies, and whose protects map
      holds RbacProtectsShape values of service plus optional scope, with each policy
      schema exposing a capability property whose enum lists the allowed capability
      strings.
    codeRefs:
    - function:bbd14d354b9d1c3aae2765a9447d1c79
    - interface:3a4058c69bc810fa3f1d318c05426b08
    - interface:9f03721d29e2b3898e0b29ad30cb348a
    - interface:b63e86d96de3a2cd62373c61fb39feb4
    - interface:ba32adcf332104a7ef22a672b35989fa
    - interface:fe7c741a681050cfb5430927cbdf4551
