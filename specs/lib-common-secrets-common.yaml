apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-common-secrets-common
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: This context exists so the guest secrets capability and the Hono secrets
    factory share one definition of what a secrets file and a secrets RBAC record
    look like, instead of each re-declaring the shapes and re-implementing the validation.
    It sits in lib/common because both consumers import it, it depends on nothing
    outside itself, and it owns the parsing and record-building logic that must stay
    consistent across every consumer of the secrets route.
  requirements:
  - id: r.exports-secrets-surface-constants
    level: MUST
    text: 'The module must export the constants that name the secrets surface: SECRETS_NSID
      (com.publicdomainrelay.temp.compute.secrets), SECRETS_ROUTE (the /xrpc/...getSecrets
      path built from SECRETS_NSID), SECRETS_SCOPE ("secrets"), FEDPROXY_RBAC_NSID
      (com.fedproxy.rbac) and DEFAULT_ACCEPT_PATH_VM, so consumers reference one spelling
      of the route, scope and RBAC type.'
    codeRefs:
    - file:lib/common/secrets-common/mod.ts
  - id: r.invalid-secrets-file-error
    level: MUST
    text: InvalidSecretsFileError must extend Error so callers and tests can distinguish
      a bad secrets payload from any other failure.
    codeRefs:
    - class:d2916f8a4fa70fb60b7c6a8af50dc206
  - id: r.parse-secrets-file-rejects-duplicates
    level: MUST
    text: parseSecretsFile must track seen paths in a Set and throw InvalidSecretsFileError
      when the same path appears twice, so a duplicate cannot silently overwrite an
      earlier secret.
    codeRefs:
    - function:6f7a9521a0c32f2f991f030c6b149cdb
  - id: r.parse-secrets-file-stringifies-values
    level: MUST
    text: A string value passes through unchanged; any other JSON value (object, array,
      number, boolean, null) is serialized with JSON.stringify via stringifyValue,
      and a value JSON.stringify returns undefined for must raise InvalidSecretsFileError.
    codeRefs:
    - function:6f7a9521a0c32f2f991f030c6b149cdb
  - id: r.parse-secrets-file-validates-entries
    level: MUST
    text: For each array element, parseSecretsFile must throw InvalidSecretsFileError
      naming the index when the element is not an object, when path is missing, not
      a string or empty, when path is not absolute, or when any path segment is "..";
      it returns SecretEntry objects with path and value strings, in input order.
    codeRefs:
    - function:6f7a9521a0c32f2f991f030c6b149cdb
    - interface:1b0cf0f1cd64a3fb0c747b50f12fe6d0
  - id: r.parse-secrets-file-validates-json
    level: MUST
    text: parseSecretsFile must JSON.parse the payload and throw InvalidSecretsFileError
      when the text is not valid JSON or when the parsed value is not an array, so
      a malformed file never yields partial entries.
    codeRefs:
    - class:d2916f8a4fa70fb60b7c6a8af50dc206
    - function:6f7a9521a0c32f2f991f030c6b149cdb
  - id: r.rbac-record-defaults
    level: MUST
    text: buildSecretsRbacRecord must default the route to SECRETS_ROUTE when SecretsRbacContext.route
      is absent and the timestamp to new Date().toISOString() when createdAt is absent,
      so callers may omit both.
    codeRefs:
    - function:bbd14d354b9d1c3aae2765a9447d1c79
    - interface:7253e0f353e49b3a4e231426d24dc4ec
  - id: r.rbac-record-grants-one-capability
    level: MUST
    text: 'buildSecretsRbacRecord must produce an RbacRecordShape whose $type is FEDPROXY_RBAC_NSID
      and that grants exactly one capability: a policies entry named `${role}-secrets-read`
      whose schema for the route requires a capability property enum-constrained to
      ["read"], a roles entry keyed by the role binding iss=issuerUri, aud=expectedAud,
      sub=subject to that policy, and a protects entry keyed by the role mapping it
      to serviceUrl under SECRETS_SCOPE.'
    codeRefs:
    - function:bbd14d354b9d1c3aae2765a9447d1c79
    - interface:3a4058c69bc810fa3f1d318c05426b08
    - interface:9f03721d29e2b3898e0b29ad30cb348a
    - interface:b63e86d96de3a2cd62373c61fb39feb4
    - interface:ba32adcf332104a7ef22a672b35989fa
    - interface:fe7c741a681050cfb5430927cbdf4551
  - id: r.rbac-record-not-published
    level: MUST
    text: The record built by buildSecretsRbacRecord is never published; the ephemeral
      server holds it in memory and evaluates it with the shared checkRBACPolicy,
      so the function must return a plain value and perform no I/O.
    codeRefs:
    - function:bbd14d354b9d1c3aae2765a9447d1c79
  interfaces:
  - name: InvalidSecretsFileError
    kind: class
    signature: class InvalidSecretsFileError extends Error
    file: lib/common/secrets-common/mod.ts
  - name: RbacPolicyShape
    kind: interface
    signature: 'interface RbacPolicyShape { meta: Record<string, string>; schemas:
      Record<string, RbacSchemaShape> }'
    file: lib/common/secrets-common/mod.ts
  - name: RbacProtectsShape
    kind: interface
    signature: 'interface RbacProtectsShape { service: string; scope?: string }'
    file: lib/common/secrets-common/mod.ts
  - name: RbacRecordShape
    kind: interface
    signature: 'interface RbacRecordShape { $type?: string; protects?: Record<string,
      RbacProtectsShape>; policies: Record<string, RbacPolicyShape>; roles: Record<string,
      RbacRoleShape>; createdAt?: string }'
    file: lib/common/secrets-common/mod.ts
  - name: RbacRoleShape
    kind: interface
    signature: 'interface RbacRoleShape { role_name: string; definition: { iss?: string;
      aud?: string; sub: string; policies: string[] } }'
    file: lib/common/secrets-common/mod.ts
  - name: RbacSchemaShape
    kind: interface
    signature: 'interface RbacSchemaShape { type?: string; $schema?: string; required?:
      string[]; properties: { capability: { enum: string[] } } }'
    file: lib/common/secrets-common/mod.ts
  - name: SecretEntry
    kind: interface
    signature: 'interface SecretEntry { path: string; value: string }'
    file: lib/common/secrets-common/mod.ts
  - name: SecretsRbacContext
    kind: interface
    signature: 'interface SecretsRbacContext { role: string; subject: string; issuerUri:
      string; expectedAud: string; serviceUrl: string; route?: string; createdAt?:
      string }'
    file: lib/common/secrets-common/mod.ts
  - name: buildSecretsRbacRecord
    kind: function
    signature: 'function buildSecretsRbacRecord(ctx: SecretsRbacContext): RbacRecordShape'
    file: lib/common/secrets-common/mod.ts
  - name: parseSecretsFile
    kind: function
    signature: 'function parseSecretsFile(text: string): SecretEntry[]'
    file: lib/common/secrets-common/mod.ts
codeRefIndex:
- file:lib/common/secrets-common/mod.ts mod.ts@lib/common/secrets-common/mod.ts
