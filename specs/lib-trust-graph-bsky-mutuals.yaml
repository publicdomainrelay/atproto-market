apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-trust-graph-bsky-mutuals
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  - sc.lib-abc-trust-graph
  intent: 'This context exists to pin down the one adapter that lets the trust graph
    read its vouch signal out of Bluesky''s social graph instead of from a bespoke
    trust store: it fixes the shape of the injection point (BskyMutualsVouchResolverOpts)
    and the exact semantics of the two VouchResolver methods the factory returns.
    It is written so the module can be reimplemented or audited without reading the
    Bluesky client behind getFollows, and so the fail-soft contract is explicit --
    a follow source that is slow, rate-limited or down must degrade to "no vouch"
    rather than abort trust evaluation, with a per-actor warn log as the only evidence
    left behind.'
  requirements:
  - id: r.conform-to-vouch-resolver
    level: MUST
    text: The object returned by createBskyMutualsVouchResolver must satisfy the VouchResolver
      contract from lib/abc/trust-graph/mod.ts, so the module remains a drop-in implementation
      and callers depend only on that abstraction rather than on this package.
    codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
  - id: r.export-factory-and-opts
    level: MUST
    text: The module must export createBskyMutualsVouchResolver, a factory taking
      a BskyMutualsVouchResolverOpts argument and returning a resolver exposing getVouchedDids
      and isVouched, so callers can plug a Bluesky follow graph into the trust graph
      without depending on a concrete Bluesky client.
    codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
    - interface:db90b579bdaef85c0398478a8d9c2578
  - id: r.fail-soft-on-lookup-error
    level: MUST
    text: 'A rejected getFollows must never propagate out of the resolver: getVouchedDids
      must catch it and return a new empty Set, and isVouched must catch it and return
      false, so an unreachable follow source degrades to no-vouch instead of failing
      the trust evaluation that called in.'
    codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
  - id: r.is-vouched-membership
    level: MUST
    text: isVouched(voucher, vouchee) must await getFollows(voucher) and report whether
      the resulting Set has vouchee, so a vouch holds exactly when the voucher follows
      the vouchee.
    codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
  - id: r.log-optional-noop-default
    level: MUST
    text: When opts.log is nullish the factory must substitute a no-op logger, so
      logging is never required of the caller and the warn call can never throw, while
      a supplied log is invoked directly with (level, msg, meta).
    codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
    - interface:db90b579bdaef85c0398478a8d9c2578
  - id: r.opts-get-follows-required
    level: MUST
    text: 'BskyMutualsVouchResolverOpts must require getFollows(actor: string): Promise<Set<string>>
      as the sole source of vouch data and must accept an optional log(level: string,
      msg: string, meta?: Record<string, unknown>): void; the factory destructures
      getFollows and log out of its options argument, so no other configuration is
      needed.'
    codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
    - interface:db90b579bdaef85c0398478a8d9c2578
  - id: r.package-manifest
    level: MAY
    text: The package may carry a lib/trust-graph-bsky-mutuals/deno.json manifest
      declaring its module metadata for Deno tooling; the code index does not treat
      that file as source, so it must not be relied on to export the adapter.
    codeRefs:
    - file:lib/trust-graph-bsky-mutuals/deno.json
  - id: r.vouched-dids-are-follows
    level: MUST
    text: getVouchedDids(did) must await getFollows(did) and return that follow Set
      unchanged, treating an actor's follow set as exactly the set of DIDs that actor
      vouches for, so no filtering, mapping or re-wrapping of the set happens at this
      boundary.
    codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
  - id: r.warn-log-on-error
    level: MUST
    text: On a caught lookup error the resolver must log level "warn" with the message
      "bsky-mutuals follow lookup failed" and metadata carrying the looked-up DID
      under key did (the did argument in getVouchedDids, the voucher argument in isVouched)
      plus the error stringified with String(err) under key error, so failures are
      diagnosable per actor.
    codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
  interfaces:
  - name: BskyMutualsVouchResolverOpts
    kind: interface
    signature: 'interface BskyMutualsVouchResolverOpts { getFollows(actor: string):
      Promise<Set<string>>; log?(level: string, msg: string, meta?: Record<string,
      unknown>): void }'
    file: lib/trust-graph-bsky-mutuals/mod.ts
  - name: createBskyMutualsVouchResolver
    kind: function
    signature: '(opts: BskyMutualsVouchResolverOpts): VouchResolver'
    file: lib/trust-graph-bsky-mutuals/mod.ts
codeRefIndex:
- file:lib/trust-graph-bsky-mutuals/deno.json deno.json@lib/trust-graph-bsky-mutuals/deno.json
- file:lib/trust-graph-bsky-mutuals/mod.ts mod.ts@lib/trust-graph-bsky-mutuals/mod.ts
- function:34fc226f1ebe43b6ca206f58c9e43a2f createBskyMutualsVouchResolver@lib/trust-graph-bsky-mutuals/mod.ts:8
- interface:db90b579bdaef85c0398478a8d9c2578 BskyMutualsVouchResolverOpts@lib/trust-graph-bsky-mutuals/mod.ts:3
