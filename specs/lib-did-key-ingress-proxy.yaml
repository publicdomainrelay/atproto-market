apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-did-key-ingress-proxy
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists so a local XRPC app can be reached from outside without
    owning a routable address: createIngress bundles subscriber registration, per-method
    service-auth minting, WebSocket target resolution and shutdown behind one IngressRef,
    letting a dispatcher publish an ingress identity on an ingress proxy host and
    hand inbound relay requests back into its own fetch handler. The options record
    keeps the two signing identities separable and leaves TLS, the lazily resolved
    loopback target and the in-process direct subscription handler as opt-in knobs,
    so the same factory serves a TLS-terminated public dispatcher and a test process
    with an in-memory firehose source.'
  requirements:
  - id: r.close-idempotent-before-serve
    level: MUST
    text: close() must forward to the stored subscriber's close() when registration
      has happened and be a no-op when onServe never ran or never completed, so a
      relay that was constructed but never served tears down without error.
    codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
  - id: r.create-ingress-factory
    level: MUST
    text: 'createIngress(opts) must build and return an IngressRef from a CreateIngressOpts
      value: it destructures logger, ingressProxyHost, signer and keypair, resolves
      the subscriber label from opts.label, and holds the active subscriber in a closure
      variable initialized to null so one object carries both registration and shutdown
      for the lifetime of the relay.'
    codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
  - id: r.direct-subscription-handler
    level: SHOULD
    text: When directSubscriptionHandler is supplied it must be forwarded so that
      inbound relay subscriptions for non-tunnel NSIDs are dispatched to it with the
      subscriptionId, nsid, params, an onEvent callback and an onData callback instead
      of opening a loopback WebSocket to localWsTarget; a function returned by that
      handler is the unsubscribe handle, so an in-process firehose source needs no
      TCP listener.
    codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
  - id: r.ingress-ref-projection
    level: MUST
    text: The returned relay must expose ingressRef as a mutable string that starts
      empty and is assigned from the subscriber handle only after registration succeeds;
      the ingressUrl getter must return the empty string while ingressRef is falsy
      and otherwise "https://" concatenated with ingressRef minus its leading "did:web:"
      prefix, and the ingressHost getter must return ingressRef with that same prefix
      stripped when present and ingressRef unchanged when it is not.
    codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
  - id: r.label-default
    level: MUST
    text: The subscriber label must resolve to the literal string "bidder" when opts.label
      is absent and otherwise to opts.label verbatim, and that resolved value must
      be the label passed to createSubscriber during onServe.
    codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
  - id: r.lazy-ws-target
    level: SHOULD
    text: localWsTarget must stay an optional thunk forwarded to createSubscriber
      as wsTarget and read at subscription time rather than at createIngress time,
      because the local serve's TCP port is assigned only once it starts listening;
      the hostname and port it returns are the loopback target for inbound relay WebSocket
      subscriptions such as com.atproto.sync.subscribeRepos forwarded from a crawling
      relay.
    codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
  - id: r.on-serve-registration
    level: MUST
    text: onServe(fetch) must wrap the caller's fetch with createSubscriberFactory
      to obtain handleRequest, then log "xrpc-relay connecting" with the ingressProxyHost,
      then await createSubscriber with the resolved label, keypair, the local getServiceAuthToken
      closure, ingressProxyHost, opts.tls, handleRequest, opts.localWsTarget as wsTarget
      and opts.directSubscriptionHandler; after it resolves it must assign relay.ingressRef
      from the handle, store the handle as the active subscriber, and log "xrpc-relay
      registered" with the handle's subdomain and ingressRef.
    codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
  - id: r.service-auth-token
    level: MUST
    text: getServiceAuthToken(lxm) must derive the audience by passing ingressProxyHost
      through hostnameToDid and return the service-auth JWT produced by signServiceAuth
      over the injected signer with that audience and the requested lexicon NSID,
      so every inbound subscription handled on the caller's behalf is authenticated
      against the specific method being called.
    codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:720938c17d8a919da0fa9510c65cc8d1
    - function:ab0d43e74646836bd86d4b393d2cafa0
  - id: r.signing-identities-separable
    level: MUST
    text: 'CreateIngressOpts must carry two distinct signing identities: signer, whose
      did() and sign(bytes) are used only inside getServiceAuthToken to mint tokens
      for the proxy audience, and keypair, whose did() and sign(data) identify the
      relay subscriber registration handed to createSubscriber, so the service-auth
      identity and the registered subscriber identity stay separately controlled.'
    codeRefs:
    - function:720938c17d8a919da0fa9510c65cc8d1
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
  - id: r.tls-flag-forwarded
    level: SHOULD
    text: opts.tls must be forwarded unchanged to createSubscriber and stay optional,
      so a dispatcher serving TLS (self-signed, trusted via DENO_CERT) causes the
      subscriber to address the proxy over https/wss even for localhost or hosts carrying
      a port, while a plaintext dispatcher needs no setting.
    codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
  - id: r.unused-hostname-binding
    level: MAY
    text: onServe may compute hostnameOnly(ingressProxyHost) into a local binding;
      as written that binding is never read, so it carries no behaviour and may be
      removed without changing registration.
    codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
  interfaces:
  - name: CreateIngressOpts
    kind: interface
    signature: 'interface CreateIngressOpts { logger: StructuredLoggerInterface; ingressProxyHost:
      string; signer: { did(): string; sign(bytes: Uint8Array): Promise<Uint8Array>
      }; keypair: { did(): string; sign(data: Uint8Array): Promise<Uint8Array> };
      label?: string; tls?: boolean; localWsTarget?: () => { hostname: string; port:
      number } | undefined; directSubscriptionHandler?: (subscriptionId: string, nsid:
      string, params: Record<string, string>, onEvent: (event: unknown) => void, onData:
      (data: Uint8Array) => void) => (() => void) | void }'
    file: lib/did-key-ingress-proxy/mod.ts
  - name: createIngress
    kind: function
    signature: 'createIngress(opts: CreateIngressOpts): IngressRef'
    file: lib/did-key-ingress-proxy/mod.ts
  - name: getServiceAuthToken
    kind: function
    signature: 'getServiceAuthToken(lxm: string): Promise<string>'
    file: lib/did-key-ingress-proxy/mod.ts
codeRefIndex:
- file:lib/did-key-ingress-proxy/mod.ts mod.ts@lib/did-key-ingress-proxy/mod.ts
- function:720938c17d8a919da0fa9510c65cc8d1 getServiceAuthToken@lib/did-key-ingress-proxy/mod.ts:51
- function:ab0d43e74646836bd86d4b393d2cafa0 createIngress@lib/did-key-ingress-proxy/mod.ts:38
- interface:da388f002919a2fd08b59e8f65646870 CreateIngressOpts@lib/did-key-ingress-proxy/mod.ts:8
