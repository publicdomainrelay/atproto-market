apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:lib/common/market-lexicons/com/fedproxy/rbac.defs.ts rbac.defs.ts@lib/common/market-lexicons/com/fedproxy/rbac.defs.ts
- file:lib/common/market-lexicons/com/fedproxy/rbac.ts rbac.ts@lib/common/market-lexicons/com/fedproxy/rbac.ts
- file:lib/common/market-lexicons/com/fedproxy/sshPublicKey.defs.ts sshPublicKey.defs.ts@lib/common/market-lexicons/com/fedproxy/sshPublicKey.defs.ts
- file:lib/common/market-lexicons/com/fedproxy/sshPublicKey.ts sshPublicKey.ts@lib/common/market-lexicons/com/fedproxy/sshPublicKey.ts
- file:lib/common/market-lexicons/com/fedproxy/temp.ts temp.ts@lib/common/market-lexicons/com/fedproxy/temp.ts
kind: SystemContext
metadata:
  name: lib-common-market-lexicons-com-fedproxy
  namespace: default
spec:
  dependsOn:
  - sc.atproto-market
  intent: 'This context exists so the fedproxy tunnel and relay protocol has first-class,
    typed lexicon bindings inside the shared market-lexicons library rather than ad-hoc
    JSON. The two records let a requester publish an RBAC policy and register SSH
    public keys for a named fedproxy service, and the `temp.ts` namespace exposes
    the XRPC handshake (`getRegistrationNonce`, `registration`, `subscribe`) used
    to bind a subscriber''s did:key to a relay channel. It is a leaf, self-contained
    export surface: it depends only on `@atproto/lex` and the attested-signature defs,
    and other packages import it rather than redefining the schemas.'
  repository: atproto-market
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/rbac.defs.ts
    - file:lib/common/market-lexicons/com/fedproxy/sshPublicKey.defs.ts
    - file:lib/common/market-lexicons/com/fedproxy/temp.ts
    id: r.generated-not-hand-edited
    level: MUST
    text: Every file in the module is marked as generated by `@atproto/lex` with a
      do-not-edit header, so schema changes must come from regeneration of the lexicons
      rather than direct edits to these files.
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/rbac.ts
    - file:lib/common/market-lexicons/com/fedproxy/sshPublicKey.ts
    id: r.generated-sidecar-reexports
    level: MUST
    text: Each record ships a sidecar module that re-exports everything from its `.defs`
      file and re-exports the defs' `main` as the module default, so `import rbac
      from './rbac.ts'` and `import sshPublicKey from './sshPublicKey.ts'` both yield
      the record validator.
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/rbac.defs.ts
    id: r.rbac-record-shape
    level: MUST
    text: The module defines a `com.fedproxy.rbac` record with NSID `com.fedproxy.rbac`,
      keyed by `tid`, whose shape requires `roles` and `policies` LexMaps, an optional
      `custom_claims_roles_index` LexMap, and a required `createdAt` datetime string;
      `roles` maps role names to definitions carrying OIDC claim constraints (aud,
      iss, sub) and a policy name, and `policies` maps policy names to JSON Schema
      constraints over `com.atproto.repo.createRecord` for `com.fedproxy.sshPublicKey`.
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/rbac.defs.ts
    - file:lib/common/market-lexicons/com/fedproxy/sshPublicKey.defs.ts
    id: r.record-validator-surface
    level: SHOULD
    text: Each defs module exposes the generated validation surface alongside the
      record's `$type`/`$nsid` — `$isTypeOf`, `$build`, `$assert`, `$check`, `$cast`,
      `$ifMatches`, `$matches`, `$parse`, `$safeParse`, `$validate`, and `$safeValidate`
      — so callers can assert, cast, parse, or safely validate the record without
      re-implementing checks.
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/rbac.defs.ts
    - file:lib/common/market-lexicons/com/fedproxy/sshPublicKey.defs.ts
    id: r.roles-authorize-key-registration
    level: SHOULD
    text: 'The RBAC record''s roles/policies split must be usable to authorize a `com.atproto.repo.createRecord`
      of a `com.fedproxy.sshPublicKey`: a role identifies holders through OIDC token
      claims and references a policy, and that policy constrains which sshPublicKey
      records the holder may write.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/sshPublicKey.defs.ts
    id: r.ssh-public-key-record-shape
    level: MUST
    text: The module defines a `com.fedproxy.sshPublicKey` record with NSID `com.fedproxy.sshPublicKey`,
      keyed by `tid`, requiring `service` (the fedproxy service name, e.g. attest
      or compute, which must match a service configured on the fedproxy host), `publicKey`
      (an SSH public key in OpenSSH authorized_keys format, e.g. `ssh-ed25519 AAAA...`),
      and `createdAt` as a datetime string.
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy/temp.ts
    id: r.temp-xrpc-namespace
    level: MUST
    text: '`temp.ts` re-exports the XRPC surface as a single `xrpc` namespace aggregating
      `registration`, `getRegistrationNonce`, and `subscribe`, so a caller reaches
      the whole relay handshake through one import path instead of importing the per-service
      defs files directly.'
  upstream: self
