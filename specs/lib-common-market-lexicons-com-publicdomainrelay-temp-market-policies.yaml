kind: SystemContext
metadata:
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-market-policies
  namespace: default
spec:
  dependsOn:
  - sc.atproto-market
  intent: These modules exist so the market's fulfillment policies can be expressed
    as interoperable, signed ATProto records that travel downstream through subcontracting
    chains, rather than as ad-hoc JSON understood only by one evaluator. Three evaluation
    strategies are given distinct lexicons so a consumer can tell, from the record
    type alone, whether policy logic is first-party (builtin), third-party bundle
    code requiring an explicit trust decision (denoWorker), or hosted by a remote
    engine (service). The generated files fix the wire shape, NSIDs, and validation
    surface that producers and evaluators code against; the doc comments record the
    security posture each type implies.
  repository: atproto-market
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/builtin.defs.ts
    id: r.builtin-record-shape
    level: MUST
    text: The builtin module defines a `tid`-keyed record at NSID `com.publicdomainrelay.temp.market.policies.builtin`
      whose `Main` carries a required `policies` array of `policySpec` refs (all must
      allow), a required `requesterDid` string naming the root requester the set was
      minted for, a required `createdAt` datetime, and an optional `signatures` ref;
      `$type` is the literal NSID and the record validator is built with `l.record<'tid',
      Main>`.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/builtin.defs.ts
    id: r.builtin-sandbox-posture
    level: SHOULD
    text: A builtin policy set is evaluated by pre-defined first-party policies named
      in the evaluator's registry, executed in an in-process Deno worker sandbox with
      no permissions, with all record resolution brokered by the host.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/denoWorker.defs.ts
    id: r.deno-worker-record-shape
    level: MUST
    text: The denoWorker module defines a `tid`-keyed record at NSID `com.publicdomainrelay.temp.market.policies.denoWorker`
      whose `Main` adds a required `manifest` `strongRef` to a `com.publicdomainrelay.temp.compute.deno.workerManifest`
      holding the bundled policy code and an optional `permissions` LexMap (net, read,
      write, env, run, ffi, sys, import) applied on top of a default deny-all posture,
      alongside the same `policies`, `requesterDid`, `createdAt` and optional `signatures`
      fields.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/builtin.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/denoWorker.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/service.defs.ts
    id: r.generated-files-not-edited
    level: MUST
    text: Every `.defs.ts` file is generated by `@atproto/lex` and marked DO NOT EDIT,
      so changes to record shape must be made by regenerating from the lexicon source
      rather than by hand-editing these files.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/builtin.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/builtin.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/denoWorker.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/denoWorker.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/service.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/service.ts
    id: r.module-export-surface
    level: MUST
    text: Each `.defs.ts` module exports the `$nsid` string, the `Main` and `PolicySpec`
      types, the `main` record validator and `policySpec` typedObject, and the full
      validator helper surface bound to the record — `$type` (the NSID), `$isTypeOf`,
      `$build`, `$assert`, `$check`, `$cast`, `$ifMatches`, `$matches`, `$parse`,
      `$safeParse`, `$validate` and `$safeValidate` — while the sibling wrapper `.ts`
      re-exports everything from its `.defs.ts` (`export * from`) and additionally
      re-exports `main` as the module default.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/builtin.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/denoWorker.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/service.defs.ts
    id: r.policy-spec-definition
    level: MUST
    text: 'Each of the three modules declares its own nested `policySpec` typedObject
      scoped to that module''s NSID, requiring a `name` string and taking an optional
      human-readable `description` plus an optional `args` LexMap whose well-known
      keys are `bidWindowSec` and `firstFree`; the three `name` fields differ in meaning:
      builtin looks the name up in the evaluator''s registry, denoWorker treats it
      as a label for code that comes from the manifest rather than a registry lookup,
      and service passes it to the engine, which resolves it against the same registry
      used for local execution.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/service.defs.ts
    id: r.service-evaluation-call
    level: SHOULD
    text: A service policy set is evaluated by the evaluator signing a service-auth
      JWT and calling `com.publicdomainrelay.temp.market.evaluatePolicy` on the engine
      named by `policyEngine`, passing each policy name and its arguments.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/service.defs.ts
    id: r.service-record-shape
    level: MUST
    text: The service module defines a `tid`-keyed record at NSID `com.publicdomainrelay.temp.market.policies.service`
      whose `Main` adds a required `policyEngine` string holding the DID of the remote
      policy engine, alongside the same `policies`, `requesterDid`, `createdAt` and
      optional `signatures` fields.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/builtin.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/denoWorker.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/service.defs.ts
    id: r.shared-cross-lexicon-refs
    level: MUST
    text: All three modules import the attested network's `signature.defs.ts` so the
      optional `signatures` field is a `Signatures` ref (badge.blue attestations over
      the policy), and denoWorker additionally imports `atproto/repo/strongRef.defs.ts`
      so `manifest` is a `RepoStrongRef.Main` ref.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/policies/denoWorker.defs.ts
    id: r.untrusted-bundle-refusal
    level: MUST
    text: A denoWorker policy set is untrusted third-party code, so an evaluator must
      refuse to run it unless it has been explicitly configured to allow untrusted
      policy execution; the record's doc comment carries this constraint with the
      type.
  upstream: self
