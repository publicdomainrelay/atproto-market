apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-utils-attestation-key
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: 'The context exists so that every part of atproto-market that needs to sign
    with the operator''s secp256k1 attestation key has one shared, predictable way
    to obtain it: give it the JWK path and get back the scalar in hex. It hides both
    the first-run bootstrap (generating and persisting a key when none exists) and
    the encoding differences between the on-disk JWK (base64url in d) and the form
    signers consume (lowercase hex), so callers never hand-roll key material handling
    or accidentally clobber an existing operator key. Pinning validation to kty/crv/d
    and swallowing only NotFound as a trigger for creation keeps permission and corruption
    failures loud instead of silently rotating the identity.'
  requirements:
  - id: r.generate-and-persist-key
    level: MUST
    text: When no file exists at jwkPath, draw 32 random bytes with crypto.getRandomValues,
      write a private JWK carrying kty "EC", crv "secp256k1", use "sig", alg "ES256K"
      and the base64url-encoded scalar as d, serialized as JSON with two-space indentation
      plus a trailing newline, and return the same scalar as lowercase hex so the
      caller can sign immediately.
    codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
  - id: r.load-existing-jwk
    level: MUST
    text: When the file at jwkPath exists, read and JSON-parse it and return base64UrlDecode(jwk.d)
      rendered as lowercase hex, not the JWK object, so every caller receives the
      key in the same hex form whether it was loaded or generated.
    codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
  - id: r.only-notfound-triggers-creation
    level: MUST
    text: Only a Deno.errors.NotFound raised by reading jwkPath falls through to key
      creation; every other read failure is rethrown unchanged so permission and I/O
      errors surface to the caller instead of silently generating and writing a new
      key over an unreadable one.
    codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
  - id: r.refuse-non-secp256k1-jwk
    level: MUST
    text: A pre-existing file whose parsed contents lack kty === "EC", crv === "secp256k1"
      or a string d causes a thrown error naming the path and stating it is not a
      secp256k1 private JWK, and the existing file is left untouched rather than overwritten.
    codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
  - id: r.restrict-key-file-mode
    level: SHOULD
    text: After writing a newly generated JWK the file mode is narrowed to 0600, and
      a chmod rejection is swallowed so platforms without chmod support still complete
      key creation and return the scalar.
    codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
  - id: r.single-exported-entrypoint
    level: MUST
    text: The module exposes exactly one public entry point, loadOrCreateAttestationKeyHex,
      which takes the JWK path as a string or URL and resolves to a lowercase-hex
      string; the helpers bytesToHex, base64UrlEncode and base64UrlDecode stay module-private
      so callers cannot bypass the load-or-create and validation path.
    codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
  interfaces:
  - name: loadOrCreateAttestationKeyHex
    kind: function
    signature: '(jwkPath: string | URL): Promise<string>'
    file: lib/utils-attestation-key/mod.ts
codeRefIndex:
- file:lib/utils-attestation-key/mod.ts mod.ts@lib/utils-attestation-key/mod.ts
- function:31d6822de041bbe285c919680dd5898d loadOrCreateAttestationKeyHex@lib/utils-attestation-key/mod.ts:22
