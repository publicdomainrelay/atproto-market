apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-hono-factory-secrets-oidc
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  intent: This context exists to separate the transport concern of serving secrets
    (route registration, bearer extraction, JSON response shape, 401 error shape,
    logging) from the policy concern of deciding who may read them. By accepting a
    SecretsAuthorizer, a getSecrets callback, an optional route and an optional logger
    through SecretsFactoryOptions, the factory lets a caller mount the same secrets
    endpoint in different hosts and test it without real service-auth wiring, whereas
    the authorization implementation and the secret entry shape live in their own
    packages.
  requirements:
  - id: r.bearer-token-then-authorize
    level: MUST
    text: The GET handler must read the Authorization request header through extractBearer
      and pass the resulting token, the resolved route and the request method to opts.authorizer.authorize,
      awaiting the returned subject.
    codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    - function:d93e06a7dd7538ef41434823de865c6e
  - id: r.create-app-registers-get-route
    level: MUST
    text: createSecretsApp must build a new Hono app and register a GET handler on
      the route taken from opts.route, falling back to the SECRETS_ROUTE constant
      when opts.route is absent, and return that app.
    codeRefs:
    - file:lib/hono-factory-secrets-oidc/mod.ts
    - function:9217ff283324c4a352117c8801e75b4a
  - id: r.extract-bearer-lenient
    level: MUST
    text: 'extractBearer must be lenient rather than throwing: it returns the empty
      string when the header is missing and when the scheme is anything other than
      a case-insensitive "bearer", and returns the value token when the header is
      "Bearer <token>".'
    codeRefs:
    - function:d93e06a7dd7538ef41434823de865c6e
  - id: r.log-optional-noop
    level: MUST
    text: The log callback in SecretsFactoryOptions is optional; when it is omitted
      the app must substitute a no-op function so that the served and denied events
      can be emitted unconditionally without failing.
    codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    - interface:7e777067ac67ae39e4b4da5c05ea6802
  - id: r.options-carry-authorizer-and-secrets
    level: MUST
    text: SecretsFactoryOptions must carry the required authorizer (a SecretsAuthorizer)
      and getSecrets (a zero-argument function returning SecretEntry[]), plus the
      optional route string and log callback, so callers inject both the policy and
      the secret source rather than the module resolving them itself.
    codeRefs:
    - interface:7e777067ac67ae39e4b4da5c05ea6802
  - id: r.success-serves-secrets-as-json
    level: MUST
    text: On successful authorization the handler must call opts.getSecrets(), log
      the served event with the authorized subject and the secret count, and respond
      with the secret entries serialized as a JSON array.
    codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
  - id: r.unauthorized-maps-to-401
    level: MUST
    text: 'When opts.authorizer.authorize rejects, the handler must not propagate
      the error; it must log the denial and respond with HTTP 401 and a JSON body
      of the shape { id: "unauthorized", message: String(err) }.'
    codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
  interfaces:
  - name: SecretsFactoryOptions
    kind: interface
    signature: 'interface SecretsFactoryOptions { authorizer: SecretsAuthorizer; getSecrets:
      () => SecretEntry[]; route?: string; log?: (event: string, extra?: Record<string,
      unknown>) => void }'
    file: lib/hono-factory-secrets-oidc/mod.ts
  - name: createSecretsApp
    kind: function
    signature: 'createSecretsApp(opts: SecretsFactoryOptions): Hono'
    file: lib/hono-factory-secrets-oidc/mod.ts
  - name: extractBearer
    kind: function
    signature: 'extractBearer(authHeader: string | undefined): string'
    file: lib/hono-factory-secrets-oidc/mod.ts
codeRefIndex:
- file:lib/hono-factory-secrets-oidc/mod.ts mod.ts@lib/hono-factory-secrets-oidc/mod.ts
- function:9217ff283324c4a352117c8801e75b4a createSecretsApp@lib/hono-factory-secrets-oidc/mod.ts:19
- function:d93e06a7dd7538ef41434823de865c6e extractBearer@lib/hono-factory-secrets-oidc/mod.ts:13
- interface:7e777067ac67ae39e4b4da5c05ea6802 SecretsFactoryOptions@lib/hono-factory-secrets-oidc/mod.ts:6
