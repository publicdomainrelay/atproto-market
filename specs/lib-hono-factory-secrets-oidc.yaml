apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-hono-factory-secrets-oidc
  namespace: default
spec:
  repository: atproto-market
  upstream: self
  dependsOn:
  - sc.atproto-market
  - sc.lib-common-secrets-common
  - sc.lib-secrets-oidc
  intent: 'This context pins down what the hono-factory-secrets-oidc package guarantees
    to its callers: the shape of the injection options, the lenient bearer-parsing
    contract, and the exact HTTP behaviour of the single GET route it registers, so
    that consumers such as guest-capability-secrets can swap in their own authorizer
    and secret source without the factory owning any atproto service-auth policy.
    It exists to keep the factory layer a thin transport adapter, mapping authorization
    outcomes onto JSON responses and log events rather than resolving tokens itself.'
  requirements:
  - id: r.bearer-token-then-authorize
    level: MUST
    text: The GET handler must read the request's Authorization header through extractBearer
      and pass the resulting token, the resolved route and c.req.method to opts.authorizer.authorize,
      awaiting the returned subject before touching the secret source.
    codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    - function:d93e06a7dd7538ef41434823de865c6e
  - id: r.create-app-registers-get-route
    level: MUST
    text: createSecretsApp must construct a new Hono app, register exactly one async
      GET handler on the route taken from opts.route with a fallback to the SECRETS_ROUTE
      constant when opts.route is absent, and return that app to the caller.
    codeRefs:
    - file:lib/hono-factory-secrets-oidc/mod.ts
    - function:9217ff283324c4a352117c8801e75b4a
  - id: r.delegate-auth-to-authorizer
    level: SHOULD
    text: The factory should keep atproto service-auth verification out of this layer,
      delegating every token decision to the injected authorizer, so the module owns
      only the HTTP shape, the routing and the error mapping.
    codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    - interface:7e777067ac67ae39e4b4da5c05ea6802
  - id: r.extract-bearer-lenient
    level: MUST
    text: 'extractBearer must be lenient rather than throwing: it returns the empty
      string when the header is absent, returns the empty string when the scheme is
      anything other than a case-insensitive "bearer", and returns the value token
      for "Bearer <token>", defaulting that token to the empty string when no value
      follows the scheme.'
    codeRefs:
    - file:lib/hono-factory-secrets-oidc/mod.ts
    - function:d93e06a7dd7538ef41434823de865c6e
  - id: r.log-optional-noop
    level: MUST
    text: The log callback in SecretsFactoryOptions is optional; when the caller omits
      it the factory must substitute a no-op function, so the served and denied events
      can be emitted unconditionally on every request without throwing.
    codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    - interface:7e777067ac67ae39e4b4da5c05ea6802
  - id: r.options-carry-authorizer-and-secrets
    level: MUST
    text: SecretsFactoryOptions must require an authorizer (a SecretsAuthorizer) and
      a zero-argument getSecrets returning SecretEntry[], and must permit the optional
      route string and log callback, so callers inject both the policy and the secret
      source instead of the module resolving either itself.
    codeRefs:
    - file:lib/hono-factory-secrets-oidc/mod.ts
    - interface:7e777067ac67ae39e4b4da5c05ea6802
  - id: r.success-serves-secrets-as-json
    level: MUST
    text: On successful authorization the handler must call opts.getSecrets(), emit
      the "secrets_served" log event carrying the authorized subject and the secret
      count, and respond with the secret entries serialized as a JSON body.
    codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    - interface:7e777067ac67ae39e4b4da5c05ea6802
  - id: r.unauthorized-maps-to-401
    level: MUST
    text: 'When opts.authorizer.authorize rejects, the handler must not propagate
      the error: it must emit the "secrets_denied" log event carrying the stringified
      error and respond with HTTP status 401 and a JSON body of the shape { id: "unauthorized",
      message: String(err) }.'
    codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    - interface:7e777067ac67ae39e4b4da5c05ea6802
  interfaces:
  - name: SecretsFactoryOptions
    kind: interface
    signature: 'interface SecretsFactoryOptions { authorizer: SecretsAuthorizer; getSecrets:
      () => SecretEntry[]; route?: string; log?: (event: string, extra?: Record<string,
      unknown>) => void }'
    file: lib/hono-factory-secrets-oidc/mod.ts
  - name: createSecretsApp
    kind: function
    signature: 'createSecretsApp(opts: SecretsFactoryOptions): Hono'
    file: lib/hono-factory-secrets-oidc/mod.ts
  - name: extractBearer
    kind: function
    signature: 'extractBearer(authHeader: string | undefined): string'
    file: lib/hono-factory-secrets-oidc/mod.ts
codeRefIndex:
- file:lib/hono-factory-secrets-oidc/mod.ts mod.ts@lib/hono-factory-secrets-oidc/mod.ts
- function:9217ff283324c4a352117c8801e75b4a createSecretsApp@lib/hono-factory-secrets-oidc/mod.ts:19
- function:d93e06a7dd7538ef41434823de865c6e extractBearer@lib/hono-factory-secrets-oidc/mod.ts:13
- interface:7e777067ac67ae39e4b4da5c05ea6802 SecretsFactoryOptions@lib/hono-factory-secrets-oidc/mod.ts:6
