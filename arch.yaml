    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/gateway.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled.ts
    id: r.generated-not-hand-edited
    level: MUST
    text: Every file in this tree is emitted by `@atproto/lex` and carries the generated-file
      banner; it must be regenerated from the source lexicons rather than edited by
      hand, since hand edits are overwritten on the next generation run.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market.ts
    id: r.market-namespace-surface
    level: MUST
    text: '`market.ts` is the broadest barrel and must re-export exactly the twenty-one
      market submodules as namespaces: `listBidders`, `receipts`, `registerBidder`,
      `bidderAssociation`, `bids`, `rfp`, `submitBid`, `event`, `policies`, `accept`,
      `badgeBlueKey`, `accepts`, `submitAccept`, `submitEvent`, `bid`, `bidderDiscovery`,
      `submitRfp`, `offering`, `relays`, `receipt` and `bidderRegistration`.'
