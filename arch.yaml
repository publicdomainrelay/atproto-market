  id: sc.lib-market-atproto
  intent: 'This context exists to give the market app and the market service one tested,
    reusable implementation of the market''s signed-record and inter-service wire
    protocol, so neither side re-implements record signing, remote proofs, service-auth
    verification or the accept-to-rfp contract walk. It is the boundary module: everything
    about how a bid, RFP, accept or settlement event is shaped on the wire, authenticated,
    signed and validated lives here, and callers configure the transport, identity
    resolver and signer rather than the library hard-coding them.'
