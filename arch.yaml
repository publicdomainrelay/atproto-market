    - type_alias:f7238f998c97915ef77a9d07f8b82c14
    id: r.per-operation-error-types
    level: MUST
    text: Each operation carries its own error and response type pair - for example
      ResolveDidErrors/ResolveDidResponses, CreatePlcOpErrors/CreatePlcOpResponses,
      GetPlcOpLogErrors/GetPlcOpLogResponses, GetPlcAuditLogErrors/GetPlcAuditLogResponses,
      GetLastOpErrors/GetLastOpResponses, GetPlcDataErrors/GetPlcDataResponses and
      ExportErrors/ExportResponses - so that failure and success payloads stay distinguishable
      at the type level rather than collapsing into one untyped result.
  - codeRefs:
    - type_alias:2217b5041dc37a25dbb3a95b3fdc3614
    - type_alias:254318a85cdcbe888f557d8dcbd18fce
    - type_alias:49e81f3179617521132a81d448100235
    - type_alias:c9e396f69721efb9d82c3a68c8763f6f
    - type_alias:cd3e5e7ab8f4ea8a1fa2b7920d7e3a7b
    - type_alias:f2763d175add69dd71270f735d4df310
    - type_alias:f625ac32a8a6e4f700251e1c33c7d289
    id: r.plc-domain-types
    level: MUST
    text: 'The generated types model the PLC directory''s domain vocabulary, not just
      transport shapes: Operation is the union of signed PLC operations, PlcOp, TombstoneOp
      and LegacyCreateOp are its variants, LogEntry represents an entry in a DID''s
      operation log, and DidDocument with PlcService represents a resolved DID document
      and its service entries - so callers in lib/did-plc/client.ts can work with
      typed operations rather than raw JSON.'
