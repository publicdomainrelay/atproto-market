  depends_on:
  - sc.atproto-market
  id: sc.compute-contract-full-flow
  intent: 'This context exists as an end-to-end integration harness: it is the executable
    proof that requester, bidder, provider, relay/dispatcher, PDS, and PLC pieces
    from the sibling packages actually compose into a successful compute contract
    (RFP -> bid -> accept -> receipt -> SSH) without any external infrastructure.
    The script exists to be run manually (`deno run --allow-all compute-contract-full-flow/run_full_flow.ts`
    from the polyrepo root) and to leave behind machine-readable evidence (`atproto-records.json`,
    `full-flow.log`) plus a human-readable `SUMMARY.md`, which is why those tracked
    outputs sit in the same directory.'
  name: compute-contract-full-flow
  requirements:
  - codeRefs:
    - file:compute-contract-full-flow/run_full_flow.ts
    id: r.cleanup-reverse-order
    level: MUST
    text: Registered cleanups run in reverse registration order, each wrapped in a
      `try/catch` so one failure cannot stop the rest, followed by a 200 ms settle
      delay before the flow logs completion.
  - codeRefs:
    - file:compute-contract-full-flow/run_full_flow.ts
    id: r.collect-records-both-repos
    level: MUST
    text: After the contract returns, `collectRecords` paginates `listRecords` (limit
      100 with cursors) for both the requester and bidder repos across the fixed collections
      `...market.offering`, `...market.rfp`, `...market.bid`, `...market.accept`,
      `...market.receipt`, `...market.policy`, `...auth.allowlist.rbacDid`, and `...compute.vm`,
      tagging each record with source label, DID, collection, uri, cid and value;
      a failure on one collection is logged as `collect error (...)` and does not
      abort the run.
  - codeRefs:
    - file:compute-contract-full-flow/run_full_flow.ts
    id: r.entrypoint-runs-standalone
    level: MUST
    text: 'The module is a directly runnable Deno script (shebang `deno run --allow-all`)
      that performs the whole flow inside `main()` and exits non-zero via `Deno.exit(1)`
      after logging `FATAL: <err>` if any uncaught error escapes.'
  - codeRefs:
    - file:compute-contract-full-flow/run_full_flow.ts
    id: r.fake-plc-did-documents
    level: MUST
    text: '`createFakePlc` provides an in-memory DID directory: `POST /*` stores the
      posted operation keyed by the URL-decoded path DID, and `GET /*` returns 404
      `DID not found: <did>` when absent, otherwise renders a DID document with the
      two W3C contexts, the stored `alsoKnownAs`, each `verificationMethods` entry
      as a `Multikey` whose `publicKeyMultibase` strips a leading `did:key:`, and
      each `services` entry as an `#<name>` service with its type and endpoint.'
  - codeRefs:
    - file:compute-contract-full-flow/run_full_flow.ts
    id: r.fetch-interceptor-local-routing
    level: MUST
    text: '`installFetchInterceptor` replaces `globalThis.fetch` so requests to `https://plc.directory/`
      are rewritten to the supplied local PLC base URL, and requests whose host is
      `localhost`, ends in `.localhost`, or contains `.localhost:` are rewritten to
      plain `http://` on the dispatcher port (defaulting the port when the host carries
      none); it returns a restore function that puts the original fetch back, and
      that restore is registered as a cleanup.'
  - codeRefs:
    - file:compute-contract-full-flow/run_full_flow.ts
    id: r.no-cli-configuration
    level: SHOULD
    text: 'The script exposes no CLI flags or environment variables: every knob (hostnames,
      ports, policy, timeouts, collection list, output paths) is fixed in source,
      so running it requires no arguments beyond `--allow-all`.'
  - codeRefs:
    - file:compute-contract-full-flow/run_full_flow.ts
    id: r.participants-on-ephemeral-ports
    level: MUST
    text: 'The flow starts every participant in-process on loopback: the dispatcher
      and fake PLC on port 0 (their real ports read back through `onListen` resolvers),
      a bidder PDS agent (`createLocalPDSAgent`) plus a bidder ingress relay and `createMarketBidder`
      with a local compute provider wrapped by `createComputeProviderHooks`, and a
      requester PDS via `createRequesterPDS` labelled `requester`; each server''s
      abort/shutdown closure is pushed onto `cleanups`.'
  - codeRefs:
    - file:compute-contract-full-flow/run_full_flow.ts
    id: r.run-contract-fixed-policy
    level: MUST
    text: '`runComputeContract` is invoked on the requester with the `only-me` policy
      and `bidWindowSec: 15`, `skipSsh: false`, `keepVm: true`, `vmReadyTimeoutSec:
      60`, `execProgram: "hostname"`, an SSH session provider from `createSshSessionProvider(logger)`,
      the bidder DID in `extraBidderDids`, and `did:plc:centraldefaultbidder000000`
      in `denyBidderDids`; the returned contract object is serialized into the log.'
  - codeRefs:
    - file:compute-contract-full-flow/SUMMARY.md
    - file:compute-contract-full-flow/atproto-records.json
    - file:compute-contract-full-flow/full-flow.log
    - file:compute-contract-full-flow/run_full_flow.ts
    id: r.tracked-outputs-committed
    level: MAY
    text: The generated `SUMMARY.md`, `atproto-records.json` and `full-flow.log` are
      tracked alongside the script as the recorded evidence of the run described in
      the summary's Participants, Result and record-count sections.
  - codeRefs:
    - file:compute-contract-full-flow/run_full_flow.ts
    id: r.write-three-artifacts
    level: MUST
    text: 'The run writes exactly three files derived from the script''s own directory
      (`new URL(".", import.meta.url).pathname`): `full-flow.log` with the timestamped
      log lines, `atproto-records.json` with the collected records pretty-printed,
      and a generated `SUMMARY.md` containing the requester/bidder DID table, the
      pretty-printed contract JSON, dispatcher and PLC addresses, a per-collection
      record-count table, links to the other two artifacts, the reproduce command,
      the architecture diagram and the SSH tunnel path, stamped with a generation
      timestamp.'
  upstream: self
- code:
  - hono-bidder/cli-args-env.ts
  - hono-bidder/mod.ts
  codeRefIndex:
  - file:hono-bidder/cli-args-env.ts cli-args-env.ts@hono-bidder/cli-args-env.ts
  - file:hono-bidder/mod.ts mod.ts@hono-bidder/mod.ts
  depends_on:
  - sc.atproto-market
  id: sc.hono-bidder
  intent: It exists so an operator can run a bidder as a single process — pick an
    identity/auth mode, enable compute backends, serve XRPC over TCP/Unix with an
    optional fedproxy ingress, and stay discoverable on AT Protocol relays — without
    writing any glue code. The declarative config file keeps every flag, env var and
    default in one auditable place, and mod.ts is the only place that interprets them.
  name: hono-bidder
  requirements:
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.association-qr
    level: MUST
    text: Unless --skip-qr is set, the bidder scans its own badgeBlueKeys records
      for an existing bidder_associate association and skips the prompt when one exists;
      otherwise it prints a qr.fedfork.com QR URL, waits on associateCalled, resolves
      the caller's handle from alsoKnownAs, prompts y/N on stdin, and either approves
      the association or rejects it and exits 0.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.attestation-keypair
    level: MUST
    text: An attestation keypair is derived from the same private key hex via loadOrGenerateKeypair
      before any PLC genesis op runs, so the attestation did:key can be published
      in the bidder's DID document and used as the badgeBlue signer.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.auth-mode-selection
    level: MUST
    text: 'Exactly one AT Protocol auth mode is chosen in this order: (1) --atproto-oauth,
      which requires --atproto-handle and exits 1 with an error log when the handle
      is missing, using createOAuthAgent plus restore/startFlow/completeFlow with
      a loopback callback server; (2) --atproto-oauth-qr, which registers a genesis
      did:plc on the PLC directory, restores a saved QR session if present, and otherwise
      renders a qr.fedfork.com QR and polls for the transferred session; (3) --atproto-handle
      plus --atproto-password, which creates a local PDS agent; (4) the default, which
      creates a local PDS agent and runs the association QR flow. Modes 1 and 2 set
      isOAuth true and leave pdsHostname undefined; modes 3 and 4 set isLocal true
      and take pdsHostname from the relay ingress host.'
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.badge-blue-attestation-binding
    level: MUST
    text: After the ATProto client is built, the bidder writes a badgeBlueKeys record
      for itself with keyId equal to the attestation did:key and service "bidder_attestation",
      using createRecord (never putRecord, which the OAuth scope rejects); failure
      to write is a logged warning, not a fatal error.
  - codeRefs:
    - file:hono-bidder/cli-args-env.ts
    - file:hono-bidder/mod.ts
    id: r.bidder-serve-binding
    level: MUST
    text: The market bidder gets its own serve instance bound to options.serveAddr
      (default 0.0.0.0), options.servePort (default 0 for a random port) and, when
      set, a Unix socket at options.serveUnix; its ingress is created unless --no-ingress-proxy
      is set.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.compute-providers
    level: MUST
    text: 'Compute providers are registered only when their flag is set: a DigitalOcean
      provider when --compute-provider-digitalocean-token is present, a local provider
      when --compute-provider-local is set (honoring mode, VM image, container image,
      cache dir, CA cert PEM and guest TLS port), and a Deno worker provider when
      --compute-provider-deno-worker is set. Each provider gets its own ingress (with
      a freshly generated relay keypair) and serve instance, and each serve is begun
      before startup continues.'
  - codeRefs:
    - file:hono-bidder/cli-args-env.ts
    - file:hono-bidder/mod.ts
    id: r.config-resolution
    level: MUST
    text: mod.ts resolves options by constructing the cli-args-env Command with the
      environment/config path key CONFIG_PATH_HONO_BIDDER, the cli-args-env module's
      default export, and an optional runtime config loaded from ./config.json; a
      missing or unparsable config.json is tolerated and leaves the built-in defaults
      in force.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.container-image-prebuild
    level: SHOULD
    text: When the local provider exposes ensureImage, the bidder awaits it after
      the association step and logs before and after, so the first guest provision
      does not pay the image build cost.
  - codeRefs:
    - file:hono-bidder/cli-args-env.ts
    id: r.declarative-config
    level: MUST
    text: The CLI config is a single default-exported object named "bidder" whose
      options map each flag to a type, description, optional env var and optional
      default, and that object is the only source of the flag/env/default surface
      consumed by mod.ts.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.deferred-relay-registration
    level: MUST
    text: 'PDS registration with relays is deferred until after the offering record
      exists: local relay URLs are re-announced once the local serve port is known,
      and the remaining crawl relays are announced with the visibility hostname after
      startup, because a crawl that connects before the offering commit would miss
      it in the live-stream gap.'
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.event-streams-relays
    level: MUST
    text: Event streams are configured from the union of --relay-url and, when --firehose-mode
      is "subscriberepos" with --firehose-url set, the comma-separated firehose URLs;
      when firehose URLs are used the default relay list is removed, and only http(s)
      root URLs are retained as requestCrawl targets because wss firehose URLs are
      consumed by the event-streams client instead.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.graceful-shutdown
    level: MUST
    text: SIGINT and SIGTERM handlers shut the market bidder down, dispose the OAuth
      agent when in an OAuth mode, shut down every provider serve, and then exit.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.ingress-per-relay-keypair
    level: MUST
    text: Each ingress created for a relay uses a freshly generated keypair, while
      service-auth JWTs are signed by the bidder's identity signer, whose DID is the
      OAuth PLC DID in QR mode and otherwise the ATProto DID.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.local-dev-fetch-patch
    level: SHOULD
    text: When the ingress proxy host looks local (localhost or 127.*) or the PLC
      directory URL resolves to a local host, global fetch is patched so https://*.localhost
      is rewritten to the ingress port over http and https://plc.directory/ is rewritten
      to the configured local PLC URL; otherwise fetch is untouched.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.oauth-client-metadata-route
    level: MUST
    text: The bidder serve exposes GET /oauth-client-metadata.json returning oauthClientMetadata
      built from the OAuth client id, redirect URI, the bidder OAuth scope list and
      the client name "Compute Provider (hono-bidder)".
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.oauth-session-expiry
    level: MUST
    text: An OAuth session-expired error handler logs the session path, deletes the
      stale session file if present, and exits the process with code 1 after a short
      flush delay so a supervisor restarts it and re-authenticates.
  - codeRefs:
    - file:hono-bidder/cli-args-env.ts
    - file:hono-bidder/mod.ts
    id: r.offering-refresh
    level: MUST
    text: --offering-refresh-sec defaults to 300 and is converted to milliseconds
      for createMarketBidder; a value of 0 (or less) is passed as undefined so the
      refresh loop is disabled.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.operator-association
    level: MUST
    text: When --associate-with is set, the bidder mints a bidder_associate badgeBlueKeys
      record in the canonical shape challenge=operator DID, keyId=this bidder's DID
      before the market bidder starts, so the trust cache resolves the bidder's operator
      ahead of the only-me scope check; failure is logged and does not abort startup.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.policy-config
    level: MUST
    text: 'Policy arguments are parsed with parsePolicyArgs, and when --policy is
      set the name is resolved against the policy registry with side "bidder"; an
      unknown or wrong-side policy name, or any parse failure, prints "invalid --policy:
      <error>" and exits with code 2. The resolved policy and args are handed to createMarketBidder
      together with the only-remote and allow-untrusted execution flags.'
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.private-key-precedence
    level: MUST
    text: The bidder signing key comes from options.privateKeyHex first; only when
      that is absent is the hex read and trimmed from the file at options.privateKeyHexPath.
      If neither yields a key, a fresh exportable Secp256k1Keypair is created, and
      the resulting hex is written back to privateKeyHexPath (creating parent directories)
      so later runs reuse it. Every failure to read or write that file is logged as
      a warning rather than fatal.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.ready-line
    level: MUST
    text: After beginServe, the bidder writes a single machine-readable JSON line
      to stdout containing event "bidder_ready" plus the bidder DID, the ingress ref
      and the serve port, so a test harness spawning the process as a subprocess can
      detect readiness.
  - codeRefs:
    - file:hono-bidder/mod.ts
    id: r.relay-visibility-check
    level: SHOULD
    text: When relay URLs and a visibility hostname are available, verifyRelayVisibility
      is run against the offering collection for the bidder DID; a positive result
      logs the indexing relays and a negative result logs a warning with the hint
      that requester-side listReposByCollection discovery will not find this bidder.
      Failure never aborts boot.
  - codeRefs:
    - file:hono-bidder/cli-args-env.ts
    - file:hono-bidder/mod.ts
    id: r.worker-permission-mode
    level: MUST
    text: The Deno worker provider defaults worker permission mode to "deny-all";
      only the value "allow-net" installs a permission policy handler, loaded dynamically.
  upstream: self
- code:
  - hono-compute-contract-gateway/mod.ts
  codeRefIndex:
  - file:hono-compute-contract-gateway/GOAL.md GOAL.md@hono-compute-contract-gateway/GOAL.md
  - file:hono-compute-contract-gateway/README.md README.md@hono-compute-contract-gateway/README.md
  - file:hono-compute-contract-gateway/cli-args-env.json cli-args-env.json@hono-compute-contract-gateway/cli-args-env.json
  - file:hono-compute-contract-gateway/config.json config.json@hono-compute-contract-gateway/config.json
  - file:hono-compute-contract-gateway/deno.json deno.json@hono-compute-contract-gateway/deno.json
  - file:hono-compute-contract-gateway/mod.ts mod.ts@hono-compute-contract-gateway/mod.ts
  depends_on:
  - sc.atproto-market
  id: sc.hono-compute-contract-gateway
  intent: 'This context exists so the gateway can be deployed as a process: it is
    the composition root that turns declarative configuration (flags, environment
    variables, JSON config) into a running did:web/DID-keyed XRPC service. Everything
    downstream — DID document serving, service-auth verification of callers, and the
    requestComputeVM, requestComputeWorkerEphemeral, requestComputeWorkerPersistent
    and deleteCompute operations — is supplied by the compute-contract-gateway-xrpc
    implementation and its Hono factory; this package''s job is only to read the configuration
    surface, build those pieces in the right order, bind a listener, and tear the
    gateway down cleanly on a signal. GOAL.md and README.md extend that intent with
    a verifiable contract: the README''s Quick Start, Request a VM and Request a Deno
    Worker shell blocks must run end to end against a locally started instance of
    this CLI, which is what the test:readme task in deno.json is for.'
  name: hono-compute-contract-gateway
  requirements:
  - codeRefs:
    - file:hono-compute-contract-gateway/cli-args-env.json
    - file:hono-compute-contract-gateway/config.json
    - file:hono-compute-contract-gateway/mod.ts
    id: r.command-entrypoint
    level: MUST
    text: mod.ts runs as the process entrypoint and resolves its options by constructing
      Command("CONFIG_PATH_HONO_COMPUTE_CONTRACT_GATEWAY", cli-args-env.json, runtimeConfig).resolve(),
      where runtimeConfig is the default export of ./config.json when that file exists
      and is silently null when the import fails, so the package runs with or without
      a local config file.
  - codeRefs:
    - file:hono-compute-contract-gateway/cli-args-env.json
    - file:hono-compute-contract-gateway/config.json
    - file:hono-compute-contract-gateway/mod.ts
    id: r.config-surface
    level: MUST
    text: 'The CLI exposes exactly these options, each reading its flag or the named
      environment variable: port (env PORT, no default, listener omitted when unset),
      hostname (env HOSTNAME, default localhost, also supplied by config.json), private-key-hex
      (env PRIVATE_KEY_HEX, no default), private-key-hex-path (env REPO_PRIVATE_KEY_HEX_PATH,
      no default), pds-state-path (env PDS_STATE_PATH, no default), plc-directory-url
      (env PLC_DIRECTORY_URL, default https://plc.directory), ingress-proxy-host (env
      INGRESS_PROXY_HOST, default xrpc.fedproxy.com), fedproxy-host (env FEDPROXY_HOST,
      default fedproxy.com), relay-urls (env RELAY_URLS, no default), and storage-path
      (env STORAGE_PATH, no default).'
  - codeRefs:
    - file:hono-compute-contract-gateway/deno.json
    id: r.deno-package-manifest
    level: MUST
    text: deno.json declares the package's JSR imports for cli-args-env, compute-contract-gateway-xrpc,
      hono-factory-compute-contract-gateway-xrpc, logger, serve and @atproto/identity,
      and compiles cli-args-env.json and config.json into any compiled binary so the
      config surface survives compilation.
  - codeRefs:
    - file:hono-compute-contract-gateway/mod.ts
    id: r.gateway-contract-consumed
    level: MUST
    text: 'The CLI depends on the ComputeContractGateway contract, whose surface it
      exposes over HTTP: a did getter, beginServe and dispose lifecycle calls, and
      the requestComputeVM, requestComputeWorkerEphemeral, requestComputeWorkerPersistent
      and deleteCompute operations invoked with a CallerIdentity and receipt inputs.'
  - codeRefs:
    - file:hono-compute-contract-gateway/mod.ts
    id: r.gateway-startup
    level: MUST
    text: The gateway is built with createComputeContractGateway using the resolved
      logger, serve instance, private key, PLC directory URL, ingress proxy host,
      fedingress host and storage path under the fixed label compute-contract-gateway,
      and gateway.beginServe() is awaited before the HTTP app is constructed so the
      gateway DID exists first.
  - codeRefs:
    - file:hono-compute-contract-gateway/mod.ts
    id: r.graceful-shutdown
    level: MUST
    text: SIGINT and SIGTERM both log gateway_shutting_down, await gateway.dispose()
      and then call Deno.exit(0), so the gateway is torn down rather than killed mid-write.
  - codeRefs:
    - file:hono-compute-contract-gateway/mod.ts
    id: r.http-mount-and-ready
    level: MUST
    text: The factory's Hono app is mounted at the root of the serve instance with
      serve.app.route("/", app) and serve.beginServe() is awaited, after which a gateway_cli_ready
      event is logged carrying the gateway DID.
  - codeRefs:
    - file:hono-compute-contract-gateway/mod.ts
    id: r.identity-and-audience
    level: MUST
    text: An IdResolver is constructed with plcUrl defaulting to https://plc.directory,
      and the Hono factory is called with that resolver, hostname defaulting to localhost,
      and audienceDids set to the running gateway's own DID, so service-auth tokens
      are accepted for this gateway's DID.
  - codeRefs:
    - file:hono-compute-contract-gateway/mod.ts
    id: r.private-key-resolution
    level: MUST
    text: The private key is taken from private-key-hex when present; only when that
      is empty and private-key-hex-path is set does the process read that file, trim
      its contents and log key_loaded_from_path with the path and key length, and
      a read failure is swallowed so a missing key file still lets the gateway generate
      a key.
  - codeRefs:
    - file:hono-compute-contract-gateway/GOAL.md
    - file:hono-compute-contract-gateway/README.md
    id: r.readme-block-coverage
    level: SHOULD
    text: The README shell blocks that the smoke test must exercise are the Quick
      Start server start plus health check, the VM key generation and requestComputeVM
      call, and the worker heredoc setup with requestComputeWorkerEphemeral and requestComputeWorkerPersistent
      calls, each expected to exit zero with the CLI started as a real subprocess
      against local infrastructure and no external network.
  - codeRefs:
    - file:hono-compute-contract-gateway/GOAL.md
    - file:hono-compute-contract-gateway/deno.json
    id: r.readme-smoke-task
    level: SHOULD
    text: deno.json provides a test:readme task that runs deno test -A against test/gateway_readme_smoke_test.ts
      using the repository root deno.json as its config, giving the README contract
      a single reproducible command.
  - codeRefs:
    - file:hono-compute-contract-gateway/mod.ts
    id: r.relay-urls-parsing
    level: MUST
    text: The relay-urls option is a comma-separated string that is split on commas,
      trimmed per entry, and passed as an array, defaulting to an empty array when
      the option is absent.
  - codeRefs:
    - file:hono-compute-contract-gateway/mod.ts
    id: r.storage-path-fallback
    level: MUST
    text: The storage path handed to the gateway is pds-state-path when set, otherwise
      storage-path, so the persistent PDS state location can be overridden independently
      of general storage.
  - codeRefs:
    - file:hono-compute-contract-gateway/mod.ts
    id: r.tcp-listener
    level: MUST
    text: The serve instance is created with a TCP listener only when port is set,
      binding that port on hostname or 0.0.0.0 when hostname is absent; with no port
      the serve instance has no TCP listener configured.
  upstream: self
- code:
  - hono-market/mod.ts
  codeRefIndex:
  - file:hono-market/deno.json deno.json@hono-market/deno.json
  - file:hono-market/mod.ts mod.ts@hono-market/mod.ts
  depends_on:
  - sc.atproto-market
  id: sc.hono-market
  intent: 'This context marks the reserved hono-market package: a namespace and manifest
    created so the Hono-facing market layer has a declared home in the monorepo''s
    package layout, kept intentionally empty until that layer is implemented here.
    It exists to hold the module boundary and versioning metadata for the package
    rather than to provide behaviour today, which is why the entry file is a no-op
    export and the config carries no dependencies or tasks.'
  name: hono-market
  requirements:
  - codeRefs:
    - file:hono-market/mod.ts
    id: r.empty-entry-module
    level: MUST
    text: The package entry module hono-market/mod.ts is a valid ES module whose only
      statement is an empty `export {}`; it must not export any values, types, factory,
      or side effects, so importing the package yields nothing.
  - codeRefs:
    - file:hono-market/mod.ts
    id: r.no-reimplementation
    level: SHOULD
    text: While the entry module stays empty, market HTTP behaviour must continue
      to come from the existing repository packages rather than from this package,
      so no Hono factory, XRPC handler, or client is duplicated into hono-market.
  - codeRefs:
    - file:hono-market/deno.json
    id: r.package-manifest
    level: MUST
    text: The package manifest hono-market/deno.json declares the package identity
      as version "0.0.0" under the "Unlicense" license, and carries no imports, tasks,
      or export mappings, so the stub package resolves with Deno's defaults.
  upstream: self
- code:
  - hono-plc/mod.ts
  codeRefIndex:
  - file:hono-plc/cli-args-env.json cli-args-env.json@hono-plc/cli-args-env.json
  - file:hono-plc/config.json config.json@hono-plc/config.json
  - file:hono-plc/mod.ts mod.ts@hono-plc/mod.ts
  depends_on:
  - sc.atproto-market
  id: sc.hono-plc
  intent: 'This context exists so the did:plc directory server can be launched as
    a standalone process from a declarative, layer-respecting Deno entrypoint. It
    carries the process-level wiring only: how the CLI''s configuration surface (flags,
    environment variables, defaults, and the optional config.json override) becomes
    a bound TCP listener, which Hono app is mounted at the root path, and how the
    process terminates on signal. The PLC operation storage and directory semantics
    themselves belong to the hono-factory-did-plc-directory package it depends on;
    hono-plc''s job is composition and lifecycle.'
  name: hono-plc
  requirements:
  - codeRefs:
    - file:hono-plc/mod.ts
    id: r.bind-address
    level: MUST
    text: The TCP listener binds to the resolved hostname when it is a non-empty string
      and otherwise falls back to 127.0.0.1, using the resolved port, so the server
      never binds to an unset address.
  - codeRefs:
    - file:hono-plc/cli-args-env.json
    - file:hono-plc/mod.ts
    id: r.config-resolution
    level: MUST
    text: Options are resolved by a single Command instance named CONFIG_PATH_HONO_PLC
      that takes the declarative cli-args-env.json plus an optional runtime config
      object and returns the resolved options; the module must not read environment
      variables directly.
  - codeRefs:
    - file:hono-plc/cli-args-env.json
    - file:hono-plc/config.json
    - file:hono-plc/mod.ts
    id: r.config-surface
    level: MUST
    text: 'The configuration surface is two options: port, exposed as environment
      variable PORT with default 2587, and hostname, exposed as environment variable
      HOSTNAME with default 127.0.0.1; the optional hono-plc/config.json in the package
      supplies overrides (shipped values port 2587 and hostname 0.0.0.0) and its location
      is selected by the CONFIG_PATH_HONO_PLC environment variable.'
  - codeRefs:
    - file:hono-plc/mod.ts
    id: r.graceful-shutdown
    level: MUST
    text: SIGINT and SIGTERM listeners both run the same shutdown routine that calls
      the server's shutdown and then Deno.exit, so the process exits cleanly on either
      signal.
  - codeRefs:
    - file:hono-plc/mod.ts
    id: r.non-persistent-storage
    level: MAY
    text: Because the store is the in-memory MemoryPlcStore, PLC operations are held
      in process memory only and are not persisted across restarts.
  - codeRefs:
    - file:hono-plc/mod.ts
    id: r.optional-runtime-config
    level: SHOULD
    text: Importing config.json is wrapped so a missing or unresolvable file leaves
      the runtime config null and the run proceeds from flags and environment variables
      alone.
  - codeRefs:
    - file:hono-plc/mod.ts
    id: r.server-composition
    level: MUST
    text: The entrypoint constructs an in-memory PLC store (MemoryPlcStore), wraps
      it with createPlcDirectoryFactory, creates a server through createServe with
      the resolved TCP address, mounts the factory's Hono app at the root path, and
      then begins serving.
  upstream: self
- code:
  - lib/abc/compute-contract-gateway/mod.ts
  codeRefIndex:
  - file:lib/abc/compute-contract-gateway/mod.ts mod.ts@lib/abc/compute-contract-gateway/mod.ts
  - interface:686284d942a70c576d3538a0ee80e825 ComputeContractGateway@lib/abc/compute-contract-gateway/mod.ts:8
  depends_on:
  - sc.atproto-market
  id: sc.lib-abc-compute-contract-gateway
  intent: This context exists to fix the contract that separates compute provisioning
    consumers from the gateway transport that actually talks to a PDS and a VM provider.
    By naming ComputeContractGateway as a standalone interface in the abc layer, callers
    in the market can request a VM or an ephemeral or persistent worker and delete
    an existing compute receipt without importing the xrpc implementation or its dependencies
    on requester PDS wiring, SSH session providers and cloud-init helpers. The interface
    also pins the lifecycle obligation that a gateway must be started before use and
    torn down afterwards, and pins the shared shapes (CallerIdentity, ComputeRequestVMInput,
    ComputeRequestWorkerInput, GatewayComputeResponse) that cross that boundary, so
    a second transport or a test double can be substituted without changing call sites.
  interfaces:
  - file: lib/abc/compute-contract-gateway/mod.ts
    kind: interface
    name: ComputeContractGateway
    signature: export interface ComputeContractGateway
  name: lib-abc-compute-contract-gateway
  requirements:
  - codeRefs:
    - file:lib/abc/compute-contract-gateway/mod.ts
    - interface:686284d942a70c576d3538a0ee80e825
    id: r.caller-and-input-types
    level: SHOULD
    text: The interface should keep CallerIdentity, ComputeRequestVMInput, ComputeRequestWorkerInput
      and GatewayComputeResponse as the shared types crossing the boundary, so callers
      and implementations agree on request identity, request payload and response
      shape without redefining them per transport.
  - codeRefs:
    - interface:686284d942a70c576d3538a0ee80e825
    id: r.delete-compute
    level: MUST
    text: ComputeContractGateway must expose deleteCompute taking a CallerIdentity,
      a receipt URI, a receipt CID and a token, resolving to an object with a boolean
      ok field, so a caller can tear down an existing compute allocation identified
      by its receipt record and learn whether the deletion succeeded.
  - codeRefs:
    - file:lib/abc/compute-contract-gateway/mod.ts
    - interface:686284d942a70c576d3538a0ee80e825
    id: r.expose-gateway-interface
    level: MUST
    text: The compute-contract-gateway abc module must export a single ComputeContractGateway
      interface that the transport, Hono factory and market callers all depend on,
      so that provisioning callers never import a concrete gateway implementation
      directly.
  - codeRefs:
    - interface:686284d942a70c576d3538a0ee80e825
    id: r.gateway-identity-field
    level: MUST
    text: ComputeContractGateway must expose a did string field identifying the gateway,
      so callers can address the gateway's own repository and service endpoint without
      inspecting the underlying PDS object.
  - codeRefs:
    - interface:686284d942a70c576d3538a0ee80e825
    id: r.gateway-lifecycle
    level: MUST
    text: ComputeContractGateway must expose an async beginServe that brings the gateway
      into a serving state and an async dispose that releases it, so a caller can
      start and stop a gateway deterministically around its use rather than relying
      on implicit startup.
  - codeRefs:
    - interface:686284d942a70c576d3538a0ee80e825
    id: r.provisioning-calls
    level: MUST
    text: ComputeContractGateway must expose requestComputeVM, requestComputeWorkerEphemeral
      and requestComputeWorkerPersistent, each accepting a CallerIdentity plus a VM
      or worker input record and resolving to a GatewayComputeResponse, so VM and
      worker provisioning differ only by the call made and the input shape passed.
  upstream: self
