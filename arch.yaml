    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
    - type_alias:635b87d49390c20cc0c03a3b2717fce8
    id: r.params-empty
    level: MUST
    text: The procedure declares an empty parameter set via `l.params()`, so `$Params`
      resolves to an empty object type and the trigger carries no query or path arguments;
      all run data travels in the input body.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
    id: r.procedure-errors
    level: MUST
    text: The procedure is registered with the declared error names `InvalidRequest`,
      `Unauthorized`, and `Forbidden`, so a spindle rejecting a trigger can distinguish
      a malformed request from an unauthenticated caller and from an authenticated
      caller not permitted to trigger that pipeline.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
    id: r.service-proxy-auth
    level: SHOULD
    text: The procedure is documented as intended to be invoked through PDS service
      proxying via the `atproto-proxy` header pointed at the spindle's did:web service
      entry, so the user's PDS mints and signs the inter-service auth token, the spindle
      verifies the token issuer against their DID document, and the verified issuer
      must match the trigger's `actor`; the input mirrors the `sh.tangled.pipeline`
      fields a knot dispatches on a push or PR event.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
    id: r.workflow-result
    level: MUST
    text: A `WorkflowResult` typed object under the NSID fragment `#workflowResult`
      carries a required `workflow` string naming the submitted workflow stem and
      optional `logsUrl` and `statusUrl` fields constrained to URI strings; the output's
      `workflows` array references this type so each submitted pipeline run is reported
      by stem and, when available, by log and status stream URLs.
  upstream: self
