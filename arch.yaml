  id: sc.lib-common-market-lexicons-com
  intent: 'The context exists so that lexicon types for the `com.atproto`, `com.fedproxy`
    and `com.publicdomainrelay` authorities are importable from a single stable module
    path per authority, mirroring the NSID hierarchy onto the filesystem. Rather than
    importing deep generated paths, callers import the authority barrel and reach
    the sub-lexicon through the named namespace export (for example the `repo` namespace
    off the `com/atproto.ts` barrel). It is a pure re-export surface: no runtime logic,
    no hand-written types, and no state.'
  name: lib-common-market-lexicons-com
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto.ts
    - file:lib/common/market-lexicons/com/fedproxy.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay.ts
    id: r.barrel-per-nsid-authority
    level: SHOULD
    text: One barrel file exists per second-level NSID authority and the directory
      layout mirrors the NSID path, so the sub-lexicon namespace name equals the third
      NSID segment and the binding target equals `./<authority>/<segment>.ts`; a new
      authority or sub-lexicon is added by regenerating the barrel rather than by
      adding ad-hoc exports.
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto.ts
    id: r.com-atproto-exports-repo
    level: MUST
    text: The `com.atproto` authority barrel re-exports the `repo` sub-lexicon as
      a namespace binding named `repo`, sourced from the sibling `./atproto/repo.ts`
      module, so callers reach the `com.atproto.repo.*` types through that single
      named export.
  - codeRefs:
    - file:lib/common/market-lexicons/com/fedproxy.ts
    id: r.com-fedproxy-exports-three-namespaces
    level: MUST
    text: The `com.fedproxy` authority barrel re-exports three sub-lexicons as namespaces
      named `temp`, `rbac` and `sshPublicKey`, each sourced from the matching `./fedproxy/<name>.ts`
      module.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay.ts
    id: r.com-publicdomainrelay-exports-temp
    level: MUST
    text: The `com.publicdomainrelay` authority barrel re-exports the `temp` sub-lexicon
      as a namespace named `temp`, sourced from `./publicdomainrelay/temp.ts`.
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto.ts
    - file:lib/common/market-lexicons/com/fedproxy.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay.ts
    id: r.generated-files-not-hand-edited
    level: MUST
    text: 'Each of the three authority barrels carries the `THIS FILE WAS GENERATED
      BY "@atproto/lex". DO NOT EDIT.` header and is treated as generator output:
      changes are made by re-running the lexicon code generator over the source lexicons,
      never by editing the barrel by hand.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto.ts
    - file:lib/common/market-lexicons/com/fedproxy.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay.ts
    id: r.re-export-only-no-runtime-logic
    level: SHOULD
    text: The barrels contain only `export * as <name> from '<path>'` re-export statements,
      carrying no runtime code, validation, or default export, so importing a barrel
      pulls in nothing beyond the referenced sub-lexicon modules.
  upstream: self
- code:
  - lib/common/market-lexicons/com/atproto/repo.ts
  codeRefIndex:
  - file:lib/common/market-lexicons/com/atproto/repo.ts repo.ts@lib/common/market-lexicons/com/atproto/repo.ts
  depends_on:
  - sc.atproto-market
  id: sc.lib-common-market-lexicons-com-atproto
  intent: The context exists to give the com.atproto.repo lexicon family a stable
    import path inside the shared market-lexicons package. By re-exporting strongRef.ts
    as a namespace, it lets callers that already import the com/atproto/repo entry
    point pull in the strongRef lexicon definitions without knowing the on-disk file
    layout, and it keeps that binding distinct from the other lexicon namespaces that
    live alongside it. Because it is machine-generated, it is not a place for authored
    behavior; its only contract is that the namespace name and the target module stay
    in sync with what the generator produces.
  name: lib-common-market-lexicons-com-atproto
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo.ts
    id: r.generated-not-edited
    level: MUST
    text: The file is generated by "@atproto/lex" and carries a DO NOT EDIT header;
      its contents must be produced by that generator and not hand-modified, so regeneration
      stays the single source of truth.
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo.ts
    id: r.namespace-name-matches-lexicon
    level: SHOULD
    text: The exported namespace name should match the lexicon record name it wraps
      (strongRef wrapping the com.atproto.repo.strongRef lexicon), keeping the binding
      predictable for callers that resolve records by their com.atproto.repo NSID
      segments.
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo.ts
    id: r.strongref-namespace-reexport
    level: MUST
    text: The module re-exports the sibling lexicon module ./repo/strongRef.ts bound
      to the namespace name strongRef, so importing this entry point yields the com.atproto.repo
      strongRef lexicon under that single named namespace rather than a flat set of
      symbols.
  upstream: self
- code:
  - lib/common/market-lexicons/com/atproto/repo/strongRef.defs.ts
  - lib/common/market-lexicons/com/atproto/repo/strongRef.ts
  codeRefIndex:
  - file:lib/common/market-lexicons/com/atproto/repo/strongRef.defs.ts strongRef.defs.ts@lib/common/market-lexicons/com/atproto/repo/strongRef.defs.ts
  - file:lib/common/market-lexicons/com/atproto/repo/strongRef.ts strongRef.ts@lib/common/market-lexicons/com/atproto/repo/strongRef.ts
  depends_on:
  - sc.atproto-market
  id: sc.lib-common-market-lexicons-com-atproto-repo
  intent: This context is the lexicon-type layer for the `com.atproto.repo.strongRef`
    record, the canonical way to reference another AT Protocol record by its `at-uri`
    and `cid`. It exists because the market lexicons need a typed, validated representation
    of that reference pair that can be shared across the common, ABC, implementation
    and transport layers without each layer restating the schema. The files are machine-generated
    from the lexicon definition and are declared off-limits to manual editing, so
    this context documents the contract the generator produces (NSID, record shape,
    validator surface, barrel export) rather than behaviour anyone authors by hand.
  name: lib-common-market-lexicons-com-atproto-repo
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.ts
    id: r.barrel-export
    level: MUST
    text: '`strongRef.ts` re-exports everything from `strongRef.defs.ts` and additionally
      re-exports `main` as the module default, so both named imports and a default
      import of the typed object resolve through the barrel.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.defs.ts
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.ts
    id: r.consumer-import-path
    level: SHOULD
    text: Consumers should import the strongRef type and helpers from this package
      path rather than re-declaring a cid/uri pair locally, so validation stays identical
      everywhere a record reference is produced or checked.
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.defs.ts
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.ts
    id: r.generated-do-not-edit
    level: MUST
    text: Both files are generated by `@atproto/lex` and carry the 'DO NOT EDIT' banner
      at the top; changes to the strongRef schema must come from regenerating the
      lexicon, never from hand-editing these files.
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.defs.ts
    id: r.main-record-shape
    level: MUST
    text: 'The `Main` type describes the record as an object with an optional `$type`
      literal `com.atproto.repo.strongRef` plus two required fields: `cid`, typed
      as `l.CidString`, and `uri`, typed as `l.AtUriString` — i.e. a strong reference
      is a CID paired with an AT-URI.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.defs.ts
    id: r.nsid-identity
    level: MUST
    text: The module exports `$nsid` with the value `com.atproto.repo.strongRef`,
      and `$type` is that same NSID string, so consumers can identify and dispatch
      on the record type without a literal.
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.defs.ts
    id: r.schema-constraints
    level: MUST
    text: 'The exported `main` value is built with `l.typedObject<Main>` over `l.object({
      cid: l.string({format: ''cid''}), uri: l.string({format: ''at-uri''}) })`, so
      runtime validation enforces the `cid` and `at-uri` string formats on the corresponding
      fields.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/atproto/repo/strongRef.defs.ts
    id: r.validator-surface
    level: MUST
    text: 'The module re-exports the full `@atproto/lex` codec surface bound to `main`:
      `$isTypeOf`, `$build`, `$assert`, `$check`, `$cast`, `$ifMatches`, `$matches`,
      `$parse`, `$safeParse`, `$validate` and `$safeValidate`, so callers can construct,
      narrow, parse and validate a strongRef through the same object.'
  upstream: self
