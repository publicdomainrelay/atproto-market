    id: r.generated-module-pairing
    level: MUST
    text: 'Every market lexicon is published as a pair: a `<name>.defs.ts` file that
      declares `$nsid`, the schema value named `main`, and `$lxm`, and a `<name>.ts`
      wrapper that does nothing but `export * from ''./<name>.defs.ts''` and `export
      { main as default } from ''./<name>.defs.ts''`, so a consumer can import either
      the full defs surface or the default schema value. Both files carry the `THIS
      FILE WAS GENERATED BY "@atproto/lex". DO NOT EDIT.` header, so hand edits to
      either are out of contract.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/listBidders.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/listBidders.ts
    id: r.list-bidders-query
    level: MUST
    text: '`listBidders` is an `l.query` whose params are `payloadNsid` (optional,
      string with `nsid` format), `maxResults` (optional integer, minimum 1, maximum
      200, defaulting to 50) and `cursor` (optional string); its JSON output body
      carries `bidders` (an array of the `bidderItem` typed object with fields `bidderDid`
      as a `did`-formatted string and `appliesTo` as a string array) plus an optional
      `cursor`, and the query declares `InvalidRequest` as its only error, so a registry
      listing that filters by payload NSID and paginates must speak exactly this shape.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/bid.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/market/listBidders.defs.ts
