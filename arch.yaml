    kind: type_alias
    name: FreeSettlementEnv
    signature: 'type FreeSettlementEnv = { Variables: { agent: Agent; resolve: RecordResolver
      } }'
  - file: lib/hono-factory-market-settlement-free/mod.ts
    kind: function
    name: createFreeSettlementFactory
    signature: 'function createFreeSettlementFactory(config: FreeSettlementConfig)'
  name: lib-hono-factory-market-settlement-free
  requirements:
  - codeRefs:
    - function:7bbe9c9808ae3467009f796d9d61f7a7
    - interface:d9c1f785121068db886f45f3e476e730
    id: r.config-defaults
    level: MUST
    text: The factory destructures its config at creation time, defaulting log to
      noopLog and path to "free/receipt" when the caller omits them, so the route
      is always defined and logging never throws on an unconfigured deployment.
  - codeRefs:
    - function:7bbe9c9808ae3467009f796d9d61f7a7
    - interface:d9c1f785121068db886f45f3e476e730
    id: r.dependencies-injected
    level: SHOULD
    text: The factory reads agent, resolver, and signer through the config callbacks
      and value on every request rather than capturing them once, so a caller can
      rotate the agent or signer without rebuilding the app.
  - codeRefs:
    - file:lib/hono-factory-market-settlement-free/mod.ts
    - interface:d9c1f785121068db886f45f3e476e730
    id: r.export-config-interface
    level: MUST
    text: 'The module exports FreeSettlementConfig, the injection surface for the
      factory: required getAgent returning an Agent, resolve as a RecordResolver,
      and getSigner returning a RecordSigner; optional log as a Logger and optional
      path as the mount path string.'
  - codeRefs:
    - file:lib/hono-factory-market-settlement-free/mod.ts
    - type_alias:259f1f8ce12ab1cae693c13fa0c86028
    id: r.export-env-type
    level: MUST
    text: The module exports FreeSettlementEnv as the Hono environment type used by
      the factory, declaring Variables with agent (Agent) and resolve (RecordResolver)
      so downstream middleware and handlers can read the request-scoped agent and
      record resolver from the Hono context.
  - codeRefs:
    - file:lib/hono-factory-market-settlement-free/mod.ts
    - function:7bbe9c9808ae3467009f796d9d61f7a7
    id: r.factory-entrypoint
    level: MUST
    text: createFreeSettlementFactory accepts a FreeSettlementConfig and returns a
      factory built by createFactory parameterised with FreeSettlementEnv, so callers
      obtain a mountable app rather than a running server.
  - codeRefs:
    - function:7bbe9c9808ae3467009f796d9d61f7a7
    id: r.json-response
    level: MUST
    text: The handler responds with c.json({ uri, cid }) taken from the StrongRef
      returned by mintGrantForAccepts, so the client receives exactly the minted receipt
      reference and nothing else.
  - codeRefs:
    - function:7bbe9c9808ae3467009f796d9d61f7a7
    id: r.log-request
    level: MUST
    text: On each request the handler logs an info entry "free grant receipt requested"
      carrying the parsed acceptsUri and acceptsCid before any minting work happens.
  - codeRefs:
    - function:7bbe9c9808ae3467009f796d9d61f7a7
    - interface:d9c1f785121068db886f45f3e476e730
    id: r.mint-grant
    level: MUST
    text: The handler mints the receipt by calling mintGrantForAccepts with agent
      from getAgent(), the configured resolve, the parsed acceptsUri and acceptsCid,
      and signer from getSigner(), then logs an info entry "receipts.free minted"
      with the resulting uri and cid.
  - codeRefs:
    - file:lib/hono-factory-market-settlement-free/mod.ts
    - function:7bbe9c9808ae3467009f796d9d61f7a7
    id: r.mount-get-route
    level: MUST
    text: initApp registers a GET handler on `/${path}/*` and derives the acceptsUri
      and acceptsCid pair by calling parseGrantPath(c.req.path, `${path}/`), so the
      receipt URL shape and the mount prefix stay in agreement.
  - codeRefs:
    - file:lib/hono-factory-market-settlement-free/deno.json
    id: r.package-config
    level: MAY
    text: The package carries its own deno.json so the factory can be imported as
      a standalone workspace member independent of the CLI that mounts it.
  upstream: self
- code:
  - lib/hono-factory-market-settlement-x402/mod.ts
  codeRefIndex:
  - file:lib/hono-factory-market-settlement-x402/mod.ts mod.ts@lib/hono-factory-market-settlement-x402/mod.ts
  - function:78e258a8c5323f8774599a9e9adf6dad createX402SettlementFactory@lib/hono-factory-market-settlement-x402/mod.ts:30
  - interface:689a63cbfa61ba7bfe171e76eeea36d4 X402SettlementConfig@lib/hono-factory-market-settlement-x402/mod.ts:19
  - type_alias:aed7d5829498218c0606453c9468be76 X402SettlementEnv@lib/hono-factory-market-settlement-x402/mod.ts:12
  depends_on:
  - sc.atproto-market
  id: sc.lib-hono-factory-market-settlement-x402
  intent: 'This context exists to bind the x402 settlement server logic to an HTTP
    surface: it is the Hono factory layer that turns the path-parsing and receipt-minting
    helpers into a route mounted by the application, while keeping agent, resolver,
    signer and payment middleware injected by the caller rather than hard-coded.'
  interfaces:
  - file: lib/hono-factory-market-settlement-x402/mod.ts
    kind: interface
    name: X402SettlementConfig
    signature: 'interface X402SettlementConfig { getAgent: () => Agent; resolve: RecordResolver;
      getSigner: () => RecordSigner; log?: Logger; path?: string; paymentMiddleware?:
      MiddlewareHandler }'
  - file: lib/hono-factory-market-settlement-x402/mod.ts
    kind: type_alias
    name: X402SettlementEnv
    signature: 'type X402SettlementEnv = { Variables: { agent: Agent; resolve: RecordResolver
      } }'
  - file: lib/hono-factory-market-settlement-x402/mod.ts
    kind: function
    name: createX402SettlementFactory
    signature: 'createX402SettlementFactory(config: X402SettlementConfig)'
  name: lib-hono-factory-market-settlement-x402
  requirements:
  - codeRefs:
    - function:78e258a8c5323f8774599a9e9adf6dad
    - interface:689a63cbfa61ba7bfe171e76eeea36d4
    id: r.config-optional-overrides
    level: MAY
    text: X402SettlementConfig may carry an optional log of type Logger, an optional
      path string, and an optional paymentMiddleware of type MiddlewareHandler; when
      log is absent it defaults to noopLog and when path is absent it defaults to
      "x402/receipt".
  - codeRefs:
    - file:lib/hono-factory-market-settlement-x402/mod.ts
    - interface:689a63cbfa61ba7bfe171e76eeea36d4
    id: r.config-required-dependencies
    level: MUST
    text: X402SettlementConfig must require getAgent returning an Agent, resolve of
      type RecordResolver, and getSigner returning a RecordSigner, so receipt minting
      always has an agent, a resolver and a signer supplied by the caller.
  - codeRefs:
    - file:lib/hono-factory-market-settlement-x402/mod.ts
    - type_alias:aed7d5829498218c0606453c9468be76
    id: r.env-variables
    level: MUST
    text: X402SettlementEnv must declare Hono Variables carrying an agent of type
      Agent and a resolve of type RecordResolver, so handlers can read the agent and
      resolver from the request context.
  - codeRefs:
    - function:78e258a8c5323f8774599a9e9adf6dad
    - interface:689a63cbfa61ba7bfe171e76eeea36d4
    - type_alias:aed7d5829498218c0606453c9468be76
    id: r.factory-returns-hono-factory
    level: MUST
    text: createX402SettlementFactory must accept an X402SettlementConfig and return
      a factory over X402SettlementEnv via createFactory, so the returned value can
      be mounted by the host application.
  - codeRefs:
    - file:lib/hono-factory-market-settlement-x402/mod.ts
    - function:78e258a8c5323f8774599a9e9adf6dad
    id: r.json-response
    level: MUST
    text: The handler must respond with c.json containing the minted receipt's uri
      and cid.
  - codeRefs:
    - file:lib/hono-factory-market-settlement-x402/mod.ts
    - function:78e258a8c5323f8774599a9e9adf6dad
    id: r.logging
    level: MUST
    text: The handler must log an informational "x402 receipt requested" entry carrying
      acceptsUri and acceptsCid before minting, and an informational "receipts.x402
      minted" entry carrying the minted uri and cid afterwards.
  - codeRefs:
    - file:lib/hono-factory-market-settlement-x402/mod.ts
    - function:78e258a8c5323f8774599a9e9adf6dad
    id: r.mint-receipt
    level: MUST
    text: The handler must mint the receipt by calling mintReceiptForAccepts with
      the current agent from getAgent(), the configured resolve, the parsed acceptsUri
      and acceptsCid, and the signer from getSigner().
  - codeRefs:
    - file:lib/hono-factory-market-settlement-x402/mod.ts
    - function:78e258a8c5323f8774599a9e9adf6dad
    id: r.payment-middleware-mount
    level: MUST
    text: When paymentMiddleware is provided, the factory must apply it with app.use
      on /<path>/* so every request under the configured path passes through payment
      handling before the receipt handler runs.
  - codeRefs:
    - file:lib/hono-factory-market-settlement-x402/mod.ts
    - function:78e258a8c5323f8774599a9e9adf6dad
    id: r.receipt-get-route
    level: MUST
    text: The factory must register a GET handler on /<path>/* that parses the request
      path with parseReceiptPath against the "<path>/" prefix into acceptsUri and
      acceptsCid, and that parsing plus the subsequent mint determine the response.
  upstream: self
- code:
  - lib/hono-factory-requester-xrpc/mod.ts
  codeRefIndex:
  - file:lib/hono-factory-requester-xrpc/deno.json deno.json@lib/hono-factory-requester-xrpc/deno.json
  - file:lib/hono-factory-requester-xrpc/mod.ts mod.ts@lib/hono-factory-requester-xrpc/mod.ts
  - function:4adb00e3e75b63bbad98d6f295adf81c createRequesterFactory@lib/hono-factory-requester-xrpc/mod.ts:57
  - interface:24e3920dde2766781bd325714476a696 RequesterFactoryOptions@lib/hono-factory-requester-xrpc/mod.ts:17
  depends_on:
  - sc.atproto-market
  id: sc.lib-hono-factory-requester-xrpc
  intent: 'This context exists so a requester process can mount the inbound submitBid
    endpoint without hand-writing the handler wiring each time: it bridges the market-atproto
    handler implementation (createSubmitBidHandler, createRecordResolver) to whatever
    Hono app the caller already runs, keeping the transport-specific registration
    in one small factory that the CLI entrypoint calls. It isolates the defaulting
    rules (service IDs, audience DIDs, hostname extraction, logger shape) so every
    requester applies the same auth audience and routing conventions.'
  interfaces:
  - file: lib/hono-factory-requester-xrpc/mod.ts
    kind: interface
    name: RequesterFactoryOptions
    signature: 'interface RequesterFactoryOptions { app: { post(path: string, handler:
      (c: HonoContext) => Response | Promise<Response>): void }; idResolver: IdResolver;
      did: string; hostname?: (req: Request) => string; audienceDids?: string[]; serviceIds?:
      string[]; onBid: SubmitBidCallback; log?: Logger | LoggerInterface }'
  - file: lib/hono-factory-requester-xrpc/mod.ts
    kind: function
    name: createRequesterFactory
    signature: '(opts: RequesterFactoryOptions): Promise<{ stop: () => void }>'
  name: lib-hono-factory-requester-xrpc
  requirements:
  - codeRefs:
    - function:4adb00e3e75b63bbad98d6f295adf81c
    id: r.async-factory
    level: SHOULD
    text: The factory is async and resolves to the stop handle, leaving room for setup
      that must be awaited before the route is usable without changing the call shape.
  - codeRefs:
    - file:lib/hono-factory-requester-xrpc/mod.ts
    - function:4adb00e3e75b63bbad98d6f295adf81c
    id: r.audience-dids-include-self
    level: MUST
    text: The factory must always build the inbound service-auth audience set with
      this requester's own did first, appending any caller-supplied audienceDids after
      it, so tokens minted for the requester itself and for the extra audiences both
      verify.
  - codeRefs:
    - file:lib/hono-factory-requester-xrpc/mod.ts
    - function:4adb00e3e75b63bbad98d6f295adf81c
    id: r.default-hostname-extractor
    level: MUST
    text: When hostname is omitted the factory must default to an extractor that reads
      the request's `host` header, tolerating a missing header as the empty string,
      and strips any port by taking the substring before the first colon.
  - codeRefs:
    - file:lib/hono-factory-requester-xrpc/mod.ts
    - function:4adb00e3e75b63bbad98d6f295adf81c
    id: r.default-service-ids
    level: MUST
    text: When serviceIds is omitted the factory must fall back to the single service
      id `pdr_temp_market`, and must pass that resolved list through to createSubmitBidHandler
      for submitBid routing.
  - codeRefs:
    - file:lib/hono-factory-requester-xrpc/mod.ts
    - interface:24e3920dde2766781bd325714476a696
    id: r.export-factory-options
    level: MUST
    text: The module must export RequesterFactoryOptions, the single options bag the
      factory accepts, whose required members are app (any object with a post(path,
      handler) method), idResolver (the DID resolver used for service-auth audience
      verification), did (this requester's did:plc) and onBid (SubmitBidCallback invoked
      when a bid is received), and whose optional members are hostname, audienceDids,
      serviceIds and log.
  - codeRefs:
    - file:lib/hono-factory-requester-xrpc/mod.ts
    - function:4adb00e3e75b63bbad98d6f295adf81c
    id: r.handler-deps-wiring
    level: MUST
    text: The factory must construct the submitBid handler with deps carrying the
      resolved hostname, the idResolver, a record resolver derived from that same
      idResolver, the resolved audienceDids and the normalized log, together with
      the resolved serviceIds and the caller's onBid callback.
  - codeRefs:
    - function:4adb00e3e75b63bbad98d6f295adf81c
    id: r.logger-normalization
    level: MUST
    text: When log is supplied the factory must normalize it to a callable logger,
      passing a function-valued log through unchanged and otherwise adapting an object
      logger by dispatching each call to the method named by the level and silently
      doing nothing when that method is absent; when log is omitted the deps carry
      no logger.
  - codeRefs:
    - file:lib/hono-factory-requester-xrpc/deno.json
    - file:lib/hono-factory-requester-xrpc/mod.ts
    id: r.package-metadata
    level: SHOULD
    text: The package ships its own Deno configuration at lib/hono-factory-requester-xrpc/deno.json
      alongside the single mod.ts entrypoint.
  - codeRefs:
    - file:lib/hono-factory-requester-xrpc/mod.ts
    - function:4adb00e3e75b63bbad98d6f295adf81c
    id: r.register-submitbid-route
    level: MUST
    text: createRequesterFactory must register exactly one route on the supplied app
      by calling app.post with the path `/xrpc/${SUBMIT_BID_NSID}`, and the registered
      handler must translate the Hono context into the raw Request (c.req.raw) that
      the submitBid handler consumes.
  - codeRefs:
    - file:lib/hono-factory-requester-xrpc/mod.ts
    - function:4adb00e3e75b63bbad98d6f295adf81c
    id: r.return-stop-handle
    level: MUST
    text: createRequesterFactory must return a handle object exposing a stop function,
      and that stop function is a no-op because the route already registered on the
      caller's app is not unregistered.
  upstream: self
- code:
  - lib/hono-factory-secrets-oidc/mod.ts
  codeRefIndex:
  - file:lib/hono-factory-secrets-oidc/mod.ts mod.ts@lib/hono-factory-secrets-oidc/mod.ts
  - function:9217ff283324c4a352117c8801e75b4a createSecretsApp@lib/hono-factory-secrets-oidc/mod.ts:19
  - function:d93e06a7dd7538ef41434823de865c6e extractBearer@lib/hono-factory-secrets-oidc/mod.ts:13
  - interface:7e777067ac67ae39e4b4da5c05ea6802 SecretsFactoryOptions@lib/hono-factory-secrets-oidc/mod.ts:6
  depends_on:
  - sc.atproto-market
  id: sc.lib-hono-factory-secrets-oidc
  intent: This context exists to separate the transport concern of serving secrets
    (route registration, bearer extraction, JSON response shape, 401 error shape,
    logging) from the policy concern of deciding who may read them. By accepting a
    SecretsAuthorizer, a getSecrets callback, an optional route and an optional logger
    through SecretsFactoryOptions, the factory lets a caller mount the same secrets
    endpoint in different hosts and test it without real service-auth wiring, whereas
    the authorization implementation and the secret entry shape live in their own
    packages.
  interfaces:
  - file: lib/hono-factory-secrets-oidc/mod.ts
    kind: interface
    name: SecretsFactoryOptions
    signature: 'interface SecretsFactoryOptions { authorizer: SecretsAuthorizer; getSecrets:
      () => SecretEntry[]; route?: string; log?: (event: string, extra?: Record<string,
      unknown>) => void }'
  - file: lib/hono-factory-secrets-oidc/mod.ts
    kind: function
    name: createSecretsApp
    signature: 'createSecretsApp(opts: SecretsFactoryOptions): Hono'
  - file: lib/hono-factory-secrets-oidc/mod.ts
    kind: function
    name: extractBearer
    signature: 'extractBearer(authHeader: string | undefined): string'
  name: lib-hono-factory-secrets-oidc
  requirements:
  - codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    - function:d93e06a7dd7538ef41434823de865c6e
    id: r.bearer-token-then-authorize
    level: MUST
    text: The GET handler must read the Authorization request header through extractBearer
      and pass the resulting token, the resolved route and the request method to opts.authorizer.authorize,
      awaiting the returned subject.
  - codeRefs:
    - file:lib/hono-factory-secrets-oidc/mod.ts
    - function:9217ff283324c4a352117c8801e75b4a
    id: r.create-app-registers-get-route
    level: MUST
    text: createSecretsApp must build a new Hono app and register a GET handler on
      the route taken from opts.route, falling back to the SECRETS_ROUTE constant
      when opts.route is absent, and return that app.
  - codeRefs:
    - function:d93e06a7dd7538ef41434823de865c6e
    id: r.extract-bearer-lenient
    level: MUST
    text: 'extractBearer must be lenient rather than throwing: it returns the empty
      string when the header is missing and when the scheme is anything other than
      a case-insensitive "bearer", and returns the value token when the header is
      "Bearer <token>".'
  - codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    - interface:7e777067ac67ae39e4b4da5c05ea6802
    id: r.log-optional-noop
    level: MUST
    text: The log callback in SecretsFactoryOptions is optional; when it is omitted
      the app must substitute a no-op function so that the served and denied events
      can be emitted unconditionally without failing.
  - codeRefs:
    - interface:7e777067ac67ae39e4b4da5c05ea6802
    id: r.options-carry-authorizer-and-secrets
    level: MUST
    text: SecretsFactoryOptions must carry the required authorizer (a SecretsAuthorizer)
      and getSecrets (a zero-argument function returning SecretEntry[]), plus the
      optional route string and log callback, so callers inject both the policy and
      the secret source rather than the module resolving them itself.
  - codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    id: r.success-serves-secrets-as-json
    level: MUST
    text: On successful authorization the handler must call opts.getSecrets(), log
      the served event with the authorized subject and the secret count, and respond
      with the secret entries serialized as a JSON array.
  - codeRefs:
    - function:9217ff283324c4a352117c8801e75b4a
    id: r.unauthorized-maps-to-401
    level: MUST
    text: 'When opts.authorizer.authorize rejects, the handler must not propagate
      the error; it must log the denial and respond with HTTP 401 and a JSON body
      of the shape { id: "unauthorized", message: String(err) }.'
  upstream: self
