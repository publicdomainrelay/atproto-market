    text: The module declares the procedure NSID `com.publicdomainrelay.temp.tangled.spindle.trigger`
      as `$nsid`, re-exports it, and exports it again as `$lxm` so callers can address
      the method by its lexical name without hard-coding the string.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle/trigger.defs.ts
    - type_alias:35f9b05be484c9db3e66293938e0c7fc
    - type_alias:5b2e55e12944df104929ddb029ab7366
    id: r.output-shape
    level: MUST
    text: The JSON output payload requires a boolean `submitted` plus `knot`, `pipelineRkey`,
      and `ref` strings, and a `workflows` array of `WorkflowResult` references, with
      `$Output` and `$OutputBody` inferred from that schema and parameterized by a
