  id: sc.lib-abc-guest-capability
  intent: 'This context exists so that a capability running inside a guest VM has
    one shared, provider-agnostic interface for the compute contract: it contributes
    cloud-init before the RFP is sent, is handed its authorization once a bid wins,
    loses it when the VM is deleted, and is disposed at the end. The derived GrantVars
    and the subject-key helper exist to keep the guest''s presented token subject
    byte-identical to the subject the issuer''s prove handler assembles from the provider''s
    droplet tags, and to keep the audience baked into cloud-init (the requester''s
    own relay DID) distinct from the subject DID (which under OAuth is the user''s
    PDS DID, not the requester''s relay DID).'
  interfaces:
  - file: lib/abc/guest-capability/mod.ts
    kind: interface
    name: CapabilityPrepared
    signature: 'interface CapabilityPrepared { ctx?: Partial<CloudInitContext> }'
  - file: lib/abc/guest-capability/mod.ts
    kind: interface
    name: DeriveGrantVarsInput
    signature: 'interface DeriveGrantVarsInput { cfg: WifSimpleConfig; subjectDid:
      string; audienceDid: string; role: string }'
  - file: lib/abc/guest-capability/mod.ts
    kind: interface
    name: GrantVars
    signature: 'interface GrantVars { requesterDid: string; role: string; actx: string;
      issuerUri: string; subject: string; expectedAud: string }'
  - file: lib/abc/guest-capability/mod.ts
    kind: interface
    name: GuestCapability
    signature: 'interface GuestCapability { readonly id: string; prepare?(ctx: PrepareContext):
      Promise<CapabilityPrepared>; readonly userDataModule?: string | UserDataModule;
      onContract?(vars: GrantVars): void | Promise<void>; onRevoke?(): void | Promise<void>;
      dispose?(): Promise<void> }'
  - file: lib/abc/guest-capability/mod.ts
    kind: interface
    name: PrepareContext
    signature: 'interface PrepareContext { vmName: string; requesterDid: string; ingressProxyHost:
      string; signer: { did(): string; sign(bytes: Uint8Array): Promise<Uint8Array>
      }; tls?: boolean; log: (event: string, extra?: Record<string, unknown>) => void
      }'
  - file: lib/abc/guest-capability/mod.ts
    kind: interface
    name: WifSimpleConfig
    signature: 'interface WifSimpleConfig { issuer_uri: string; actx: string; subject?:
      string; to_issue?: string; accept_path?: string; actx_path?: string; token_path?:
      string; url_path?: string; url_route?: string }'
  - file: lib/abc/guest-capability/mod.ts
    kind: function
    name: deriveGrantVars
    signature: 'function deriveGrantVars(input: DeriveGrantVarsInput): GrantVars'
  - file: lib/abc/guest-capability/mod.ts
    kind: function
    name: isWifSimpleConfig
    signature: 'function isWifSimpleConfig(v: unknown): v is WifSimpleConfig'
  - file: lib/abc/guest-capability/mod.ts
    kind: function
    name: subjectKeyOf
    signature: 'function subjectKeyOf(did: string): string'
  name: lib-abc-guest-capability
  requirements:
  - codeRefs:
    - interface:4a42c93f29714a7a7b77a0bc305ced37
    - interface:5f5c338392bdac0f1231e29c58ed026a
    - interface:e5b63e63421abe6ef6831d96f92908ca
    - interface:ef44ecde4500e20b9d199d5a1a0e1fbd
    id: r.capability-lifecycle
    level: MUST
    text: 'GuestCapability defines a guest-side concern spanning the compute contract
      with a required readonly id string and readonly optional userDataModule (string
      or UserDataModule), plus the optional hooks: prepare before the RFP is sent,
      onContract when a bid wins (given GrantVars), onRevoke when the VM delete event
      is sent, and dispose to release resources at the end; each async hook may return
      a void or a promise.'
  - codeRefs:
    - interface:4a42c93f29714a7a7b77a0bc305ced37
    - interface:5f5c338392bdac0f1231e29c58ed026a
    id: r.capability-prepared
    level: MUST
    text: CapabilityPrepared is the result of prepare, carrying an optional partial
      CloudInitContext that the capability contributes to cloud-init (typically paired
      with its userDataModule).
  - codeRefs:
    - function:d4dc1e02e9dae26d725c63e37e4e73ad
    - interface:08837ecc0b4c67d61d030acb83c87cff
    - interface:b7bf881b25d7887524eb96f3c3e767d7
    - interface:ef44ecde4500e20b9d199d5a1a0e1fbd
    id: r.derive-grant-vars
    level: MUST
    text: 'deriveGrantVars maps a DeriveGrantVarsInput to GrantVars: requesterDid
      is the audienceDid, role and actx/issuerUri are copied from the WIF config,
      expectedAud is the string api://ATProto?actx=<audienceDid>, and subject is rendered
      from the config''s subject template (defaulting to actx:{actx}:plc:{did-plc-key}:role:{role})
      with actx, didPlcKey=subjectKeyOf(subjectDid) and role.'
  - codeRefs:
    - function:d4dc1e02e9dae26d725c63e37e4e73ad
    - interface:ef44ecde4500e20b9d199d5a1a0e1fbd
    id: r.grant-vars-shape
    level: MUST
    text: 'GrantVars carries everything a capability needs to authorize the guest
      derived from the winning bid: requesterDid, role, actx, issuerUri, subject and
      expectedAud, all strings.'
  - codeRefs:
    - file:lib/abc/guest-capability/deno.json
    - file:lib/abc/guest-capability/mod.ts
    id: r.layer-dependencies
    level: MUST
    text: The package publishes a single ./mod.ts export under the name @publicdomainrelay/guest-capability-abc
      and depends only on the JSR packages @publicdomainrelay/cloud-init-common (for
      CloudInitContext and UserDataModule) and @publicdomainrelay/fedproxy-rbac-common
      (for renderSubject).
  - codeRefs:
    - interface:4a42c93f29714a7a7b77a0bc305ced37
    - interface:e5b63e63421abe6ef6831d96f92908ca
    id: r.prepare-context-shape
    level: MUST
    text: 'PrepareContext supplies a capability''s prepare hook with vmName, requesterDid,
      ingressProxyHost, a signer exposing did() and sign(bytes): Promise<Uint8Array>,
      an optional tls flag, and a log(event, extra?) callback for emitting structured
      events.'
  - codeRefs:
    - file:lib/abc/guest-capability/mod.ts
    - function:843034a41b996ad93e7eddbd263f3ff7
    id: r.subject-key-tail
    level: MUST
    text: subjectKeyOf returns the last colon-separated segment of a DID (falling
      back to the whole input when split yields nothing), matching how the provider
      tags the droplet oidc-sub:plc:<tail> so the guest-rendered subject equals the
      subject the issuer assembles from those tags.
  - codeRefs:
    - function:d4dc1e02e9dae26d725c63e37e4e73ad
    - interface:08837ecc0b4c67d61d030acb83c87cff
    id: r.subject-vs-audience-did
    level: MUST
    text: 'DeriveGrantVarsInput keeps subjectDid and audienceDid as separate inputs
      and documents why: the subject DID is the DID that authored and submitted the
      market records (under OAuth the user''s PDS DID, which is not the requester''s
      local relay DID), while the audience DID is baked into cloud-init before a bid
      exists and so can only be the requester''s own relay DID.'
  - codeRefs:
    - function:9fc5d3416856b249927132984c52288d
    - interface:b7bf881b25d7887524eb96f3c3e767d7
    id: r.wif-guard
    level: MUST
    text: isWifSimpleConfig is a runtime type guard that rejects any non-object or
      null value and returns true only when both issuer_uri and actx are strings,
      so a bid's WIF config can be narrowed from unknown before use.
  - codeRefs:
    - file:lib/abc/guest-capability/mod.ts
    - interface:b7bf881b25d7887524eb96f3c3e767d7
    id: r.wif-simple-config-shape
    level: MUST
    text: 'WifSimpleConfig models the resolved com.publicdomainrelay.temp.compute.config.wif.simple
      record from the winning bid: issuer_uri and actx are required strings, while
      subject and the to_issue/accept_path/actx_path/token_path/url_path/url_route
      fields are optional strings.'
  upstream: self
