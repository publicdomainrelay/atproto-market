  id: sc.lib-cocore-api
  intent: This context exists so callers elsewhere in atproto-market can manage cocore
    API keys without hand-rolling XRPC plumbing or service-auth signing. It isolates
    the cocore-specific details — the default AppView host, the did:web audience derivation,
    the three api-key NSIDs, and the error convention — behind a small typed surface,
    and keeps token minting injectable so the caller supplies getServiceAuth rather
    than the module owning credentials.
  interfaces:
  - file: lib/cocore-api/mod.ts
    kind: interface
    name: ApiKey
    signature: 'interface ApiKey { id: string; name: string; createdAt: string; lastUsedAt?:
      string }'
  - file: lib/cocore-api/mod.ts
    kind: interface
    name: CocoreClient
    signature: 'interface CocoreClient { createApiKey(name: string): Promise<CreateApiKeyResponse>;
      listApiKeys(): Promise<ListApiKeysResponse>; deleteApiKey(id: string): Promise<void>
      }'
  - file: lib/cocore-api/mod.ts
    kind: interface
    name: CocoreClientOptions
    signature: 'interface CocoreClientOptions { appviewUrl?: string; fetch?: typeof
      fetch; getServiceAuth: (aud: string, nsid: string) => Promise<string> }'
  - file: lib/cocore-api/mod.ts
    kind: interface
    name: CreateApiKeyResponse
    signature: 'interface CreateApiKeyResponse { token: string; key: ApiKey }'
  - file: lib/cocore-api/mod.ts
