- code:
  - lib/guest-capability-secrets/mod.ts
  codeRefIndex:
  - file:lib/guest-capability-secrets/deno.json deno.json@lib/guest-capability-secrets/deno.json
  - file:lib/guest-capability-secrets/mod.ts mod.ts@lib/guest-capability-secrets/mod.ts
  - function:0d24cd5f66964dd094175db073cc3baf createSecretsCapability@lib/guest-capability-secrets/mod.ts:37
  - interface:0c769a67d709c48b40d3f1032540989a CreateSecretsCapabilityOpts@lib/guest-capability-secrets/mod.ts:23
  depends_on:
  - sc.atproto-market
  id: sc.lib-guest-capability-secrets
  intent: 'This context exists to specify the guest-side secrets capability: the unit
    that exposes a set of SecretEntry values to a sandboxed guest over a per-contract
    OIDC-authorized HTTPS ingress, and that ties that exposure to the lifecycle of
    the capability grant. It exists so the host can hand a guest an addressable secrets
    endpoint (URL, route, audience, accept path) during prepare, grant scoped access
    on contract, and guarantee teardown on revoke or dispose, without the caller having
    to know about the keypair, relay, serve or authorizer wiring.'
  interfaces:
  - file: lib/guest-capability-secrets/mod.ts
    kind: interface
    name: CreateSecretsCapabilityOpts
    signature: 'interface CreateSecretsCapabilityOpts { secrets: SecretEntry[]; logger:
      StructuredLoggerInterface; route?: string; acceptPathVm?: string }'
  - file: lib/guest-capability-secrets/mod.ts
    kind: function
    name: createSecretsCapability
    signature: |-
      (
        opts: CreateSecretsCapabilityOpts,
      ): GuestCapability
  name: lib-guest-capability-secrets
  requirements:
  - codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
    id: r.capability-identity
    level: MUST
    text: The returned GuestCapability must identify itself with id SECRETS_CAPABILITY_ID
      and userDataModule "secrets", so the host can key its user data and capability
      registry on stable names.
  - codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
    id: r.exports-secrets-capability-factory
    level: MUST
    text: 'The package must export createSecretsCapability(opts: CreateSecretsCapabilityOpts):
      GuestCapability from lib/guest-capability-secrets/mod.ts, so a host can construct
      the secrets capability from a plain options object.'
  - codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
    id: r.oncontract-installs-grant
    level: MUST
    text: onContract must build an RBAC record from the grant vars (role, subject,
      issuerUri, expectedAud) plus the relay's ingressUrl and the resolved route,
      install it on the authorizer together with issuerUri and expectedAud, and log
      secrets_grant_installed; the service URL must degrade to the empty string when
      no relay exists yet.
  - codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
    id: r.option-defaults
    level: MUST
    text: When opts.route is absent the capability must fall back to SECRETS_ROUTE,
      and when opts.acceptPathVm is absent it must fall back to DEFAULT_ACCEPT_PATH_VM,
      so callers may omit both without losing a usable route or accept path.
  - codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - interface:0c769a67d709c48b40d3f1032540989a
    id: r.options-shape
    level: MUST
    text: CreateSecretsCapabilityOpts must carry the secrets to serve as SecretEntry[],
      a StructuredLoggerInterface logger, and optional route and acceptPathVm strings;
      the logger is required because every lifecycle step logs through it.
  - codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
    id: r.prepare-mounts-secrets-app
    level: MUST
    text: prepare must route "/" on the serve app to createSecretsApp, passing the
      shared authorizer, a getSecrets callback that returns opts.secrets, the resolved
      route, and a log adapter that forwards to logger.info, so secrets are only ever
      read through the authorizer-protected app.
  - codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
    id: r.prepare-returns-context
    level: MUST
    text: prepare must return a context containing secretsUrl from the relay's ingressUrl,
      secretsRoute set to the resolved route, secretsAcceptPath set to the resolved
      accept path, and secretsAud formatted as `api://ATProto?actx=<requesterDid>`
      from the prepare context, and must log secrets_server_ready with the URL, route
      and secret count.
  - codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
    id: r.prepare-starts-ingress-and-server
    level: MUST
    text: prepare must create an exportable Secp256k1 keypair, build an ingress through
      createIngress using the prepare context's ingressProxyHost, signer and tls with
      label "secrets", wrap that relay in createServe, and await beginServe, so the
      secrets endpoint is listening before the guest receives its address.
  - codeRefs:
    - file:lib/guest-capability-secrets/mod.ts
    - function:0d24cd5f66964dd094175db073cc3baf
    id: r.revoke-and-dispose
    level: MUST
    text: onRevoke must revoke the authorizer's grant and log secrets_grant_revoked,
      and dispose must additionally shut down the serve handle and clear the serve
      and relay references before resolving, so no secrets endpoint outlives the capability.
  - codeRefs:
    - file:lib/guest-capability-secrets/deno.json
    - file:lib/guest-capability-secrets/mod.ts
    id: r.single-module-package
    level: SHOULD
    text: The package should expose its whole surface from lib/guest-capability-secrets/mod.ts
      with only lib/guest-capability-secrets/deno.json beside it as package metadata,
      so consumers import one module path.
  upstream: self
- code:
  - lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
  codeRefIndex:
  - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts mod.ts@lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
  - function:35f62ddaabe8e88061e3c0f6d7f5c28c requireAuth@lib/hono-factory-compute-contract-gateway-xrpc/mod.ts:30
  - function:fb9c0b643b6c0ae7e354f595aa7280cf createComputeContractGatewayFactory@lib/hono-factory-compute-contract-gateway-xrpc/mod.ts:25
  - interface:9ce82a55642acec416e2eb4c3b27f13c ComputeContractGatewayFactoryOptions@lib/hono-factory-compute-contract-gateway-xrpc/mod.ts:18
  depends_on:
  - sc.atproto-market
  id: sc.lib-hono-factory-compute-contract-gateway-xrpc
  intent: 'This context exists so a process can stand up an atproto-speaking HTTP
    surface in front of any ComputeContractGateway implementation without hand-writing
    the transport each time. It fixes the wire contract of the compute gateway: which
    XRPC NSIDs are served, what the well-known did:web document advertises, how inter-service
    service-auth tokens are verified per method, and how gateway results and errors
    map onto HTTP status codes. Callers supply only a gateway implementation, a hostname,
    an IdResolver and an optional audience DID list, and receive a ready Hono app.'
  interfaces:
  - file: lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    kind: interface
    name: ComputeContractGatewayFactoryOptions
    signature: 'interface ComputeContractGatewayFactoryOptions { gateway: ComputeContractGateway;
      hostname: string; idResolver: IdResolver; audienceDids?: string[] }'
  - file: lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    kind: function
    name: createComputeContractGatewayFactory
    signature: '(opts: ComputeContractGatewayFactoryOptions): { app: Hono }'
  - file: lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    kind: function
    name: requireAuth
    signature: '(lxm: string)'
  name: lib-hono-factory-compute-contract-gateway-xrpc
  requirements:
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:35f62ddaabe8e88061e3c0f6d7f5c28c
    id: r.auth-failure-401
    level: MUST
    text: 'If verifyServiceAuth throws, the middleware returns a 401 JSON body { error:
      "Unauthorized", message: String(err) } and does not invoke the downstream handler;
      on success it awaits next.'
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:35f62ddaabe8e88061e3c0f6d7f5c28c
    id: r.auth-header-required
    level: MUST
    text: 'The requireAuth middleware factory closes over a per-route lxm string and,
      when the request has no authorization header, short-circuits with a 401 JSON
      body { error: "Unauthorized", message: "missing Authorization header" } instead
      of calling the downstream handler.'
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:fb9c0b643b6c0ae7e354f595aa7280cf
    id: r.cors-all-routes
    level: MUST
    text: The app applies the cors middleware to every route via app.use on the wildcard
      path.
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:fb9c0b643b6c0ae7e354f595aa7280cf
    id: r.delete-compute-handler
    level: MUST
    text: 'The deleteCompute handler parses the JSON body for receiptUri, receiptCid
      and token strings, calls gateway.deleteCompute({ did: "unknown" }, receiptUri,
      receiptCid, token ?? ""), and returns the result as JSON without setting an
      error-derived status code.'
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:fb9c0b643b6c0ae7e354f595aa7280cf
    id: r.did-web-document
    level: MUST
    text: 'GET /.well-known/did.json returns a DID document whose @context is ["https://www.w3.org/ns/did/v1"],
      whose id is did:web:<hostname>, and whose single service entry has id #<DEFAULT_GATEWAY_SERVICE_ID>,
      type PDRComputeContractGateway and serviceEndpoint https://<hostname>.'
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:fb9c0b643b6c0ae7e354f595aa7280cf
    - interface:9ce82a55642acec416e2eb4c3b27f13c
    id: r.factory-returns-hono-app
    level: MUST
    text: createComputeContractGatewayFactory takes a ComputeContractGatewayFactoryOptions
      bag and returns an object with a single app property holding a Hono instance;
      it destructures gateway, hostname, idResolver and audienceDids from the options.
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:fb9c0b643b6c0ae7e354f595aa7280cf
    id: r.health-endpoint
    level: MUST
    text: 'GET /health responds with the JSON body { status: "ok" }.'
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - interface:9ce82a55642acec416e2eb4c3b27f13c
    id: r.options-shape
    level: MUST
    text: The factory options must carry a required gateway of type ComputeContractGateway,
      a required hostname string, a required idResolver of type IdResolver, and an
      optional audienceDids string array.
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:fb9c0b643b6c0ae7e354f595aa7280cf
    id: r.request-compute-vm-issuer
    level: MUST
    text: 'The requestComputeVM handler parses the JSON body, takes body.payload as
      a string, base64-decodes the second dot-separated segment of that JWT-shaped
      payload and reads its iss claim as the caller DID, falling back to the string
      "unknown" when payload is absent, then calls gateway.requestComputeVM({ did:
      issuerDid }, body) and returns the result with status 500 when result.error
      is set and 200 otherwise; the handler also reads the authorization header into
      a local that is not otherwise used.'
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:35f62ddaabe8e88061e3c0f6d7f5c28c
    id: r.service-auth-verification
    level: MUST
    text: When an authorization header is present the middleware derives the audience
      host from the request Host header with any port suffix stripped, falling back
      to the configured hostname when the header is absent, and calls verifyServiceAuth
      with that hostname, the route lxm, serviceIds fixed to [DEFAULT_GATEWAY_SERVICE_ID],
      extraAudienceDids resolved to the configured audienceDids or else [gateway.did]
      when audienceDids is undefined, and the injected idResolver.
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:fb9c0b643b6c0ae7e354f595aa7280cf
    id: r.worker-routes-caller-did
    level: MUST
    text: 'The requestComputeWorkerEphemeral and requestComputeWorkerPersistent handlers
      parse the JSON body, call the corresponding gateway method with caller { did:
      "unknown" } and the body, and return the result with status 500 when result.error
      is set and 200 otherwise.'
  - codeRefs:
    - file:lib/hono-factory-compute-contract-gateway-xrpc/mod.ts
    - function:fb9c0b643b6c0ae7e354f595aa7280cf
    id: r.xrpc-post-routes
    level: MUST
