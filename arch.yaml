  id: sc.lib-requester-xrpc
  intent: 'This context exists so the atproto-market requester can find who is offering
    a compute service, prove the bidder is discoverable through relays, stand up a
    requester identity/repo, and then drive an SSH-tunnelled session against the winning
    bidder. It holds both the discovery/verification half (relay queries, relay visibility,
    endpoint resolution, bidder calls) and the transport half (keypair generation,
    ssh args, session provider, websocat, readiness polling, program execution), because
    the contract flow needs them in one place to run end to end. The default guest
    transport is now iroh: the guest''s dumbpipe listener is reached through a dumbpipe
    connection built from the iroh ticket the bidder publishes, and the legacy websocat-over-relay
    ProxyCommand remains only for the fedproxy-ssh transport. The OAuth handle and
    agent-application helpers exist so the same flow works when the requester authenticates
    through an OAuth session rather than a locally held key.'
