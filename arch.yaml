    text: beginServe must dynamically import createRequesterPDS from @publicdomainrelay/requester-xrpc,
      construct the PDS with the gateway options (label falling back to "compute-contract-gateway"),
      await its own beginServe, and then log gateway_ready with the resulting DID.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.delete-compute-stub
    level: MAY
    text: 'deleteCompute may ignore the caller identity, receipt uri, receipt cid
      and token and return { ok: true } unconditionally, as the gateway does not yet
      perform real deletion.'
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.did-requires-start
    level: MUST
    text: The did getter must throw an Error with the message "gateway not started"
      when the PDS has not been created, and otherwise return the PDS DID.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.dispose-guards-null
    level: MUST
    text: dispose must be a no-op when the PDS was never created and must otherwise
      delegate to the PDS dispose.
  - codeRefs:
    - function:03370a182fd0653c2e57c9c946423ce7
    - interface:ecee421eb7bb2708411146ff260c58b2
    id: r.factory-returns-gateway
    level: MUST
    text: createComputeContractGateway must accept a GatewayOptions object and return
      a ComputeContractGateway whose PDS handle starts out null, so any use before
      beginServe fails rather than silently operating without an identity.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - interface:ecee421eb7bb2708411146ff260c58b2
    id: r.options-shape
    level: MUST
    text: GatewayOptions must require a logger and a serve handle, and must accept
      optional privateKeyHex, plcDirectoryUrl, ingressProxyHost, fedingressHost, label,
      storagePath and relayUrls used to configure the underlying requester PDS and
      the compute contracts.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.request-methods-require-start
    level: MUST
    text: requestComputeVM, requestComputeWorkerEphemeral and requestComputeWorkerPersistent
      must each throw an Error with the message "gateway not started" when invoked
      before beginServe has created the PDS.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.request-vm-bids
    level: SHOULD
    text: requestComputeVM should synthesize a single-element bids array holding the
      winner DID, bid uri, bid cid and a zero cost when the contract reports more
      than zero bids, and an empty bids array otherwise.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.request-vm-contract
    level: MUST
    text: requestComputeVM must run the compute contract through runComputeContract
      with a VM name taken from the input role or a random compute-prefixed suffix,
      skipSsh and keepVm defaulting to true, rbac set to true, the caller's policy
      spec and policy engine, the configured plcDirectoryUrl, ingressProxyHost and
      relayUrls, the caller's extraBidderDids, and a fedproxy.com fedingressHost when
      none is configured.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.request-vm-response
    level: MUST
    text: When the VM contract returns an error, requestComputeVM must return that
      error together with the RFP uri and cid; otherwise it must return the receipt
      uri, cid and ok flag, the ssh readiness and exit code, the winner DID and bid
      uri and cid, the RFP uri and cid, and a VM fqdn of <flat vm name>--<flat DID>.<fedingressHost>
      with websocatUrl of wss://<vmFqdn>.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.request-worker-manifest
    level: MUST
    text: Both worker request methods must run the contract with a random worker-prefixed
      VM name, skipSsh and keepVm true, and a payloadFactory that reads WORKER_MANIFEST_NSID
      from @publicdomainrelay/compute-deno-common and writes a repo record of that
      NSID containing the caller's deno lock (defaulting to "{}"), deno json, source
      bundle and a creation timestamp.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.ssh-provider-per-request
    level: MUST
    text: Each request method must build its SSH session provider via createSshSessionProvider
      with the configured logger and hand it to runComputeContract, so SSH key material
      and polling are scoped to the individual request.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.worker-ephemeral-bidders
    level: MUST
    text: requestComputeWorkerEphemeral must pass the caller's extraBidderDids, defaulting
      to an empty array, while requestComputeWorkerPersistent must pass an empty extraBidderDids
      array; both must scope the contract to WORKER_MANIFEST_NSID through appliesToNsid.
  - codeRefs:
    - file:lib/compute-contract-gateway-xrpc/mod.ts
    - function:03370a182fd0653c2e57c9c946423ce7
    id: r.worker-response
    level: MUST
    text: Both worker request methods must return only the error with RFP uri and
      cid on failure, and otherwise the receipt uri, cid and ok flag together with
      the winner DID and the RFP uri and cid.
  upstream: self
- code:
  - lib/delegated-trust-badge-blue-keys/mod.ts
  codeRefIndex:
  - file:lib/delegated-trust-badge-blue-keys/mod.ts mod.ts@lib/delegated-trust-badge-blue-keys/mod.ts
  - function:473e9effb9d9e91445db68e031e329ea createBadgeBlueKeysDelegatedTrustResolver@lib/delegated-trust-badge-blue-keys/mod.ts:15
  - interface:05ddb65bca17c3188f02d33eda8b8481 DelegatedTrustBadgeBlueKeysOpts@lib/delegated-trust-badge-blue-keys/mod.ts:9
  - interface:9ba074d070c57eb2e62aa0df62cb0178 ListedRecord@lib/delegated-trust-badge-blue-keys/mod.ts:4
  depends_on:
  - sc.atproto-market
  id: sc.lib-delegated-trust-badge-blue-keys
  intent: 'This context exists so that delegated trust is transitive through an association
    record rather than through a direct vouch: an operator that vouches for a DID
    should also be trusted by that DID''s associated parties. It hides the two record
    shapes and the failure modes behind the DelegatedTrustResolver contract so market-bidder
    and requester-xrpc can wire it in without knowing the badgeBlueKeys layout.'
  interfaces:
  - file: lib/delegated-trust-badge-blue-keys/mod.ts
    kind: interface
    name: DelegatedTrustBadgeBlueKeysOpts
    signature: 'interface DelegatedTrustBadgeBlueKeysOpts { vouchResolver: VouchResolver;
      listOwnRecords(collection: string, opts?: { limit?: number }): Promise<ListedRecord[]>;
      log?(level: string, msg: string, meta?: Record<string, unknown>): void }'
  - file: lib/delegated-trust-badge-blue-keys/mod.ts
    kind: interface
    name: ListedRecord
    signature: 'interface ListedRecord { uri: string; value: Record<string, unknown>
      }'
  - file: lib/delegated-trust-badge-blue-keys/mod.ts
    kind: function
    name: createBadgeBlueKeysDelegatedTrustResolver
    signature: |-
      (
        opts: DelegatedTrustBadgeBlueKeysOpts,
      ): DelegatedTrustResolver
  name: lib-delegated-trust-badge-blue-keys
  requirements:
  - codeRefs:
    - function:473e9effb9d9e91445db68e031e329ea
    id: r-degrade-on-listing-failure
    level: MUST
    text: A failure while listing or scanning badgeBlueKeys records must be caught,
      reported through the logger at warn level with selfDid and the stringified error,
      and must leave the self-vouch set returned rather than failing the call.
  - codeRefs:
    - function:473e9effb9d9e91445db68e031e329ea
    - interface:05ddb65bca17c3188f02d33eda8b8481
    id: r-optional-logger
    level: MUST
    text: 'The log callback is optional: when opts.log is absent the resolver must
      use a no-op logger, and when present it must be called with a level, a message
      and a metadata object carrying fields such as challenge, service, keyId, selfDid,
      opVouchCount or error.'
  - codeRefs:
    - function:473e9effb9d9e91445db68e031e329ea
    id: r-two-association-shapes
    level: MUST
    text: 'A record must be read as an association when keyId equals selfDid and challenge
      is a did: string (canonical, challenge names the operator), and also when challenge
      equals selfDid and keyId is a did: string (legacy inverted, keyId names the
      operator); both shapes contribute their operator DID to the candidate set.'
  - codeRefs:
    - function:473e9effb9d9e91445db68e031e329ea
    id: r-union-operator-vouches
    level: MUST
    text: For every candidate operator the resolver must call vouchResolver.getVouchedDids(operator)
      and union the result into the returned set, so that a wrong candidate with no
      vouches adds nothing and the correct operator adds the vouches that matter.
  - codeRefs:
    - file:lib/delegated-trust-badge-blue-keys/mod.ts
    - interface:05ddb65bca17c3188f02d33eda8b8481
    id: r-vouch-resolver-injected
    level: MUST
    text: 'The module must not construct its own trust source: the vouchResolver and
      listOwnRecords capabilities arrive through DelegatedTrustBadgeBlueKeysOpts,
      keeping the module free of transport or repository dependencies.'
  - codeRefs:
    - function:473e9effb9d9e91445db68e031e329ea
    - interface:05ddb65bca17c3188f02d33eda8b8481
    id: r.factory-returns-resolver
    level: MUST
    text: createBadgeBlueKeysDelegatedTrustResolver must accept a DelegatedTrustBadgeBlueKeysOpts
      and return a DelegatedTrustResolver whose only method is getDelegatedTrustedDids(selfDid),
      which resolves to a Set of DID strings.
  - codeRefs:
    - function:473e9effb9d9e91445db68e031e329ea
    id: r.filter-association-services
    level: MUST
    text: Records whose service field is neither requester_associate nor bidder_associate
      must be skipped and must not contribute any candidate operator.
  - codeRefs:
    - function:473e9effb9d9e91445db68e031e329ea
    - interface:9ba074d070c57eb2e62aa0df62cb0178
    id: r.list-badge-blue-keys
    level: MUST
    text: The resolver must read the subject's own records through listOwnRecords
      for the badgeBlueKeys collection with a limit of 200, consuming each record's
      uri and value fields as described by ListedRecord.
  - codeRefs:
    - function:473e9effb9d9e91445db68e031e329ea
    id: r.seed-with-own-vouches
    level: MUST
    text: getDelegatedTrustedDids must seed the returned set with the DIDs vouchResolver.getVouchedDids(selfDid)
      yields, and must substitute an empty set instead of propagating an error when
      that call rejects.
  upstream: self
- code:
  - lib/did-key-ingress-proxy/mod.ts
  codeRefIndex:
  - file:lib/did-key-ingress-proxy/mod.ts mod.ts@lib/did-key-ingress-proxy/mod.ts
  - function:720938c17d8a919da0fa9510c65cc8d1 getServiceAuthToken@lib/did-key-ingress-proxy/mod.ts:51
  - function:ab0d43e74646836bd86d4b393d2cafa0 createIngress@lib/did-key-ingress-proxy/mod.ts:38
  - interface:da388f002919a2fd08b59e8f65646870 CreateIngressOpts@lib/did-key-ingress-proxy/mod.ts:8
  depends_on:
  - sc.atproto-market
  id: sc.lib-did-key-ingress-proxy
  intent: 'This context is the ingress side of the relay: it lets an application that
    already has a fetch handler be reached at a public did:web host through the xrpc-relay
    ingress proxy without the app managing transport, TLS, or service-auth itself.
    It exists so that a local or in-process service (bidder, PDS agent, gateway target)
    can declare a small set of options and get back an IngressRef it can advertise,
    with the WebSocket firehose path either proxied to a local TCP target or served
    directly in-process.'
  interfaces:
  - file: lib/did-key-ingress-proxy/mod.ts
    kind: interface
    name: CreateIngressOpts
    signature: 'interface CreateIngressOpts { logger: StructuredLoggerInterface; ingressProxyHost:
      string; signer: { did(): string; sign(bytes: Uint8Array): Promise<Uint8Array>
      }; keypair: { did(): string; sign(data: Uint8Array): Promise<Uint8Array> };
      label?: string; tls?: boolean; localWsTarget?: () => { hostname: string; port:
      number } | undefined; directSubscriptionHandler?: (subscriptionId: string, nsid:
      string, params: Record<string, string>, onEvent: (event: unknown) => void, onData:
      (data: Uint8Array) => void) => (() => void) | void }'
  - file: lib/did-key-ingress-proxy/mod.ts
    kind: function
    name: createIngress
    signature: 'createIngress(opts: CreateIngressOpts): IngressRef'
  - file: lib/did-key-ingress-proxy/mod.ts
    kind: function
    name: getServiceAuthToken
    signature: 'getServiceAuthToken(lxm: string): Promise<string>'
  name: lib-did-key-ingress-proxy
  requirements:
  - codeRefs:
    - function:ab0d43e74646836bd86d4b393d2cafa0
    id: r.close-idempotent-before-serve
    level: MUST
    text: close() must forward to the stored subscriber when one exists and be a no-op
      when onServe has not yet registered a subscriber, so callers can tear down a
      relay that never served.
  - codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
    id: r.create-ingress-factory
    level: MUST
    text: createIngress(opts) must build and return an IngressRef from CreateIngressOpts,
      destructuring logger, ingressProxyHost, signer and keypair, and holding the
      active subscriber in a closure so that a single relay object serves both registration
      and shutdown.
  - codeRefs:
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
    id: r.direct-subscription-handler
    level: SHOULD
    text: When directSubscriptionHandler is provided, inbound relay subscriptions
      for non-tunnel NSIDs must be dispatched to it with subscriptionId, nsid, params,
      an onEvent callback and an onData callback instead of opening a loopback WebSocket
      to localWsTarget; its returned function, when any, is the unsubscribe/cleanup
      handle and an in-process firehose source needs no TCP listener.
  - codeRefs:
    - function:ab0d43e74646836bd86d4b393d2cafa0
    id: r.ingress-ref-projection
    level: MUST
    text: The relay's ingressRef starts as the empty string and is set to the subscriber
      handle's ingressRef after registration; the ingressUrl getter must return the
      empty string while ingressRef is empty and otherwise "https://" plus ingressRef
      with the leading "did:web:" prefix stripped, and the ingressHost getter must
      strip that same prefix when present and return ingressRef unchanged otherwise.
  - codeRefs:
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
    id: r.label-default
    level: MUST
    text: The subscriber label must default to the literal string "bidder" when opts.label
      is absent, and use opts.label verbatim when present; that label is passed to
      createSubscriber.
  - codeRefs:
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
    id: r.lazy-ws-target
    level: SHOULD
    text: localWsTarget must be consulted lazily at subscription time rather than
      at createIngress time, because the local serve's TCP port is only assigned once
      it is listening; its returned hostname and port are the loopback target for
      forwarded inbound relay WebSocket subscriptions such as com.atproto.sync.subscribeRepos.
  - codeRefs:
    - file:lib/did-key-ingress-proxy/mod.ts
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
    id: r.on-serve-registration
    level: MUST
    text: onServe(fetch) must wrap the supplied fetch in createSubscriberFactory to
      obtain handleRequest, log "xrpc-relay connecting" with ingressProxyHost, call
      createSubscriber with label, keypair, a getServiceAuthToken closure, ingressProxyHost,
      the optional tls, handleRequest, and the optional localWsTarget and directSubscriptionHandler,
      then store the returned handle and log "xrpc-relay registered" with subdomain
      and ingressRef.
  - codeRefs:
    - function:720938c17d8a919da0fa9510c65cc8d1
    - function:ab0d43e74646836bd86d4b393d2cafa0
    id: r.service-auth-token
    level: MUST
    text: getServiceAuthToken(lxm) must derive the audience from ingressProxyHost
      via hostnameToDid and return the service-auth JWT produced by signServiceAuth
      using the injected signer with that audience and the requested lexicon NSID,
      so each inbound subscription can be authenticated per-method.
  - codeRefs:
    - function:720938c17d8a919da0fa9510c65cc8d1
    - interface:da388f002919a2fd08b59e8f65646870
    id: r.signing-identities
    level: MUST
    text: 'CreateIngressOpts must carry two distinct signing identities: signer, whose
      did() and sign(bytes) are used only to mint service-auth tokens for the proxy
      audience, and keypair, whose did() and sign(data) identify the subscriber registration,
      so the service-auth identity and the relay subscriber identity stay separable.'
  - codeRefs:
    - function:ab0d43e74646836bd86d4b393d2cafa0
    - interface:da388f002919a2fd08b59e8f65646870
    id: r.tls-flag
    level: SHOULD
    text: When opts.tls is set, the dispatcher serves TLS, so the subscriber must
      use https/wss addressing even for localhost or hosts carrying a port; the flag
      is forwarded unchanged to createSubscriber.
  upstream: self
