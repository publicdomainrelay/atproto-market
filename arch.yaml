  requirements:
  - codeRefs:
    - function:e49cc4a90e023dc47d5a2d109f1d2f08
    id: r.client-factory
    level: MUST
    text: createPlcDirectoryClient must build a PlcClient pointed at the caller-supplied
      PLC directory URL rather than the public default.
  - codeRefs:
    - file:lib/did-plc/client.ts
    - interface:d759a391fe304d866db88c324e3e12bc
    - method:ccfc740ff0345ec11783cafe8b0545c9
    id: r.client-options-defaults
    level: MUST
    text: PlcClient must default its base URL to the public PLC directory (trailing
      slash stripped), default its fetch to the bound global fetch, leave the timeout
      unset when not supplied, and apply the configured timeout as an AbortSignal
      on every request it issues.
  - codeRefs:
    - method:3eb76e760f6161e2133b61ae52ba09e2
    - method:4a87ed875b87c760b18994d50d1b79d5
    - method:56dc0a2c422513844c595e8ec9a9b661
    - method:72c360d1837be5bb5dcfa1140fa19cc7
    id: r.error-class-identity
    level: MUST
    text: Each error subclass must set its own `name` and pass its fixed HTTP status
      to the PlcError base, so PlcError exposes a readonly `status` alongside the
      inherited message.
  - codeRefs:
    - interface:da65aed4a72e5d371a6f16031aa0ef83
    - method:72f0f2fbb2ecf38e70ef7708ae62c81b
    - method:a8b2aede97428a79b7847a31740b5845
    id: r.export-pagination
    level: MUST
    text: PlcClient.export must page the /export endpoint using the ExportOptions
      `after` cursor and `count` limit, tolerate both the array shape and the single-object
      shape the server/spec disagree on, and return an empty array when nothing usable
      is returned; exportPages must be an async generator that repeatedly calls export
      with the page size (default 1000), stops on an empty page or a short page, and
      uses the last entry's createdAt as the next cursor.
  - codeRefs:
    - file:lib/did-plc/fixup-openapi.ts
    - file:lib/did-plc/openapi-ts.config.ts
    - file:lib/did-plc/openapi.official.yaml
    id: r.generated-client-provenance
    level: SHOULD
    text: The generated OpenAPI client that PlcClient builds on should be produced
      from the checked-in official PLC OpenAPI document via the openapi-ts configuration
      and its fixup script, so the generated types stay in sync with the upstream
      spec.
  - codeRefs:
    - function:8da01723383daa387c12dc941628b9a7
    - interface:4c23cbfe2fc6db60fea7fe843a47a8f6
    - interface:5998a6ebd292373230c747dba056be85
    id: r.genesis-derivation
    level: MUST
    text: createGenesisOp must build an unsigned plc_operation (rotationKeys, verificationMethods,
      alsoKnownAs, services, prev null), DAG-CBOR encode it, sign the encoded bytes
      via the caller-supplied signer, attach the base64url (unpadded, URL-safe) signature,
      then derive the did:plc identifier as base32-lower of the first 15 bytes of
      sha256 over the DAG-CBOR encoding of the signed operation, returning both the
      DID and the ready-to-submit operation.
  - codeRefs:
    - function:8da01723383daa387c12dc941628b9a7
    - interface:4c23cbfe2fc6db60fea7fe843a47a8f6
    id: r.genesis-two-pass-services
    level: MUST
    text: 'When GenesisOptions.services is a function instead of a map, createGenesisOp
      must run a two-pass derivation: first build with empty services to obtain a
      preliminary DID, then rebuild with the services that callback returns for that
      preliminary DID.'
  - codeRefs:
    - interface:d20f19dc21ed3a83a1714e5dd722b53e
    - method:934b52fe49087234488561a3e9fa265c
    id: r.health-endpoint
    level: MUST
    text: PlcClient.health must GET `<baseUrl>/health` with the configured fetch and
      timeout and return the parsed HealthResponse, throwing PlcError with the response
      status on a non-ok response; this endpoint has no generated OpenAPI type and
      must not go through the generated SDK.
  - codeRefs:
    - function:3b90763d12a0a4c3f820e3c6672dc372
    - type_alias:cda4456d40f40308bc05b5e1f3d08229
    id: r.key-extraction
    level: MUST
    text: keysFromDidDocument must return every verificationMethod public key of a
      DID document as a did:key string, passing through values already prefixed with
      `did:key:` and prefixing raw multibase values, and returning an empty array
      when the document has no verificationMethod.
  - codeRefs:
    - function:689a9b51d2e09d093defe4dfd3db3deb
    - function:c4d5a623ba103c6f42dd447f82559553
    - interface:df8391de25b80908a518669067a0216c
    id: r.keypair-state-persistence
    level: MUST
    text: loadKeypairState must read and JSON-parse a keypair state file, return null
      when the file does not exist, and throw on malformed JSON or when privateKeyHex,
      didPlc or createdAt is missing or not a string; saveKeypairState must write
      the state as pretty-printed JSON to a temp file and rename it into place so
      the write is atomic.
  - codeRefs:
    - file:lib/did-plc/mod.ts
    id: r.module-exports
    level: MUST
    text: mod.ts must be the package's single entrypoint, re-exporting the high-level
      client, the hand-tuned and generated types, the resolver, genesis and keypair-state
      modules, and additionally exposing the low-level generated SDK functions and
      client factory for consumers that want them directly.
  - codeRefs:
    - method:21f0cc8824e1b4f6b3504c835e87cf1d
    - method:7a27bfcb60ada39f3859bf8cd78c6fed
    - method:a608364390c07ffbcb4053df02e4f50c
    - method:acc069a9598f75909843cc79e05f199d
    - method:f049cdcb1705123200f64a903d8d30bf
    id: r.read-endpoints
    level: MUST
    text: 'PlcClient must expose read calls against the PLC directory: resolve a did:plc
      DID to a DidDocument, fetch the current non-nullified operation chain, fetch
      the full audit log including nullified operations, fetch only the latest operation,
      and fetch the DID''s current PLC data, each keyed by DID and rejecting with
      the mapped error on failure.'
  - codeRefs:
    - function:3a3751439dd48106c07530ecb7436c23
    - function:a44d36ee0dc159bf2beed768aaff1e61
    - interface:d1adb282179ee1bc93186f577980da48
    - type_alias:cda4456d40f40308bc05b5e1f3d08229
    id: r.resolver-cache
    level: MUST
    text: createPlcKeyResolver and plcClientAsKeyResolver must return a KeysForDid
      function that resolves the DID document through a PlcClient and maps it through
      keysFromDidDocument, memoizing results in an in-memory Map (default on, disableable),
      and must swallow resolution failures by caching and returning an empty key list
      rather than rejecting.
  - codeRefs:
    - class:ca276d9a71683fdf566bcdf5fb46e47c
    - file:lib/did-plc/client.ts
    - method:a608364390c07ffbcb4053df02e4f50c
    id: r.runtime-detection
    level: MUST
    text: PlcClient must detect at module load whether it is running under Deno and,
      on Deno, bypass the generated SDK functions in favor of direct `_client.get`/`_client.post`
      calls, because Deno's Request constructor rejects the `client` option the generated
      SDK spreads into every request; in the browser it must use the generated SDK
      functions.
  - codeRefs:
    - class:33b7d068752c38948075552d9cef40eb
    - class:8a857a0ac52fbb0a4da6a57b447664ec
    - class:9b6ece3d7112f0cf0be907735c5f3d5a
    - class:a02218cd093a941f85749da7960298a5
    - file:lib/did-plc/client.ts
    id: r.status-error-mapping
    level: MUST
    text: 'An unsuccessful PLC response must be turned into the matching error type:
      status 404 into PlcNotFoundError, 410 into PlcTombstonedError, 400 into PlcInvalidOperationError,
      and any other non-ok status into PlcError carrying the numeric status; a failed
      fetch (no response) must throw PlcError with status 0. The server''s own message
      must be preferred over the HTTP status text, using the already-parsed generated-client
      error when available and only falling back to reading the response body when
      it is not.'
  - codeRefs:
    - file:lib/did-plc/client.ts
    - method:6265c2659cccf561f5f79d7c67669548
    id: r.submit-op
    level: MUST
    text: PlcClient.submitOp must POST a signed Operation to the directory for the
      given DID and throw the mapped PLC error when the signature is invalid or the
      prev pointer is wrong.
  - codeRefs:
    - file:lib/did-plc/types.ts
    - interface:4f51012b3df9c0dc5b7b93dc7b0249ba
    - interface:d20f19dc21ed3a83a1714e5dd722b53e
    - interface:da65aed4a72e5d371a6f16031aa0ef83
    id: r.type-augmentation
    level: SHOULD
    text: 'types.ts should re-export the generated OpenAPI types while adding the
      hand-tuned types the spec models loosely: PlcService, the export pagination
      options, and the health response.'
  upstream: self
