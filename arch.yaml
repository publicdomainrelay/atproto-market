  depends_on:
  - sc.atproto-market
  id: sc.lib-market-bidder
  intent: 'This context exists to hold the bidder-side lifecycle orchestration for
    the market: the single place where a bidder''s identity, allowlist, offering record,
    policy scope gate and record-discovery watchers are assembled from injectable
    dependencies. It sits downstream of the market ABC/lexicon/server packages and
    upstream of any concrete bidder entrypoint, so that provider callbacks, policy
    executors and trust resolvers can be composed without the factory knowing anything
    about process startup or transport ownership. Its guest on-network route is also
    the channel by which a guest reports the iroh ticket the requester will dial,
    so it must pass that value through verbatim.'
  interfaces:
  - file: lib/market-bidder/mod.ts
    kind: interface
    name: MarketBidder
    signature: 'interface MarketBidder { beginServe(): Promise<void>; shutdown():
      void; refreshOffering(): Promise<void> }'
  - file: lib/market-bidder/mod.ts
    kind: interface
    name: MarketBidderConfig
    signature: 'interface MarketBidderConfig { logger: StructuredLoggerInterface;
      serve: ServeHandle; atproto: ATProto; relay?: IngressRef; providers?: MarketBidderProviderRef[];
      setup?(): Promise<void>; teardown?(): Promise<void>; callbackFactory?: (deps:
      CallbackFactoryDeps) => CallbackSet | Promise<CallbackSet>; onContractChange?:
      (event: ContractEvent) => void; policy?: string | null; policyArgs?: PolicyArgs;
      policyExec?: PolicyExecOptions; eventStreams?: ATProtoEventStreamsClient; offeringRefreshMs?:
      number; appliesTo?: string[]; skipServeBegin?: boolean; onSessionExpired?: (err:
      OAuthSessionExpiredError) => void; acceptToContract?: Map<string, GuestContractEntry>
      }'
