  id: sc.lib-common-market-lexicons-com-publicdomainrelay
  intent: This context exists to mark the generated entrypoint that assembles the
    com.publicdomainrelay lexicon bindings into a single import surface. Consumers
    reach the individual lexicon families (tangled, auth, requester, agent, compute,
    market, badgeBlueKeys, gateway) through this file instead of importing each temp/*.ts
    path directly, and the file is regenerated by the "@atproto/lex" tool rather than
    authored by hand. Its purpose is therefore to be a stable, machine-maintained
    namespace barrel rather than a place for behavior.
  name: lib-common-market-lexicons-com-publicdomainrelay
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp.ts
    id: r.generated-file-not-edited
    level: MUST
    text: The file lib/common/market-lexicons/com/publicdomainrelay/temp.ts is generated
      by "@atproto/lex" and carries a header warning against editing; changes must
      come from regenerating the lexicons rather than hand-editing this module.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp.ts
    id: r.namespace-reexports
    level: MUST
    text: The module re-exports each of the eight sibling temp/ submodules as a named
      namespace binding using export-star-as syntax, so importers get tangled, auth,
      requester, agent, compute, market, badgeBlueKeys and gateway from this single
      entrypoint.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp.ts
    id: r.no-runtime-behavior
    level: MUST
    text: The module defines no runtime behavior of its own — no functions, classes
      or values beyond the re-export bindings — so importing it has the effect only
      of resolving the eight temp/ submodules.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp.ts
    id: r.submodule-paths-resolve
    level: MUST
    text: Each re-export target resolves relative to this file as ./temp/<name>.ts,
      so the submodules must remain at those paths under the temp/ directory for the
      barrel to compile.
  upstream: self
