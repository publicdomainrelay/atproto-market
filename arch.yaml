  id: sc.lib-did-plc-generated-core
  intent: 'This context exists because the did:plc API client is generated from an
    OpenAPI document and needs a self-contained core layer that every generated operation
    calls into. It centralizes the mechanical parts of HTTP dispatch that the generator
    does not want to inline per endpoint: resolving auth into a header or cookie,
    encoding bodies per content type, mapping positional arguments onto path and query
    parameters, applying OpenAPI serialization styles, building and de-duplicating
    query strings, and streaming server-sent events with retry. Keeping it as one
    reviewed unit makes the generated surface auditable and lets the client layer
    import a single stable set of helpers instead of duplicating serialization logic
    across generated operation files.'
