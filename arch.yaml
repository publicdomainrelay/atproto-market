  id: sc.lib-common-market-lexicons-com-publicdomainrelay-temp-compute-events
  intent: This context exists so the generated event-vocabulary entrypoint is described
    as a stable, machine-produced interface that consumers import instead of reaching
    into the vm/ submodules by path. It exists to pin down that the module is a barrel
    only — every symbol it exposes is owned by a sibling module under vm/ — so that
    regeneration by @atproto/lex is understood to be the only sanctioned way the exported
    surface changes, and so that editors and reviewers do not treat the absence of
    local declarations as a gap to fill by hand.
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-compute-events
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events/vm.ts
    id: r.barrel-only-no-local-declarations
    level: MUST
    text: The module must define no types, constants, or functions of its own and
      must act purely as a re-export barrel, so every exported symbol it surfaces
      is declared in and owned by a sibling module under the vm/ directory.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events/vm.ts
    id: r.generated-not-hand-edited
    level: MUST
    text: 'The file must remain a verbatim @atproto/lex code-generator artifact: it
      carries the banner comment ''THIS FILE WAS GENERATED BY "@atproto/lex". DO NOT
      EDIT.'' and any change to its exported surface is produced by rerunning the
      generator, not by hand editing.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events/vm.ts
    id: r.reexport-delete-namespace
    level: MUST
    text: The module must re-export the delete variant as a named namespace export
      aliased with the quoted string 'delete' to the sibling module ./vm/delete.ts,
      using the quoted form because the bare identifier is a reserved word.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events/vm.ts
    id: r.reexport-started-and-on-network
    level: MUST
    text: The module must re-export the started and onNetwork event variants as namespace
      exports bound to the sibling modules ./vm/started.ts and ./vm/onNetwork.ts respectively,
      alongside the delete variant described above.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events/vm.ts
    id: r.sibling-modules-must-resolve
    level: MUST
    text: The three sibling modules the barrel points at — vm/delete.ts, vm/started.ts,
      and vm/onNetwork.ts, resolved relative to this file — must exist and export
      the namespace members the barrel forwards, so that importing this entrypoint
      never fails to resolve.
  upstream: self
