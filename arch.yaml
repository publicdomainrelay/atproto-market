    id: r.json-session-store-persistence
    level: MUST
    text: jsonSessionStore must return a SessionStore over the given file path that
      lazily loads and caches the JSON object from that file, falls back to an empty
      object when the file is missing or unparsable, and rewrites the whole file as
      two-space-indented JSON after every set and del.
  - codeRefs:
    - file:lib/atproto-oauth-helpers/mod.ts
    - function:653db074b84283be302a08bc6df60d44
    id: r.loopback-callback-server
    level: MUST
    text: startLoopbackCallbackServer must serve on hostname 127.0.0.1 at the requested
      port, resolve the returned promise with the redirect's query parameters as a
      string record when the path is /callback (answering with an HTML page telling
      the user to close the tab), answer 404 for any other path, and expose a shutdown
      function that stops the Deno server.
  - codeRefs:
    - file:lib/atproto-oauth-helpers/mod.ts
    - function:7981a0b8b11bca99dd8741f34edb3e25
    id: r.memory-state-store
    level: MUST
    text: memoryStateStore must return a StateStore backed by a fresh in-memory Map
      per call, with async get, set and del that read, write and delete entries in
      that map; it holds no cross-process or on-disk state, so it is only suitable
      for the short-lived state of a single authorization flow.
  - codeRefs:
    - file:lib/atproto-oauth-helpers/mod.ts
    - function:d03b1bd1ba44ea92ad6b5bb772af7fe3
    id: r.oauth-client-metadata-defaults
    level: MUST
    text: oauthClientMetadata must build the client metadata document with client_id
      defaulting to "http://localhost", redirect_uris defaulting to ["http://127.0.0.1:0/callback"],
      client_name defaulting to "ATProto OAuth Client", the required scope taken verbatim
      from the options, and application_type "web", dpop_bound_access_tokens true,
      grant_types ["authorization_code", "refresh_token"], response_types ["code"]
      and token_endpoint_auth_method "none" fixed.
  - codeRefs:
    - file:lib/atproto-oauth-helpers/mod.ts
    - function:c4b50dc71822e21c61d8462aa6849574
    id: r.runtime-implementation
    level: MUST
    text: webCryptoRuntime must return a RuntimeImplementation whose createKey is
      createWebCryptoKey, whose getRandomValues returns crypto.getRandomValues over
      a fresh Uint8Array of the requested length, and whose digest maps the lowercase
      names sha256, sha384 and sha512 to the Web Crypto names SHA-256, SHA-384 and
      SHA-512 (passing any other name through unchanged) before calling crypto.subtle.digest.
  - codeRefs:
    - file:lib/atproto-oauth-helpers/mod.ts
    id: r.shared-by-agent-and-requester
    level: SHOULD
    text: The helpers should stay free of any dependency on a specific caller so that
      both the bidder's createOAuthAgent and the requester's createOAuthRequester
      can configure their OAuthClient with the same webCryptoRuntime, memoryStateStore
      and jsonSessionStore instances rather than duplicating them.
  - codeRefs:
    - file:lib/atproto-oauth-helpers/key.ts
    - method:e6fca13262fb7317e7cd6ca588b27877
    id: r.verify-jwt-unimplemented
    level: MUST
    text: WebCryptoKey.verifyJwt must be declared with the token and options parameters
      but must always throw an Error reading "WebCryptoKey.verifyJwt not implemented";
      this key is used for signing only, and verification is not part of this helper.
  - codeRefs:
    - class:5a1bec4d77c5f5a5cde8c04bb59bca88
    - file:lib/atproto-oauth-helpers/key.ts
    - method:2c62f219629eb196fc241a82271bf951
    id: r.web-crypto-key-extends-jwk-key
    level: MUST
    text: WebCryptoKey must extend @atproto/jwk's abstract Key, passing to super a
      JWK merged from the public and private JWK arguments plus the alg and kid, with
      use fixed to "sig" and key_ops fixed to ["sign", "verify"], while keeping the
      CryptoKey, the alg string and the public JWK in private fields.
