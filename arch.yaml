    level: MUST
    text: The SDK module exports exactly seven operation functions - resolveDid, createPlcOp,
      getPlcOpLog, getPlcAuditLog, getLastOp, getPlcData and export_ - each generic
      over ThrowOnError extends boolean defaulting to false and each returning a RequestResult
      parameterised by that operation's response, error and ThrowOnError types.
