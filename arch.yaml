    - function:0131a84b31ad85543599f7fcdc257d17
    - interface:38443be81142d5646b8f37c2d0673a74
    id: r.config-defaults
    level: SHOULD
    text: 'createConfig must supply the documented defaults so that an unconfigured
      client behaves sensibly: parseAs ''auto'', responseStyle ''fields'', and throwOnError
      false. baseUrl and fetch are optional, and next is typed never to steer callers
      of Next.js applications to the dedicated client package.'
  - codeRefs:
    - file:lib/did-plc/generated/client/utils.gen.ts
    - function:045b120064539e4384e726f1ad3a6cfd
    - function:5cc56f8414c5363a5723ab1d53a49283
    id: r.config-merge-order
    level: MUST
    text: Per-request options are resolved by spreading the client config first and
      the call options second, so call options win; fetch falls back through options.fetch,
      then _config.fetch, then globalThis.fetch; and headers are combined with mergeHeaders
      rather than overwritten. Config merging itself is performed by mergeConfigs,
      which must combine two Config objects without dropping either side's fields.
  - codeRefs:
    - file:lib/did-plc/generated/client/client.gen.ts
    - function:0131a84b31ad85543599f7fcdc257d17
    - function:188d765b509d3931cfcc5bbfffb2b7dc
    id: r.create-client-factory
    level: MUST
    text: createClient is the sole entrypoint to the generated client. Given an optional
      Config (defaulting to the empty object) it merges that config over the defaults
      from createConfig() and returns a Client exposing buildUrl, getConfig, setConfig,
      request, interceptors, the per-method helpers connect/delete/get/head/options/patch/post/put/trace,
      and an sse namespace with the same method set. getConfig must return a shallow
      copy of the live config so callers cannot mutate internal state, and setConfig
      must merge the incoming config into the stored one and return the resulting
      copy.
  - codeRefs:
    - file:lib/did-plc/generated/client/client.gen.ts
    - function:188d765b509d3931cfcc5bbfffb2b7dc
    id: r.error-body-extraction
    level: MUST
    text: On a non-ok response the client reads the body as text, attempts JSON.parse,
      and throws the parsed JSON when parsing succeeds, otherwise the raw text. This
      preserves the server's structured error payload for callers instead of wrapping
      it.
  - codeRefs:
    - file:lib/did-plc/generated/client/types.gen.ts
    - file:lib/did-plc/generated/client/utils.gen.ts
    id: r.generated-code-provenance
    level: MAY
    text: The four files carry the .gen.ts suffix and live under lib/did-plc/generated/client;
      manual edits are permitted but must be reflected in this spec, since regeneration
      from the did:plc source will overwrite anything not encoded as a requirement
      here.
  - codeRefs:
    - file:lib/did-plc/generated/client/utils.gen.ts
    - function:bf0bf50aa3da564c87154fb48989d79a
    - interface:6a08e48cdf00ed57e85e84d03157d051
    id: r.interceptors
    level: MUST
    text: createInterceptors returns a Middleware bundle with request, response and
      error interceptor collections. Each collection supports registration and removal,
      and the createClient request loop must tolerate sparse entries by skipping falsy
      interceptor functions rather than invoking them, so a removed interceptor never
      throws.
  - codeRefs:
    - file:lib/did-plc/generated/client/client.gen.ts
    - function:188d765b509d3931cfcc5bbfffb2b7dc
    - function:e9636fa71df0faaef499d2a5fb4b33cf
    id: r.request-pipeline
    level: MUST
    text: 'A request must run the documented pipeline in order: resolve options and
      URL via beforeRequest, apply security via setAuthParams when opts.security is
      set, run requestValidator, serialize the body with bodySerializer, delete the
      Content-Type header when the body is undefined or serializes to the empty string,
      build the Request with redirect ''follow'', pass it through every registered
      request interceptor, call fetch, pass the Response through every registered
      response interceptor, and then parse. Any thrown error must be passed through
      the error interceptor chain, defaulted to an empty object if the chain yields
      nothing, and either rethrown when throwOnError is set or returned as an error
      result.'
  - codeRefs:
    - file:lib/did-plc/generated/client/client.gen.ts
    - function:8458ee58b9d6ddeb478f0901d8d49b7a
    id: r.response-parsing
    level: MUST
    text: 'Successful responses are parsed according to opts.parseAs: when it is ''auto''
      the format is inferred from the response Content-Type header by getParseAs,
      defaulting to ''json''. A 204 status or a Content-Length of ''0'' must yield
      an empty value appropriate to the parse format (empty object for json, empty
      FormData for formData, response.body for stream, and the parsed empty value
      for the Body methods). For json parsing the body must be read as text and JSON.parse''d
      only when non-empty, because servers may return 200 with an empty body. responseValidator
      and responseTransformer apply only to the json path.'
  - codeRefs:
    - interface:38443be81142d5646b8f37c2d0673a74
    - type_alias:2af15840ea8a34874a90d03c8c53bfca
    - type_alias:952c875d05b76621416e955f7ac584c0
    id: r.response-style
    level: MUST
    text: The responseStyle config, typed as ResponseStyle ('data' | 'fields'), selects
      the return shape and defaults to 'fields'. Under 'data' the client returns the
      parsed payload alone; under 'fields' it returns the payload alongside the request
      and response objects on success, and alongside the error on failure. When throwOnError
      is true the error is thrown instead of returned, so no error field is produced.
  - codeRefs:
    - file:lib/did-plc/generated/client/client.gen.ts
    - function:188d765b509d3931cfcc5bbfffb2b7dc
    - type_alias:aff9789136e33dc58e0e596ab4913239
    id: r.sse-methods
    level: SHOULD
    text: The sse namespace methods must reuse beforeRequest so that headers, auth
      and query handling match the plain method helpers, then hand the resolved options
      and URL to createSseClient with a serialized body and an onRequest hook that
      runs the request interceptor chain on the constructed Request. The sse set includes
      trace in addition to the methods the plain helpers cover.
  - codeRefs:
    - file:lib/did-plc/generated/client/index.ts
    - interface:060e771651286dc59512e47760351c52
    - interface:38443be81142d5646b8f37c2d0673a74
    - interface:52b8825cf135e083d7d54d23395fc970
    - interface:9323c2d655bd8f9655c74438a7d51be9
    - interface:c1fcf386d064ae2466c6e8d0fd2ac083
    - type_alias:6ae6701371118f7f03da4ff85978bdf7
    - type_alias:aff9789136e33dc58e0e596ab4913239
    - type_alias:c165bd43ffb67fcfa6433020cbe99e52
    id: r.type-surface
    level: MUST
    text: 'The module must export the generic type surface that typed callers depend
      on: Config parameterised by a ClientOptions subtype and extending RequestInit
      minus body/headers/method plus CoreConfig, RequestOptions, ResolvedRequestOptions
      as the fully-resolved variant, RequestResult parameterised by data, error, ThrowOnError
      and response style, ClientOptions carrying baseUrl and throwOnError, Client
      as the returned interface, CreateClientConfig, and TDataShape and Options as
      the per-operation generics. index.ts must re-export this surface so consumers
      import from the client directory rather than individual generated files.'
  - codeRefs:
    - file:lib/did-plc/generated/client/utils.gen.ts
    - function:8b30a2691d351681cfd7042ce1e15408
    - function:a8e4eb7e716e14eb46c35d17b48cf48b
    id: r.url-and-query-serialization
    level: MUST
    text: buildUrl assembles the final request URL from the resolved options, honouring
      baseUrl and path parameters, and applies the query serializer. createQuerySerializer
      takes QuerySerializerOptions and returns a function from a query-params object
      to a string; by default arrays explode in form style and objects in deepObject
      style, with reserved characters percent-encoded.
