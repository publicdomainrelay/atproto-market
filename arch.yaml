  id: sc.test-fixtures-cloud-init
  intent: 'These fixtures exist so the generated cloud-config for each module combination
    is pinned: the snapshot test renders each composition and asserts exact equality,
    so any accidental change to the composer''s emitted YAML (escaping, unit contents,
    ordering, hardening flags) fails loudly. They also serve as the readable reference
    for what each module emits on the guest, since the composed strings are otherwise
    only visible at runtime. The iroh fixture pins the dumbpipe listener transport
    that replaced the did-key-ingress-proxy tunnel-subscriber.'
  name: test-fixtures-cloud-init
  requirements:
  - codeRefs:
    - file:test/fixtures/cloud-init/fedproxy-ssh.yaml
    id: r.fedproxy-ssh-loopback-sshd
    level: MUST
    text: fedproxy-ssh.yaml pins sshd to loopback with 'ListenAddress 127.0.0.1' (never
      0.0.0.0), permits key-only root login, and installs the websocat ws-to-tcp bridge
      unit plus the fedproxy-client unit configured with SERVICE, HANDLE, PORT, ATPRP_URL,
      AUTH_PLUGIN=oidc and MARKET_ACCEPT_JSON_PATH; the first-boot setup script keeps
      a single-escaped ${STAMP} guard and is gated on the DigitalOcean service-account
      token via a matching .path unit.
  - codeRefs:
    - file:test/fixtures/cloud-init/fedproxy-web-wootty.yaml
    id: r.fedproxy-web-wootty-token-handoff
    level: MUST
    text: 'fedproxy-web-wootty.yaml runs woottyd as the agent user on 127.0.0.1:8080
      with WOOTTY_COMMAND=tmux and WOOTTY_STATIC_DIR pointing at the extracted wootty-web
      assets, and its setup script mints a service-auth token scoped to the get-ttyd-password-vm-test
      role, reads the password from the com.fedproxy.ttydCredentials record over the
      xrpc relay, and writes it as WOOTTY_AUTH_TOKEN into a 0600 agent-owned env file;
      the config keeps ssh_pwauth: false and disable_root: false.'
  - codeRefs:
    - file:test/fixtures/cloud-init/iroh.yaml
    id: r.iroh-fixture
    level: MUST
    text: 'A new fixture test/fixtures/cloud-init/iroh.yaml must be the byte-exact
      composer output of buildUserData({ctx: CTX, modules: [''iroh'']}) with the shared
      CTX, so it starts with the ''#cloud-config'' header and pins: /root/.ssh/authorized_keys
      built from ctx.sshAuthorizedKey, the key-only sshd drop-in (PermitRootLogin
      prohibit-password, PasswordAuthentication no, no ListenAddress), the dumbpipe
      install step using the dumbpipe release archive, the dumbpipe-listen systemd
      unit running listen-tcp --host 127.0.0.1:22, and the runcmd that writes the
      captured ticket to /root/secrets/iroh-node-id. This fixture must be generated
      from the composer output (never hand-written), and the existing tunnel.yaml,
      tunnel-secrets.yaml, fedproxy-ssh.yaml and fedproxy-web-wootty.yaml fixtures
      must remain unchanged and green.'
  - codeRefs:
    - file:test/fixtures/cloud-init/fedproxy-ssh.yaml
    - file:test/fixtures/cloud-init/fedproxy-web-wootty.yaml
    - file:test/fixtures/cloud-init/tunnel-secrets.yaml
    - file:test/fixtures/cloud-init/tunnel.yaml
    id: r.snapshot-files-are-composer-output
    level: MUST
    text: 'Each fixture file is the byte-exact rendered output of the composer for
      one module selection with the shared CTX: tunnel.yaml from modules [''tunnel''],
      fedproxy-ssh.yaml from [''fedproxy-ssh''], fedproxy-web-wootty.yaml from [''fedproxy-web'',''wootty''],
      and tunnel-secrets.yaml from [''tunnel'',''secrets''] using SECRETS_CTX; each
      file starts with the ''#cloud-config'' header line so the composer output and
      the fixture stay comparable by assertEquals.'
  - codeRefs:
    - file:test/fixtures/cloud-init/tunnel.yaml
    id: r.tunnel-direct-tcp-probe
    level: MUST
    text: tunnel.yaml installs the tunnel-subscriber systemd unit running the hono-did-key-ingress-proxy-tunnel-subscriber
      with --ingress-proxy-host relay.local:443, --aud-host relay.local, the sshd
      host key as private key, --target-host 127.0.0.1 and --target-port 22, and it
      contains no ListenAddress directive at all so the compute-provider harness can
      TCP-probe port 22 directly.
  - codeRefs:
    - file:test/fixtures/cloud-init/tunnel-secrets.yaml
    id: r.tunnel-secrets-runtime-discovery
    level: MUST
    text: 'tunnel-secrets.yaml is the tunnel transport plus the secrets unit: the
      setup script discovers provider specifics at runtime from the bidder-injected
      accept.json (unwrapping the strongRef shape with ''.bid_config.value // .bid_config''
      and reading token_path, url_path and url_route with defaults), echoes the provider-assigned
      subject read from the workload-identity token''s sub claim rather than rendering
      a client-side subject template, runs under set -euo pipefail and exits non-zero
      on failure, and never bakes a provider-specific path or secret value into the
      cloud-config, installing each fetched secret 0600 under a 0700 root-owned parent
      after umask 077.'
  upstream: self
