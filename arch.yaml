  - lib/common/market-lexicons/com/atproto.ts
  - lib/common/market-lexicons/com/fedproxy.ts
  - lib/common/market-lexicons/com/publicdomainrelay.ts
  codeRefIndex:
  - file:lib/common/market-lexicons/com/atproto.ts atproto.ts@lib/common/market-lexicons/com/atproto.ts
  - file:lib/common/market-lexicons/com/fedproxy.ts fedproxy.ts@lib/common/market-lexicons/com/fedproxy.ts
