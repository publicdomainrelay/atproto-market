  name: lib-common-compute-contract-gateway-common
  requirements:
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/types.ts
    - interface:79ac11ae8e1a5e878c56818d0ea8f713
    id: r.bid-entry
    level: MUST
    text: GatewayBidEntry records one bid in the contract's ledger as the bidder's
      did, the bid record's uri and cid, and a numeric cost, so bids from different
      bidders can be compared on a single numeric field.
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/types.ts
    - interface:54d56e2397fdff2c37bd648570123818
    id: r.caller-identity
    level: MUST
    text: CallerIdentity identifies the party invoking the gateway by a single required
      did string, so a transport can hand the gateway a caller identity without carrying
      credentials or handles.
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/types.ts
    - interface:79ac11ae8e1a5e878c56818d0ea8f713
    - interface:a92d50db702dea8d4a773cdf785d7086
    id: r.compute-response
    level: MUST
    text: 'GatewayComputeResponse is the all-optional result shape returned to a caller:
      receipt fields (receiptUri, receiptCid, receiptOk), VM fields (sshReady, sshExitCode,
      websocatUrl, vmFqdn), winner fields (winnerDid, winnerBidUri, winnerBidCid,
      winnerBidConfig), RFP fields (rfpUri, rfpCid), an optional bids ledger of GatewayBidEntry,
      and an optional error string, so success detail and failure both fit one shape.'
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/types.ts
    - interface:79ac11ae8e1a5e878c56818d0ea8f713
    - interface:869e37e6b7707634513f48f2312f0215
    - interface:bb907138ab8576908b425812a1323e8a
    id: r.contract-state
    level: MUST
    text: 'GatewayContractState tracks a single RFP end to end: it requires the callerDid
      plus the rfpUri/rfpCid that opened the contract, optional winnerDid / winnerBidUri
      / winnerBidCid / winnerBidConfig once a winner is chosen, optional acceptUri/acceptCid,
      optional receiptUri/receiptCid/receiptOk once a receipt is verified, the required
      bids and events ledgers, and a required status restricted to the five literals
      bidding, winner_selected, accepted, receipt_verified and terminated.'
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/nsids.ts
    id: r.default-service-id
    level: MUST
    text: nsids.ts exports DEFAULT_GATEWAY_SERVICE_ID as the string compute_contract_gateway,
      naming the did:web service fragment callers target when no other service id
      is given.
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/types.ts
    - interface:869e37e6b7707634513f48f2312f0215
    id: r.event-entry
    level: MUST
    text: GatewayEventEntry records one entry in the contract's event log as an unconstrained
      type string plus a timestamp string, keeping the event vocabulary open to the
      gateway rather than enumerated in the shared type.
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/nsids.ts
    id: r.lxm-aliases
    level: SHOULD
    text: 'Each NSID is paired with a *_LXM constant that is assigned the NSID constant
      itself, so the LXM spelling and the NSID string can never drift apart: REQUEST_COMPUTE_VM_LXM,
      REQUEST_COMPUTE_WORKER_EPHEMERAL_LXM, REQUEST_COMPUTE_WORKER_PERSISTENT_LXM,
      DELETE_COMPUTE_LXM and SUBSCRIBE_COMPUTE_EVENTS_LXM.'
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/mod.ts
    id: r.mod-reexports
    level: MUST
    text: The package entrypoint mod.ts re-exports nsids.ts and types.ts wholesale,
      so a consumer that imports the package root gets every NSID constant and every
      gateway interface without importing individual modules.
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/deno.json
    - file:lib/common/compute-contract-gateway-common/mod.ts
    id: r.no-dependencies
    level: MUST
    text: The package declares no imports in its deno.json and its modules import
      nothing, so it stays the dependency-free bottom of the gateway's layering and
      can be consumed by both the ABC interface layer and the XRPC transport.
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/nsids.ts
    id: r.nsid-constants
    level: MUST
    text: 'nsids.ts defines the five gateway XRPC method identifiers as string constants
      under the com.publicdomainrelay.temp.gateway authority: REQUEST_COMPUTE_VM_NSID
      (requestComputeVM), REQUEST_COMPUTE_WORKER_EPHEMERAL_NSID (requestComputeWorkerEphemeral),
      REQUEST_COMPUTE_WORKER_PERSISTENT_NSID (requestComputeWorkerPersistent), DELETE_COMPUTE_NSID
      (deleteCompute) and SUBSCRIBE_COMPUTE_EVENTS_NSID (subscribeComputeEvents).'
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/types.ts
    - interface:41ae11030dc803c5fa163f76b3aaeeb0
    id: r.policy-spec
    level: MUST
    text: GatewayPolicySpec names a policy by a required name, with an optional description
      and an optional free-form args record, so a requester can attach a policy to
      a compute request without the common package knowing any policy engine's argument
      shapes.
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/types.ts
    - interface:869f60653fa984f384ebda98b750465b
    id: r.tokens
    level: MUST
    text: 'GatewayTokens bundles the capability tokens a compute request needs: submitRfp,
      submitAccept and createRecord are required, while submitEvent is optional, so
      a caller can drive a contract to acceptance without event submission while still
      being required to hold the RFP, accept and record-creation capabilities.'
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/types.ts
    - interface:e9438a48f8507c2cb4704a23772cbcfd
    id: r.vm-request-input
    level: MUST
    text: 'ComputeRequestVMInput carries a VM request: the required computeVm record
      and sshPublicKey, optional vmReadyTimeoutSec, execProgram, skipSsh and keepVm
      knobs, and the shared optional policy, policyEngine, extraBidderDids and tokens
      fields, so VM provisioning parameters travel in one payload alongside the bidder
      and policy configuration.'
  - codeRefs:
    - file:lib/common/compute-contract-gateway-common/types.ts
    - interface:cba9e8e50afd227d1e11556b44027a17
    id: r.worker-request-input
    level: MUST
    text: 'ComputeRequestWorkerInput carries a worker request: the required source
      and denoJson strings, an optional denoLock, an optional persistent flag that
      distinguishes the persistent worker path from the ephemeral one, and the same
      optional policy, policyEngine, extraBidderDids and tokens fields as the VM request.'
  upstream: self
- code:
  - lib/common/fedproxy-rbac-common/mod.ts
  codeRefIndex:
  - file:lib/common/fedproxy-rbac-common/mod.ts mod.ts@lib/common/fedproxy-rbac-common/mod.ts
  - function:a98ccef775e425fa7c13add3016e54f5 renderSubject@lib/common/fedproxy-rbac-common/mod.ts:16
  - function:aac738c94c8e2dfa2a0ff4c0e8d5c018 buildSshKeyRbacRecord@lib/common/fedproxy-rbac-common/mod.ts:26
  - function:e5377f0a379eb596837b1526cd73134c didPlcKey@lib/common/fedproxy-rbac-common/mod.ts:12
  - interface:967a594352d4c9b86213f54d84909966 SshKeyRbacContext@lib/common/fedproxy-rbac-common/mod.ts:4
  depends_on:
  - sc.atproto-market
  id: sc.lib-common-fedproxy-rbac-common
  intent: 'This context exists so the wire shape of the fedproxy RBAC record and the
    placeholder semantics it shares with the guest-capability grant derivation are
    specified in one place, independent of any transport or deployment. It pins down
    the contract that callers rely on: which fields a context must carry, how a DID
    is reduced to its PLC key, how a subject template is interpolated, what the default
    subject template is, and exactly which role, policy, audience, issuer and JSON
    schema the emitted record must contain. Because both the fedproxy RBAC path and
    lib/abc/guest-capability''s deriveGrantVars must produce matching subjects and
    audiences for a token to be accepted, the rules here are the single source of
    truth the two sides are checked against.'
  interfaces:
  - file: lib/common/fedproxy-rbac-common/mod.ts
    kind: interface
    name: SshKeyRbacContext
    signature: 'interface SshKeyRbacContext { serviceName: string; issuerUri: string;
      actx: string; requesterDid: string; subjectTemplate?: string }'
  - file: lib/common/fedproxy-rbac-common/mod.ts
    kind: function
    name: buildSshKeyRbacRecord
    signature: 'buildSshKeyRbacRecord(ctx: SshKeyRbacContext): Record<string, unknown>'
  - file: lib/common/fedproxy-rbac-common/mod.ts
    kind: function
    name: didPlcKey
    signature: 'didPlcKey(did: string): string'
  - file: lib/common/fedproxy-rbac-common/mod.ts
    kind: function
    name: renderSubject
    signature: 'renderSubject(template: string, vars: { actx: string; didPlcKey: string;
      role: string }): string'
  name: lib-common-fedproxy-rbac-common
  requirements:
  - codeRefs:
    - function:aac738c94c8e2dfa2a0ff4c0e8d5c018
    - interface:967a594352d4c9b86213f54d84909966
    id: r.context-fields
    level: MUST
    text: A caller supplying an SshKeyRbacContext must provide serviceName, issuerUri,
      actx and requesterDid; subjectTemplate is optional and its absence selects the
      default subject template rather than producing an error or an empty subject.
  - codeRefs:
    - function:a98ccef775e425fa7c13add3016e54f5
    - function:aac738c94c8e2dfa2a0ff4c0e8d5c018
    id: r.default-subject-template
    level: MUST
    text: buildSshKeyRbacRecord renders the subject from ctx.subjectTemplate when
      it is set, and otherwise falls back to the default template "actx:{actx}:plc:{did-plc-key}:role:{role}";
      the interpolation variables are actx from the context, the PLC key of the requester
      DID, and role set to serviceName.
  - codeRefs:
    - file:lib/common/fedproxy-rbac-common/mod.ts
    - function:e5377f0a379eb596837b1526cd73134c
    id: r.did-plc-key-strip
    level: MUST
    text: didPlcKey removes a leading "did:plc:" prefix from the given DID and returns
      the remainder unchanged; a DID without that prefix, or the empty string, is
      returned as-is.
  - codeRefs:
    - function:aac738c94c8e2dfa2a0ff4c0e8d5c018
    id: r.policy-naming
    level: MUST
    text: The policy is keyed by the derived name "<serviceName>-ssh-key-register",
      and the record's policies map contains that one key pointing at the policy object
      referenced from the role definition.
  - codeRefs:
    - file:lib/common/fedproxy-rbac-common/mod.ts
    - function:aac738c94c8e2dfa2a0ff4c0e8d5c018
    id: r.pure-builders
    level: SHOULD
    text: The exported builders stay free of I/O and ambient state, deriving the whole
      record from the context argument alone so a caller can compute and compare records
      without a network or a running service.
  - codeRefs:
    - file:lib/common/fedproxy-rbac-common/mod.ts
    - function:aac738c94c8e2dfa2a0ff4c0e8d5c018
    id: r.record-type
    level: MUST
    text: buildSshKeyRbacRecord returns a plain Record<string, unknown> whose $type
      is the fedproxy RBAC NSID constant, so the emitted object is recognisable as
      a fedproxy RBAC record rather than an arbitrary map.
  - codeRefs:
    - function:aac738c94c8e2dfa2a0ff4c0e8d5c018
    - interface:967a594352d4c9b86213f54d84909966
    id: r.role-shape
    level: MUST
    text: The returned record's roles map holds exactly one entry, keyed by ctx.serviceName,
      whose role_name is that same service name and whose definition carries aud built
      as "api://ATProto?actx=<requesterDid>", iss set to ctx.issuerUri, sub set to
      the rendered subject, and policies listing the single derived policy name.
  - codeRefs:
    - file:lib/common/fedproxy-rbac-common/mod.ts
    - function:aac738c94c8e2dfa2a0ff4c0e8d5c018
    id: r.ssh-key-register-policy
    level: MUST
    text: The policy object marks itself with meta.policy "ssh-key-register" and contributes
      a JSON schema for /xrpc/com.atproto.repo.createRecord that requires the body's
      collection to be constrained to the fedproxy SSH key NSID and requires the capability
      and body properties, so only SSH key record creation is authorised by this record.
  - codeRefs:
    - file:lib/common/fedproxy-rbac-common/mod.ts
    - function:a98ccef775e425fa7c13add3016e54f5
    id: r.subject-placeholders
    level: MUST
    text: renderSubject replaces every occurrence of the literal placeholders {actx},
      {did-plc-key} and {role} in the given template with vars.actx, vars.didPlcKey
      and vars.role respectively, applying all three substitutions globally so repeated
      placeholders are all expanded and no placeholder matching is left behind.
  upstream: self
