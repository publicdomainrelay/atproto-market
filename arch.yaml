    - function:eec1501b10e44ae978048272c4e9cced
    id: r.attestation-keypair
    level: MUST
    text: 'The market''s attestation key is a badge.blue signing key: loadOrGenerateKeypair
      returns the keypair for a supplied hex private key or generates and persists
      one when none is given, createBadgeBlueSigner builds the keypair from a caller-supplied
      hex key, and attestationFor derives the public attestation (issuer, verification
      method, multibase public key) that goes into records.'
  - codeRefs:
    - function:10d883640e8a5a7f9d0b724d937133d1
    - function:565917e19429b690f77d038a1771cb93
    - function:bfb74ae8c3c5764aa8fec8a08b8a6dcd
    - function:c01f943b04487ed6765417f89402e2c2
    - function:e5c728d6a9759280b70b480547592bd5
    id: r.badge-blue-key-binding
    level: MUST
    text: 'A key only counts as the caller''s when it is bound by a badge.blue keys
      record: keyBoundByBadgeBlueKey resolves the caller''s DID document, finds the
      keys record at the rkey badgeBlueKeysRkey derives for that key id, and returns
      whether the record actually binds that key; createKeyBoundByBadgeBlueKey wraps
      this into a reusable two-argument predicate and createBadgeBlueKeysRecord writes
      the binding record via a caller-supplied writeRecord, encoding multibase keys
      with base58btcEncode.'
  - codeRefs:
    - function:72525a51e6418b0a9341975a977fd7f7
    - function:a8e295376e37dbcc8d8027ffbc143b2e
    - interface:0c2d4165b40cf28c14348ceb91db6d93
    - interface:6e79b7b8c9ce2b70f4e3986aff5f0d77
    id: r.bid-submission
    level: MUST
    text: 'Bid submission is factored so it can run against either transport: createBidFactory
      builds the bidder from BidFactoryDeps, and createAndSubmitBid takes the target
      RFP''s uri, cid and record plus BidSettlementDeps and the request url, writes
      the bid record, submits it to the market service and returns the resulting bid
      uri and cid.'
  - codeRefs:
    - class:b264115331e7de1c849ce526bb95a46d
    - function:a4a549b19eff8b40c325d4759430ac84
    - interface:06b7f3d949eb2428955dc829ff88bd32
    - method:29c46de8762f2cda28ea9f42945ec2aa
    - method:460e2c9722d4f592de1c2ba79e06993e
    - method:5a7c89ac703d88b59f76fd56a381a91f
    - method:5e00b55cb39a80b1b67ad87180a3b6ba
    - method:75948ea3fb693dc4b0e4e92c7a6cc06a
    - method:c68ce766697e07e3588237b46e812d30
    - type_alias:d1516ebc54626f302d7a51f379e48688
    id: r.client-surface
    level: MUST
    text: 'Callers reach the market through one client: createMarketClient wraps an
      XrpcService in a MarketClient configured by MarketClientOptions, the client
      lazily builds its RecordSigner via ensureSigner fetched once, create produces
      a signed record locally, and submitRfp, submitBid, submitAccept and submitEvent
      post to the configured target returning the submission result (uri and cid)
      for each.'
  - codeRefs:
    - class:088ab0f90fba416f3035887f3f6abcf1
    - function:d7be7fb39bc4e2f86fd9985e13241b85
    - interface:9f98899afaebca0e8500df067ae28b03
    - method:407b0c921496346755f27d2c95775484
    id: r.contract-graph
    level: MUST
    text: 'An accept record is only treated as settling a bid when the graph resolves:
      resolveContractGraph walks the accept through its record references using the
      supplied RecordResolver, optionally verifies record signatures with the given
      KeysForDid, and returns a ContractGraph; any dangling or contradictory reference
      raises ContractGraphError instead of returning a partial graph.'
  - codeRefs:
    - function:068238ff7263642ac7b90ebbfc5ddca3
    - function:985b4184227ce0a11d4eea568402dfce
    - function:a1c9d31ffef200b9bfd10ae485037f4c
    - interface:ff01c799dc7cac3a6c8a4ee77fb85202
    id: r.inline-attestations
    level: MUST
    text: 'Records may embed attestations inline: inlineEntries extracts the attestation
      entries from a record, toStorableEntry converts one to the plain object form
      that can be written to a repo, and verifyInlineAttestation asynchronously checks
      that each entry is signed by a key the issuer actually controls.'
  - codeRefs:
    - function:102ed3d4f37a62e09488394627bb14ba
    - function:777e711d211dc51cbd2e0d75a82e0d5b
    - interface:e48c155afb36e23092258ba5e83a372d
    - type_alias:328bae5301fa305891c325db61c46469
    id: r.key-resolution
    level: MUST
    text: 'Keys are resolved from the DID document rather than supplied by the submitter:
      createDidKeyResolver returns a KeysForDid that resolves did:key locally and
      fetches other DIDs (with a configurable PLC URL and timeout), and verifyRemoteProof
      checks a remote proof against the keys that resolver returns for the proof''s
      DID.'
  - codeRefs:
    - function:3717d81ed40faf5d4dad599c4a466c88
    - interface:a1fd6134e58d1be9a02ec1816d47d3d6
    id: r.offering-refresh
    level: SHOULD
    text: 'An offering listing is kept fresh by a cancellable loop: startOfferingRefresh
      runs the supplied refresh callback every intervalMs, logs failures through the
      optional Logger instead of throwing, and returns an OfferingRefreshHandle the
      caller can use to stop it.'
  - codeRefs:
    - file:lib/market-atproto/deno.json
    - file:lib/market-atproto/mod.ts
    id: r.public-exports
    level: SHOULD
    text: The package exposes its surface through a single mod.ts entrypoint so consumers
      import from the package root rather than reaching into individual modules, with
      the Deno module manifest in lib/market-atproto/deno.json declaring that entrypoint
      and the package's dependencies.
  - codeRefs:
    - function:d4ce49ecbfee113afc4127141aa82940
    - function:e21dfce0e403ec8cbf782a0e996930be
    - type_alias:d50b5da61960bf0467d63a21148b6499
    id: r.public-record-access
    level: MUST
    text: 'Reads against a repo the caller does not own go through resolution rather
      than a configured url: listRecordsPublic resolves the repo''s PDS from its DID
      and then pages the collection, and createRecordResolver returns a RecordResolver
      that fetches individual records by uri for use in signature and contract checks.'
  - codeRefs:
    - function:16fad6b2b6420af853fbdd73759716b6
    - function:3f8629004305c464a50d8b1bacae6b4b
    - function:4d0d3b3b20bd7fc36774859f10ac13dc
    - function:6ba98cc82d098583236519c1e8e764f1
    - function:9a8248f51f025f8b6e32b4e8e299f71a
    - interface:3c712b587b45e111a5a8a12db9b7a950
    - interface:4479a9b41ebd3caed12b255aa2081366
    id: r.record-plumbing
    level: MUST
    text: 'The library reads, writes and deletes AT Protocol records through an injected
      Agent: createRecord writes a record and returns its strong reference, createReceiptRecord
      writes a receipt from a set of refs and a subject, deleteRecord removes one
      by its uri, listRecordsAll pages a collection on a given PDS url up to an optional
      limit and timeout, and resolvePds maps a DID to its PDS endpoint.'
  - codeRefs:
    - function:2dec0113615801ddc5fff8420d814147
    - function:62506aa5278c714b78058eb4ffa8fdd4
    - interface:6fe3d0938f2e2498697e840d96caf911
    - interface:90db8b9ee170a9798bba0b80f26f7874
    id: r.record-signing
    level: MUST
    text: 'Records submitted to the market carry a signature: createSignedRecord signs
      a record with the supplied RecordSigner before writing it, returns the written
      strong reference together with the signature, and createRemoteProofRecord writes
      a separate remote-proof record whose subject points at the signed record so
      a verifier can re-derive the signature from the repo rather than trusting the
      submitter.'
  - codeRefs:
    - function:0f913e33cc210dafda22aef7e2cdc7b1
    - function:13fec5a02eca908bbeb919368a29e6dc
    - function:3f161e971ad1f5274100575fc3b91d09
    - function:6977507cc804dcb71b651b9629300054
    - function:6e2cdf7b076fec814b99568afd576756
    - function:b42bd4e8e8a7b5c513c75339ddb940c2
    - function:ea2b23f33739df4fc8dc7ed4efaefea8
    - function:fb68d4609e3ad9dcb35fa9dc0cfb9a51
    - interface:3c3e311a12ad5dfe3195b5aaac36af7d
    - interface:a2aebdfd88748624278922bae605823b
    id: r.server-handlers
    level: MUST
    text: 'The market service exposes one handler per market method: createSubmitRfpHandler,
      createSubmitBidHandler, createSubmitAcceptHandler and createSubmitEventHandler
      each build a Handler from their config (deps, lexicon/collection names, verifiers
      and logging) and delegate RFP dispatch to createRfpDispatcher, which validates
      the dispatched RFP input before writing, while createVerifyHandler answers verification
      queries from VerifyHandlerDeps and uses pdsForDid and fetchRecord to pull the
      referenced records.'
  - codeRefs:
    - function:87b92ea5f5717bb556617a2c1fa92cf8
    - function:97a396ee1219f7d9074d254be6aedd52
    - function:98363f480e900827243e69ef1e48679b
    - type_alias:07fd46a41bb1c9e9be4323c963b3e633
    - type_alias:69e9d4e152de0d940d35bb2ea3fa5e21
    - type_alias:c5125342bf372413de697892aa5b2a46
    id: r.service-auth
    level: MUST
    text: 'Calls between market services are authenticated with a service JWT: extractBearer
      pulls the token out of an Authorization header, serviceDidForHost derives the
      did:web service DID for a hostname, and verifyMarketServiceAuth validates the
      token against that audience and issuer and returns a ServiceAuthResult the handler
      can act on.'
  - codeRefs:
    - function:8667f4a02873405e91188462d922e2fe
    - function:dd9dba3c37b4e3b9f52bdef5f65e1d72
    - interface:76a72b652b31091b4242c7e9e449f123
    id: r.signature-verification
    level: MUST
    text: 'A submitted record is only accepted when its signatures verify: verifyRecordSignatures
      takes the verification options including the keys resolver, returns false on
      any signature it cannot check, and normalizeSignature accepts the several encodings
      a signature may arrive in (raw bytes, multibase, base64, hex) while rejecting
      anything it cannot decode.'
  upstream: self
