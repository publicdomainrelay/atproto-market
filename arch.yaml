  requirements:
  - codeRefs:
    - file:lib/abc/market-bidder/mod.ts
    - interface:92e6f8d9226ce7be70eb5107af0d0b2d
    id: r.active-contract-accept-identity
    level: MUST
    text: ActiveContract represents a contract currently held by the bidder and MUST
      record acceptAuthor alongside the optional receiptUri, receiptCid and acceptedAt
      of the acceptance, so that an accepted contract can be traced back to the author
      and receipt that produced it.
  - codeRefs:
    - interface:92e6f8d9226ce7be70eb5107af0d0b2d
    id: r.active-contract-provider-id-promise
    level: SHOULD
    text: ActiveContract SHOULD carry providerIdPromise as a Promise resolving to
      string, number or undefined rather than a settled provider id, so provisioning
      may be awaited lazily and a not-yet-provisioned contract is representable as
      a promise resolving to undefined.
  - codeRefs:
    - file:lib/abc/market-bidder/mod.ts
    - interface:2c4596abe13b14dd4988fbb0b94602fc
    id: r.callback-factory-deps
    level: MUST
    text: CallbackFactoryDeps MUST bundle the guest contract entry, active contract
      and contract event shapes needed to construct a CallbackSet, so a callback factory
      receives everything it needs to build callbacks without reaching into bidder
      internals.
  - codeRefs:
    - file:lib/abc/market-bidder/mod.ts
    - interface:5609df4ae617cdffc9fce7738e5e75be
    id: r.callback-set-slots
    level: MUST
    text: 'CallbackSet MUST let a host inject behaviour through optional slots: rfpCallbacks
      for RFP callbacks, onAccept for the submit-accept callback, eventCallbacks for
      contract event callbacks, and an eventBackground flag selecting whether event
      callbacks run in the background, with every slot optional so a bidder runs with
      any subset supplied.'
  - codeRefs:
    - file:lib/abc/market-bidder/mod.ts
    - interface:7caf4582318b20bae5d3f32ec19f2169
    id: r.contract-event-discriminated-union
    level: MUST
    text: ContractEvent MUST discriminate contract lifecycle state with type limited
      to accepted, provisioned, provisioning-failed, terminated or termination-failed,
      and MUST carry key, receiptUri, receiptCid, acceptAuthor and acceptedAt for
      every event so each notification is self-describing.
  - codeRefs:
    - interface:7caf4582318b20bae5d3f32ec19f2169
    id: r.contract-event-terminal-fields
    level: SHOULD
    text: ContractEvent SHOULD include terminatedAt and providerId only for the event
      types where they are meaningful, leaving them optional so a terminated or provisioned
      event can report its timestamp and provider while earlier events omit them.
  - codeRefs:
    - interface:9e5d28d053bf9ead50572ed7deb21bda
    id: r.guest-contract-entry-optional-submit-url
    level: MAY
    text: GuestContractEntry MAY carry a submitEventUrl to name where events for that
      guest contract are submitted; when absent the consumer must fall back to its
      own event submission target.
  - codeRefs:
    - file:lib/abc/market-bidder/mod.ts
    - interface:9e5d28d053bf9ead50572ed7deb21bda
    id: r.guest-contract-entry-receipt-identity
    level: MUST
    text: GuestContractEntry identifies a contract the bidder did not itself author
      by a receiptKey, receiptUri and receiptCid triple, and MUST expose those three
      as required fields so a consumer can address the receipt without further lookup.
  - codeRefs:
    - file:lib/abc/market-bidder/deno.json
    - file:lib/abc/market-bidder/mod.ts
    id: r.no-behaviour-in-abc
    level: MUST
    text: lib/abc/market-bidder/mod.ts MUST stay declarative, exporting only these
      interface declarations and their imported callback types (RfpCallbacks, SubmitAcceptCallback,
      EventCallbacks) with no runtime, transport or environment access, so the interface
      layer can be depended on from both lib/market-bidder-compute and lib/market-bidder-worker.
  - codeRefs:
    - file:lib/abc/market-bidder/mod.ts
    - interface:6ec00215165ec55bc47d1c24c39bb995
    id: r.policy-exec-options
    level: SHOULD
    text: PolicyExecOptions SHOULD parameterise how a bidder policy is executed, holding
      the execution options separately from the policy itself so callers can vary
      execution without changing the policy.
  - codeRefs:
    - file:lib/abc/market-bidder/mod.ts
    - interface:647384108ca521aa1b24b60fbbf8e53a
    id: r.provider-ref
    level: MUST
    text: MarketBidderProviderRef MUST name a provider reference resolvable by the
      bidder, so that compute and worker bidder implementations share one type for
      identifying the provider a contract runs on.
  upstream: self
