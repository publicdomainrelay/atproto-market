  id: sc.lib-common-market-lexicons-com-publicdomainrelay-temp-tangled
  intent: 'The context exists to record the generated namespace barrel for the com.publicdomainrelay.temp.tangled.spindle
    lexicon tree, so that downstream code that imports the tangled spindle lexicon
    has a stable entry point and so that regeneration of the lexicon bindings is kept
    separate from hand-written code. It is documentation of generated surface, not
    of intended behaviour: the file only re-exports.'
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-tangled
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle.ts
    id: r.generated-not-hand-edited
    level: MUST
    text: The module is machine-generated by @atproto/lex and must not be hand-edited;
      changes to the exposed lexicon surface belong in the lexicon schema and must
      arrive through regeneration, otherwise the next generator run overwrites them.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle.ts
    id: r.temp-lexicon-location
    level: SHOULD
    text: The file stays under the com/publicdomainrelay/temp/tangled lexicon path
      segment that matches its namespace; the `temp` segment marks the namespace as
      provisional, so the barrel should move as a unit when that namespace is promoted
      out of temp rather than being patched in place.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/tangled/spindle.ts
    id: r.trigger-namespace-reexport
    level: MUST
    text: The module re-exports the sibling spindle/trigger.ts module wholesale under
      the name `trigger` (export * as trigger), so importers of the tangled spindle
