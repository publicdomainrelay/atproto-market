  id: sc.lib-market-bidder-agent
  intent: This context exists so the market bidder agent can run against a PDS using
    an OAuth client session rather than a plain credential login, while still satisfying
    the `AtprotoAgentLike` contract the rest of the market stack consumes. It isolates
    the DPoP/refresh plumbing that the upstream `@atproto/oauth-client` keeps private,
    and it adapts the generic `ATProto` helper surface onto that agent by supplying
    TID generation, strong-ref-returning create/update helpers, attestation signing,
    and service-proxied `callService` requests.
