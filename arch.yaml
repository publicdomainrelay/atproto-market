  - file: lib/market-bidder-agent/mod.ts
    kind: function
    name: refreshLock
    signature: 'refreshLock(): Promise<void>'
  name: lib-market-bidder-agent
  requirements:
  - codeRefs:
    - file:lib/market-bidder-agent/mod.ts
    - function:407e4c41cef3e86724e04659cedadfdb
    id: r.agent-surface
    level: MUST
    text: The object returned by the agent factory exposes the current session DID,
      the caller-supplied signer, and the record and service-auth operations `applyWrites`,
      `getRecord`, `listRecords`, `createRecord`, `putRecord`, and `getServiceAuth`,
      so it satisfies the `AtprotoAgentLike` contract consumed by the desktop wrapper.
  - codeRefs:
    - file:lib/market-bidder-agent/mod.ts
    id: r.alg-negotiation
    level: MUST
    text: The DPoP signing algorithm is chosen by intersecting the key's advertised
      algorithms with the server-supported list, falling back to the key's first algorithm,
      and an error is thrown when no algorithm matches.
  - codeRefs:
    - function:06cebf856c3be35de17c689a0ccaca29
    id: r.apply-writes
    level: MUST
    text: '`applyWrites` rewrites each `WriteOp` by renaming its `record` field to
      `value`, then POSTs `com.atproto.repo.applyWrites` to the session PDS with `validate:
      false`, throwing an error carrying the status and response text on a non-OK
      response and otherwise returning the parsed commit event.'
  - codeRefs:
    - function:a690e444f084e1d7e654f05a07f22482
    - function:a9adf14c6ea59e323dcdd8a8ad87784f
    id: r.call-service
    level: MUST
    text: 'When the wrapped agent supplies `getServiceAuth`, the wrapper replaces
      `callService`: an `http(s)` endpoint yields the target base with `/xrpc` and
      a `did:web:<host>` audience, a `did:` endpoint resolves the DID document, finds
      the service entry named by the fragment (defaulting to `pdr_temp_market`), and
      uses its `serviceEndpoint` origin as the audience, minting a service-auth token
      and POSTing the JSON body with a Bearer authorization header; the result reports
      status, ok, and the parsed JSON or text body.'
  - codeRefs:
    - function:a9adf14c6ea59e323dcdd8a8ad87784f
    id: r.desktop-atproto-wrap
    level: MUST
    text: '`createDesktopATProto` dynamically imports `createATProto` and delegates
      the logger, badge signer, PLC directory, and agent to it, returning the resulting
      `ATProto` rather than reimplementing the helper layer.'
  - codeRefs:
    - interface:ac5d8663ab340c835a37c121adbb2dac
    id: r.did-resolver
    level: MAY
    text: The DID resolver used for service resolution only needs a `did.resolve`
      method returning a DID document record, not the full `@atproto/identity` resolver
      surface.
  - codeRefs:
    - file:lib/market-bidder-agent/mod.ts
    id: r.dpop-nonce
    level: MUST
    text: 'DPoP nonces are stored in a map keyed by request origin; the stored nonce
      is attached to each proof, a differing `DPoP-Nonce` response header replaces
      the stored value, and when the response is a nonce error (401 with `WWW-Authenticate:
      DPoP ... error="use_dpop_nonce"`, or 400 with a JSON body reporting `use_dpop_nonce`
      for bodies under 10 KiB) the original body is cancelled and the request is retried
      once with the fresh nonce.'
  - codeRefs:
    - file:lib/market-bidder-agent/mod.ts
    - function:1b2e0f2694d705889bcfb6ed573a9d5a
    id: r.dpop-proof-inline
    level: MUST
    text: 'Requests are signed with a DPoP proof built inline per RFC 9449: the `htu`
      claim strips query and fragment from the URL, the `ath` claim is the base64url
      SHA-256 of the bearer token taken from a `DPoP `-prefixed Authorization header,
      the JWT header carries `typ: dpop+jwt` with the bare public JWK, and the ES256
      signature is produced with `crypto.subtle` over the base64url header and payload.'
  - codeRefs:
    - function:fdc54648c4f6169ee7c3ef17e76f9628
    id: r.get-record
    level: MUST
    text: '`getRecord` issues a GET to `com.atproto.repo.getRecord` with URL-encoded
      repo, collection, and rkey parameters, returns `null` for a 404 or 400 response,
      throws with the status and body text on any other non-OK response, and otherwise
      returns the decoded record.'
  - codeRefs:
    - function:08fbe16787fbdc5b92d51bda4c9a4519
    id: r.list-records
    level: MUST
    text: '`listRecords` issues a GET to `com.atproto.repo.listRecords` for the given
      repo and collection, appending a `limit` parameter only when one is supplied,
      and throws with the status and body text on a non-OK response.'
  - codeRefs:
    - file:lib/market-bidder-agent/mod.ts
    - function:a9adf14c6ea59e323dcdd8a8ad87784f
    id: r.record-helper-patch
    level: SHOULD
    text: When the wrapped agent supplies `createRecord`, the wrapper installs TID-keyed
      `createRecord` and `createRepoRecord` overrides that return strong refs and
      raw `{ uri, cid }` respectively, and installs `updateRecord` over the agent's
      `putRecord`; the TID is a monotonic 13-character base36 timestamp suffixed by
      a wrapping 2048-count base36 clock, and `createSignedRepoRecord` signs an inline
      attestation for the repository and stores it under a `signatures` array.
  - codeRefs:
    - function:691e68a35723a4f0e774745f7efb891b
    - interface:981804416897bc52d8c40722ea378abb
    id: r.refresh-lock
    level: MUST
    text: '`refreshLock` serializes concurrent refreshes behind a single in-flight
      promise so simultaneous 401s cause one `refreshSession` call; it replaces the
      current session, invokes the optional `onSessionRefreshed` callback, rebuilds
      the DPoP fetch closure so proofs use the new key material, and clears the in-flight
      promise in a `finally` block.'
  - codeRefs:
    - function:a690e444f084e1d7e654f05a07f22482
    id: r.service-auth
    level: MUST
    text: '`getServiceAuth` GETs `com.atproto.server.getServiceAuth` with the required
      `aud` and optional `lxm` query parameters, retries once after a `refreshLock`
      when the response is 401, throws with the status and body text on a non-OK response,
      and returns the `token` field of the decoded body.'
  - codeRefs:
    - interface:76dfa4cb57701d3cf137a9d79e664dfe
    - interface:981804416897bc52d8c40722ea378abb
    id: r.session-shape
    level: MUST
    text: An OAuth agent session is described by its DID, PDS base URL, access JWT,
      DPoP key pair, and public JWK, and the options carry a required `refreshSession`
      callback plus an optional `onSessionRefreshed` notification invoked after a
      successful refresh.
  - codeRefs:
    - function:1b2e0f2694d705889bcfb6ed573a9d5a
    - function:691e68a35723a4f0e774745f7efb891b
    id: r.token-refresh-retry
    level: MUST
    text: '`dpopFetch` retries on an expired access token: a 401 whose `WWW-Authenticate`
      begins with `Bearer ` or `DPoP ` and contains `error="invalid_token"` triggers
      a session refresh followed by a re-send, repeated at most twice to absorb clock
      skew between the auth server and the PDS, and the last response is returned
      regardless.'
  - codeRefs:
    - function:8f78299c9e8f2a298e0fa81860dd13d0
    - function:96dc609775f8f9f5382312d19ec99f0e
    id: r.write-records
    level: MUST
    text: '`createRecord` and `putRecord` POST to `com.atproto.repo.createRecord`
      and `com.atproto.repo.putRecord` respectively on the session PDS, each passing
      repo, collection, rkey, the record, and `validate: false`, throwing with the
      status and body text on failure and returning the `{ uri, cid }` result.'
  upstream: self
- code:
  - lib/market-bidder-compute/mod.ts
  codeRefIndex:
  - file:lib/market-bidder-compute/mod.ts mod.ts@lib/market-bidder-compute/mod.ts
  - function:5ec21894bcf015b3164a07db128adf72 createVmBidderCallbacks@lib/market-bidder-compute/mod.ts:78
  - function:aed470efa09431ae131407c08a4b3c37 createComputeProviderHooks@lib/market-bidder-compute/mod.ts:446
  - interface:462aac25716496197891c11616e37b58 VmBidderDeps@lib/market-bidder-compute/mod.ts:44
  depends_on:
  - sc.atproto-market
  id: sc.lib-market-bidder-compute
  intent: 'This context exists so that the compute VM market can be served by a market
    bidder without the generic bidder package knowing anything about VM provisioning.
    It is the adapter layer: it turns a ComputeProvider into the MarketBidderProviderRef
    the bidder host expects, supplying serviceId and appliesTo for routing and delegating
    setup/teardown to the provider, while the callbacks implement the VM-specific
    RFP, accept, and event semantics. It sits downstream of the atproto-market bidder
    abstractions and is what concrete compute providers plug into. It also turns the
    guest''s iroh endpoint id, read back from the provider, into the contract event
    the requester uses as its SSH transport target.'
  interfaces:
  - file: lib/market-bidder-compute/mod.ts
    kind: interface
    name: VmBidderDeps
    signature: 'interface VmBidderDeps { policyExec?: { onlyRemote?: boolean; allowUntrusted?:
      boolean }; getVouchedDids?: (did: string) => Promise<Set<string>>; resolveOperatorDid?:
      (bidderDid: string) => Promise<string | null>; evaluator: { evaluatePolicies(input:
      { refs: Array<{ uri: string; cid: string }>; ctx: PolicyEvalCtx }): Promise<PolicyResult>
      }; did: string; attestationKp: AttestationKeypair; signer: { did(): string;
      sign(bytes: Uint8Array): Promise<Uint8Array> }; idResolver: IdResolver; relay:
      { ingressRef: string; ingressUrl: string }; computeProvider: ComputeProvider;
      log: Logger; activeContracts: Map<string, ActiveContract>; onContractChange?:
      (event: ContractEvent) => void; createRepoRecord: (collection: string, record:
      Record<string, unknown>) => Promise<{ uri: string; cid: string }>; createSignedRepoRecord:
      (collection: string, record: Record<string, unknown>, issuer?: string) => Promise<{
      uri: string; cid: string; record: Record<string, unknown> }>; callService: (endpointUrl:
      string, nsid: string, lxm: string, body: Record<string, unknown>) => Promise<{
      status: number; ok: boolean; body: unknown }>; resolve: RecordResolver; acceptToContract?:
      Map<string, import("@publicdomainrelay/market-bidder-abc").GuestContractEntry>
      }'
  - file: lib/market-bidder-compute/mod.ts
    kind: function
    name: createComputeProviderHooks
    signature: '(opts: { provider: ComputeProvider }): MarketBidderProviderRef'
  - file: lib/market-bidder-compute/mod.ts
    kind: function
    name: createVmBidderCallbacks
    signature: '(deps: VmBidderDeps): { rfp: Record<string, Record<string, SubmitRfpCallback>>;
      accept: SubmitAcceptCallback; event: Record<string, Record<string, (ctx: EventDispatchContext)
      => Promise<{ status?: number; body?: unknown } | void>>; }'
  name: lib-market-bidder-compute
  requirements:
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:5ec21894bcf015b3164a07db128adf72
    id: r.accept-bidconfig-required
    level: MUST
    text: Provisioning must be aborted and left unprovisioned when the bid's bidConfig
      ref cannot be resolved, because an incomplete accept bundle makes fedproxy-client
      fatal-exit inside the guest; the resolve failure must be logged together with
      which step (bid or config) and which uri/cid failed.
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:5ec21894bcf015b3164a07db128adf72
    id: r.accept-bundle-injection
    level: MUST
    text: The provisioned VM is built by passing an accept bundle -- accept, rfp,
      bid, bid_config and vm refs -- through computeProvider.injectAcceptBundle and
      appending it to the VM's existing user_data, with _uri and _cid stamped from
      the resolved payload.
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:5ec21894bcf015b3164a07db128adf72
    id: r.accept-provisioning-timeout
    level: MUST
    text: On accept, when the accept carries an RFP ref, the handler must race VM
      provisioning against a 600000 ms (10 minute) timeout and on failure or timeout
      record providerIdPromise as undefined rather than throwing.
  - codeRefs:
    - function:5ec21894bcf015b3164a07db128adf72
    - interface:462aac25716496197891c11616e37b58
    id: r.callback-factory-shape
    level: MUST
    text: 'createVmBidderCallbacks must accept a single VmBidderDeps bundle and return
      an object with three callback maps: rfp keyed by NSID then lxm, the single accept
      callback, and event keyed by NSID then lxm returning an optional { status, body
      } response.'
  - codeRefs:
    - function:5ec21894bcf015b3164a07db128adf72
    - interface:462aac25716496197891c11616e37b58
    id: r.contract-mirroring
    level: SHOULD
    text: When deps.acceptToContract is provided, the accept ref must be mirrored
      into it keyed by refKey({ uri, cid }) with the receipt key, receipt uri/cid
      and the accept's submitEvent URL, so guest event endpoints can look the contract
      up from an accept.
  - codeRefs:
    - function:5ec21894bcf015b3164a07db128adf72
    - interface:462aac25716496197891c11616e37b58
    id: r.deps-optional-policy-hooks
    level: MAY
    text: The policy-execution, vouch-set and operator-resolution fields of the deps
      bundle are optional; when absent the handler must supply inert stand-ins --
      no operator DID and an empty vouch set -- so policy evaluation still runs without
      them.
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:5ec21894bcf015b3164a07db128adf72
    id: r.iroh-ticket-emission
    level: MUST
    text: 'Once a providerId resolves, the handler must obtain the guest''s iroh ticket
      by calling deps.computeProvider.getNodeId(providerId) when that optional method
      exists, retrying with a bounded backoff up to the provisioning timeout because
      the guest writes /root/secrets/iroh-node-id only after boot; the returned ticket
      must be published on the contract''s event path so the requester can dial it:
      the vm.onNetwork record''s address field must carry the ticket (the registerIdentity
      computeIdentity.nodeId field may carry the same value in addition). This publication
      must be deduplicated per receipt key and must not require an ingress submitEvent
      URL. When the provider has no getNodeId or it never returns a ticket, the handler
      must fall back to its previous behavior (the provisioned address) rather than
      failing the contract.'
  - codeRefs:
    - function:5ec21894bcf015b3164a07db128adf72
    - function:aed470efa09431ae131407c08a4b3c37
    id: r.provider-ref-callback-delegation
    level: MUST
    text: The returned ref's buildCallbacks must forward every CallbackFactoryDeps
      field into createVmBidderCallbacks, substituting the hook's own provider for
      computeProvider, and translate the result into { rfpCallbacks, onAccept, eventCallbacks
      }.
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:aed470efa09431ae131407c08a4b3c37
    id: r.provider-ref-identity
    level: MUST
    text: createComputeProviderHooks must return a MarketBidderProviderRef declaring
      serviceId "pdr_temp_market" and appliesTo ["com.publicdomainrelay.temp.compute.vm"],
      with setup and teardown bound to the supplied provider.
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:5ec21894bcf015b3164a07db128adf72
    id: r.receipt-lookup-by-uri-fallback
    level: MUST
    text: Contract lookup for an event must try the refKey first and then fall back
      to scanning activeContracts for a matching receiptUri, because the receipt record
      is rewritten after the remote proof so its current CID no longer matches the
      key recorded at creation; the URI identifies the contract, not the CID.
  - codeRefs:
    - function:5ec21894bcf015b3164a07db128adf72
    - interface:462aac25716496197891c11616e37b58
    id: r.receipt-registration
    level: MUST
    text: Each accept must produce a signed receipt record whose cid is an attestation
      CID binding the accept body, the receipt metadata and the issuer DID, and must
      register that receipt in the shared activeContracts map under refKey({ uri,
      cid }) along with providerIdPromise, acceptAuthor, receiptUri, receiptCid and
      acceptedAt, notifying onContractChange with an "accepted" event.
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:5ec21894bcf015b3164a07db128adf72
    id: r.rfp-bid-construction
    level: MUST
    text: After policies pass, the handler must create a bid config through computeProvider.createBidConfig,
      write a zero-cost free bid payload record, assemble a signed bid record carrying
      strongRefs to the RFP, payload and bidConfig plus relay.ingressUrl as submitAccept,
      and best-effort POST it to rfp.submitBid when that URL is present; submission
      failures are logged and must not fail the handler.
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:5ec21894bcf015b3164a07db128adf72
    id: r.rfp-policy-evaluation
    level: MUST
    text: 'On receiving an RFP, each strongRef in rfp.policies must be evaluated individually
      through deps.evaluator.evaluatePolicies with perspective "bidder", and the first
      result whose allow is false must short-circuit the handler with body { ok: false,
      error: "policy rejected", violations }; an absent or empty policies array imposes
      no restriction.'
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:5ec21894bcf015b3164a07db128adf72
    id: r.vm-delete-authority
    level: MUST
    text: A vm.delete event with no receipt ref must answer 400 InvalidRequest, an
      unresolvable receipt must answer 400 InvalidRequest with "unknown receipt",
      and an event whose issuerDid does not equal the contract's acceptAuthor must
      answer 403 Forbidden; only the accept author may delete the VM.
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:5ec21894bcf015b3164a07db128adf72
    id: r.vm-onnetwork-emission
    level: MUST
    text: Once a providerId resolves, a vm.onNetwork compute event record must be
      written to the bidder's own PDS and wrapped in a signed market event referencing
      the receipt, so the firehose distributes it; this emission must be deduplicated
      per receipt key and must not be gated on an ingress submitEvent URL being present.
  - codeRefs:
    - file:lib/market-bidder-compute/mod.ts
    - function:5ec21894bcf015b3164a07db128adf72
    id: r.vm-onnetwork-submit-event
    level: MAY
    text: As a best-effort supplement to the firehose write, the vm.onNetwork event
      may also be pushed to the accept's submitEvent URL via callService, with failures
      logged rather than propagated.
  upstream: self
- code:
  - lib/market-bidder-worker/mod.ts
  codeRefIndex:
  - file:lib/market-bidder-worker/mod.ts mod.ts@lib/market-bidder-worker/mod.ts
  - function:0270e1f8fb0d9ba7755ac84195824cd5 createComputeProviderDenoWorker@lib/market-bidder-worker/mod.ts:305
  - function:35fb7d4b902e6ad5a4f68cf585a580df createWorkerBidderCallbacks@lib/market-bidder-worker/mod.ts:74
  - function:a5248f76fd7c17fa0d03949153f13023 createWorkerProviderHooks@lib/market-bidder-worker/mod.ts:335
  - interface:61e8bfc9bbbe2ef113ac6821edec06fc WorkerProvider@lib/market-bidder-worker/mod.ts:297
  - interface:6588bb229d1d3f4b0851680b4a33303c WorkerBidderDeps@lib/market-bidder-worker/mod.ts:39
  - interface:7505aec1e654513bf40d42b074c9622b CreateComputeProviderDenoWorkerOpts@lib/market-bidder-worker/mod.ts:292
  depends_on:
  - sc.atproto-market
  id: sc.lib-market-bidder-worker
  intent: 'This context exists to give the market bidder a reusable, dependency-injected
    implementation of the worker-manifest flow -- bidding on compute-worker RFPs and
    accepting them into running worker instances -- so that the actual relay, signer,
    manifest store, runner, resolver and policy engine can be supplied by whatever
    host process embeds it (Deno worker runtime, CLI, or test harness) rather than
    being hard-wired. It sits downstream of the shared market bidder ABC layer: it
    implements the rfpCallbacks/onAccept callback set and the MarketBidderProviderRef
    registration shape that the ABC bidder loop expects, while adding worker-specific
    policy, permission and attestation behavior.'
  interfaces:
  - file: lib/market-bidder-worker/mod.ts
    kind: interface
    name: CreateComputeProviderDenoWorkerOpts
    signature: |-
      interface CreateComputeProviderDenoWorkerOpts {
        logger: StructuredLoggerInterface;
        atproto: ATProto;
      }
  - file: lib/market-bidder-worker/mod.ts
    kind: interface
    name: WorkerBidderDeps
    signature: interface WorkerBidderDeps
  - file: lib/market-bidder-worker/mod.ts
    kind: interface
    name: WorkerProvider
    signature: interface WorkerProvider
  - file: lib/market-bidder-worker/mod.ts
    kind: function
    name: createComputeProviderDenoWorker
    signature: '(opts: CreateComputeProviderDenoWorkerOpts): Promise<WorkerProvider>'
  - file: lib/market-bidder-worker/mod.ts
    kind: function
    name: createWorkerBidderCallbacks
    signature: |-
      (deps: WorkerBidderDeps): {
        rfp: Record<string, Record<string, SubmitRfpCallback>>;
        accept: SubmitAcceptCallback;
      }
  - file: lib/market-bidder-worker/mod.ts
    kind: function
    name: createWorkerProviderHooks
    signature: |-
      (opts: {
        provider: WorkerProvider;
        permissionPolicyHandler?: PermissionPolicyHandler;
      }): MarketBidderProviderRef
  name: lib-market-bidder-worker
  requirements:
  - codeRefs:
    - function:35fb7d4b902e6ad5a4f68cf585a580df
    - interface:6588bb229d1d3f4b0851680b4a33303c
    id: r.accept-provisioning
    level: MUST
    text: On a valid accept, onAccept must register the resolved manifest record with
      workerManifestStore, create a WORKER_INSTANCE_NSID record whose manifest field
      is a strongRef to the manifest, and start the worker via workerRunner.start
      taking a ComputeStrongRef instance (the new record) and a ComputeStrongRef manifest.
  - codeRefs:
    - function:35fb7d4b902e6ad5a4f68cf585a580df
    id: r.accept-validation
    level: MUST
    text: 'onAccept must reject malformed accepts with HTTP 400 InvalidRequest bodies
      before doing any work: a missing rfp ref gives "missing rfp ref in accept",
      a resolved RFP without a payload gives "missing payload in rfp", an unresolvable
      payload gives "payload not found", and a payload whose $type is not WORKER_MANIFEST_NSID
      gives "payload is not a worker manifest".'
  - codeRefs:
    - function:35fb7d4b902e6ad5a4f68cf585a580df
    - interface:6588bb229d1d3f4b0851680b4a33303c
    id: r.active-contract-tracking
    level: MUST
    text: onAccept must record the new contract in deps.activeContracts under the
      refKey of the receipt strongRef, with providerIdPromise resolving to the instance
      URI and acceptAuthor set to the issuer DID, then emit onContractChange type
      "accepted" immediately and a follow-up "provisioned" or "provisioning-failed"
      event once providerIdPromise settles depending on whether a providerId is present.
  - codeRefs:
    - function:35fb7d4b902e6ad5a4f68cf585a580df
    - interface:6588bb229d1d3f4b0851680b4a33303c
    id: r.bid-record-creation
    level: MUST
    text: On a permitted RFP, onRfp must first create a free payload record in collection
      com.publicdomainrelay.temp.market.bids.free with cost 0 and a createdAt timestamp,
      then create and sign a bid record containing the BID_NSID $type, a strongRef
      to the RFP, a strongRef to that payload, submitAccept set to relay.ingressUrl
      and the same createdAt, and return body {ok:true, bidUri, bidCid}.
  - codeRefs:
    - function:35fb7d4b902e6ad5a4f68cf585a580df
    id: r.callback-namespace
    level: MUST
    text: 'createWorkerBidderCallbacks must return the callbacks keyed for dispatch
      as rfp: { pdr_temp_market: { [WORKER_MANIFEST_NSID]: onRfp } } alongside the
      bare accept handler, so the bidder loop only routes worker-manifest RFPs to
      this handler.'
  - codeRefs:
    - function:35fb7d4b902e6ad5a4f68cf585a580df
    - interface:6588bb229d1d3f4b0851680b4a33303c
    id: r.dep-defaults
    level: MUST
    text: WorkerBidderDeps.resolveOperatorDid and getVouchedDids are optional; when
      omitted, onRfp must substitute defaults of resolving to null and returning an
      empty Set respectively, so policy evaluation never crashes on a missing hook.
      policyExec, onContractChange and permissionPolicyHandler are likewise optional.
  - codeRefs:
    - file:lib/market-bidder-worker/mod.ts
    - function:35fb7d4b902e6ad5a4f68cf585a580df
    id: r.no-termination-path
    level: MAY
    text: Worker contracts intentionally have no termination path, because no worker.delete
      lexicon exists yet; this known gap is left unfixed rather than invented by adding
      a teardown callback for accepted contracts.
  - codeRefs:
    - function:35fb7d4b902e6ad5a4f68cf585a580df
    - interface:6588bb229d1d3f4b0851680b4a33303c
    id: r.policy-eval-on-rfp
    level: MUST
    text: createWorkerBidderCallbacks' onRfp handler must evaluate each strongRef
      in rfp.policies through deps.evaluator.evaluatePolicies one ref at a time, with
      ctx perspective "bidder", selfDid and subjectDid set to the bidder DID, rootRequesterDid
      and counterpartyDid set to the RFP issuer DID, resolve wired to the injected
      RecordResolver, and a demand field built from rfp.payload (rfpRef, payloadRef,
      payloadNsid via nsidFromUri). The first result with allow=false short-circuits
      the handler, logging a warning and returning body {ok:false, error:"policy rejected",
      violations}. An absent or empty policies array imposes no restriction and the
      RFP is open to all bidders.
