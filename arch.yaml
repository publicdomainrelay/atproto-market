    id: r.grant-lifecycle
    level: MUST
    text: 'The authorizer holds at most one active SecretsGrant: install(grant) replaces
      it, revoke() clears it to null, and the granted getter reports whether a grant
      is currently installed.'
  - codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - function:d7d076f635e975de9b23dac9be2ef9e7
    - interface:dc48a990f6ac35504ef07082ebff16e1
    id: r.injected-fetch-and-tolerance
    level: MUST
    text: createSecretsAuthorizer takes CreateSecretsAuthorizerOpts where fetch defaults
      to globalThis.fetch and clockToleranceSec defaults to 5; every discovery and
      JWKS request goes through that injected fetch so caller-patched transports such
      as local dispatchers and tests are not bypassed by jose's remote JWKS fetching.
  - codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - function:d7d076f635e975de9b23dac9be2ef9e7
    id: r.jwks-discovery-and-cache
    level: MUST
    text: getJwks resolves keys by fetching <issuerUri>/.well-known/openid-configuration
      from the trimmed issuer, requiring a jwks_uri in the response, fetching that
      URI, and turning the document into a local jose JWK set; the result is cached
      per issuer URI and returned from cache unless reload is true, and a non-OK discovery
      or JWKS response raises UnauthorizedException naming the URL and status.
  - codeRefs:
    - file:lib/secrets-oidc/deno.json
    - file:lib/secrets-oidc/mod.ts
    id: r.package-surface
    level: MUST
    text: The package @publicdomainrelay/secrets-oidc exports ./mod.ts and depends
      on jose (npm ^5) plus the jsr packages secrets-common, rbac-atproto and oidc-issuer-abc,
      so consumers get the authorizer types and factory from the single module entrypoint.
  - codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - interface:05b597fb30f58132a5be06a41f6fba0d
    - interface:d3e1a8191afeaac9625fd120d563275c
    id: r.rbac-decision
    level: MUST
    text: After verification the grant's rbac record, the token sub, the request path
      and the request method are passed to checkRBACPolicy, and a successful authorize
      returns AuthorizedRequest carrying that sub.
  - codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - interface:05b597fb30f58132a5be06a41f6fba0d
    id: r.reject-without-grant-or-token
    level: MUST
    text: authorize throws UnauthorizedException when no grant is installed ('no active
      secrets grant') or when the token argument is empty ('missing bearer token'),
      before any decoding or verification happens.
  - codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - function:d7d076f635e975de9b23dac9be2ef9e7
    id: r.rotation-retry
    level: MUST
    text: When verification fails specifically with jose.errors.JWKSNoMatchingKey,
      the authorizer reloads the issuer's JWKS once (getJwks with reload) and retries
      verification; a retry failure is reported as UnauthorizedException.
  - codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - interface:bf1e05cf2e07ed74d51e51e2e63afc40
    id: r.signature-verification
    level: MUST
    text: The token signature is verified with jose.jwtVerify against the grant's
      issuerUri as issuer and expectedAud as audience, using the configured clockTolerance;
      any failure other than a missing key surfaces as UnauthorizedException 'token
      verification failed'.
  - codeRefs:
    - function:5f4aad08662e2d2094582832d7b08310
    - interface:d3e1a8191afeaac9625fd120d563275c
    id: r.sub-required
    level: MUST
    text: A verified payload without a sub claim is rejected with UnauthorizedException
      'token has no sub'.
  upstream: self
- code:
  - lib/trust-graph-bsky-mutuals/mod.ts
  codeRefIndex:
  - file:lib/trust-graph-bsky-mutuals/deno.json deno.json@lib/trust-graph-bsky-mutuals/deno.json
  - file:lib/trust-graph-bsky-mutuals/mod.ts mod.ts@lib/trust-graph-bsky-mutuals/mod.ts
  - function:34fc226f1ebe43b6ca206f58c9e43a2f createBskyMutualsVouchResolver@lib/trust-graph-bsky-mutuals/mod.ts:8
  - interface:db90b579bdaef85c0398478a8d9c2578 BskyMutualsVouchResolverOpts@lib/trust-graph-bsky-mutuals/mod.ts:3
  depends_on:
  - sc.atproto-market
  id: sc.lib-trust-graph-bsky-mutuals
  intent: This context exists to plug a real social signal — the Bluesky follow graph
    — into the trust graph's resolver seam without the trust graph knowing anything
    about Bluesky or about how follows are fetched. The module owns only the interpretation
    (follows are vouches) and the failure policy (a broken follow lookup must not
    break trust evaluation), while the caller supplies the transport via getFollows
    and observation via log. Keeping it as a thin, dependency-injected adapter means
    the trust graph can be exercised with a fake follow source and the same resolver
    can later be backed by a cache, a PDS, or an indexer.
  interfaces:
  - file: lib/trust-graph-bsky-mutuals/mod.ts
    kind: interface
    name: BskyMutualsVouchResolverOpts
    signature: 'interface BskyMutualsVouchResolverOpts { getFollows(actor: string):
      Promise<Set<string>>; log?(level: string, msg: string, meta?: Record<string,
      unknown>): void }'
  - file: lib/trust-graph-bsky-mutuals/mod.ts
    kind: function
    name: createBskyMutualsVouchResolver
    signature: 'createBskyMutualsVouchResolver(opts: BskyMutualsVouchResolverOpts):
      VouchResolver'
  name: lib-trust-graph-bsky-mutuals
  requirements:
  - codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
    id: r.conform-to-vouch-resolver
    level: SHOULD
    text: The returned object should satisfy the VouchResolver contract from lib/abc/trust-graph/mod.ts
      so the module stays a drop-in implementation of that ABC interface and callers
      depend only on the abstraction.
  - codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
    - interface:db90b579bdaef85c0398478a8d9c2578
    id: r.export-factory
    level: MUST
    text: The module must export createBskyMutualsVouchResolver, a factory taking
      BskyMutualsVouchResolverOpts and returning a VouchResolver with getVouchedDids
      and isVouched, so the Bluesky follow graph can be supplied to the trust graph
      as a resolver.
  - codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
    id: r.fail-soft-on-lookup-error
    level: MUST
    text: 'A rejected getFollows must never propagate: getVouchedDids must catch it
      and return an empty Set, and isVouched must catch it and return false, so an
      unreachable follow source degrades to no-vouch instead of failing the caller.'
  - codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
    id: r.is-vouched-membership
    level: MUST
    text: isVouched(voucher, vouchee) must await getFollows(voucher) and report whether
      the resulting Set contains vouchee, so a vouch holds exactly when the voucher
      follows the vouchee.
  - codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
    - interface:db90b579bdaef85c0398478a8d9c2578
    id: r.log-optional-noop-default
    level: MUST
    text: When opts.log is absent the resolver must fall back to a no-op logger so
      logging is never required and never throws, while a supplied log is called directly
      with (level, msg, meta).
  - codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - interface:db90b579bdaef85c0398478a8d9c2578
    id: r.opts-get-follows-required
    level: MUST
    text: 'BskyMutualsVouchResolverOpts must require a getFollows(actor: string):
      Promise<Set<string>> member, which is the sole source of vouch data, and may
      accept an optional log(level, msg, meta?) member; the resolver destructures
      both from its options argument.'
  - codeRefs:
    - file:lib/trust-graph-bsky-mutuals/deno.json
    id: r.package-manifest
    level: MAY
    text: The package may carry a lib/trust-graph-bsky-mutuals/deno.json manifest
      declaring its module metadata, which the code index does not treat as source.
  - codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
    id: r.vouched-dids-are-follows
    level: MUST
    text: getVouchedDids(did) must return the Set produced by getFollows(did) unchanged,
      treating the actor's follow set as exactly the set of DIDs that actor vouches
      for.
  - codeRefs:
    - file:lib/trust-graph-bsky-mutuals/mod.ts
    - function:34fc226f1ebe43b6ca206f58c9e43a2f
    id: r.warn-log-on-error
    level: MUST
    text: On a caught lookup error the resolver must log level "warn" with the message
      "bsky-mutuals follow lookup failed" and metadata carrying the actor DID (the
      did argument for getVouchedDids, the voucher for isVouched) plus the error stringified
      via String(err).
  upstream: self
- code:
  - lib/trust-graph-tangled-graph/mod.ts
  codeRefIndex:
  - file:lib/trust-graph-tangled-graph/deno.json deno.json@lib/trust-graph-tangled-graph/deno.json
  - file:lib/trust-graph-tangled-graph/mod.ts mod.ts@lib/trust-graph-tangled-graph/mod.ts
  - function:c548791fdd9c126249e41e29c7d44c44 createTangledGraphVouchResolver@lib/trust-graph-tangled-graph/mod.ts:14
  - interface:96c0ea570aaadab563b357e40f8b2254 TangledGraphVouchResolverOpts@lib/trust-graph-tangled-graph/mod.ts:9
  - interface:f3b2726e5ba78287474a3382ccf87cc2 ListedRecord@lib/trust-graph-tangled-graph/mod.ts:4
  depends_on:
  - sc.atproto-market
  id: sc.lib-trust-graph-tangled-graph
  intent: 'This context exists so the generic trust graph can resolve web-of-trust
    vouches from records stored in a repository without knowing anything about the
    record layout, the transport, or how the records are fetched. Callers (the market
    bidder and the requester XRPC paths) supply a repo-scoped listRecords function,
    optionally a logger, and receive a VouchResolver they can hand to trust-graph
    evaluation. The module is deliberately transport-agnostic: it never performs I/O
    itself, and it treats lookup failure as "no vouches" rather than an error so a
    transient repository outage degrades trust rather than breaking the caller.'
  interfaces:
  - file: lib/trust-graph-tangled-graph/mod.ts
    kind: interface
    name: ListedRecord
    signature: 'interface ListedRecord { uri: string; value: Record<string, unknown>
      }'
  - file: lib/trust-graph-tangled-graph/mod.ts
    kind: interface
    name: TangledGraphVouchResolverOpts
    signature: 'interface TangledGraphVouchResolverOpts { listRecords(repo: string,
      collection: string): Promise<ListedRecord[]>; log?(level: string, msg: string,
      meta?: Record<string, unknown>): void }'
  - file: lib/trust-graph-tangled-graph/mod.ts
    kind: function
    name: createTangledGraphVouchResolver
    signature: '(opts: TangledGraphVouchResolverOpts): VouchResolver'
  name: lib-trust-graph-tangled-graph
  requirements:
  - codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - interface:f3b2726e5ba78287474a3382ccf87cc2
    id: r.export-listed-record
    level: MUST
    text: Export a ListedRecord shape carrying the record's uri and its decoded value
      object, so callers can hand back raw listed records without adapting them.
  - codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
    id: r.fail-closed-on-lookup-error
    level: MUST
    text: 'A rejection from listRecords must not propagate: it is logged at warn level
      with the message "tangled-graph vouch lookup failed" and metadata containing
      the did and the stringified error, and getVouchedDids returns the vouches collected
      so far (an empty set) instead of throwing.'
  - codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
    id: r.is-vouched-membership
    level: MUST
    text: isVouched(voucher, vouchee) must resolve the voucher's vouched set via getVouchedDids
      and return whether that set contains the vouchee, inheriting the same fail-closed
      behaviour on lookup errors.
  - codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
    id: r.list-vouch-collection
    level: MUST
    text: getVouchedDids must list records for the given did under the module's vouch
      collection NSID (VOUCH_NSID) through the injected listRecords callback.
  - codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - interface:96c0ea570aaadab563b357e40f8b2254
    id: r.opts-list-records-callback
    level: MUST
    text: Take the repository read as an injected listRecords(repo, collection) callback
      returning a promise of ListedRecord[], so the resolver performs no network or
      PDS access of its own.
  - codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - interface:96c0ea570aaadab563b357e40f8b2254
    id: r.opts-optional-logger
    level: MAY
    text: Accept an optional log(level, msg, meta) callback; when it is absent the
      resolver substitutes a no-op logger so logging never throws.
  - codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
    id: r.returns-vouch-resolver
    level: MUST
    text: createTangledGraphVouchResolver must return a VouchResolver value exposing
      getVouchedDids(did) -> Promise<Set<string>> and isVouched(voucher, vouchee)
      -> Promise<boolean>, not a bare function or a thrown error.
  - codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
    id: r.rkey-must-be-did
    level: MUST
    text: The vouched identity must be taken from the record's rkey (the last slash-separated
      segment of uri, empty string when absent) and added to the result set only when
      that rkey starts with "did:"; all other rkeys are discarded.
  - codeRefs:
    - file:lib/trust-graph-tangled-graph/deno.json
    - file:lib/trust-graph-tangled-graph/mod.ts
    id: r.single-mod-entrypoint
    level: SHOULD
    text: The package should expose its surface through the single mod.ts entrypoint,
      with the module configuration in deno.json alongside it.
  - codeRefs:
    - file:lib/trust-graph-tangled-graph/mod.ts
    - function:c548791fdd9c126249e41e29c7d44c44
    id: r.skip-denounce
    level: MUST
    text: Records whose value.kind is "denounce" must be skipped entirely, so a denouncement
      is never counted as a vouch for its subject.
  upstream: self
- code:
  - lib/utils-attestation-key/mod.ts
  codeRefIndex:
  - file:lib/utils-attestation-key/mod.ts mod.ts@lib/utils-attestation-key/mod.ts
  - function:31d6822de041bbe285c919680dd5898d loadOrCreateAttestationKeyHex@lib/utils-attestation-key/mod.ts:22
  depends_on:
  - sc.atproto-market
  id: sc.lib-utils-attestation-key
  intent: 'This context exists so that processes needing to sign AT Protocol attestations
    have one idempotent, deterministic place to obtain their signing key material:
    point it at a JWK path and it either loads the existing key or mints and persists
    a new one. It deliberately refuses to overwrite a file that is not a secp256k1
    private JWK, guarding against clobbering an unrelated or misconfigured key store,
    and it returns the raw hex scalar so callers can feed it into the attestation
    layer without re-parsing the JWK.'
  interfaces:
  - file: lib/utils-attestation-key/mod.ts
    kind: function
    name: loadOrCreateAttestationKeyHex
    signature: '(jwkPath: string | URL): Promise<string>'
  name: lib-utils-attestation-key
  requirements:
  - codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
    id: r.generate-and-persist-key
    level: MUST
    text: When no file exists, draw 32 random bytes with crypto.getRandomValues, write
      a JWK with kty "EC", crv "secp256k1", use "sig", alg "ES256K" and base64url-encoded
      d to jwkPath as JSON with two-space indentation plus a trailing newline, and
      return the same scalar as lowercase hex.
  - codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
    id: r.load-existing-jwk
    level: MUST
    text: When the file at jwkPath exists, read and JSON-parse it, and return bytesToHex(base64UrlDecode(jwk.d))
      so the caller receives the private scalar as lowercase hex rather than the JWK
      itself.
  - codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
    id: r.only-notfound-triggers-creation
    level: MUST
    text: A Deno.errors.NotFound on the read is the only failure that falls through
      to key creation; every other read error is rethrown unchanged so permission
      and I/O problems surface instead of silently generating a new key.
  - codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
    id: r.refuse-non-secp256k1-jwk
    level: MUST
    text: A pre-existing file whose parsed contents do not have kty === "EC", crv
      === "secp256k1" and a string d must cause a thrown error naming the path and
      stating it is not a secp256k1 private JWK; the file must not be overwritten.
  - codeRefs:
    - file:lib/utils-attestation-key/mod.ts
    - function:31d6822de041bbe285c919680dd5898d
    id: r.restrict-key-file-mode
    level: SHOULD
    text: After writing a newly generated JWK the file mode is set to 0600, and a
      chmod failure is swallowed so platforms without chmod support still complete
      key creation.
  upstream: self
- code:
  - request-vm-ssh/cli-args-env.ts
  - request-vm-ssh/cli_smoke_test.ts
  - request-vm-ssh/mod.ts
  codeRefIndex:
  - file:request-vm-ssh/cli-args-env.ts cli-args-env.ts@request-vm-ssh/cli-args-env.ts
  - file:request-vm-ssh/cli_smoke_test.ts cli_smoke_test.ts@request-vm-ssh/cli_smoke_test.ts
  - file:request-vm-ssh/mod.ts mod.ts@request-vm-ssh/mod.ts
  depends_on:
  - sc.atproto-market
  id: sc.request-vm-ssh
  intent: 'This context exists so the requester CLI''s external contract is pinned
    down: which flags and environment variables configure it and what each defaults
    to, how the three identity/OAuth modes differ, how association is proven or skipped,
    what is passed into `runComputeContract`, and how shutdown, hold mode and the
    `--help` smoke test behave. It is the operator-facing shell around the requester
    library, so that library can change without silently breaking the command people
    actually run. The default guest transport is the iroh module, so the CLI must
    ensure the dumbpipe helper is present and drive SSH through the published ticket.'
  name: request-vm-ssh
  requirements:
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.association-proof
    level: MUST
    text: 'Unless --skip-qr is set, the entrypoint looks for an existing association:
      in OAuth mode by listing `com.publicdomainrelay.temp.badgeBlueKeys` on the user''s
      PDS through the OAuth agent matching challenge==userDid, service==requester_associate
      and keyId==pds.did; otherwise by paging the same collection on the local PDS
      matching challenge==pds.did and service==requester_associate. Any OAuth session
      counts as association proof, so OAuth mode never prompts again.'
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.begin-serve-nonoauth
    level: MUST
    text: '`pds.beginServe()` is awaited only in non-OAuth mode; OAuth modes skip
      it because their market identity is the session user rather than the ephemeral
      PDS keypair DID, which is what `marketDid` resolves to.'
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.capabilities
    level: MUST
    text: When --secrets names a JSON bundle, the file is parsed and a secrets guest
      capability is registered (the ephemeral server is reachable only through the
      ingress proxy and releases values after the VM exchanges its workload identity
      token); --user-data names a base cloud-init file that is read and patched with
      the default iroh transport provisioning before the RFP, and --user-data-transport
      selects the transport module.
  - codeRefs:
    - file:request-vm-ssh/cli-args-env.ts
    - file:request-vm-ssh/mod.ts
    id: r.cli-configuration-surface
    level: MUST
    text: 'Configuration is declared declaratively in cli-args-env.ts as an option
      map, not read via Deno.env.get in the entrypoint: `--port` (PORT, no default;
      when absent only the ingress relay serves), `--private-key-hex` (REPO_PRIVATE_KEY_HEX),
      `--private-key-hex-path` (REPO_PRIVATE_KEY_HEX_PATH, default a requester-private-key
      file under the user cache dir, overridden by --private-key-hex), `--plc-directory-url`
      (PLC_DIRECTORY_URL, default https://plc.directory), `--atproto-oauth` (boolean),
      `--atproto-oauth-qr` (boolean), `--atproto-handle` (ATP_HANDLE), `--oauth-client-id`
      (OAUTH_CLIENT_ID, default http://localhost), `--oauth-redirect-uri` (OAUTH_REDIRECT_URI,
      default http://127.0.0.1:0/callback), `--oauth-session-path` (OAUTH_SESSION_PATH,
      default requester-oauth-session.json under the cache dir), `--ingress-proxy-host`
      (INGRESS_PROXY_HOST, default xrpc.fedproxy.com), `--no-ingress-proxy` (boolean),
      `--fedproxy-host` (FEDPROXY_HOST, default fedproxy.com), `--label` (REQUESTER_LABEL,
      default request-vm-ssh), `--vm-name` (VM_NAME), `--exec` (EXEC_PROGRAM, default
      bash), `--vm-ready-timeout-sec` (VM_READY_TIMEOUT_SEC, default 300), `--keep-vm`
      (KEEP_VM), `--hold` (HOLD), `--ssh-authorized-key` (SSH_AUTHORIZED_KEY, repeatable
      or comma-separated), `--skip-ssh` (SKIP_SSH), `--bidder-dids` (BIDDER_DIDS),
      `--deny-bidder-dids` (DENY_BIDDER_DIDS), `--relay-url` (RELAY_URL), `--firehose-mode`
      (FIREHOSE_MODE, default off), `--firehose-url` (FIREHOSE_URL, repeatable or
      comma-separated), `--serve-addr` (SERVE_ADDR), `--serve-unix` (SERVE_UNIX),
      `--guest-host-aliases` (GUEST_HOST_ALIASES), `--user-data` (USER_DATA), `--user-data-transport`
      (USER_DATA_TRANSPORT, default iroh), `--secrets` (SECRETS_FILE), `--policy`,
      `--policy-args`, `--policy-engine` (POLICY_ENGINE), `--only-remote-policy-exec`,
      `--allow-untrusted-policy-exec`, `--pds-state-path` (PDS_STATE_PATH, default
      requester-pds under the cache dir), `--oauth-session-file` (OAUTH_SESSION_FILE),
      `--oauth-session-client-id` (OAUTH_SESSION_CLIENT_ID), `--skip-qr` (boolean),
      `--skip-rbac` (SKIP_RBAC, default off i.e. RBAC enabled).'
  - codeRefs:
    - file:request-vm-ssh/cli_smoke_test.ts
    id: r.cli-smoke-test
    level: MUST
    text: A smoke test invokes `deno run -A request-vm-ssh/mod.ts --help` from the
      repository root (derived from the test file's own URL, not a hard-coded path),
      asserts exit code 0, and asserts stdout mentions "request-vm-ssh".
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.config-json-overlay
    level: SHOULD
    text: A sibling `config.json` is imported dynamically and passed as the runtime
      config to the CLI resolver so file values override absent flags; a missing or
      unparsable config.json is swallowed rather than fatal.
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.contract-invocation
    level: MUST
    text: runComputeContract is called with the built PDS plus the resolved ingress/fedproxy
      hosts, PLC URL, guest host aliases, VM name, exec program (default bash), skip-ssh/keep-vm
      flags, comma- or repeated-flag-flattened SSH authorized keys, VM-ready timeout,
      extra and denied bidder DIDs, relay URLs, base user data, RBAC flag, capabilities,
      policy settings, the offering watcher accessor, the event-streams client, and
      an SSH session provider that pauses console output on SSH start and resumes
      it on SSH end.
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.firehose-watchers
    level: MUST
    text: An event-streams client is built from --relay-url plus, when firehose mode
      is subscriberepos and a URL is given, each comma-separated --firehose-url entry,
      with the default relay set removed when a firehose URL is supplied; it then
      starts a watcher on the offering collection that records offering DIDs seen
      in non-delete operations and a watcher on the compute event collection for this
      PDS, and the client's relay URLs plus the offering-DID accessor are passed into
      the contract run.
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.hold-mode
    level: MUST
    text: '--hold runs provisioning-only: the first SIGINT/SIGTERM aborts the hold
      signal so the contract tears the VM down via vm.delete and returns, while without
      --hold a signal shuts down directly; combining --hold with --skip-ssh is rejected
      with `--hold requires SSH readiness (conflicts with --skip-ssh)` and exit status
      2.'
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.identity-modes
    level: MUST
    text: 'Exactly one of three mutually exclusive branches selects the requester
      identity: --atproto-oauth with --atproto-handle builds an OAuth requester with
      the requester OAuth scope, restores a persisted session or opens the browser
      on the auth URL and completes the flow through a loopback callback server; --atproto-oauth-qr
      restores a saved QR session or shows a qr.fedfork.com QR URL and polls for the
      transferred session, then builds a local PDS whose `oauthAgent`/`oauthSession`
      are the signed-in user so market records are authored by that user via applyOAuthAgentToRequesterPDS;
      and the default branch builds a plain local PDS.'
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.iroh-default-transport
    level: MUST
    text: The CLI must default --user-data-transport to the iroh module so a run with
      no transport flag provisions the guest with the dumbpipe listener, must ensure
      the dumbpipe binary is available (via the requester library's ensureDumbpipe)
      whenever SSH will run, and must not pass a hard-coded websocat ProxyCommand;
      the legacy websocat/fedproxy-ssh path must remain reachable only by explicitly
      selecting that transport. --skip-ssh must still skip all SSH and ticket handling,
      --keep-vm must still leave the VM running, and an explicitly unknown --user-data-transport
      id must still fail with the cloud-init module registry's unknown user-data module
      error.
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.local-dev-fetch-patch
    level: MUST
    text: When the ingress proxy host contains localhost or starts with 127., the
      entrypoint replaces globalThis.fetch so that https URLs whose host ends in .localhost
      are rewritten to http on the patch port (the port embedded in the ingress host,
      else 80), letting the requester reach bidder PDS endpoints during local development.
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.oauth-session-expiry
    level: MUST
    text: In the loopback OAuth mode an expired session deletes the stale session
      file, logs the expiry with a restart hint, and exits with status 1 after a short
      delay; QR-mode sessions are created with the same one-hour auto-refresh threshold
      and persist rotated sessions through saveOAuthQRSession.
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.policy-selection
    level: MUST
    text: 'When --policy is given, its args are parsed, the policy name is resolved
      against the Deno/TypeScript policy registry for the requester role, and an unknown
      or invalid policy prints `invalid --policy: <err>` and exits with status 2;
      the resolved policy, --policy-engine DID, --only-remote-policy-exec and --allow-untrusted-policy-exec
      are forwarded to the contract run.'
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.private-key-resolution
    level: MUST
    text: The key hex comes from --private-key-hex when set; otherwise --private-key-hex-path
      is read, trimmed and used if non-empty. In the plain and QR modes a freshly
      generated or loaded key is written back to the path (warned, not fatal, on write
      failure); in QR mode a generated key is also submitted to the PLC directory
      as a genesis operation when the DID does not yet resolve, and the key is persisted
      so later runs reuse it.
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.qr-association-prompt
    level: MUST
    text: With no association found, the entrypoint prints a `https://qr.fedfork.com/#plc=<did>`
      QR code to the console and waits on `pds.associateCalled`, resolves the caller's
      handle from the DID document (falling back to the DID), prompts `Associate with
      <handle>? [y/N]`, and then either calls `pds.approveAssociation()` or, on any
      non-yes answer, rejects the association and exits 0.
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.rbac-default-on
    level: MUST
    text: RBAC is enabled by default — the requester writes the com.fedproxy.rbac
      record authorizing the VM to register its SSH host key — and only --skip-rbac
      turns it off.
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.serve-binding
    level: MUST
    text: The serve listener binds TCP only when --port is set, using --serve-addr
      as the bind address (default 127.0.0.1), and additionally an optional unix socket
      from --serve-unix; the resulting handle is handed to the PDS factory.
  - codeRefs:
    - file:request-vm-ssh/mod.ts
    id: r.shutdown
    level: MUST
    text: After the contract run returns, the result is logged, the PDS is disposed,
      and shutdown closes the event streams, disposes any OAuth agent, shuts the serve
      handle down and exits; SIGINT and SIGTERM are registered to that same path unless
      hold mode is active.
  upstream: self
