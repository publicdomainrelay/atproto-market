  depends_on:
  - sc.atproto-market
  id: sc.lib-common-market-lexicons
  intent: This context exists so every other package in atproto-market can name the
    same lexicons through one import surface instead of hard-coding NSID strings,
    and so the @atproto/lex-generated TypeScript bindings for those lexicons are vendored
    and exported from a single place. Consumers import the generated value/definition
    objects from the com and network barrels for encoding, decoding and lexicon validation,
    while server, bidder, requester and CLI code imports the NSID constants from nsids.ts
    when building at:// URIs, collection names, service-id lookups and $type tags.
    Keeping the NSID constants hand-written and separate from the generated bindings
    lets the identifiers be added or aliased without regenerating lexicons, and the
    _LXM aliases preserve older call sites that used the LXM naming.
  name: lib-common-market-lexicons
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/nsids.ts
    id: r.attested-vocabulary
    level: MUST
    text: nsids.ts declares the shared attestation vocabulary as network.attested.signature,
      network.attested.proof and network.attested.verify, and sets ATTESTATION_INLINE_TYPE
      to NETWORK_ATTESTED_SIGNATURE_NSID so an inline attestation entry is stamped
      with the bare signature nsid and verifiers keyed on the network.attested union
      accept it.
  - codeRefs:
    - file:lib/common/market-lexicons/com.ts
    - file:lib/common/market-lexicons/network.ts
    id: r.generated-barrels-export-namespaces
    level: MUST
    text: com.ts exports the @atproto/lex-generated per-authority modules as namespaces
      fedproxy, publicdomainrelay and atproto from ./com/*.ts, and network.ts exports
      the generated module as namespace attested from ./network/attested.ts, so generated
      value and definition objects are reachable as named namespaces rather than flattened
      symbols.
  - codeRefs:
    - file:lib/common/market-lexicons/com.ts
    - file:lib/common/market-lexicons/network.ts
    id: r.generated-files-not-hand-edited
    level: MUST
    text: com.ts and network.ts carry the header 'THIS FILE WAS GENERATED BY "@atproto/lex".
      DO NOT EDIT.' and must be regenerated rather than edited by hand, so the exported
      namespaces stay in sync with the lexicons they mirror.
  - codeRefs:
    - file:lib/common/market-lexicons/nsids.ts
    id: r.lxm-aliases-match-nsid
    level: MUST
    text: Each *_LXM alias constant in nsids.ts is assigned its corresponding NSID
      constant (SUBMIT_RFP_LXM = SUBMIT_RFP_NSID, SUBMIT_BID_LXM = SUBMIT_BID_NSID,
      SUBMIT_ACCEPT_LXM = SUBMIT_ACCEPT_NSID, SUBMIT_EVENT_LXM = SUBMIT_EVENT_NSID,
      REGISTER_BIDDER_LXM = REGISTER_BIDDER_NSID, LIST_BIDDERS_LXM = LIST_BIDDERS_NSID,
      ASSOCIATE_CONFIRM_LXM = ASSOCIATE_CONFIRM_NSID, MARKET_EVALUATE_POLICY_LXM =
      MARKET_EVALUATE_POLICY_NSID, MARKET_POLICY_DESCRIBE_LXM = MARKET_POLICY_DESCRIBE_NSID,
      MARKET_POLICY_CHECK_SCOPE_LXM = MARKET_POLICY_CHECK_SCOPE_NSID, MARKET_POLICY_HOST_RESOLVE_OPERATOR_LXM,
      MARKET_POLICY_HOST_GET_VOUCHED_DIDS_LXM, MARKET_POLICY_HOST_GET_TRUST_SET_LXM
      and MARKET_POLICY_HOST_GET_RECORD_LXM equal their NSID counterparts), so legacy
      LXM-named call sites and current NSID-named call sites resolve to the same identifier.
  - codeRefs:
    - file:lib/common/market-lexicons/nsids.ts
    id: r.nsid-constants-authority
    level: MUST
    text: 'nsids.ts declares every shared NSID as an exported string constant: market
      and compute records and procedures under the com.publicdomainrelay.temp.* authority
      (agent.class, agent.skill, compute.vm, compute.config.wif.simple, compute.events.vm.*,
      market.bids.free, market.accepts.free, market.receipts.free, market.bids.x402,
      market.accepts.x402, market.receipts.x402, market.rfp, market.bid, market.accept,
      market.receipt, market.event, market.offering, market.submitRfp, market.submitBid,
      market.submitAccept, market.submitEvent, market.bidderRegistration, market.registerBidder,
      market.listBidders, market.bidderDiscovery, market.relays, market.policies.*,
      market.evaluatePolicy, market.bidderAssociation, market.registerIdentity, market.policy.describe,
      market.policy.checkScope, market.policy.host.*), auth.allowlist.rbacDid, badgeBlueKeys,
      requester.associateConfirm, packageRegistry.resolve/package/release, guest.onNetwork,
      guest.registerIdentity), so no caller needs to inline a literal NSID.'
  - codeRefs:
    - file:lib/common/market-lexicons/deno.json
    id: r.package-manifest
    level: MUST
    text: deno.json names the package @publicdomainrelay/market-lexicons, licenses
      it Unlicense, points exports at ./mod.ts, and declares @atproto/lex as the sole
      import mapped to npm:@atproto/lex@^0.1.3, so the generated bindings resolve
      their runtime dependency from the package manifest rather than an import map.
  - codeRefs:
    - file:lib/common/market-lexicons/nsids.ts
    id: r.service-id-defaults
    level: MUST
    text: nsids.ts exports the default service-id constants DEFAULT_MARKET_SERVICE_ID
      (pdr_temp_market), DEFAULT_COMPUTE_EVENT_SERVICE_ID (pdr_temp_compute_event),
      DEFAULT_REQUESTER_ASSOCIATE_SERVICE_ID (requester_associate) and DEFAULT_BIDDER_ASSOCIATE_SERVICE_ID
      (bidder_associate) so service proxying targets and association lookups share
      one default per role.
  - codeRefs:
    - file:lib/common/market-lexicons/mod.ts
    id: r.single-import-surface
    level: MUST
    text: The package entrypoint mod.ts re-exports com.ts, network.ts and nsids.ts,
      so a consumer importing the package gets the generated com bindings, the generated
      network bindings and every NSID constant from one specifier.
  upstream: self
- code:
  - lib/common/market-lexicons/com/atproto.ts
  - lib/common/market-lexicons/com/fedproxy.ts
  - lib/common/market-lexicons/com/publicdomainrelay.ts
  codeRefIndex:
  - file:lib/common/market-lexicons/com/atproto.ts atproto.ts@lib/common/market-lexicons/com/atproto.ts
  - file:lib/common/market-lexicons/com/fedproxy.ts fedproxy.ts@lib/common/market-lexicons/com/fedproxy.ts
