    signature: 'interface GatewayComputeResponse { receiptUri?: string; receiptCid?:
      string; receiptOk?: boolean; sshReady?: boolean; sshExitCode?: number; websocatUrl?:
      string; vmFqdn?: string; winnerDid?: string; winnerBidUri?: string; winnerBidCid?:
      string; winnerBidConfig?: Record<string, unknown>; rfpUri?: string; rfpCid?:
      string; bids?: GatewayBidEntry[]; error?: string }'
  - file: lib/common/compute-contract-gateway-common/types.ts
