      `$ifMatches`, `$matches`, `$parse`, `$safeParse`, `$validate`, and `$safeValidate`
      as the corresponding methods bound to `main`, so callers get type guard, construction,
      and parse/validate behaviour without reaching for the builder directly.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif/simple.defs.ts
    id: r.field-validation
    level: MUST
    text: '`main` validates the record body with `l.object`, binding each required
      field to `l.string()` and wrapping `actx_path` in `l.optional(l.string())`,
      so a record missing a required field or carrying a non-string field fails validation.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif/simple.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif/simple.ts
    id: r.generated-only
    level: MUST
    text: Both files are generated by `@atproto/lex` and declare it in their header,
      so their field names, optionality, and export list are not to be hand-edited;
      changes belong in the lexicon source and must be regenerated.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif/simple.defs.ts
    id: r.nsid-identity
    level: MUST
    text: 'The record type is identified by the NSID `com.publicdomainrelay.temp.compute.config.wif.simple`:
      `$nsid` holds that string, `$type` is exported as the same value, and the `Main`
      type''s literal `$type` field is that same NSID.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif/simple.defs.ts
    id: r.optional-actx-path
    level: MUST
    text: '`actx_path` is the only optional field: it is a string path to a file containing
      the auth context string that may need to be formatted into the token subject,
      and its absence is valid while all other fields are still required.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif/simple.defs.ts
    id: r.required-fields
    level: MUST
    text: 'A simple WIF config record requires `issuer_uri`, `to_issue`, `accept_path`,
      `token_path`, `url_path`, `url_route`, and `subject`, each a string: the OIDC
      issuer the provider''s RBAC trusts, the RBAC role the issued token will carry,
      the on-disk path to the accept file, the path to the workload identity token
      file, the path to the file holding the token-issuance service URL, the route
      appended to that URL for requesting tokens, and the format the requested token''s
      subject must follow.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config/wif/simple.defs.ts
    id: r.tid-record-key
    level: MUST
    text: '`main` is a `l.record<''tid'', Main>` bound to the NSID, declaring the
      `tid` record-key type so instances of this config are stored under TID rkeys
      rather than a fixed key.'
