    id: r.create-jwt-signs-compact-jws
    level: MUST
    text: WebCryptoKey.createJwt must override the caller-supplied header's alg and
      kid with the key's own alg and jwk.kid, base64url-encode the header and payload
      JSON as the signing input, sign it with ECDSA over P-256/SHA-256 via crypto.subtle.sign,
      and return the three-part compact JWS of header.payload.signature.
  - codeRefs:
    - file:lib/atproto-oauth-helpers/key.ts
    - function:a1f1c096bf7c6dd3ad9ba01660767894
    id: r.create-key-generates-es256-pair
    level: MUST
    text: createWebCryptoKey must generate an extractable, sign/verify-capable ECDSA
      P-256 key pair, select "ES256" when the supplied algorithm list contains it
      and otherwise the first listed algorithm, derive kid from crypto.randomUUID(),
      and return a WebCryptoKey built from the private key with the exported public
      and private JWKs.
