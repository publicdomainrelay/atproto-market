  id: sc.lib-common-market-lexicons-com-publicdomainrelay-temp-compute-events
  intent: This context exists so the generated event-vocabulary entrypoint is described
    as a stable, machine-produced interface that consumers import instead of reaching
    into the vm/ submodules by path. It exists to pin down that the module is a barrel
    only — every symbol it exposes is owned by a sibling module under vm/ — so that
    regeneration by @atproto/lex is understood to be the only sanctioned way the exported
    surface changes, and so that editors and reviewers do not treat the absence of
    local declarations as a gap to fill by hand.
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-compute-events
  requirements:
