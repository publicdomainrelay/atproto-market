    - interface:50e55cd486d00a6d88fbbbc9513ea0be
    id: r.at-uri-parsing
    level: MUST
    text: parseAtUri strips the at:// prefix and splits the remainder on slashes into
      repo, collection and rkey; atUriAuthority returns just the authority segment;
      nsidFromUri returns the collection segment, which callers treat as the record's
      NSID.
  - codeRefs:
    - file:lib/abc/market/attestation.ts
    - interface:7c4ceebaecd03e6d27746999a54821d2
    id: r.attestation-keypair
    level: MUST
    text: AttestationKeypair hands the attestation layer a did:key public-key reference
      from its did method together with the private key material, so callers can sign
      and verify without this package depending on the attestation implementation.
  - codeRefs:
    - interface:2e006fab2ae9f1b1265f8f1d98886565
    - interface:9be2bacad9b50e4fe402adc03562b2fb
    - type_alias:072e38723584e04ddf9824fe73b8ae8d
    - type_alias:5f2c2806cdf4c52f0324b4d29875f620
    id: r.bid-and-accept-callbacks
    level: MUST
    text: SubmitBidCallback and SubmitAcceptCallback receive contexts built from the
      record as sent inline in the request (uri, cid, record or resolved accept, issuer
      DID, resolver, logger, and the mandatory inbound request) and return the same
      HandlerResult shape as the RFP callback.
  - codeRefs:
    - class:d2f9b5d5998f84730325047d9db1340d
    - method:9bca3b5354a39ba5e5a08834053af403
    id: r.contract-graph-error
    level: MUST
    text: ContractGraphError extends Error and carries a status field that defaults
      to 400 when the thrower does not name one, so a malformed contract graph surfaces
      as a client error unless a caller says otherwise.
  - codeRefs:
    - file:lib/abc/market/contract.ts
    - interface:30de74b08ca0dfbe29306bb852e2c2f5
    id: r.contract-graph-shape
    level: MUST
    text: 'ContractGraph names the records that make up a market contract: bid, rfp
      and rfpPayload are required strong refs, while bidPayload, bidConfig, accept,
      receipt and event are optional because they only exist once the corresponding
      step has happened.'
  - codeRefs:
    - interface:783b2e7264d1c2455e923a183aa08af2
    - type_alias:5c297d7e51972b79b3f90a4857f9f822
    - type_alias:a5fad144b700800ee41170bd530c2038
    id: r.event-callbacks
    level: MUST
    text: EventCallback receives an EventDispatchContext with the event's uri, cid,
      resolved record, payload NSID and issuer DID, plus the service id the token's
      aud matched when one did, and EventCallbacks indexes handlers by service id
      and payload NSID the same way RFP callbacks are indexed.
  - codeRefs:
    - type_alias:c2e697175930be3ef1c6b21a7b6e1472
    id: r.handler-result-shape
    level: MUST
    text: HandlerResult is either void or an object with an optional status and optional
      body, so a callback can decline to shape the response and let the host supply
      a default.
  - codeRefs:
    - function:ff7b2b644f6f0a994b9f5492fe767eb8
    id: r.receipt-url-join
    level: MUST
    text: receiptUrlFor joins a base url and a path with exactly one slash, stripping
      trailing slashes from the base, and falls back to the origin of the request
      url when no base url is configured.
  - codeRefs:
    - file:lib/abc/market/resolve.ts
    - interface:1a01cd0adebae6ece66a71a28e7e34ca
    - interface:46637b41730d998d7409bb094a199fbe
    id: r.record-resolver-contract
    level: MUST
    text: A host supplies a RecordResolver whose resolve method takes a RecordRef
      of uri plus cid and returns a Promise of Resolved<T>, so every callback context
      can fetch and type records without knowing the transport.
  - codeRefs:
    - class:9828d35cfd8b58a1cd6a8a7f61cbd771
    - method:cb5ff5f27df8f18f6f47ed0cb0207572
    id: r.record-version-error
    level: MUST
    text: RecordVersionError is thrown for an unrecognized record version and its
      message reads exactly `unknown record version <version>` with the offending
      version interpolated.
  - codeRefs:
    - function:6098bf13a256d45b83e56dba75b170ba
    - function:e01a0614b1d05394405331fc4f91dd7a
    id: r.ref-identity
    level: MUST
    text: refKey renders a RecordRef as a single string of the form uri#cid for use
      as a map key, and refsEqual reports two refs equal only when both uri and cid
      match, so cid changes are never mistaken for the same record version.
  - codeRefs:
    - function:4c0fc8eba95ff6940c69d8c957e19f82
    - function:a0b78ea629d02463b11bee34bbee99c3
    id: r.resolved-helpers
    level: MUST
    text: stripResolved returns the wrapped record with the _uri and _cid bookkeeping
      fields removed, and resolvedRef returns a com.atproto.repo.strongRef built from
      those fields, letting a Resolved value be converted back to a record or to a
      ref without re-reading the source.
  - codeRefs:
    - file:lib/abc/market/settlement.ts
    - interface:463898e97d88180ba985082bf1910898
    - interface:534292774b0efca0f35c954e05c1c3e0
    - type_alias:15b66e1486bb1129d9a6b3136080517b
    id: r.settlement-interface
    level: MUST
    text: Settlement exposes its mode as either x402 or free, the NSID of the bid
      payload it produces, a receiptUrl derived from the request url, and createBidPayload
      which writes the payload at the given receipt url and timestamp and returns
      its strong ref; SettlementCtx supplies the agent, resolver, signer, logger and
      base url the implementation needs without this layer knowing the concrete backend.
  - codeRefs:
    - file:lib/abc/market/mod.ts
    id: r.single-entry-export
    level: MUST
    text: mod.ts re-exports resolve, settlement, contract, callbacks and attestation
      so a consumer imports the whole interface layer from the package entry point
      rather than reaching into individual modules.
  - codeRefs:
    - interface:ff0c27330e697df5114c8bef0c21e380
    - type_alias:32fcebe14317b9d1b49d3b48bcb3ca40
    - type_alias:caeab7a15e595c198b75e96251bfe5d8
    id: r.submit-rfp-callback
    level: MUST
    text: SubmitRfpCallback receives a SubmitRfpContext carrying the RFP's uri, cid,
      resolved record, payload NSID and issuer DID plus the resolver and logger, and
      may return a HandlerResult of status and body or nothing; RfpCallbacks indexes
      those handlers by service id and then by payload NSID so one server can host
      several RFP types.
  - codeRefs:
    - interface:ff0c27330e697df5114c8bef0c21e380
    id: r.submit-rfp-request-optional
    level: MUST
    text: The inbound request on SubmitRfpContext is optional, because an RFP discovered
      by pulling the firehose has no originating HTTP request while one pushed over
      submitRfp does; handlers that need url or headers must tolerate its absence.
  upstream: self
