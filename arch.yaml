- code:
  - lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.defs.ts
  - lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.ts
  - lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.defs.ts
  - lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.ts
  codeRefIndex:
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.defs.ts
    class.defs.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.defs.ts
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.ts class.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.ts
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.defs.ts
    skill.defs.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.defs.ts
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.ts skill.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.ts
  depends_on:
  - sc.atproto-market
  id: sc.lib-common-market-lexicons-com-publicdomainrelay-temp-agent
  intent: This context exists so callers can read and write the agent-class and agent-skill
    records of the publicdomainrelay.temp namespace through a typed, validated interface
    rather than hand-rolled JSON. The class record is a template that names a skill
    bundle and an optional parent class so an agent can be instantiated from it seeded
    with those skills, and the skill record carries the capability text plus example
    records and path-annotated property references that resolve values out of those
    examples. Both files are machine-generated by "@atproto/lex" and are not meant
    to be edited by hand; the thin class.ts and skill.ts barrels give importers a
    stable module path whose default export is the record validator.
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-agent
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.defs.ts
    id: r.class-nsid-and-key
    level: MUST
    text: The class lexicon binds $nsid to 'com.publicdomainrelay.temp.agent.class'
      and registers the record validator `main` with record key type 'tid', so class
      records are addressed by TID.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.defs.ts
    id: r.class-optional-fields
    level: MAY
    text: A class record may carry a parent strongRef, meaning instantiating agents
      inherit the parent class's skills alongside this class's own, and a spawnsSubAgent
      boolean marking the class as intended to be spawned as a sub-agent from a parent
      flow rather than as a top-level runtime; both are optional and omitted values
      validate.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.defs.ts
    id: r.class-required-fields
    level: MUST
    text: A class record requires a string name, a string description, a skills array,
      and a datetime-format createdAt; creation fails validation when any of those
      is absent or of the wrong type.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.defs.ts
    id: r.class-skill-references
    level: MUST
    text: Every element of a class record's skills array, and its optional parent,
      is validated as a strongRef to an atproto repo record (RepoStrongRef.Main),
      so a class composes skill records by reference rather than by value.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.ts
    id: r.generated-not-edited
    level: MUST
    text: All four files carry the header 'THIS FILE WAS GENERATED BY "@atproto/lex".
      DO NOT EDIT.', marking them as generated output that must be regenerated from
      the lexicon schema rather than patched by hand.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.ts
    id: r.module-barrels
    level: MUST
    text: class.ts re-exports everything from class.defs.ts and re-exports `main`
      as the module default, and skill.ts does the same for skill.defs.ts, so each
      lexicon can be imported by its short module path and default-imported as its
      record validator.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.defs.ts
    id: r.property-reference
    level: MUST
    text: The skill lexicon defines the inline typed object 'com.publicdomainrelay.temp.agent.skill#propertyReference'
      with a required dotted path string, e.g. '.examples[].value.payload.value.user_data',
      and an optional strongRef; a skill's optional property_references array is an
      array of those objects, and each entry either carries the literal value at that
      path or a strongRef that resolves recursively to it.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.defs.ts
    id: r.skill-examples
    level: MAY
    text: A skill record may carry an examples array whose entries are each validated
      as a strongRef to a repo record (RepoStrongRef.Main), letting a skill point
      at records that demonstrate it.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.defs.ts
    id: r.skill-nsid-and-key
    level: MUST
    text: The skill lexicon binds $nsid to 'com.publicdomainrelay.temp.agent.skill'
      and registers the record validator `main` with record key type 'tid'.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.defs.ts
    id: r.skill-required-fields
    level: MUST
    text: A skill record requires a string name, a string description, a string content
      holding the skill itself, and a string createdAt; validation rejects a record
      missing any of them.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/class.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent/skill.defs.ts
    id: r.validator-exports
    level: MUST
    text: Each defs module exports the record validator `main` together with the bound
      helpers $type, $isTypeOf, $build, $assert, $check, $cast, $ifMatches, $matches,
      $parse, $safeParse, $validate and $safeValidate, plus the $nsid constant and
      a `Main` type alias, so consumers can build, parse and validate records without
      touching the underlying schema object.
  upstream: self
- code:
  - lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist.ts
  codeRefIndex:
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist.ts allowlist.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist.ts
  depends_on:
  - sc.atproto-market
  id: sc.lib-common-market-lexicons-com-publicdomainrelay-temp-auth
  intent: 'The context exists so the rest of the codebase, and any tooling reading
    the market lexicons tree, has one stable import path for the com.publicdomainrelay.temp.auth.allowlist
    lexicon surface. Rather than deep-importing the generated definitions file directly,
    consumers import this barrel and reach the deterministic record helpers through
    the re-exported `rbacDid` namespace. It carries no runtime policy of its own:
    it is a generated, non-editable projection of the lexicon schema, and the authorization
    semantics live in the data records that conform to that schema, not in this file.'
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-auth
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist.ts
    id: r.generated-do-not-edit
    level: MUST
    text: The barrel file is machine-generated by the "@atproto/lex" generator and
      is marked DO NOT EDIT, so any change to the namespace re-export it performs
      must be made by regenerating from the lexicon schema rather than by hand-editing
      this file.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist.ts
    id: r.namespace-matches-lexicon-nsid
    level: SHOULD
    text: The exported namespace name should track the lexicon NSID it fronts, com.publicdomainrelay.temp.auth.allowlist.rbacDid,
      so that the file path under lib/common/market-lexicons/com/publicdomainrelay/temp/auth/
      and the namespace name stay in one-to-one correspondence with the record type.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist.ts
    id: r.no-logic-in-barrel
    level: MUST
    text: The barrel declares no runtime values, types, or side effects of its own;
      it performs only the namespace re-export, leaving all record validation and
      construction helpers to the generated definitions module it points at.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist.ts
    id: r.re-export-rbacdid-namespace
    level: MUST
    text: The barrel re-exports the allowlist definitions as a single named namespace
      binding, `rbacDid`, sourced from ./allowlist/rbacDid.ts, so consumers resolve
      the whole com.publicdomainrelay.temp.auth.allowlist surface through `rbacDid`
      instead of importing the generated definitions module by path.
  upstream: self
- code:
  - lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.defs.ts
  - lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.ts
  codeRefIndex:
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.defs.ts
    rbacDid.defs.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.defs.ts
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.ts
    rbacDid.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.ts
  depends_on:
  - sc.atproto-market
  id: sc.lib-common-market-lexicons-com-publicdomainrelay-temp-auth-allowlist
  intent: 'This context exists so that the `rbacDid` allowlist record is describable
    and consumable as a typed lexicon: the `.defs.ts` file pins the NSID and the record
    shape and exposes the `@atproto/lex` record helpers (`build`, `assert`, `check`,
    `cast`, `parse`, `validate` and their safe variants) that callers use to construct,
    validate and parse allowlist records, while the barrel `rbacDid.ts` gives the
    collection a single import surface with the record itself as the default export.
    Both files are generated by `@atproto/lex` and are not meant to be edited by hand.'
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-auth-allowlist
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.ts
    id: r.barrel-surface
    level: MUST
    text: The barrel module re-exports the entire definitions module and additionally
      re-exports its `main` binding as the module default, so `import defs from '.../rbacDid'`
      yields the `rbacDid` record validator.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.ts
    id: r.generated-not-edited
    level: MUST
    text: 'Both files carry the `@atproto/lex` generated-file header and must be treated
      as generated output: the header comment must remain, and changes belong in the
      lexicon source that regenerates them rather than in these files directly.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.defs.ts
    id: r.import-from-lex-runtime
    level: MUST
    text: Record construction and validation must go through the `l` runtime imported
      from `@atproto/lex`, since the schema fields are `l.LexMap` and `l.DatetimeString`
      runtime types rather than plain TypeScript shapes.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.defs.ts
    id: r.nsid-identity
    level: MUST
    text: The module declares the lexicon NSID `com.publicdomainrelay.temp.auth.allowlist.rbacDid`
      in `$nsid` and re-exports it, and `$type` is that same NSID, so the record type
      string, the record validator and the exported constant all agree on one identifier.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.defs.ts
    id: r.record-fields
    level: MUST
    text: The `Main` record requires `$type` fixed to the NSID, a `protects` lex-map,
      an `allowed` lex-map and a `createdAt` datetime string; the `protects` map holds
      label -> { service, scope } entries whose service id and optional scope must
      match for the protection to apply, and the `allowed` map holds label -> [did,
      ...] entries listing the DIDs authorized under each label.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.defs.ts
    id: r.record-validator
    level: MUST
    text: 'The exported `main` value is built with `l.record<''tid'', Main>(''tid'',
      $nsid, ...)` over an `l.object` of `l.lexMap()` for `protects` and `allowed`
      and `l.string({ format: ''datetime'' })` for `createdAt`, making the record
      key a TID and the two maps untyped lex-maps rather than typed objects.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.defs.ts
    id: r.self-allowlist-purpose
    level: SHOULD
    text: The record's documented purpose is a self-allowlist granting the record
      owner's DID access to their own account-scoped operations, so consumers should
      read `allowed` as authorizing the listed DIDs under the labels declared in `protects`
      rather than as a general cross-account ACL.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth/allowlist/rbacDid.defs.ts
    id: r.validator-exports
    level: MUST
    text: 'The definitions module exports the record''s validation and construction
      surface as bound helpers on `main`: `$build`, `$assert`, `$check`, `$cast`,
      `$isTypeOf`, `$ifMatches`, `$matches`, `$parse`, `$safeParse`, `$validate` and
      `$safeValidate`, each delegating to the corresponding method of the `main` record
      type.'
  upstream: self
- code:
  - lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config.ts
  - lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events.ts
  - lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.defs.ts
  - lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.ts
  codeRefIndex:
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config.ts config.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config.ts
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events.ts events.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events.ts
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.defs.ts
    vm.defs.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.defs.ts
  - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.ts vm.ts@lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.ts
  depends_on:
  - sc.atproto-market
  id: sc.lib-common-market-lexicons-com-publicdomainrelay-temp-compute
  intent: 'The package exists so the market''s requester and provider speak one wire
    format for ephemeral compute: the requester publishes a `compute.vm` request and
    attaches `compute.config.wif.simple` parameters so it can exchange a workload-identity
    token for one scoped to the provider''s RBAC, while the provider publishes `compute.events.vm.*`
    records reporting boot (`started`), network reachability (`onNetwork`), guest
    identity (`registerIdentity`), and requesting teardown (`delete`). It is machine-generated
    from lexicons rather than authored by hand, so its purpose is to carry schema
    fidelity — field names, optionality, integer floors, datetime formats, and record
    keys — into TypeScript types and validators that the rest of the market code imports.'
  name: lib-common-market-lexicons-com-publicdomainrelay-temp-compute
  requirements:
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config.ts
    id: r.config-wif-namespace
    level: MUST
    text: The `config` entry re-exports the WIF subtree from `./config/wif.ts` as
      a single `wif` namespace, so consumers reach the workload-identity configuration
      records as `config.wif.*`.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events.ts
    id: r.event-delete
    level: MUST
    text: The `delete` event record requests that the provider tear down a provisioned
      VM and requires both a `reason` string (for example 'workflow_complete' or 'policy_engine_never_came_up')
      and a `createdAt` datetime; it is sent by the requester because the provider
      treats the VM as a black box and cannot observe those conditions.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events.ts
    id: r.event-on-network
    level: MUST
    text: The `onNetwork` event record reports that a VM has registered its SSH key
      or fedproxy route and its policy engine answered, carrying a required `createdAt`
      datetime and an optional `address` string naming the hostname or IP the VM is
      reachable at.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events.ts
    id: r.event-started
    level: MUST
    text: The `started` event record reports that a provisioned VM has begun booting
      and carries only a required `createdAt` datetime, so a provider can signal boot
      without claiming reachability.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events.ts
    id: r.events-vm-namespace
    level: MUST
    text: The `events` entry re-exports the VM event subtree from `./events/vm.ts`
      as a single `vm` namespace, exposing the `delete`, `started` and `onNetwork`
      event records under `events.vm.*`.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/events.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.ts
    id: r.generated-not-hand-edited
    level: MUST
    text: Every file in the context opens with the header `THIS FILE WAS GENERATED
      BY "@atproto/lex". DO NOT EDIT.`; the sources are generator output, so schema
      changes belong in the upstream lexicons rather than in these modules.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.defs.ts
    id: r.location-embed
    level: SHOULD
    text: The optional `location` field refs the embedded `location` definition (`com.publicdomainrelay.temp.compute.vm#location`),
      exported as the `Location` type and the `location` typed-object validator, whose
      `country` (ISO 3166-1 alpha-3 or human-readable name) and `region` subfields
      are both optional strings.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.defs.ts
    id: r.role-account-scoping
    level: MUST
    text: '`role` is a required string naming the RBAC role the compute runs under,
      and it is documented as requester-controlled: because the requester''s did:plc
      may set it freely and roles are scoped under accounts, agents must request compute
      from their own accounts rather than a shared one.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.defs.ts
    id: r.validator-exports
    level: MUST
    text: The definition file exports the record validator alongside its bound helpers
      — `$type`, `$isTypeOf`, `$build`, `$assert`, `$check`, `$cast`, `$ifMatches`,
      `$matches`, `$parse`, `$safeParse`, `$validate` and `$safeValidate` — each bound
      to `main` so callers can build and check records without re-deriving the schema.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.ts
    id: r.vm-module-surface
    level: MUST
    text: The `vm` module re-exports everything from `vm.defs.ts` and additionally
      re-exports the `main` record validator as the module's default export, so importing
      the module default yields the VM request record validator itself.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.defs.ts
    id: r.vm-record-shape
    level: MUST
    text: The VM request record is the `com.publicdomainrelay.temp.compute.vm` record,
      keyed by `tid`, and its required fields are `cpus`, `mem`, `disk`, `network`,
      `role` and `user_data`, with an optional embedded `location`; the same schema
      is exported as the `Main` type and as the `main` record validator, with `$nsid`
      holding the NSID string.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/vm.defs.ts
    id: r.vm-resource-fields
    level: MUST
    text: '`cpus` is validated as an integer with a minimum of 1, while `mem`, `disk`
      and `network` are free-form strings carrying human-readable size requests such
      as ''512M'', ''4G'', ''10G'' and ''500G''; `user_data` is a string holding cloud-init
      bootstrap data.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/compute/config.ts
    id: r.wif-simple-shape
    level: MUST
    text: The WIF namespace's `simple` record (`com.publicdomainrelay.temp.compute.config.wif.simple`,
      keyed by tid) requires `accept_path`, `issuer_uri`, `to_issue`, `token_path`,
      `url_path`, `url_route` and `subject`, and optionally `actx_path`; it describes
      the parameters a requester uses to obtain a token authorized for the provider,
      where the OIDC issuer URI is trusted by the provider's RBAC, `to_issue` names
      the role granted for token exchange, and requested token subjects must follow
      the `subject` format.
  upstream: self
