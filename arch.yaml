  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/requester/associateConfirm.defs.ts
    - type_alias:32f59c1292407af850d8f6ada5d5959c
    id: r.params-empty
    level: MUST
