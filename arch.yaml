  id: sc.lib-did-plc-generated-client
  intent: 'This context exists to pin the shape of the generated did:plc HTTP client
    so that regeneration and downstream edits in lib/did-plc/client.ts can be checked
    against a stated contract. It is generated by hey-api from the did:plc OpenAPI
    surface, and it is upstream of itself, so the spec records the observable behaviour
    of the generated output rather than any hand-authored design intent. The consumer
    is the did:plc package: anything that changes createClient''s option merging,
    interceptor semantics, response parsing, or exported type names changes every
    caller in lib/did-plc.'
