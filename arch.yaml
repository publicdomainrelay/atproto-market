  - codeRefs:
    - function:d182b9f8d24e2ca8806313b0bcd98280
    - interface:8ec256e4f14d893e88afbca014d72b53
    id: r.service-auth-audience
    level: MUST
    text: Every request derives its service-auth audience as did:web:<host> from the
      parsed base URL and obtains a token by awaiting opts.getServiceAuth(aud, nsid)
      with that audience and the NSID being called.
  - codeRefs:
