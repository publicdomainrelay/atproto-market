    id: r.patch-merge-semantics
    level: MUST
    text: Applying a UserDataPatch must deep-merge apt keys, union packages and bootcmd
      with duplicates removed, replace-in-place users and write_files entries that
      repeat an existing name or path (later entry wins, first position kept), and
      rebuild runcmd as runcmdPrepend then the existing runcmd then runcmd, so prepended
      commands stay ahead of provisioning commands.
  upstream: self
