      the bound validation helpers `$type`, `$isTypeOf`, `$build`, `$assert`, `$check`,
      `$cast`, `$ifMatches`, `$matches`, `$parse`, `$safeParse`, `$validate` and `$safeValidate`,
      each bound to the `main` record so callers can build, check, cast and parse
      against the schema without re-deriving it.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/agent.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/auth.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/badgeBlueKeys.defs.ts
