    level: MUST
    text: buildUserData must return a string starting with the literal `#cloud-config`
      header followed by the YAML serialization of the merged object; the composer
      owns the header, so modules must not emit it themselves.
  - codeRefs:
    - interface:0bccaee64ad56c10f80842c828570d30
    id: r.context-fields
    level: MUST
    text: CloudInitContext must carry the guest-provisioning inputs, with vmName required
      and didPlc, didPlcKey, relayHost, xrpcRelaySubdomain, sshAuthorizedKey, ingressProxyHost,
      audHost, jsrUrl, targetPort, hostAliases, sshHandle, listenPort, woottyDistUrl,
      secretsUrl, secretsRoute, secretsAud and secretsAcceptPath optional, so a module
      reading a field it does not need can be composed from a partial context.
  - codeRefs:
