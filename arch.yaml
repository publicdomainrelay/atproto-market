  - codeRefs:
    - function:4a9182a659c42eaf5efea613d576bf56
    id: r.egress-metadata-hosts-always-blocked
    level: MUST
    text: Regardless of options, assertSafeEgressUrl rejects the cloud metadata hosts
      169.254.169.254 and metadata.google.internal, comparing the lowercased hostname
      with surrounding IPv6 brackets stripped.
  - codeRefs:
    - function:4a9182a659c42eaf5efea613d576bf56
    - type_alias:3b05835c22ae315ee54800118068199e
    id: r.egress-opt-in-private-blocking
    level: MUST
    text: 'When EgressOptions.blockPrivate is set, assertSafeEgressUrl additionally
      rejects loopback and private hosts: localhost, ::1, 127.0.0.0/8, 10.0.0.0/8,
      192.168.0.0/16, 169.254.0.0/16, 172.16.0.0/12, and fc00::/7 prefixes (fc or
      fd); without the flag those hosts pass.'
  - codeRefs:
    - function:4a9182a659c42eaf5efea613d576bf56
    - type_alias:3b05835c22ae315ee54800118068199e
    id: r.egress-options-shape
