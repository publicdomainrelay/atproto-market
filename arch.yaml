    level: MUST
    text: The generated directory exposes a single barrel entry point that re-exports
      the client configuration, the SDK operations and the generated types, so consumers
      such as lib/did-plc/client.ts and lib/did-plc/mod.ts import from the package
      root instead of reaching into the individual generated files.
