  id: sc.lib-abc-trust-graph
  intent: 'This context exists so that trust-graph consumers depend on shape rather
    than on any particular trust source. Concrete implementations live outside this
    package: createBskyMutualsVouchResolver and createTangledGraphVouchResolver satisfy
    VouchResolver, createBadgeBlueKeysOperatorDiscovery satisfies OperatorDiscovery,
    and createBadgeBlueKeysDelegatedTrustResolver satisfies DelegatedTrustResolver,
    with consumers such as createMarketBidder composing them. Keeping the interfaces
    here in one comment-free mod.ts lets those implementations and consumers share
    a single contract without a dependency cycle, and keeps the dependency direction
    one-way: this package depends only on atproto-market and imports nothing from
    its implementors.'
  interfaces:
  - file: lib/abc/trust-graph/mod.ts
    kind: interface
    name: DelegatedTrustResolver
    signature: interface DelegatedTrustResolver
  - file: lib/abc/trust-graph/mod.ts
    kind: interface
    name: OperatorDiscovery
    signature: interface OperatorDiscovery
  - file: lib/abc/trust-graph/mod.ts
    kind: interface
    name: VouchResolver
    signature: interface VouchResolver
  name: lib-abc-trust-graph
  requirements:
  - codeRefs:
