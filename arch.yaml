  id: sc.atproto-market
  intent: This context exists so that the marketplace packages do not each re-implement
    identity, signing, PLC and record-write plumbing. createATProto centralizes how
    the repo obtains an agent bound to a DID and signer and how records are created
    and updated against arbitrary collections, while createMarketClient centralizes
    construction of the market XRPC client over a service. Downstream packages (bidders,
    gateways, market settlement, trust graph, requester) depend on these two factories
    rather than on raw agents or raw XRPC services.
  name: atproto-market
  requirements:
  - id: r.agent-factory
    level: MUST
    text: createATProto accepts a CreateATProtoOpts bundle of logger, badgeBlueSigner,
      plcDirectory and agent, and resolves to an ATProto whose DID and signer are
      read from the supplied agent; it constructs an IdResolver and returns record
      helpers bound to that agent's DID.
  - id: r.attestation-signer
    level: SHOULD
    text: Attestation signing is supplied to the agent factory as an AttestationKeypair
      rather than as a raw key, keeping key material behind the market attestation
      abstraction.
  - codeRefs:
    - file:LEXICONS.md
    - file:deno.json
    - file:deno.lock
    id: r.deno-workspace
    level: MUST
    text: 'The repository is a Deno workspace: dependencies and tasks are declared
      in deno.json with the resolved graph committed as deno.lock, and LEXICONS.md
      documents the lexicon set the packages implement.'
  - id: r.market-client-factory
    level: MUST
    text: createMarketClient takes an XrpcService plus an optional MarketClientOptions
      defaulting to an empty object and returns a MarketClient instance constructed
      from those two arguments, so callers never build the class directly.
  - id: r.plc-directory
    level: SHOULD
    text: DID and PLC handling is injected as a PlcClient from lib/did-plc/client.ts,
      so the atproto helpers depend on the repository's own PLC client instead of
      constructing one internally.
  - id: r.record-create
    level: MUST
    text: The createRecord helper mints a new rkey via TID.next().toString(), calls
      agent.createRecord(did, collection, rkey, record) when that method exists, and
      otherwise falls back to agent.applyWrites with a create action followed by agent.getRecord;
      both paths return a com.atproto.repo.strongRef whose uri is at://<did>/<collection>/<rkey>
      and whose cid falls back to the empty string when the fetched record has none.
  - id: r.record-update
    level: MUST
    text: The updateRecord helper takes an existing rkey, calls agent.putRecord(did,
      collection, rkey, record) when that method exists, and otherwise falls back
      to agent.applyWrites with an update action followed by agent.getRecord; it returns
      the same com.atproto.repo.strongRef shape as createRecord, including the empty-string
      cid fallback.
  upstream: self
