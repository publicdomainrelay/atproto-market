    id: r.generated-not-hand-edited
    level: MUST
    text: Every file in this context is emitted by @hey-api/openapi-ts, so changes
      belong in the generator configuration or templates rather than in these modules,
      and consumers treat the exported symbols as a stable interface rather than as
      editable implementation.
  - codeRefs:
    - function:3aa423aa49ce15b5c281fdf674ccea83
    - interface:1b456f0aa4a4892de795fc7cfe346405
    - type_alias:1442602a19a8b8d826fe955ec8b35459
    id: r.path-array-serialization
    level: MUST
    text: 'serializeArrayParam renders an array into a path or query fragment according
      to the OpenAPI style and explode flags: exploded styles join with the style''s
      separator (space, dot, semicolon, comma or ampersand), non-exploded styles join
      with the non-exploded separator (comma, pipe or percent-encoded space), and
      the allowReserved flag decides whether values are percent-encoded.'
  - codeRefs:
    - function:6b40f3b794b4bad43b14cd20458c4211
    - function:d8a8ad4ef7229e1f081c6bf168c34b83
    - type_alias:d4025b696fa82ef945e4ff5e7c98f3ca
    id: r.path-primitive-serialization
    level: MUST
    text: serializePrimitiveParam emits a single name/value path segment, and serializeObjectParam
      renders a Record or Date into a path fragment supporting exploded key/value
      pairs, the style's object separator, a valueOnly mode that omits the parameter
      name, and allowReserved control over percent-encoding.
  - codeRefs:
    - function:0eec6a8b5f95850e00b60b674c319208
    - function:52c78b83773379b2af971b52fe7d344b
    - function:9e1e59ef39a8a3523eabbe58a707c0da
    - type_alias:1442602a19a8b8d826fe955ec8b35459
    - type_alias:d4025b696fa82ef945e4ff5e7c98f3ca
    id: r.path-separator-tables
    level: MUST
    text: 'The separator helpers map each array or object style to its delimiter:
      separatorArrayExplode returns space, dot, semicolon, comma or ampersand, separatorArrayNoExplode
      returns comma, pipe or percent-encoded space, and separatorObjectExplode returns
      space, dot, semicolon, comma or ampersand, so every serializer reaches the correct
      delimiter through one table lookup.'
  - codeRefs:
    - function:322f298b5f2b35c454545e9e7383ed23
    - function:e070a49e14782e2ad70106dfca6b7555
    - function:fd2b04c364cd99e46d33fea953a519f3
    - type_alias:73d3e5f774b282eef2fec4e0529a39f4
    id: r.query-key-json-values
    level: MUST
    text: serializeQueryKeyValue normalizes an arbitrary value into a JsonValue suitable
      for a query cache key, delegating to stringifyToJsonValue and applying queryKeyJsonReplacer
      so that Date, Map, Set and undefined-bearing structures collapse to a deterministic
      JSON-safe form or to undefined when no representation exists.
  - codeRefs:
    - function:6da9c83dca2343cb8d6ab89b226694e3
    - type_alias:dde729a96cfbf612b97b92a3c998d820
    id: r.request-body-validity
    level: MUST
    text: 'getValidRequestBody decides what body actually goes on the wire: it returns
      a pre-serialized body as-is when present, applies the supplied bodySerializer
      to the raw body when one is configured, and yields no body when the serializer
      is explicitly null.'
  - codeRefs:
    - function:328544b37c6f5c21f27f71b2df1541fe
    - interface:21dc1cb955f27a91202088472797c2b3
    - type_alias:c40de77654e0d20536f33c98f3814deb
    id: r.sse-client-retry
    level: MUST
    text: createSseClient opens a streaming request to the given url, parses each
      server-sent event into a StreamEvent with event, data, id and retry fields,
      invokes onSseEvent per event and onSseError on failure, honors the server-supplied
      retry delay clamped within sseDefaultRetryDelay and sseMaxRetryDelay, stops
      after sseMaxRetryAttempts, and returns an async iterable of events plus a stream
      accessor.
  - codeRefs:
    - method:3e119e404dd19ce39adbd340693e853e
    - method:5c7ca5bd02df3770e74bbdce8d0506c2
    - method:903d25222e9da49cf170564fbcd88121
    - method:ea065c4e19adf5aad92b1f94271d9c6b
    - type_alias:918b65cfb156b73540784120485ddc65
    id: r.sse-hooks
    level: SHOULD
    text: ServerSentEventsOptions lets a caller intercept the outgoing request through
      onRequest (receiving the url and RequestInit and returning the Request to send),
      observe errors through onSseError, observe each parsed event through onSseEvent,
      and replace the retry sleep through sseSleepFn, with the remaining RequestInit
      fields spread onto the underlying fetch call.
  - codeRefs:
    - function:44cf0e94fd6213ef2ce23d5c6a2d1d08
    - function:8a8169ef157538cd873bebae1c7e4b7c
    - interface:9724358a094cfd674de35400ce1b41f5
    id: r.url-assembly
    level: MUST
    text: getUrl assembles the final request URL from a baseUrl and/or url, a path
      parameter record, and a query record rendered through the supplied QuerySerializer,
      while defaultPathSerializer substitutes each path placeholder of the form {name}
      with its serialized value and leaves the remaining template intact.
