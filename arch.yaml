    id: r.nsid-export
    level: MUST
    text: Every `.defs.ts` module exports its `$nsid` constant, the corresponding
      `$params` / `$input` / `$output` / `$message` schema builders, the inferred
      type aliases derived from those builders, the `main` procedure or subscription
      value and `$lxm` set to the same NSID, so the endpoint identity is available
      both as a runtime string and as a type-level literal.
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/gateway/requestComputeVM.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/gateway/requestComputeVM.ts
    id: r.request-compute-vm-procedure
    level: MUST
    text: '`requestComputeVM` is a procedure under NSID `com.publicdomainrelay.temp.gateway.requestComputeVM`
      that takes no parameters. Its input requires `computeVm` (a ref to `../compute/vm.defs.ts`
      `Main`) and `sshPublicKey`, and optionally accepts `vmReadyTimeoutSec`, `policy`
      (a `PolicySpec` ref), `policyEngine` and `extraBidderDids` (an array of did
      strings). The optional fields carry schema defaults: `execProgram` defaults
      to the string `bash`, `skipSsh` defaults to `true`, and `keepVm` defaults to
      `true`. Every output field is optional and comprises `receiptUri`, `receiptCid`,
      `receiptOk`, `sshReady`, `sshExitCode`, `websocatUrl` (uri), `vmFqdn`, `winnerDid`,
      `winnerBidUri`, `winnerBidCid`, `winnerBidConfig` (lex map), `rfpUri`, `rfpCid`,
      an array of `bidSummary` refs, and `error`. Declared error names are InvalidRequest,
      AuthRequired, NoBidders and ProvisioningFailed.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/gateway/requestComputeVM.defs.ts
    id: r.request-compute-vm-typed-objects
    level: MUST
    text: '`requestComputeVM.defs.ts` additionally exports the typed objects `policySpec`
      and `bidSummary` under its own NSID, with `PolicySpec` requiring a `name` policy
      registry name and accepting an optional `description` and an `args` lex map
      whose well-known keys are bidWindowSec and firstFree, and `BidSummary` carrying
      optional `bidderDid` (did), `bidUri` (at-uri) and `cost` integer; the types
      are re-exported as `PolicySpec` and `BidSummary` alongside the schema constants.'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/gateway/requestComputeWorkerEphemeral.defs.ts
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/gateway/requestComputeWorkerPersistent.defs.ts
    id: r.request-compute-worker-procedures
    level: MUST
    text: '`requestComputeWorkerEphemeral` and `requestComputeWorkerPersistent` are
      procedures taking no parameters, and both share an input of required `source`
      and `denoJson` strings plus an optional `denoLock` string and an optional `bidWindowSec`
      integer that defaults to 30; both return an output of optional `receiptUri`,
      `receiptCid`, `receiptOk`, `workerInstanceUri` (at-uri) and `error`, with the
      persistent variant adding an optional `executeUrl` (uri). Both declare error
      names InvalidRequest, AuthRequired and NoBidders, and their doc comments state
      the gateway bundles the source, creates a workerManifest record and runs the
      full RFP protocol, returning the worker instance ref for single-request execution
      (ephemeral) or after starting the worker (persistent).'
  - codeRefs:
    - file:lib/common/market-lexicons/com/publicdomainrelay/temp/gateway/subscribeComputeEvents.defs.ts
    - type_alias:6cbf471842bed7607958a9024f6c1586
    id: r.subscribe-compute-events-subscription
    level: MUST
    text: '`subscribeComputeEvents` is a subscription under NSID `com.publicdomainrelay.temp.gateway.subscribeComputeEvents`
      whose `$params` require a `receiptUri` string in at-uri format, and whose message
      is an open typed union of `vm_started`, `vm_on_network`, `terminated` and `error`.
      `vm_started` and `terminated` carry `receiptUri` plus `timestamp`, `vm_on_network`
      carries `receiptUri`, `address` and `timestamp`, and `terminated` additionally
      carries a `reason` string, while `error` carries only a `message`. The declared
      error names are InvalidRequest and AuthRequired, and the doc comment states
      the gateway pushes events as they arrive from the bidder.'
  upstream: self
